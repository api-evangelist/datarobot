  description: >-
    This page describes the endpoints for enacting workflow requirements to ensure quality and comply
    with regulatory obligations. When you create a new or change an existing deployment, if the approval
    workflow is enabled, an MLOps administrator within your organization must approve your changes. [Approval
    policies](deploy-approval) affect the users who have permissions to review deployments and provide
    automated actions when reviews time out. Approval policies also affect users whose deployment events
    are governed by a configured policy (e.g., new deployment creation, model replacement).
