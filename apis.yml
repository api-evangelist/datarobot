aid: datarobot
name: DataRobot
description: >-
  DataRobot is an enterprise AI platform for building, deploying, governing, and
  monitoring predictive and generative AI models and agentic workflows. It exposes
  a public REST API (v2), first-party Python and R clients, a `dr` command-line
  tool, and an MCP surface (Global MCP plus deployable standalone servers) that lets
  agentic coding environments call DataRobot tools and resources. Developers
  authenticate with personal API keys (bearer tokens) against regional endpoints
  (US/EU/JP), while OAuth 2.0 / OIDC via app.datarobot.com backs agent and
  integration auth. The platform covers AutoML, MLOps deployment and monitoring,
  model governance and compliance documentation, and code-first GenAI/agent
  development. Surfaced as a portfolio company of Norwest Venture Partners, Sapphire
  Ventures, and Techstars, and enriched by the API Evangelist pipeline.
