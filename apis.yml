    methods to calculate fairness for a binary classification model and attempt to identify any biases
    in the model's predictive behavior. In DataRobot, bias represents the difference between a model's
    predictions for different populations (or groups) while fairness is the measure of the model's bias.
    Select protected features in the dataset and choose fairness metrics and mitigation techniques either
    [before model building](fairness-metrics#configure-metrics-and-mitigation-pre-autopilot) or [from
    the Leaderboard](fairness-metrics#configure-metrics-and-mitigation-post-autopilot) once models are
    built. [Bias and Fairness insights](bias/index) help identify bias in a model and visualize the root-cause
    analysis, explaining why the model is learning bias from the training data and from where.
