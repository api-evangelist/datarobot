  - name: start
    summary: Run the application quickstart process for the current template.
    docs: https://docs.datarobot.com/en/docs/agentic-ai/cli/commands/start.html
  - name: plugin
    summary: Install plugins (e.g. `dr plugin install assist` for Agent Assist).
key_flows:
