      - description
      - creationDate
      - creationUserId
      - lastUpdateDate
      - lastUpdateUserId
      - userName
      - versionCount
      title: PromptTemplateResponse
      type: object
    EditComparisonPromptRequest:
      description: The body of the "Edit comparison prompt" request.
