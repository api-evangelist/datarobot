  /api/v2/genai/promptTemplates/{promptTemplateId}/versions/:
    get:
      description: List versions for a prompt template with pagination.
      operationId: list_prompt_template_versions_promptTemplates__promptTemplateId__versions__get
      parameters:
      - description: The ID of the prompt template to retrieve.
        in: path
        name: promptTemplateId
        required: true
        schema:
          description: The ID of the prompt template to retrieve.
          title: promptTemplateId
          type: string
      - description: Skip the specified number of values.
        in: query
