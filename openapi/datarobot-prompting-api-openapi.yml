                $ref: '#/components/schemas/ComparisonChatResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Edit comparison chat by comparison chat ID
      tags:
      - Prompting
  /api/v2/genai/comparisonPrompts/:
    get:
      description: List the comparison prompts associated with a comparison chat or a set of LLM blueprints.
      operationId: list_comparison_prompts_comparisonPrompts__get
      parameters:
      - description: Only retrieve the comparison prompts associated with the specified LLM blueprint IDs. Either this parameter or `comparisonChatId` must be specified, but not both.
        in: query
        name: llmBlueprintIds
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: Only retrieve the comparison prompts associated with the specified LLM blueprint IDs. Either this parameter or `comparisonChatId` must be specified, but not both.
          title: llmBlueprintIds
      - description: Only retrieve the comparison prompts associated with the specified comparison chat ID. Either this parameter or `llmBlueprintIds` must be specified, but not both.
        in: query
        name: comparisonChatId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the comparison prompts associated with the specified comparison chat ID. Either this parameter or `llmBlueprintIds` must be specified, but not both.
          title: comparisonChatId
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListComparisonPromptsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List comparison prompts
      tags:
      - Prompting
    post:
      description: Request the execution of a new comparison prompt.
      operationId: create_comparison_prompt_comparisonPrompts__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComparisonPromptRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonPromptResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create comparison prompt
      tags:
      - Prompting
  /api/v2/genai/comparisonPrompts/{comparisonPromptId}/:
    delete:
      description: Delete an existing comparison prompt.
      operationId: delete_comparison_prompt_comparisonPrompts__comparisonPromptId___delete
      parameters:
      - description: The ID of the comparison prompt to delete.
        in: path
        name: comparisonPromptId
        required: true
        schema:
