openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Prompting API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: The following endpoints outline how to manage prompts.
  name: Prompting
paths:
  /api/v2/genai/chatPrompts/:
    get:
      description: List chat prompts.
      operationId: list_chat_prompts_chatPrompts__get
      parameters:
      - description: Only retrieve the chat prompts associated with this playground ID.
        in: query
        name: playgroundId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the chat prompts associated with this playground ID.
          title: playgroundId
      - description: Only retrieve the chat prompts associated with this LLM blueprint ID. If specified, will retrieve the chat prompts for the oldest chat in this LLM blueprint.
        in: query
        name: llmBlueprintId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the chat prompts associated with this LLM blueprint ID. If specified, will retrieve the chat prompts for the oldest chat in this LLM blueprint.
          title: llmBlueprintId
      - description: Only retrieve the chat prompts associated with this chat ID.
        in: query
        name: chatId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the chat prompts associated with this chat ID.
          title: chatId
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChatPromptsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List chat prompts
      tags:
      - Prompting
    post:
      description: Request the execution of a new prompt within a chat or an LLM blueprint.
      operationId: create_chat_prompt_chatPrompts__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatPromptRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPromptResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create chat prompt
      tags:
      - Prompting
  /api/v2/genai/chatPrompts/{chatPromptId}/:
    delete:
      description: Delete an existing chat prompt.
      operationId: delete_chat_prompt_chatPrompts__chatPromptId___delete
      parameters:
      - description: The ID of the chat prompt to delete.
        in: path
        name: chatPromptId
        required: true
        schema:
          description: The ID of the chat prompt to delete.
          title: chatPromptId
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Delete chat prompt by chat prompt ID
      tags:
      - Prompting
    get:
      description: Retrieve an existing chat prompt.
      operationId: get_chat_prompt_chatPrompts__chatPromptId___get
      parameters:
      - description: The ID of the chat prompt to retrieve.
        in: path
        name: chatPromptId
        required: true
        schema:
          description: The ID of the chat prompt to retrieve.
          title: chatPromptId
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPromptResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Retrieve chat prompt by chat prompt ID
      tags:
      - Prompting
    patch:
      description: Edit an existing chat prompt.
      operationId: update_chat_prompt_data_chatPrompts__chatPromptId___patch
      parameters:
      - description: The ID of the chat prompt to edit.
        in: path
        name: chatPromptId
        required: true
        schema:
          description: The ID of the chat prompt to edit.
          title: chatPromptId
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditChatPromptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPromptResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Edit chat prompt by chat prompt ID
      tags:
      - Prompting
  /api/v2/genai/chats/:
    get:
      description: List chats.
      operationId: list_chats_chats__get
      parameters:
      - description: Only retrieve the chats associated with this LLM blueprint ID.
        in: query
        name: llmBlueprintId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the chats associated with this LLM blueprint ID.
          title: llmBlueprintId
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Apply this sort order to the results. Valid options are "name" and "creationDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ChatsSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name" and "creationDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChatsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List chats
      tags:
      - Prompting
    post:
      description: Create a new chat.
      operationId: create_chat_chats__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create chat
      tags:
      - Prompting
  /api/v2/genai/chats/{chatId}/:
    delete:
      description: Delete an existing chat.
      operationId: delete_chat_chats__chatId___delete
      parameters:
      - description: The ID of the chat to delete.
        in: path
        name: chatId
        required: true
        schema:
          description: The ID of the chat to delete.
          title: chatId
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Delete chat by chat ID
      tags:
      - Prompting
    get:
      description: Retrieve an existing chat.
      operationId: get_chat_chats__chatId___get
      parameters:
      - description: The ID of the chat to retrieve.
        in: path
        name: chatId
        required: true
        schema:
          description: The ID of the chat to retrieve.
          title: chatId
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Retrieve chat by chat ID
      tags:
      - Prompting
    patch:
      description: Edit an existing chat.
      operationId: edit_chat_chats__chatId___patch
      parameters:
      - description: The ID of the chat to edit.
        in: path
        name: chatId
        required: true
        schema:
          description: The ID of the chat to edit.
          title: chatId
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Edit chat by chat ID
      tags:
      - Prompting
  /api/v2/genai/comparisonChats/:
    get:
      description: List comparison chats.
      operationId: list_comparison_chats_comparisonChats__get
