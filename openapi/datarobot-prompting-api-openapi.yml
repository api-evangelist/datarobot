        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Delete comparison chat by comparison chat ID
      tags:
      - Prompting
    get:
      description: Retrieve an existing comparison chat.
      operationId: get_comparison_chat_comparisonChats__comparisonChatId___get
      parameters:
      - description: The ID of the comparison chat to retrieve.
        in: path
        name: comparisonChatId
        required: true
        schema:
          description: The ID of the comparison chat to retrieve.
          title: comparisonChatId
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonChatResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Retrieve comparison chat by comparison chat ID
