          anyOf:
          - type: string
          - items:
              additionalProperties:
                anyOf:
                - type: string
                - items:
                    additionalProperties: true
                    type: object
                  type: array
                - type: 'null'
              type: object
            type: array
          - items:
              additionalProperties:
                anyOf:
                - type: string
                - items:
                    additionalProperties: true
                    type: object
                  type: array
              type: object
            type: array
          - additionalProperties:
              anyOf:
              - type: string
              - items:
                  additionalProperties:
                    type: string
                  type: object
                type: array
            type: object
          - type: 'null'
          description: The final representation of the prompt that was submitted to the LLM.
          title: finalPrompt
        inputTokenCount:
          default: 0
