          description: Validation Error
      summary: List prompt templates versions
      tags:
      - Prompting
  /api/v2/genai/promptTemplates/{promptTemplateId}/:
    get:
      description: Get prompt template by ID.
      operationId: get_prompt_template_promptTemplates__promptTemplateId___get
      parameters:
      - description: The ID of the prompt template to retrieve.
        in: path
        name: promptTemplateId
