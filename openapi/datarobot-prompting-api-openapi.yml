              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List comparison chats
      tags:
      - Prompting
    post:
      description: Create a new comparison chat.
      operationId: create_comparison_chat_comparisonChats__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComparisonChatRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonChatResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create comparison chat
      tags:
      - Prompting
  /api/v2/genai/comparisonChats/{comparisonChatId}/:
    delete:
      description: Delete an existing comparison chat.
      operationId: delete_comparison_chat_comparisonChats__comparisonChatId___delete
      parameters:
      - description: The ID of the comparison chat to delete.
