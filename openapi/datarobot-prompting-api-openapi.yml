          title: systemPrompt
        validationId:
          anyOf:
          - type: string
          - type: 'null'
          description: The validation ID of the custom model LLM.
          title: validationId
      title: CustomModelLLMSettings
      type: object
    Citation:
      description: API response object for a single vector database citation.
      properties:
        chunkId:
          anyOf:
