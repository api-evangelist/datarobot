          description: Validation Error
      summary: Delete comparison prompt by comparison prompt ID
      tags:
      - Prompting
    get:
      description: Retrieve an existing comparison prompt.
      operationId: get_comparison_prompt_comparisonPrompts__comparisonPromptId___get
      parameters:
      - description: The ID of the comparison prompt to retrieve.
        in: path
        name: comparisonPromptId
        required: true
        schema:
          description: The ID of the comparison prompt to retrieve.
          title: comparisonPromptId
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonPromptResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Retrieve comparison prompt by comparison prompt ID
      tags:
      - Prompting
    patch:
      description: Edit an existing comparison prompt. Editing may involve adding new prompt result metadata or executing this comparison prompt on new LLM blueprints.
      operationId: update_comparison_prompt_comparisonPrompts__comparisonPromptId___patch
      parameters:
      - description: The ID of the comparison prompt to edit.
        in: path
        name: comparisonPromptId
        required: true
        schema:
          description: The ID of the comparison prompt to edit.
          title: comparisonPromptId
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditComparisonPromptRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                title: Response Update Comparison Prompt Comparisonprompts  Comparisonpromptid   Patch
                type: string
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Edit comparison prompt by comparison prompt ID
      tags:
      - Prompting
  /api/v2/genai/promptTemplates/:
    get:
      description: List prompt templates for the user with optional filtering and sorting.
      operationId: list_prompt_templates_promptTemplates__get
      parameters:
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Apply this sort order to the results. Valid options are "name", "description", "creationDate", "lastUpdateDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PromptTemplatesSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name", "description", "creationDate", "lastUpdateDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      - description: Only retrieve prompt templates with names matching the search query.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve prompt templates with names matching the search query.
          title: search
      - description: Retrieve only the prompt templates created by these users.
        in: query
        name: creationUserIds
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Retrieve only the prompt templates created by these users.
          title: creationUserIds
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPromptTemplatesResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List prompt templates
      tags:
      - Prompting
    post:
      description: Create a new prompt template.
      operationId: create_prompt_template_promptTemplates__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptTemplateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create prompt template
      tags:
      - Prompting
  /api/v2/genai/promptTemplates/versions/:
    get:
      description: List prompt templates versions for the user with optional filtering.
      operationId: list_prompt_templates_versions_promptTemplates_versions__get
      parameters:
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Retrieve only versions with matching prompt templates ids.
        in: query
        name: promptTemplatesIds
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Retrieve only versions with matching prompt templates ids.
