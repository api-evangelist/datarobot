      - RUNNING
      - COMPLETED
      - REQUIRES_USER_INPUT
      - SKIPPED
      - ERROR
      title: ExecutionStatus
      type: string
    CreateComparisonPromptRequest:
      description: The body of the "Create comparison prompt" request.
      properties:
        comparisonChatId:
          anyOf:
          - type: string
