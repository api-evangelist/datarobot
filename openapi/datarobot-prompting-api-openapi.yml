          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Apply this sort order to the results. Valid options are "name" and "creationDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ComparisonChatsSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name" and "creationDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      responses:
        '200':
