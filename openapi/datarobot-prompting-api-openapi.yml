        feedbackResult:
          anyOf:
          - $ref: '#/components/schemas/ComparisonPromptFeedbackResult'
          - type: 'null'
          description: The feedback information to add to the comparison prompt.
      title: EditComparisonPromptRequest
      type: object
    ExecutionStatus:
