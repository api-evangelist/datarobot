        required: true
        schema:
          description: The ID of the comparison chat to edit.
          title: comparisonChatId
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditComparisonChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
