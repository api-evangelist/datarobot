        metrics:
          description: Object where each metric has validation, backtesting, backtestingScores and holdout scores reported, or null if they have not been computed. The `validation` score will be the score of the first backtest, which will be computed during initial model training.  The `backtesting` and  `backtestingScores` scores are computed when requested via :http:post:`/api/v2/projects/(projectId)/datetimeModels/(modelId)/backtests/`. The `backtesting` score is the average score across all backtests. The `backtestingScores` is an array of scores for each backtest, with the scores reported as null if the backtest score is unavailable. The `holdout` score is the score against the holdout data, using the training data defined in `trainingInfo`.
          example: "\n        {\n            \"metrics\": {\n                \"FVE Poisson\": {\n                    \"holdout\": null,\n                    \"validation\": 0.56269,\n                    \"backtesting\": 0.50166,\n                    \"backtestingScores\": [0.51206, 0.49436, null, 0.62516],\n                    \"crossValidation\": null\n                },\n                \"RMSE\": {\n                    \"holdout\": null,\n                    \"validation\": 21.0836,\n                    \"backtesting\": 23.361932,\n                    \"backtestingScores\": [0.4403, 0.4213, null, 0.5132],\n                    \"crossValidation\": null\n                }\n            }\n        }\n"
          type: object
