openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Datarobot Models API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage DataRobot models.
  name: datarobot_models
paths:
  /api/v2/projects/{projectId}/biasMitigatedModels/:
    get:
      description: List of bias mitigated models for the selected project.
      operationId: projectsBiasMitigatedModels_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: Retrieve a list of mitigated models for the parent model if specified. Otherwise retrieve a list of all mitigated models for the project.
        in: query
        name: parentModelId
        required: false
        schema:
          type: string
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiasMitigatedModelsListResponse'
          description: Returns Bias Mitigated models results.
      summary: List of bias mitigated models by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.29
    post:
      description: 'Add a request to the queue to train a model with bias mitigation applied.

        If the job has been previously submitted, the request will return the `jobId` of the previously submitted job. Use this `jobId` to check status of the previously submitted job.'
      operationId: projectsBiasMitigatedModels_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiasMitigationModelCreate'
      responses:
        '202':
          description: The model training request has been successfully submitted. See Location header.
      summary: Add a request by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.29
  /api/v2/projects/{projectId}/biasMitigationFeatureInfo/:
    get:
      description: Get bias mitigation data quality information for a given projectId and featureName.
      operationId: projectsBiasMitigationFeatureInfo_list
      parameters:
      - description: Name of feature for mitigation info.
        in: query
        name: featureName
        required: true
        schema:
          maxLength: 500
          minLength: 1
          type: string
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesInfo'
          description: Dictionary with one entry ("messages") with list of data quality information about a feature.
      summary: Get bias mitigation data quality information by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.29
  /api/v2/projects/{projectId}/biasMitigationFeatureInfo/{featureName}/:
    post:
      description: Submit a job to create bias mitigation data quality information for a given projectId and featureName.
      operationId: projectsBiasMitigationFeatureInfo_createOne
      parameters:
      - description: The project ID
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: Name of feature for mitigation info.
        in: path
        name: featureName
        required: true
        schema:
          maxLength: 500
          minLength: 1
          type: string
      responses:
        '202':
          description: A URI of the newly submitted job in the "Location" header.
      summary: Submit a job by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.29
  /api/v2/projects/{projectId}/blenderModels/:
    get:
      description: List all blenders in a project.
      operationId: projectsBlenderModels_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. If 0, all results.
        in: query
        name: limit
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlenderListResponse'
          description: A list of all of the blenders in a project.
        '404':
          description: This resource does not exist.
      summary: List all blenders by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.5
    post:
      description: 'Create a blender from other models using a specified blender method. Note: Time Series projects only allow the following blender methods: "AVG", "MED", "FORECAST_DISTANCE_ENET", and "FORECAST_DISTANCE_AVG".'
      operationId: projectsBlenderModels_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlenderCreate'
      responses:
        '202':
          description: Model job successfully added to queue. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status of the job.
              schema:
                format: url
                type: string
        '404':
          description: This resource does not exist.
        '422':
          description: Unable to create a blender or request is not supported in this context.
      summary: Create a blender by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.5
  /api/v2/projects/{projectId}/blenderModels/blendCheck/:
    post:
      description: Check if models can be blended.
      operationId: projectsBlenderModelsBlendCheck_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlenderCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlenderInfoRetrieveResponse'
          description: Information on whether models can be blended and why.
        '404':
          description: This resource does not exist.
        '422':
          description: Unable to process request.
      summary: Check if models can be blended by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.13
  /api/v2/projects/{projectId}/blenderModels/{modelId}/:
    get:
      description: Retrieve a blender. Blenders are a special type of models, so the response includes all attributes that would be in a response to :http:get:`/api/v2/projects/(projectId)/models/(modelId)/` as well as some additional ones.
      operationId: projectsBlenderModels_retrieve
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlenderRetrieveResponse'
          description: The blender model.
        '404':
          description: Specified blender not found.
      summary: Retrieve a blender by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.5
  /api/v2/projects/{projectId}/combinedModels/:
    get:
      description: 'Retrieve all existing combined models for this project.

        .. note::


        To retrieve information on the segments for a combined model, retrieve the combined model using :http:get:`/api/v2/projects/(projectId)/combinedModels/(combinedModelId)/`'
      operationId: projectsCombinedModels_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedModelListResponse'
          description: ''
      summary: Retrieve all existing combined models by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.27
  /api/v2/projects/{projectId}/combinedModels/{combinedModelId}/:
    get:
      description: Retrieve an existing combined model. If available, contains information on which champion model is used for each segment.
      operationId: projectsCombinedModels_retrieve
      parameters:
      - description: The ID of the project.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The ID of the combined model.
        in: path
        name: combinedModelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedModelResponse'
          description: ''
      summary: Retrieve an existing combined model by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.27
  /api/v2/projects/{projectId}/combinedModels/{combinedModelId}/segments/:
    get:
      description: Retrieve Combined Model segments info (name, related project & model details).
      operationId: projectsCombinedModelsSegments_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Case-insensitive search against segment name.
        in: query
        name: searchSegmentName
        required: false
        schema:
          maxLength: 100
          type: string
        x-versionadded: v2.27
      - description: The ID of the project.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The ID of the combined model.
        in: path
        name: combinedModelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedModelSegmentsPaginatedResponse'
          description: ''
      summary: Retrieve Combined Model segments info by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.27
  /api/v2/projects/{projectId}/combinedModels/{combinedModelId}/segments/download/:
    get:
      description: Download Combined Model segments info (name, related project & model details) as a CSV.
      operationId: projectsCombinedModelsSegmentsDownload_list
      parameters:
      - description: The ID of the project.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The ID of the combined model.
        in: path
        name: combinedModelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
          headers:
            Content-Disposition:
              description: Contains an auto-generated filename for this download.
              schema:
                type: string
      summary: Download Combined Model segments info by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.27
  /api/v2/projects/{projectId}/datetimeModels/:
    get:
      description: List all the models from a datetime partitioned project.
      operationId: projectsDatetimeModels_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: the ID of the bulk model operation. If specified, only models submitted in scope of this operation will be shown.
        in: query
        name: bulkOperationId
        required: false
        schema:
          type: string
        x-versionadded: v2.25
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatetimeModelsResponse'
          description: The datetime partitioned project's models
      summary: List datetime partitioned project models by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.6
    post:
      description: 'Train a new datetime model.


        All durations and datetimes should be specified in accordance with the :ref:`timestamp and duration formatting rules`.'
      operationId: projectsDatetimeModels_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainDatetimeModel'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatetimeModelSubmissionResponse'
          description: The model has been successfully submitted.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '422':
          description: There was an error submitting the specified job. See the `message` field for more details.
      summary: Train a new datetime model by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.6
  /api/v2/projects/{projectId}/datetimeModels/fromModel/:
    post:
      description: 'Retrain an existing datetime model using a new training period for the model training set (with optional time window sampling) or different feature list.


        All durations and datetimes should be specified in accordance with the :ref:`timestamp and duration formatting rules`.


        Note that only one of `trainingDuration` or `trainingRowCount` or `trainingStartDate` and `trainingEndDate` should be specified. If `trainingStartDate` and `trainingEndDate` are specified, the source model must be frozen.'
      operationId: projectsDatetimeModelsFromModel_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrainDatetimeModel'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatetimeModelSubmissionResponse'
          description: Retrain an existing datetime model using a new sample size and/or feature list.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '403':
          description: User does not have permissions to manage models.
        '404':
          description: Model with specified `modelId` doesn't exist, or user does not have access to the project.
        '422':
          description: Model with specified `modelId` is deprecated, or it doesn't support retraining with specified parameters.
      summary: Retrain an existing datetime model by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.19
  /api/v2/projects/{projectId}/datetimeModels/{modelId}/:
    get:
      description: 'Look up a particular datetime model

        All durations and datetimes are specified in accordance with :ref:`timestamp and duration formatting rules `.'
      operationId: projectsDatetimeModels_retrieve
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatetimeModelDetailsResponse'
          description: Datetime model
      summary: Get datetime model by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.6
  /api/v2/projects/{projectId}/datetimeModels/{modelId}/backtests/:
    post:
      description: Score all the available backtests of a datetime model.
      operationId: projectsDatetimeModelsBacktests_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Scoring of all the available backtests of a datetime model has been successfully requested.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Score all the available backtests of a datetime model by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.6
  /api/v2/projects/{projectId}/deploymentReadyModels/:
    post:
      description: Prepare a specific model for deployment. This model will go through the recommendation stages.
      operationId: projectsDeploymentReadyModels_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareForDeployment'
      responses:
        '201':
          description: Start preparing the model for deployment.
        '422':
          description: An error occurred when submitting the model job
      summary: Prepare a model by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.22
  /api/v2/projects/{projectId}/eureqaDistributionPlot/{solutionId}/:
    get:
      description: 'Retrieve Eureqa model details plot.


        Available for classification projects only.'
      operationId: projectsEureqaDistributionPlot_retrieve
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The ID of the solution to return data for.
        in: path
        name: solutionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EureqaDistributionDetailResponse'
          description: The Eureqa model details plot.
        '404':
          description: Data was not found.
      summary: Retrieve Eureqa model details plot by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.13
  /api/v2/projects/{projectId}/eureqaModelDetail/{solutionId}/:
    get:
      description: 'Retrieve Eureqa model details plot.


        Available for regression projects only.'
      operationId: projectsEureqaModelDetail_retrieve
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The ID of the solution to return data for.
        in: path
        name: solutionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EureqaModelDetailResponse'
          description: The Eureqa model details plot.
        '404':
          description: Data was not found.
      summary: Retrieve eureqa model detail by ID
      tags:
      - datarobot_models
      x-versionadded: v2.13
  /api/v2/projects/{projectId}/eureqaModels/:
    post:
      description: Create a new model from an existing eureqa solution.
      operationId: projectsEureqaModels_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EureqaLeaderboardEntryPayload'
      responses:
        '200':
          description: Request accepted, creation is underway.
          headers:
            Location:
              description: The location at which the new model can be retrieved.
              schema:
                type: string
        '404':
          description: Data not found.
        '422':
          description: Model for this solution already exists.
      summary: Create a new model by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.13
  /api/v2/projects/{projectId}/eureqaModels/{modelId}/:
    get:
      description: 'Retrieve the pareto front for the specified Eureqa model.


        Only the best solution in the pareto front will have a corresponding model initially. Models can be created for other solutions using :http:post:`/api/v2/projects/(projectId)/eureqaModels/`.'
      operationId: projectsEureqaModels_retrieve
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParetoFrontResponse'
          description: The Pareto front for the Eureqa model.
        '404':
          description: Data was not found.
      summary: Retrieve the pareto front by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.13
  /api/v2/projects/{projectId}/frozenDatetimeModels/:
    post:
      description: 'Train a frozen datetime model. If no training data is specified, the frozen datetime model will be trained on the most recent data using an amount of data that is equivalent to the original model. However, if the equivalent duration does not provide enough rows for training, then the duration will be extended until the minimum is met. Note that this will require the holdout of the project to be unlocked.


        All durations and datetimes should be specified in accordance with the :ref:`timestamp and duration formatting rules`.


        Note that only one of `trainingDuration`, `trainingRowCount`, `trainingStartDate` and `trainingEndDate`, or `useProjectSettings` may be specified.'
      operationId: projectsFrozenDatetimeModels_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainDatetimeFrozenModel'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatetimeModelSubmissionResponse'
          description: The model has been successfully submitted.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '403':
          description: User does not have permissions to manage models.
        '404':
          description: Model with specified `modelId` does not exist, or user does not have access to the project.
        '422':
          description: Model with specified `modelId` is deprecated, or it does not support retraining with specified parameters.
      summary: Train a frozen datetime model by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.6
  /api/v2/projects/{projectId}/frozenModels/:
    get:
      description: List all frozen models from a project.
      operationId: projectsFrozenModels_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. If 0, all results.
        in: query
        name: limit
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: If specified, the returned models will only have scores for this metric.  If not, all metrics will be included.
        in: query
        name: withMetric
        required: false
        schema:
          type: string
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrozenModelListResponse'
          description: The list of frozen models in the project.
        '404':
          description: This resource does not exist.
      summary: List all frozen models by project ID
      tags:
      - datarobot_models
      x-versionadded: v2.5
    post:
      description: 'Train a new frozen model with parameters from an existing model. Frozen models use tuning parameters from another model on the leaderboard, allowing them to be retrained on a larger amount of the training data more efficiently.

        To specify the amount of data to use to train the model, use either `samplePct` to express a percentage of the rows of the dataset to use or `trainingRowCount` to express the number of rows to use.

        If neither `samplePct` or `trainingRowCount` is specified, the model will be trained on the maximum available training data that can be used to train an in-memory model.

        For projects using smart sampling, `samplePct` and `trainingRowCount` will be interpreted as a percent or number of rows of the minority class.

        When configuring retraining sample sizes for models in projects with large row counts, DataRobot recommends requesting sample sizes using integer row counts instead of percentages. This is because percentages map to many actual possible row counts and only one of which is the actual sample size for up to validation. For example, if a project has 199,408 rows and you request a 64% sample size, any number of rows between 126,625 rows and 128,618 rows maps to 64% of the data. Using actual integer row counts (or `project.max_training_rows`) avoids ambiguity around how many rows of data you want the model to use.'
