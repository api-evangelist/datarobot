openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public User Management API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: This page describes the endpoints for handling users, groups, and organizations.
  name: user_management
paths:
  /api/v2/accessRoles/:
    get:
      description: Retrieve all access roles that the user has access to, optionally filtering by global access roles.
      operationId: accessRoles_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: If provided, restricts results to roles only usable by the organization with the provided ID. Ignored when globalRoles=only.
        in: query
        name: organizationId
        required: false
        schema:
          type: string
      - description: Whether to include roles that are available to all organizations, along with or instead of organization-specific results.
        in: query
        name: globalRoles
        required: true
        schema:
          default: included
          enum:
          - included
          - excluded
          - only
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRoleListResponse'
          description: The created role.
      summary: Retrieve a list of access roles
      tags:
      - user_management
      x-versionadded: v2.36
    post:
      description: Create a new access role with custom permissions and associate it with a particular organization.
      operationId: accessRoles_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRoleCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRole'
          description: The created role.
        '422':
          description: Invalid organizationId; name is not unique within organization; or custom role limit exceeded (100 per organization).
      summary: Create a new custom access role
      tags:
      - user_management
      x-versionadded: v2.36
  /api/v2/accessRoles/{roleId}/:
    delete:
      description: Delete a custom access role and remove it from any users, groups, or organizations it was assigned to.
      operationId: accessRoles_delete
      parameters:
      - description: The ID of the access role.
        in: path
        name: roleId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Role successfully deleted.
        '422':
          description: Role is not a custom role.
      summary: Delete a custom access role by role ID
      tags:
      - user_management
      x-versionadded: v2.36
    get:
      description: Retrieve details about an access role.
      operationId: accessRoles_retrieve
      parameters:
      - description: The ID of the access role.
        in: path
        name: roleId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRole'
          description: The requested role.
      summary: Retrieve an access role by role ID
      tags:
      - user_management
      x-versionadded: v2.36
    patch:
      description: Update the name or permissions of a custom access role.
      operationId: accessRoles_patch
      parameters:
      - description: The ID of the access role.
        in: path
        name: roleId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRoleUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRole'
          description: Role successfully updated.
        '422':
          description: Name is not unique within organization; or role is not a custom role.
      summary: Update a custom access role by role ID
      tags:
      - user_management
      x-versionadded: v2.36
  /api/v2/accessRoles/{roleId}/users/:
    get:
      description: Retrieve all users that have this access role assigned to them, any of their groups, or their organization.
      operationId: accessRolesUsers_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Restrict results to users whose name or username partially matches this string.
        in: query
        name: namePart
        required: false
        schema:
          type: string
      - description: The ID of the access role.
        in: path
        name: roleId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRoleUsersListResponse'
          description: The list of users assigned to this access role.
      summary: Retrieve a list of the users using this access role by role ID
      tags:
      - user_management
      x-versionadded: v2.36
  /api/v2/account/rateLimitUsage/:
    get:
      description: Return the rate limit usage for the user making this request. There is one entry per rate limit applied to the user.
      operationId: accountRateLimitUsage_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRateLimitUsageListResponse'
          description: Rate limit usage entries for the requesting user.
      summary: Retrieve rate limit resource usage
      tags:
      - user_management
      x-versionadded: v2.0
  /api/v2/bulkUserOperations/:
    post:
      description: Make multiple User creation requests in bulk from a list.
      operationId: bulkUserOperations_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBulkCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBulkCreateResponse'
          description: List of responses from each User creation request.
        '422':
          description: Invalid request payload.
      summary: Make multiple User creation requests in bulk
      tags:
      - user_management
      x-versionadded: v2.29
  /api/v2/directoryEntities/:
    get:
      description: Search directory entities by name within the caller's organization. Currently supports groups only, with exact (case-sensitive) name matching. The name parameter is optional - omitting it returns all groups in the organization, paginated. Admin-only fields (memberCount, externalIdpGroupId, updatedAt) are returned as null for non-admin callers.
      operationId: directoryEntities_list
      parameters:
      - description: Group name to resolve. Matched in full and case-sensitively. When omitted, returns all groups in the organization, paginated.
        in: query
        name: name
        required: false
        schema:
          maxLength: 100
          type: string
      - description: Entity type to search. Currently only "group" is supported.
        in: query
        name: entityType
        required: false
        schema:
          enum:
          - group
          type: string
      - description: How the name parameter is matched. Only "exact" is currently supported - the group name must match in full, including case. "startsWith" is reserved for a future release and returns 400 if supplied.
        in: query
        name: matchType
        required: false
        schema:
          enum:
          - exact
          type: string
      - description: Number of results to skip before returning the page. For example, offset=100 with limit=100 returns results 101-200.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Maximum number of results to return in one page. Defaults to 20; maximum is 100.
        in: query
        name: limit
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorySearchResponse'
          description: ''
      summary: Search the directory
      tags:
      - user_management
      x-versionadded: v2.49
  /api/v2/groups/:
    delete:
      description: Delete the user groups.
      operationId: groups_deleteMany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupBulkDelete'
      responses:
        '204':
          description: ''
        '422':
          description: Multiple user groups found by the identifier.
      summary: Delete multiple user groups
      tags:
      - user_management
      x-versionadded: v2.26
    get:
      description: List the user groups that satisfy the query condition.
      operationId: groups_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 50
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: User groups must contain the substring.
        in: query
        name: namePart
        required: false
        schema:
          default: ''
          type: string
      - description: List user groups by the specified IDs.
        in: query
        name: groupIds
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 100
            type: array
      - description: List user groups for the organization. If the value is `unowned`, the route will filter for groups that aren't owned by any organization.
        in: query
        name: orgId
        required: false
        schema:
          oneOf:
          - enum:
            - unowned
            type: string
          - type: string
      - description: List user groups that the user is part of.
        in: query
        name: userId
        required: false
        schema:
          type: string
      - description: Indicates if the search by `namePart` should exclude the groups that the user with userId is a member.
        in: query
        name: excludeUserMembership
        required: false
        schema:
          default: 'False'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: The order that the results should be retrieved in. Prefix the attribute name with a dash to sort in descending order, e.g. `orderBy=-name`.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - name
          - -name
          - orgName
          - -orgName
          - accessRoleName
          - -accessRoleName
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupsListResponse'
          description: ''
      summary: List user groups
      tags:
      - user_management
      x-versionadded: v2.0
    post:
      description: Create a new user group.
      operationId: groups_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupResponse'
          description: ''
        '422':
          description: Unable to process the request.
      summary: Create a user group
      tags:
      - user_management
      x-versionadded: v2.26
  /api/v2/groups/{groupId}/:
    delete:
      description: Delete the user group.
      operationId: groups_delete
      parameters:
      - description: The identifier of the user group.
        in: path
        name: groupId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '422':
          description: Multiple user groups found by the identifier.
      summary: Delete a user group by group ID
      tags:
      - user_management
      x-versionadded: v2.26
    get:
      description: Retrieve the user group.
      operationId: groups_retrieve
      parameters:
      - description: The identifier of the user group.
        in: path
        name: groupId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupResponse'
          description: ''
        '422':
          description: Multiple user groups found by the identifier.
      summary: Retrieve a user group by group ID
      tags:
      - user_management
      x-versionadded: v2.26
    patch:
      description: Update the user group.
      operationId: groups_patch
      parameters:
      - description: The identifier of the user group.
        in: path
        name: groupId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupResponse'
          description: ''
        '422':
          description: Unable to process the request.
      summary: Update a user group by group ID
      tags:
      - user_management
      x-versionadded: v2.26
  /api/v2/groups/{groupId}/users/:
    delete:
      description: Remove users from the group.
      operationId: groupsUsers_deleteMany
      parameters:
      - description: The identifier of the user group.
        in: path
        name: groupId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyUsersInGroup'
      responses:
        '204':
          description: ''
        '422':
          description: The user was not found.
      summary: Remove users by group ID
      tags:
      - user_management
      x-versionadded: v2.26
    get:
      description: List users in the group.
      operationId: groupsUsers_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 50
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: User groups must contain the substring.
        in: query
        name: namePart
        required: false
        schema:
          default: ''
          type: string
      - description: The order that the results should be retrieved in. Prefix the attribute name with a dash to sort in descending order, e.g. `orderBy=-username`.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - username
          - -username
          - userGroup
          - -userGroup
          - lastName
          - -lastName
          - firstName
          - -firstName
          - status
          - -status
          - expirationDate
          - -expirationDate
          type: string
        x-versionadded: v2.22
      - description: If specified, filters results by account activation status.
        in: query
        name: isActive
        required: false
        schema:
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: If specified, filters results to admin users (system and org) or non-admin users.
        in: query
        name: isAdmin
        required: false
        schema:
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: The identifier of the user group.
        in: path
        name: groupId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersInGroupResponse'
          description: ''
      summary: List users by group ID
      tags:
      - user_management
      x-versionadded: v2.26
    post:
      description: Add users to the group.
      operationId: groupsUsers_create
      parameters:
      - description: The identifier of the user group.
        in: path
        name: groupId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyUsersInGroup'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUsersToGroupResponse'
          description: ''
        '422':
          description: Unable to process the request, or if the user does not belong to the group's organization, or if one is already in the maximum number of groups, or if the user is not found.
      summary: Add users by group ID
      tags:
      - user_management
      x-versionadded: v2.26
  /api/v2/inactiveAccountLifecycles/{organizationId}/:
    delete:
      description: Delete inactive account policy configuration for a specific organization.
      operationId: inactiveAccountLifecycles_delete
      parameters:
      - description: The organization ID.
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Inactive account policy configuration has been successfully deleted.
      summary: Delete inactive account policy configuration by organization ID
      tags:
      - user_management
      x-versionadded: v2.50
    get:
      description: Retrieve inactive account policy configuration for a specific organization.
      operationId: inactiveAccountLifecycles_retrieve
      parameters:
      - description: The organization ID.
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InactiveAccountLifecycleConfigResponse'
          description: Inactive account policy configuration.
      summary: Retrieve inactive account policy configuration by organization ID
      tags:
      - user_management
      x-versionadded: v2.50
    patch:
      description: Partially update inactive account policy configuration for a specific organization.
      operationId: inactiveAccountLifecycles_patch
      parameters:
      - description: The organization ID.
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchInactiveAccountLifecycleConfig'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InactiveAccountLifecycleConfigResponse'
          description: Updated inactive account policy configuration.
      summary: Update inactive account policy configuration by organization ID
      tags:
      - user_management
      x-versionadded: v2.50
    post:
      description: Create inactive account policy configuration for a specific organization.
      operationId: inactiveAccountLifecycles_createOne
      parameters:
      - description: The organization ID.
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInactiveAccountLifecycleConfig'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InactiveAccountLifecycleConfigResponse'
          description: Created inactive account policy configuration.
      summary: Create inactive account policy configuration by organization ID
      tags:
      - user_management
      x-versionadded: v2.50
  /api/v2/organizations/:
    get:
      description: List organizations available in the system.
      operationId: organizations_list
      parameters:
      - description: The number of records to skip over. Default 0.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Query for organizations with these IDs.
        in: query
        name: id
        required: false
        schema:
          items:
            type: string
          maxItems: 100
          type: array
        x-versionadded: v2.31
      - description: Only return the organizations whose names contain the given substring.
        in: query
        name: namePart
        required: false
        schema:
          default: ''
          type: string
      - description: Allows the ability to retrieve deleted organizations.
        in: query
        name: includeDeleted
        required: true
        schema:
          default: false
          type: boolean
      - description: Allows the ability to retrieve deleted and permadeleted organizations.
        in: query
        name: includePermadeleted
        required: true
        schema:
          default: false
          type: boolean
      - description: Allows the ability to retrieve only deleted and permadeleted organizations.
        in: query
        name: deletedOnly
        required: true
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
          description: ''
      summary: List organizations
      tags:
      - user_management
      x-versionadded: v2.0
  /api/v2/organizations/{organizationId}/:
    get:
      description: Retrieve the organization details.
      operationId: organizations_retrieve
      parameters:
      - description: Organization ID
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRetrieve'
          description: ''
      summary: Retrieve an organization by organization ID
      tags:
      - user_management
      x-versionadded: v2.0
  /api/v2/organizations/{organizationId}/jobs/:
    get:
      description: List currently running jobs belonging to this organization.
      operationId: organizationsJobs_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. If 0, all results.
        in: query
        name: limit
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Organization ID
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationJobListResponse'
          description: ''
      summary: List organization jobs by organization ID
      tags:
      - user_management
      x-versionadded: v2.0
  /api/v2/organizations/{organizationId}/users/:
    get:
      description: List memberships in this organization.
      operationId: organizationsUsers_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. If 0, all results.
        in: query
        name: limit
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Query for users with these IDs.
        in: query
        name: ids
        required: false
        schema:
          items:
            type: string
          maxItems: 100
          type: array
        x-versionadded: v2.36
      - description: Organization ID
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserListResponse'
          description: ''
      summary: List organization users by organization ID
      tags:
      - user_management
      x-versionadded: v2.0
    post:
      description: Add user to an existing organization. A user can only be part of one organization.
      operationId: organizationsUsers_create
      parameters:
      - description: Organization ID
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUser'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserCreatedResponse'
          description: ''
        '422':
          description: Invalid data.
      summary: Add user by organization ID
      tags:
      - user_management
      x-versionadded: v2.0
  /api/v2/organizations/{organizationId}/users/{userId}/:
    get:
      description: Retrieve the user from this organization.
      operationId: organizationsUsers_retrieve
      parameters:
      - description: The organization the user is in
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      - description: The user ID.
        in: path
        name: userId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponse'
          description: ''
      summary: Retrieve a user by organization ID
      tags:
      - user_management
      x-versionadded: v2.0
    patch:
      description: Patch organization's user. Only system or the organization admin can perform this operation.
      operationId: organizationsUsers_patch
      parameters:
      - description: The organization the user is in
        in: path
        name: organizationId
        required: true
        schema:
          type: string
      - description: The user ID.
        in: path
        name: userId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
