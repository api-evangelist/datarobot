openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Batch Predictions API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to generate predictions for a project.
  name: batch_predictions
paths:
  /api/v2/batchJobs/:
    get:
      description: Get a collection of batch jobs by statuses
      operationId: batchJobs_list
      parameters:
      - description: This many results will be skipped
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
        x-versionadded: v2.30
      - description: At most this many results are returned
        in: query
        name: limit
        required: true
        schema:
          default: 100
          maximum: 10000
          minimum: 1
          type: integer
        x-versionadded: v2.30
      - description: Includes only jobs that have the status value that matches this flag. Repeat the parameter for filtering on multiple statuses.
        in: query
        name: status
        required: false
        schema:
          oneOf:
          - enum:
            - INITIALIZING
            - RUNNING
            - COMPLETED
            - ABORTED
            - FAILED
            type: string
          - items:
              enum:
              - INITIALIZING
              - RUNNING
              - COMPLETED
              - ABORTED
              - FAILED
              type: string
            type: array
      - description: Includes only jobs that have the source value that matches this flag. Repeat the parameter for filtering on multiple statuses.Prefix values with a dash (`-`) to exclude those sources.
        in: query
        name: source
        required: false
        schema:
          oneOf:
          - enum:
            - other
            - api_client_r
            - api_client_python
            - integration_snippet_requests
            - integration_snippet_api_client
            - integration_snippet_standalone_python
            - integration_snippet_standalone_powershell
            - ui_make_prediction
            - ui_leaderboard_make_prediction
            - ui_uxr_make_prediction
            - integration_job
            - scheduled_from_job_definition
            - manual_run_from_job_definition
            - model_package_insights
            - portable_batch_predictions
            - data_pipelines
            - challenger_replay
            - -other
            - -api_client_r
            - -api_client_python
            - -integration_snippet_requests
            - -integration_snippet_api_client
            - -integration_snippet_standalone_python
            - -integration_snippet_standalone_powershell
            - -ui_make_prediction
            - -ui_leaderboard_make_prediction
            - -ui_uxr_make_prediction
            - -integration_job
            - -scheduled_from_job_definition
            - -manual_run_from_job_definition
            - -model_package_insights
            - -portable_batch_predictions
            - -data_pipelines
            - -challenger_replay
            type: string
          - items:
              enum:
              - other
              - api_client_r
              - api_client_python
              - integration_snippet_requests
              - integration_snippet_api_client
              - integration_snippet_standalone_python
              - integration_snippet_standalone_powershell
              - ui_make_prediction
              - ui_leaderboard_make_prediction
              - ui_uxr_make_prediction
              - integration_job
              - scheduled_from_job_definition
              - manual_run_from_job_definition
              - model_package_insights
              - portable_batch_predictions
              - data_pipelines
              - challenger_replay
              - -other
              - -api_client_r
              - -api_client_python
              - -integration_snippet_requests
              - -integration_snippet_api_client
              - -integration_snippet_standalone_python
              - -integration_snippet_standalone_powershell
              - -ui_make_prediction
              - -ui_leaderboard_make_prediction
              - -ui_uxr_make_prediction
              - -integration_job
              - -scheduled_from_job_definition
              - -manual_run_from_job_definition
              - -model_package_insights
              - -portable_batch_predictions
              - -data_pipelines
              - -challenger_replay
              type: string
            type: array
      - description: Includes only jobs for this particular deployment
        in: query
        name: deploymentId
        required: false
        schema:
          type: string
        x-versionadded: v2.30
      - description: ID of leaderboard model which is used in job for processing predictions dataset
        in: query
        name: modelId
        required: false
        schema:
          type: string
        x-versionadded: v2.30
      - description: Includes only job by specific id
        in: query
        name: jobId
        required: false
        schema:
          type: string
        x-versionadded: v2.30
      - description: Sort order which will be applied to batch prediction list. Prefix the attribute name with a dash to sort in descending order, e.g. "-created".
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - created
          - -created
          - status
          - -status
          type: string
        x-versionadded: v2.30
      - description: '[DEPRECATED - replaced with RBAC permission model] - No effect'
        in: query
        name: allJobs
        required: false
        schema:
          default: false
          type: boolean
        x-versionadded: v2.30
        x-versiondeprecated: v2.32
      - description: Only list jobs created at most this amount of hours ago.
        in: query
        name: cutoffHours
        required: false
        schema:
          maximum: 8760
          minimum: 0
          type: integer
        x-versionadded: v2.30
      - description: ISO-formatted datetime of the earliest time the job was added (inclusive). For example "2008-08-24T12:00:00Z". Will ignore cutoffHours if set.
        in: query
        name: startDateTime
        required: false
        schema:
          format: date-time
          type: string
      - description: ISO-formatted datetime of the latest time the job was added (inclusive). For example "2008-08-24T12:00:00Z".
        in: query
        name: endDateTime
        required: false
        schema:
          format: date-time
          type: string
      - description: Includes only jobs for this particular definition
        in: query
        name: batchPredictionJobDefinitionId
        required: false
        schema:
          type: string
        x-versionadded: v2.30
      - description: Includes only jobs for this particular prediction instance hostname
        in: query
        name: hostname
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
        x-versionadded: v2.30
      - description: Includes only jobs that have the batch job type that matches this flag. Repeat the parameter for filtering on multiple types.
        in: query
        name: batchJobType
        required: false
        schema:
          oneOf:
          - enum:
            - monitoring
            - prediction
            type: string
          - items:
              enum:
              - monitoring
              - prediction
              type: string
            type: array
        x-versionadded: v2.30
      - description: Includes only jobs for these particular intakes type
        in: query
        name: intakeType
        required: false
        schema:
          oneOf:
          - enum:
            - local_file
            - azure
            - bigquery
            - dataStage
            - databricks
            - dataset
            - datasphere
            - dss
            - gcp
            - http
            - jdbc
            - localFile
            - recipe
            - s3
            - snowflake
            - synapse
            - trino
            type: string
          - items:
              enum:
              - local_file
              - azure
              - bigquery
              - dataStage
              - databricks
              - dataset
              - datasphere
              - dss
              - gcp
              - http
              - jdbc
              - localFile
              - recipe
              - s3
              - snowflake
              - synapse
              - trino
              type: string
            type: array
        x-versionadded: v2.30
      - description: Includes only jobs for these particular outputs type
        in: query
        name: outputType
        required: false
        schema:
          oneOf:
          - enum:
            - local_file
            - azure
            - bigquery
            - databricks
            - datasphere
            - gcp
            - http
            - jdbc
            - localFile
            - s3
            - snowflake
            - synapse
            - trino
            type: string
          - items:
              enum:
              - local_file
              - azure
              - bigquery
              - databricks
              - datasphere
              - gcp
              - http
              - jdbc
              - localFile
              - s3
              - snowflake
              - synapse
              - trino
              type: string
            type: array
        x-versionadded: v2.30
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobListResponse'
          description: A list of Batch job objects
      summary: List batch jobs
      tags:
      - batch_predictions
      x-versionadded: v2.35
  /api/v2/batchJobs/fromJobDefinition/:
    post:
      description: Launches a one-time batch job based off of the previously supplied definition referring to the job definition ID and puts it on the queue.
      operationId: batchJobsFromJobDefinition_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPredictionJobDefinitionId'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobResponse'
          description: Job details for the created Batch Prediction job
        '404':
          description: Job was deleted, never existed or you do not have access to it
        '422':
          description: 'Could not create a Batch job. Possible reasons: {}'
      summary: Launch a Batch job
      tags:
      - batch_predictions
      x-versionadded: v2.35
  /api/v2/batchJobs/{batchJobId}/:
    delete:
      description: If the job is running, it will be aborted. Then it will be removed, meaning all underlying data will be deleted and the job is removed from the list of jobs.
      operationId: batchJobs_delete
      parameters:
      - description: ID of the Batch job
        in: path
        name: batchJobId
        required: true
        schema:
          type: string
      - description: 'The number of which csv part is being uploaded when using multipart upload '
        in: path
        name: partNumber
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
        x-versionadded: v2.30
      responses:
        '202':
          description: Job cancelled
        '404':
          description: Job does not exist or was not submitted to the queue.
        '409':
          description: 'Job cannot be aborted for some reason. Possible reasons: job is already aborted or completed.'
      summary: Cancel a Batch job by batch job ID
      tags:
      - batch_predictions
      x-versionadded: v2.35
    get:
      description: Retrieve a Batch job.
      operationId: batchJobs_retrieve
      parameters:
      - description: ID of the Batch job
        in: path
        name: batchJobId
        required: true
        schema:
          type: string
      - description: 'The number of which csv part is being uploaded when using multipart upload '
        in: path
        name: partNumber
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
        x-versionadded: v2.30
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobResponse'
          description: Job details for the requested Batch job
      summary: Retrieve Batch job by batch job ID
      tags:
      - batch_predictions
      x-versionadded: v2.35
  /api/v2/batchJobs/{batchJobId}/csvUpload/:
    put:
      description: Stream CSV data to the job. Only available for jobs thatuses the localFile intake option.
      operationId: batchJobsCsvUpload_putMany
      parameters:
      - description: ID of the Batch job
        in: path
        name: batchJobId
        required: true
        schema:
          type: string
      - description: 'The number of which csv part is being uploaded when using multipart upload '
        in: path
        name: partNumber
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
        x-versionadded: v2.30
      responses:
        '202':
          description: Job data was successfully submitted
        '404':
          description: Job does not exist or does not require data
        '409':
          description: Dataset upload has already begun
        '415':
          description: Not acceptable MIME type
        '422':
          description: Job was "ABORTED" due to too many errors in the data
      summary: Stream CSV data by batch job ID
      tags:
      - batch_predictions
      x-versionadded: v2.35
  /api/v2/batchJobs/{batchJobId}/download/:
    get:
      description: This is only valid for jobs scored using the "localFile" output option
      operationId: batchJobsDownload_list
      parameters:
      - description: ID of the Batch job
        in: path
        name: batchJobId
        required: true
        schema:
          type: string
      - description: 'The number of which csv part is being uploaded when using multipart upload '
        in: path
        name: partNumber
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
        x-versionadded: v2.30
      responses:
        '200':
          description: Job was downloaded correctly
          headers:
            Content-Disposition:
              description: Contains an auto generated filename for this download ("attachment;filename=result-<id>.csv").
              schema:
                type: string
            Content-Type:
              description: MIME type of the returned data
              schema:
                enum:
                - text/csv
                type: string
        '404':
          description: Job does not exist or is not completed
        '406':
          description: Not acceptable MIME type
        '422':
          description: Job was "ABORTED" due to too many errors in the data
      summary: Download the scored data set of a batch job by batch job ID
      tags:
      - batch_predictions
      x-versionadded: v2.35
  /api/v2/batchPredictionJobDefinitions/:
    get:
      description: List all Batch Prediction jobs definitions available
      operationId: batchPredictionJobDefinitions_list
      parameters:
      - description: This many results will be skipped
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned
        in: query
        name: limit
        required: true
        schema:
          default: 100
          maximum: 10000
          minimum: 1
          type: integer
      - description: A human-readable name for the definition, must be unique across organisations.
        in: query
        name: searchName
        required: false
        schema:
          maxLength: 100
          minLength: 1
          type: string
      - description: Includes only definitions for this particular deployment
        in: query
        name: deploymentId
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPredictionJobDefinitionsListResponse'
          description: List of all available jobs
        '422':
          description: Your input data or query arguments did not work together
      summary: List Batch Prediction job definitions
      tags:
      - batch_predictions
      x-versionadded: v2.24
    post:
      description: Create a Batch Prediction Job definition. A configuration for a Batch Prediction job which can either be executed manually upon request or on scheduled intervals, if enabled. The API payload is the same as for `/batchPredictions` along with optional ``enabled`` and ``schedule`` items.
      operationId: batchPredictionJobDefinitions_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPredictionJobDefinitionsCreate'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPredictionJobDefinitionsResponse'
          description: Job details for the created Batch Prediction job definition
        '403':
          description: You are not authorized to create a job definition on this deployment due to your permissions role
        '422':
          description: You tried to create a job definition with uncompatible or missing parameters to create a fully functioning job definition
      summary: Creates a new Batch Prediction job definition
      tags:
      - batch_predictions
      x-versionadded: v2.24
  /api/v2/batchPredictionJobDefinitions/{jobDefinitionId}/:
    delete:
      description: Delete a Batch Prediction job definition
      operationId: batchPredictionJobDefinitions_delete
      parameters:
      - description: ID of the Batch Prediction job definition
        in: path
        name: jobDefinitionId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '403':
          description: You are not authorized to delete this job definition due to your permissions role
        '404':
          description: Job was deleted, never existed or you do not have access to it
        '409':
          description: Job could not be deleted, as there are currently running jobs in the queue.
      summary: Delete Batch Prediction job definition by job definition ID
      tags:
      - batch_predictions
      x-versionadded: v2.24
    get:
      description: Retrieve a Batch Prediction job definition
      operationId: batchPredictionJobDefinitions_retrieve
      parameters:
      - description: ID of the Batch Prediction job definition
        in: path
        name: jobDefinitionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPredictionJobDefinitionsResponse'
          description: Job details for the requested Batch Prediction job definition
        '404':
          description: Job was deleted, never existed or you do not have access to it
      summary: Retrieve Batch Prediction job definition by job definition ID
      tags:
      - batch_predictions
      x-versionadded: v2.24
    patch:
      description: Update a Batch Prediction job definition
      operationId: batchPredictionJobDefinitions_patch
      parameters:
      - description: ID of the Batch Prediction job definition
        in: path
        name: jobDefinitionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPredictionJobDefinitionsUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPredictionJobDefinitionsResponse'
          description: Job details for the updated Batch Prediction job definition
        '403':
          description: You are not authorized to alter the contents of this job definition due to your permissions role
        '404':
          description: Job was deleted, never existed or you do not have access to it
        '409':
          description: You chose a name of your job definition that was already existing within your organization
        '422':
          description: 'Could not update the job definition. Possible reasons: {}'
      summary: Update Batch Prediction job definition by job definition ID
      tags:
      - batch_predictions
      x-versionadded: v2.24
  /api/v2/batchPredictionJobDefinitions/{jobDefinitionId}/portable/:
    get:
      description: Retrieve a Batch Prediction job definition for Portable Batch Predictions
      operationId: batchPredictionJobDefinitionsPortable_list
      parameters:
      - description: ID of the Batch Prediction job definition
        in: path
        name: jobDefinitionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Snippet for Portable Batch Predictions
        '404':
          description: Job was deleted, never existed or you do not have access to it
      summary: Retrieve job definition snippet by job definition ID
      tags:
      - batch_predictions
      x-versionadded: v2.26
