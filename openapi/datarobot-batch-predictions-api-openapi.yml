      responses:
        '202':
          description: The prediction has successfully been requested. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status of the predictions as with :http:get:`/api/v2/projects/(projectId)/predictJobs/(jobId)/`
              schema:
                type: string
        '422':
          description: The request cannot be processed.
      summary: Make new predictions by project ID
      tags:
      - batch_predictions
      x-versionadded: v2.0
  /api/v2/projects/{projectId}/predictions/{predictionId}/:
    get:
      description: 'Retrieve predictions that have previously been computed.

        Training predictions encoded either as JSON or CSV.

        If CSV output was requested, the returned CSV data will contain the following columns:


        * For regression projects: `row_id` and `prediction`.

        * For binary classification projects: `row_id`, `prediction`,

        `class_` and `class_`.

        * For multiclass projects: `row_id`, `prediction` and a

        `class_` for each class.

        * For multilabel projects: `row_id` and for each class

        `prediction_` and `class_`.

        * For time-series, these additional columns will be added: `forecast_point`,

        `forecast_distance`, `timestamp`, and `series_id`.


        .. minversion:: v2.21


        * If `explanationAlgorithm` = ''shap'', these additional columns will be added:

        triplets of (`Explanation__feature_name`,

        `Explanation__feature_value`, and `Explanation__strength`) for `i` ranging

        from 1 to `maxExplanations`, `shap_remaining_total` and `shap_base_value`. Binary

        classification projects will also have `explained_class`, the class for which

        positive SHAP values imply an increased probability.'
      operationId: projectsPredictions_retrieve
      parameters:
      - description: The ID of the prediction record to retrieve. If you have the jobId, you can retrieve the predictionId using :http:get:`/api/v2/projects/(projectId)/predictJobs/(jobId)/`.
        in: path
        name: predictionId
        required: true
        schema:
          type: string
      - description: The ID of the project the prediction belongs to.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: Requested MIME type for the returned data
        in: header
        name: Accept
        required: false
        schema:
          enum:
          - application/json
          - text/csv
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionRetrieveResponse'
          description: Predictions that have previously been computed.
          headers:
            Content-Type:
              description: MIME type of the returned data
              schema:
                enum:
                - application/json
                - text/csv
                type: string
        '404':
          description: No prediction data found.
      summary: Get a completed set of predictions by project ID
      tags:
      - batch_predictions
      x-versionadded: v2.0
