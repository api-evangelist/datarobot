openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Value Tracker API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage Value Trackers, as well as add comments and host discussions.
  name: value_tracker
paths:
  /api/v2/comments/:
    post:
      operationId: comments_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentRetrieve'
          description: ''
        '201':
          description: The comment was successfully created
        '422':
          description: The request was formatted improperly
      summary: Post a comment
      tags:
      - value_tracker
      x-versionadded: v2.21
  /api/v2/comments/{commentId}/:
    delete:
      description: Delete a comment
      operationId: comments_delete
      parameters:
      - description: The ID of the comment
        in: path
        name: commentId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
        '204':
          description: The use case comment was deleted
      summary: Delete a comment by comment ID
      tags:
      - value_tracker
      x-versionadded: v2.21
    get:
      description: Retrieve a comment
      operationId: comments_retrieve
      parameters:
      - description: The ID of the comment
        in: path
        name: commentId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentRetrieve'
          description: ''
      summary: Retrieve a comment by comment ID
      tags:
      - value_tracker
      x-versionadded: v2.21
    patch:
      description: Update a comment
      operationId: comments_patch
      parameters:
      - description: The ID of the comment
        in: path
        name: commentId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdate'
      responses:
        '200':
          description: ''
        '204':
          description: The comment was successfully updated
        '422':
          description: The request was formatted improperly
      summary: Update a comment by comment ID
      tags:
      - value_tracker
      x-versionadded: v2.21
  /api/v2/comments/{entityType}/{entityId}/:
    get:
      description: List comments
      operationId: comments_list
      parameters:
      - description: The number of records to skip over. Default 0.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of records to return in the range from 1 to 100. Default 100.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: Sort comments by a field of the comment.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - createdAt
          - -createdAt
          - updatedAt
          - -updatedAt
          type: string
      - description: ID of the entity to retrieve comments of
        in: path
        name: entityId
        required: true
        schema:
          type: string
      - description: Type of the entity to retrieve a comments of, currently only useCase is supported
        in: path
        name: entityType
        required: true
        schema:
          enum:
          - useCase
          - model
          - catalog
          - experimentContainer
          - deployment
          - workload
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
          description: ''
      summary: List comments by entitytype
      tags:
      - value_tracker
      x-versionadded: v2.24
  /api/v2/valueTrackerValueTemplates/:
    get:
      description: List available value tracker templates.
      operationId: valueTrackerValueTemplates_list
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ValueTrackerValueTemplateResponse'
                type: array
          description: ''
      summary: List available value tracker templates
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackerValueTemplates/{templateType}/:
    get:
      description: Get an individual value tracker value template by its name.
      operationId: valueTrackerValueTemplates_retrieve
      parameters:
      - description: The name of the class ValueTracker value template to be retrieved
        in: path
        name: templateType
        required: true
        schema:
          enum:
          - classification
          - regression
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerValueTemplateResponse'
          description: ''
        '400':
          description: Bad request
      summary: Get an individual value tracker value template by its name by templatetype
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackerValueTemplates/{templateType}/calculation/:
    get:
      description: Calculate the value of the template with the given template parameters.
      operationId: valueTrackerValueTemplatesCalculation_list
      parameters:
      - description: Accuracy improvement
        in: query
        name: accuracyImprovement
        required: true
        schema:
          type: number
      - description: Estimated number of decisions per year
        in: query
        name: decisionsCount
        required: true
        schema:
          type: integer
      - description: Estimated number of incorrect decisions per year. Required for templateType CLASSIFICATION
        in: query
        name: incorrectDecisionsCount
        required: false
        schema:
          type: integer
      - description: Estimated cost of an individual incorrect decision. Required for templateType CLASSIFICATION
        in: query
        name: incorrectDecisionCost
        required: false
        schema:
          type: number
      - description: Target value. Required for templateType REGRESSION
        in: query
        name: targetValue
        required: false
        schema:
          type: number
      - description: The name of the class ValueTracker value template to be retrieved
        in: path
        name: templateType
        required: true
        schema:
          enum:
          - classification
          - regression
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerValueTemplateCalculateResponse'
          description: ''
        '400':
          description: Bad request
      summary: Calculate the value of the template by templatetype
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackers/:
    get:
      description: List value trackers the requesting user has access to.
      operationId: valueTrackers_list
      parameters:
      - description: The number of records to skip over. Default 0.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of records to return in the range from 1 to 100. Default 100.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: Sort the value trackers by a field of the value tracker.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - businessImpact
          - -businessImpact
          - potentialValue
          - -potentialValue
          - realizedValue
          - -realizedValue
          - feasibility
          - -feasibility
          - stage
          - -stage
          type: string
      - description: Only return value trackers with names that match the given string.
        in: query
        name: namePart
        required: false
        schema:
          type: string
      - description: Filter results by the current stage of the value trackers.
        in: query
        name: stage
        required: false
        schema:
          enum:
          - ideation
          - queued
          - dataPrepAndModeling
          - validatingAndDeploying
          - inProduction
          - retired
          - onHold
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerListResponse'
          description: ''
      summary: List value trackers the requesting user has access to
      tags:
      - value_tracker
      x-versionadded: v2.31
    post:
      description: Create a new value tracker.
      operationId: valueTrackers_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueTracker'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerCreateResponse'
          description: ''
      summary: Create a new value tracker
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackers/{valueTrackerId}/:
    delete:
      description: Delete a value tracker.
      operationId: valueTrackers_delete
      parameters:
      - description: The ID of the ValueTracker.
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
        '204':
          description: The value tracker was deleted.
      summary: Delete a value tracker by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
    get:
      description: Retrieve a value tracker.
      operationId: valueTrackers_retrieve
      parameters:
      - description: The ID of the ValueTracker.
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerResponse'
          description: ''
      summary: Retrieve a value tracker by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
    patch:
      description: Update a value tracker.
      operationId: valueTrackers_patch
      parameters:
      - description: The ID of the ValueTracker.
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueTrackerUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerResponse'
          description: ''
      summary: Update a value tracker by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackers/{valueTrackerId}/activities/:
    get:
      description: Retrieve the activities of a value tracker.
      operationId: valueTrackersActivities_list
      parameters:
      - description: The number of records to skip over. Default 0.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of records to return in the range from 1 to 100. Default 100.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: The ID of the ValueTracker.
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerActivityListResponse'
          description: ''
      summary: Retrieve the activities of a value tracker by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackers/{valueTrackerId}/attachments/:
    get:
      description: Get the list of resources attached to this value tracker.
      operationId: valueTrackersAttachments_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: This many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: The value tracker attachment type.
        in: query
        name: type
        required: false
        schema:
          enum:
          - dataset
          - modelingProject
          - deployment
          - customModel
          - modelPackage
          - application
          type: string
      - description: The ID of the ValueTracker.
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerAttachmentListResponse'
          description: ''
        '404':
          description: Either the value tracker does not exist or the user does not have permissions to view this value tracker.
      summary: Get the list of resources attached by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
    post:
      description: Attach the list of resources to this value tracker.
      operationId: valueTrackersAttachments_create
      parameters:
      - description: The ID of the ValueTracker.
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateValueTrackerAttachment'
      responses:
        '201':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ValueTrackerAttachment'
                type: array
          description: ''
        '404':
          description: Use case or object not found or value tracker not writable or object not readable.
        '422':
          description: The request was formatted improperly.
      summary: Attach the list of resources by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackers/{valueTrackerId}/attachments/{attachmentId}/:
    delete:
      description: Removes a resource from a value tracker.
      operationId: valueTrackersAttachments_delete
      parameters:
      - description: The ID of the ValueTracker.
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      - description: The ID of the attachment.
        in: path
        name: attachmentId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '403':
          description: The user does not have permission to remove objects from this value tracker
        '404':
          description: Either the value tracker does not exist or the user does not have permissions to view this value tracker.
        '422':
          description: The request was formatted improperly, or the requested object to delete was not found
      summary: Removes a resource by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
    get:
      description: Get a resource that is attached to a value tracker.
      operationId: valueTrackersAttachments_retrieve
      parameters:
      - description: The ID of the ValueTracker.
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      - description: The ID of the attachment.
        in: path
        name: attachmentId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerAttachmentResponse'
          description: ''
        '403':
          description: The user does not have permission to attach objects to this value tracker
        '404':
          description: Either the value tracker does not exist or the user does not have permissions to view this value tracker.
        '422':
          description: The request was formatted improperly, or the requested object to attach was not found
      summary: Get a resource that is attached by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackers/{valueTrackerId}/realizedValueOverTime/:
    get:
      description: Retrieve realized value information for a given value tracker over a period of time.
      operationId: valueTrackersRealizedValueOverTime_list
      parameters:
      - description: 'Start of the period to retrieve monitoring data, defaults to 7 days ago from the end of the period. Note: this field only accepts top of the hour RFC3339 datetime strings, for example: ``2019-08-01T00:00:00Z``.'
        in: query
        name: start
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - description: 'End of the period to retrieve monitoring data, defaults to the next top of the hour. Note: this field only accepts top of the hour RFC3339 datetime strings, for example: ``2019-08-01T00:00:00Z``.'
        in: query
        name: end
        required: false
        schema:
          format: date-time
          type:
          - string
          - 'null'
      - description: The time duration of a bucket. Needs to be multiple of one hour. Can not be longer than the total length of the period. If not set, a default value will be calculated based on the start and end time.
        in: query
        name: bucketSize
        required: false
        schema:
          format: duration
          type: string
      - description: The ID of the class ValueTracker
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerRealizedValuesOverTimeResponse'
          description: ''
      summary: Retrieve realized value information by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
  /api/v2/valueTrackers/{valueTrackerId}/sharedRoles/:
    get:
      description: Get the list of users, groups and organizations that have access to this value tracker.
      operationId: valueTrackersSharedRoles_list
      parameters:
      - description: Only return roles for a user, group or organization with this identifier.
        in: query
        name: id
        required: false
        schema:
          type: string
      - description: This many results will be skipped
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned
        in: query
        name: limit
        required: true
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      - description: Only return roles for a user, group or organization with this name.
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: The list of access controls for recipients with this type.
        in: query
        name: shareRecipientType
        required: false
        schema:
          enum:
          - user
          - group
          - organization
          - externalApplication
          type: string
      - description: The ID of the class ValueTracker
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueTrackerSharingListResponse'
          description: ''
      summary: Get the list of users, groups and organizations that have access by value…
      tags:
      - value_tracker
      x-versionadded: v2.31
    patch:
      description: Share a value tracker with a user, group or organization.
      operationId: valueTrackersSharedRoles_patchMany
      parameters:
      - description: The ID of the class ValueTracker
        in: path
        name: valueTrackerId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueTrackerSharingUpdate'
      responses:
        '200':
          description: ''
        '204':
          description: The roles were updated successfully.
        '422':
          description: The request was formatted improperly.
      summary: Share a value tracker by value tracker ID
      tags:
      - value_tracker
      x-versionadded: v2.31
components:
  schemas:
    ValueTrackerSharingRoleUpdateData:
      properties:
        id:
          description: The ID of the recipient
          type: string
        role:
          description: The assigned role
          enum:
          - OWNER
          - USER
          - CONSUMER
          - NO_ROLE
          type: string
        shareRecipientType:
          description: The recipient type
          enum:
          - user
          - group
          - organization
          type: string
        username:
          description: The name of the user, group, or organization
          type: string
      required:
      - role
      - shareRecipientType
      type: object
    ValueTrackerValueTemplateClassificationData:
      description: The value tracker value data.
      properties:
        accuracyImprovement:
          description: Accuracy improvement.
          type: number
        decisionsCount:
          description: The estimated number of decisions per year.
          type: integer
        incorrectDecisionCost:
          description: The estimated cost of an individual incorrect decision.
          type: number
        incorrectDecisionsCount:
          description: The estimated number of incorrect decisions per year.
          type: integer
      required:
      - accuracyImprovement
      - decisionsCount
      - incorrectDecisionCost
      - incorrectDecisionsCount
      type: object
    ValueTrackerValueTemplateRegression:
      properties:
        data:
          $ref: '#/components/schemas/ValueTrackerValueTemplateRegressionData'
        templateType:
          description: The value tracker value template type.
          enum:
          - regression
          type: string
      required:
      - data
      - templateType
      type: object
    ValueTrackerAttachmentApplicationOverview:
      properties:
        appType:
          description: The type of the application.
          type: string
        createdAt:
          description: The time when the application was created.
          format: date-time
          type: string
        lastModifiedAt:
          description: The time of the last modification.
          format: date-time
          type: string
        name:
          description: The name of the application.
          type: string
        version:
          description: The version string of the app.
          type: string
      required:
      - appType
      - createdAt
      - lastModifiedAt
      - name
      - version
      type: object
    Comment:
      properties:
        content:
          description: Content of the comment, 10000 symbols max
          maxLength: 10000
          type: string
        entityId:
          description: ID of the entity to post the comment to
          type: string
        entityType:
          description: Type of the entity to post the comment to, currently only useCase is supported
          enum:
          - useCase
          - model
          - catalog
          - experimentContainer
          - deployment
          - workload
          type: string
        mentions:
          description: A list of users IDs mentioned in the content
          items:
            type: string
          maxItems: 100
          type: array
      required:
      - content
      - entityId
      - entityType
      type: object
    ValueTrackerActivity:
      description: DataRobot user information.
      properties:
        eventDescription:
          $ref: '#/components/schemas/ValueTrackerEventDescriptions'
        eventType:
          description: The type of activity.
          type:
          - string
          - 'null'
        firstName:
          description: The first name of the ValueTracker owner.
          type:
          - string
          - 'null'
        id:
          description: The ID of the ValueTracker activity.
          type: string
        lastName:
          description: The last name of the ValueTracker owner.
          type:
          - string
          - 'null'
        timestamp:
          description: The timestamp of the activity.
          format: date-time
          type: string
        user:
          $ref: '#/components/schemas/ValueTrackerDrUserId'
        username:
          description: The username of the ValueTracker owner.
          type: string
      required:
      - eventDescription
      - eventType
      - timestamp
      - user
      type: object
    ValueTrackerValueTemplateSchema:
      description: Schema entry defining the type and limits of a template parameter
      properties:
        elementType:
          description: Possible types used for template variables
          enum:
          - integer
          - float
          - number
          type: string
        label:
          description: Label describing the represented value
          type: string
        maximum:
          description: Sets Maximum value if given
          type:
          - integer
          - 'null'
        minimum:
          description: Sets Minimum value if given
          type:
          - integer
          - 'null'
        placeholder:
          description: Text that can be used to prefill an input filed for the value
          type: string
        unit:
          description: The unit type (e.g., %).
          type:
          - string
          - 'null'
      required:
      - elementType
      - label
      - maximum
      - minimum
      - placeholder
      - unit
      type: object
    ValueTrackerActivityListResponse:
      properties:
        count:
          description: The number of items returned on this page.
          type: integer
        data:
          description: The activities of the value tracker.
          items:
            $ref: '#/components/schemas/ValueTrackerActivity'
          type: array
        next:
          description: URL pointing to the next page (if null, there is no next page).
          format: uri
          type:
          - string
          - 'null'
        previous:
          description: URL pointing to the previous page (if null, there is no previous page).
          format: uri
          type:
          - string
          - 'null'
        totalCount:
          description: The number of items matching the query condition.
          type: integer
      required:
      - count
      - data
      - next
      - previous
      - totalCount
      type: object
    ValueTrackerHealthInformation:
      properties:
        endDate:
          description: The end date for this health status.
          format: date-time
          type:
          - string
          - 'null'
        message:
          description: Information about the health status.
          type:
          - string
          - 'null'
        startDate:
          description: The start date for this health status.
          format: date-time
          type:
          - string
          - 'null'
        status:
          description: The status of the value tracker.
          type:
          - string
          - 'null'
      required:
      - endDate
      - message
      - startDate
      - status
      type: object
    ValueTrackerAttachmentListResponse:
      properties:
        count:
