openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Insights API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to generate and interpret insights for specific models.
  name: Insights
paths:
  /api/v2/dataSlices/:
    delete:
      description: Data slices bulk deletion.
      operationId: dataSlices_deleteMany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSlicesBulkDeleteRequest'
      responses:
        '204':
          description: The requested data slice(s) are deleted successfully.
      summary: Data slices bulk deletion
      tags:
      - Insights
      x-versionadded: v2.31
    post:
      description: Request to create a new data slice.
      operationId: dataSlices_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSlicesCreationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSliceIndividualResponse'
          description: The requested data slice is created successfully.
      summary: Request
      tags:
      - Insights
      x-versionadded: v2.31
  /api/v2/dataSlices/{dataSliceId}/:
    delete:
      description: Deletes the data slice specified by the data slice ID.
      operationId: dataSlices_delete
      parameters:
      - description: ID of the data slice.
        in: path
        name: dataSliceId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The specified data slice was deleted.
      summary: Delete a data slice by data slice ID
      tags:
      - Insights
      x-versionadded: v2.31
    get:
      description: Returns details about the specified data slice ID.
      operationId: dataSlices_retrieve
      parameters:
      - description: ID of the data slice.
        in: path
        name: dataSliceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSliceIndividualResponse'
          description: Data slice was found.
      summary: Retrieve a Data Slice by data slice ID
      tags:
      - Insights
      x-versionadded: v2.31
  /api/v2/dataSlices/{dataSliceId}/sliceSizes/:
    get:
      description: Returns the number of rows available after applying a data slice to the specified subset of the dataset.
      operationId: dataSlicesSliceSizes_list
      parameters:
      - description: The project ID.
        in: query
        name: projectId
        required: true
        schema:
          type: string
      - description: The source of data to use to calculate the size.
        in: query
        name: source
        required: true
        schema:
          enum:
          - backtest_0
          - backtest_0_training
          - backtest_1
          - backtest_10
          - backtest_10_training
          - backtest_11
          - backtest_11_training
          - backtest_12
          - backtest_12_training
          - backtest_13
          - backtest_13_training
          - backtest_14
          - backtest_14_training
          - backtest_15
          - backtest_15_training
          - backtest_16
          - backtest_16_training
          - backtest_17
          - backtest_17_training
          - backtest_18
          - backtest_18_training
          - backtest_19
          - backtest_19_training
          - backtest_1_training
          - backtest_2
          - backtest_20
          - backtest_20_training
          - backtest_2_training
          - backtest_3
          - backtest_3_training
          - backtest_4
          - backtest_4_training
          - backtest_5
          - backtest_5_training
          - backtest_6
          - backtest_6_training
          - backtest_7
          - backtest_7_training
          - backtest_8
          - backtest_8_training
          - backtest_9
          - backtest_9_training
          - crossValidation
          - externalTestSet
          - holdout
          - holdout_training
          - training
          - validation
          - vectorDatabase
          type: string
      - description: The external dataset ID to use when calculating the size of a slice. Use this parameter only when the source is 'externalTestSet'.
        in: query
        name: externalDatasetId
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: The model ID whose training dataset should be sliced. Use this parameter only when the source is 'training'.
        in: query
        name: modelId
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: ID of the data slice.
        in: path
        name: dataSliceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSliceRetrieveSubsetSizeResponse'
          description: The subset slice size was retrieved.
        '204':
          description: No slice size exists.
        '403':
          description: Unathorized access to resource.
      summary: Returns the number of rows available after applying a data slice by data slice…
      tags:
      - Insights
      x-versionadded: v2.31
    post:
      description: Compute the number of rows available after applying a data slice to the specified subset of the dataset.
      operationId: dataSlicesSliceSizes_create
      parameters:
      - description: ID of the data slice.
        in: path
        name: dataSliceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSliceComputeSubsetSizeRequest'
      responses:
        '202':
          description: The requested data slices have been successfully validated.
      summary: Compute the number of rows available after applying a data slice by data slice…
      tags:
      - Insights
      x-versionadded: v2.31
  /api/v2/insights/confusionMatrix/:
    post:
      description: Request calculation of insight with an optional data slice.
      operationId: insightsConfusionMatrix_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeConfusionMatrixRequest'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInsightsResponse'
          description: The requested insights computation was accepted.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '422':
          description: Unsupported project or model type, model not trained, or locked holdout.
      summary: Request calculation of Confusion Matrix chart
      tags:
      - Insights
      x-versionadded: v2.42
  /api/v2/insights/confusionMatrix/models/{entityId}/:
    get:
      description: The list of paginated Confusion Matrix chart insights.
      operationId: insightsConfusionMatrixModels_list
      parameters:
      - description: The number of items to return.
        in: query
        name: limit
        required: true
        schema:
          default: 10
          maximum: 10
          minimum: 1
          type: integer
      - description: The number of items to skip before starting to collect the result set.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          maximum: 1000000
          minimum: 0
          type: integer
      - description: The ID of the data slice.
        in: query
        name: dataSliceId
        required: false
        schema:
          type:
          - string
          - 'null'
      - description: The subset of data used to compute the insight.
        in: query
        name: source
        required: false
        schema:
          enum:
          - (-1, -1)
          - (-1,-1)
          - (0, -1)
          - (0,-1)
          - CV
          - backtest_10
          - backtest_11
          - backtest_12
          - backtest_13
          - backtest_14
          - backtest_15
          - backtest_16
          - backtest_17
          - backtest_18
          - backtest_19
          - backtest_2
          - backtest_20
          - backtest_3
          - backtest_4
          - backtest_5
          - backtest_6
          - backtest_7
          - backtest_8
          - backtest_9
          - crossValidation
          - externalTestSet
          - holdout
          - validation
          - validation_0
          - validation_1
          type: string
      - description: Return only insights without a data_slice_id.
        in: query
        name: unslicedOnly
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Orders the chart data by the specified attributes.Prefix the attribute name with a dash to sort in descending order (e.g., dataOrderBy='-predictedCount).'
        in: query
        name: dataOrderBy
        required: false
        schema:
          default: className
          enum:
          - className
          - -className
          - actualCount
          - -actualCount
          - predictedCount
          - -predictedCount
          - f1
          - -f1
          - precision
          - -precision
          - recall
          - -recall
          type: string
      - description: Determines whether the values in the rows of the confusion matrix should correspond to the same actual class ('actual') or predicted class ('predicted').
        in: query
        name: orientation
        required: false
        schema:
          default: actual
          enum:
          - actual
          - -actual
          - predicted
          - -predicted
          type: string
      - description: The first row (start index) used when applying slicing to the confusion matrix.
        in: query
        name: rowStart
        required: false
        schema:
          minimum: 0
          type: integer
      - description: The last row (end index) used when applying slicing to the confusion matrix.
        in: query
        name: rowEnd
        required: false
        schema:
          minimum: 0
          type: integer
      - description: The first column (start index) used when applying slicing to the confusion matrix.
        in: query
        name: colStart
        required: false
        schema:
          minimum: 0
          type: integer
      - description: The last column (end index) used when applying slicing to the confusion matrix.
        in: query
        name: colEnd
        required: false
        schema:
          minimum: 0
          type: integer
      - description: The ID of the model.
        in: path
        name: entityId
        required: true
        schema:
          type: string
      - description: Requested MIME type for the returned data.
        in: header
        name: Accept
        required: false
        schema:
          enum:
          - application/json
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveConfusionMatrixPaginatedResponse'
          description: Retrieves a model's Confusion Matrix chart.
        '404':
          description: Requested entity ID or data slice ID not found
        '422':
          description: Unsupported project type, or unsupported insight for model
      summary: The list of paginated Confusion Matrix chart insights by entity ID
      tags:
      - Insights
      x-versionadded: v2.42
