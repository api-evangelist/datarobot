  /api/v2/projects/{projectId}/predictionExplanations/:
    post:
      description: 'Create a new PredictionExplanations object (and its accompanying PredictionExplanationsRecord).

        In order to successfully create PredictionExplanations for a particular model and dataset, you must first

        - Compute feature impact for the model via :http:post:`/api/v2/projects/(projectId)/models/(modelId)/featureImpact/`

        - Compute a PredictionExplanationsInitialization for the model via :http:post:`/api/v2/projects/(projectId)/models/(modelId)/predictionExplanationsInitialization/`

        - Compute predictions for the model and dataset via :http:post:`/api/v2/projects/(projectId)/predictions/`

        `thresholdHigh` and `thresholdLow` are optional filters applied to speed up computation. When at least one is specified, only the selected outlier rows will have prediction explanations computed. Rows are considered to be outliers if their predicted value (in case of regression projects) or probability of being the positive class (in case of classification projects) isless than `thresholdLow` or greater than `thresholdHigh`. If neither is specified, prediction explanations will be computed for all rows.'
      operationId: projectsPredictionExplanations_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionExplanationsCreate'
      responses:
        '202':
          description: The request was accepted and will be worked on.
          headers:
            Location:
              description: A url that can be polled to check the status.
