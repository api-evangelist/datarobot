  /api/v2/projects/{projectId}/models/{modelId}/multiclassFeatureImpact/:
    get:
      description: 'Retrieve feature impact scores for each class in a multiclass model.

        Feature Impact is computed for each column by creating new data with that column randomly permuted (but the others left unchanged), and seeing how the error metric score for the predictions is affected. Elsewhere this technique is sometimes called ''Permutation Importance''.

        The `impactUnnormalized` is how much worse the error metric score is when making predictions on this modified data. The `impactNormalized` is normalized so that the largest value is 1. In both cases, larger values indicate more important features.'
      operationId: projectsModelsMulticlassFeatureImpact_list
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MulticlassFeatureImpactResponse'
          description: ''
        '404':
          description: If no feature impact data found for a given model.
      summary: Retrieve multiclass feature impact by ID
      tags:
      - Insights
      x-versionadded: v2.19
