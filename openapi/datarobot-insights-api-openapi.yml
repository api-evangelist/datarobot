      parameters:
      - description: Only the series containing the given value in one of the series ID columns will be returned if specified.
        in: query
        name: multiseriesValue
        required: false
        schema:
          type: string
      - description: The number of results to skip. Defaults to 0 if not specified.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The maximum number of results to return. Defaults to 100 if not specified.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          minimum: 0
          type: integer
      - description: The name of the metric to retrieve the scores for.If omitted, the default project metric will be used.
        in: query
        name: metric
        required: false
        schema:
          type: string
      - description: 'Used for sorting the series. Supported attributes for ordering include: "multiseriesValue", "rowCount", "validationScore", "holdoutScore"  and "backtestingScore", "startDate", "endDate", and "targetAverage".Prefix the attribute name with a dash to sort in descending order,e.g. `orderBy=-rowCount`. If multiple series with equal values of the ordering attributeexist, ties will be broken arbitrarily.'
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - multiseriesValue
          - -multiseriesValue
          - rowCount
          - -rowCount
          - startDate
          - -startDate
          - endDate
          - -endDate
          - targetAverage
          - -targetAverage
          - validationScore
          - -validationScore
          - backtestingScore
          - -backtestingScore
          - holdoutScore
          - -holdoutScore
          - cluster
          - -cluster
          type: string
      - description: 'Used to specify on which attribute values to filter the series.Supported attributes for filtering include: "rowCount", "startDate", "endDate", "targetAverage", "validationScore", "holdoutScore", and "backtestingScore".`filterByBins` and `numberOfBins` are required if this parameter is used.'
        in: query
        name: filterBy
        required: false
        schema:
          enum:
          - rowCount
          - startDate
          - endDate
          - targetAverage
          - validationScore
          - backtestingScore
          - holdoutScore
          - cluster
          type: string
      - description: Used to specify the number of bins in the histogram on which to filter the series.Can be 10, 20 or 50.`filterBy` and `filterByBins` are required if this parameter is used.
        in: query
        name: numberOfBins
        required: false
        schema:
          enum:
          - '10'
          - '20'
          - '50'
          type: string
      - description: Used to specify the multiseries histogram bins on which to filter the series.`filterBy` and `numberOfBins` are required if this parameter is used.
        in: query
        name: filterByBins
        required: false
        schema:
          type: string
      - description: Used to specify the specific cluster on which to filter the series.`filterBy` is required if this parameter is used.Only valid for unsupervised clustering projects.
        in: query
        name: clusterNames
        required: false
        schema:
          type: string
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
