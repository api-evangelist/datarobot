      x-versionadded: v2.18
  /api/v2/projects/{projectId}/models/{modelId}/featureImpact/:
    get:
      description: 'Retrieve feature impact scores for features in a model.

        Feature Impact is computed for each column by creating new data with that column randomly permuted (but the others left unchanged), and seeing how the error metric score for the predictions is affected. Elsewhere this technique is sometimes called ''Permutation Importance''.

        The `impactUnnormalized` is how much worse the error metric score is when making predictions on this modified data. The `impactNormalized` is normalized so that the largest value is 1. In both cases, larger values indicate more important features. If a feature is a redundant feature, i.e. once other features are considered it doesn''t contribute much in addition, the `redundantWith` value is the name of feature that has the highest correlation with this feature.'
      operationId: projectsModelsFeatureImpact_list
      parameters:
      - description: The backtest value used for Feature Impact computation. Applicable for datetime aware models.
        in: query
        name: backtest
        required: false
        schema:
          oneOf:
          - maximum: 19
            minimum: 0
            type: integer
          - enum:
            - holdout
            type: string
        x-versionadded: v2.28
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermutationFeatureImpactResponse'
          description: ''
        '404':
          description: No feature impact data found for the given model.
      summary: Retrieve feature impact scores by project ID
      tags:
      - Insights
      x-versionadded: v2.3
    post:
      description: 'Add a request to calculate feature impact to the queue.

        If the job has been previously submitted, the request will fail and return the `jobId` of previously submitted job. This `jobId` can be used to check status of previously submitted job.'
      operationId: projectsModelsFeatureImpact_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermutationFeatureImpactCreatePayload'
      responses:
        '202':
          description: The request was accepted and will be worked on.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '404':
          description: If `modelId` does not exist in project leaderboard
        '422':
          description: 'If feature impact has already run will return error including `jobId` property which is the `jobId` of the previously started feature impact job.


            .. minversion:: v2.21


            If the `rowCount` exceeds the maximum or minimum value for this dataset. Minimum is 10 rows. Maximum is 100000 rows or the training sample size of the model, whichever is less.

            '
      summary: Create feature impact by ID
      tags:
      - Insights
      x-versionadded: v2.3
