  /api/v2/projects/{projectId}/models/{modelId}/featureEffects/:
    get:
      description: 'Retrieve Feature Effects for the model.

        Feature Effects provides partial dependence and predicted vs actual values for the top 500 features, ordered by feature impact score.

        The partial dependence shows marginal effect of a feature on the target variable after accounting for the average effects of all other predictive features. It indicates how, holding all other variables except the feature of interest as they were, the value of this feature affects your prediction.

        If a Feature Effects job was previously submitted, this endpoint will return a response structured as {"message": , "jobId": } where jobId is the ID of the job. Retrieve the job with :http:get:`/api/v2/projects/(projectId)/jobs/(jobId)/`'
      operationId: projectsModelsFeatureEffects_list
      parameters:
      - description: The model's data source.
        in: query
        name: source
        required: false
        schema:
          default: training
          enum:
          - training
          - validation
          - holdout
          type: string
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureEffectsResponse'
          description: ''
        '403':
          description: User does not have permission to view the project.
        '404':
          description: Project, model, source or computation results do not exist.
      summary: Retrieve feature effects by ID
      tags:
      - Insights
      x-versionadded: v2.18
    post:
      description: 'Add a request to the queue to calculate Feature Effects.

        If the job has been previously submitted, the request fails, returning the `jobId` of the previously submitted job. Use this `jobId` to check status of the previously submitted job.'
      operationId: projectsModelsFeatureEffects_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureEffectCreate'
      responses:
        '202':
          description: The Feature Effects request has been successfully submitted. See Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '403':
          description: User does not have permission to view or submit jobs for the project.
        '404':
          description: The provided project or model does not exist.
        '422':
          description: "Queue submission error.\n\n.. minversion:: v2.21\n\n    If the rowCount exceeds the maximum or minimum value for this dataset. Minimum\n    is 10 rows. Maximum is 100000 rows or the training sample size of the model,\n    whichever is less.\n"
      summary: Create feature effects by ID
      tags:
      - Insights
      x-versionadded: v2.18
  /api/v2/projects/{projectId}/models/{modelId}/featureEffectsMetadata/:
    get:
      description: 'Retrieve Feature Effects metadata. Response contains status and available sources.

        One of the provided `source` parameters used for retrieving Feature Effects.

        * Source can be, at a minimum, `training` or `validation`. If holdout is configured for the project, `source` also includes `holdout`.

        * Source value of `training` is always available. (versions prior to v2.17 support `validation` only)

        * When a model is trained into `validation` or `holdout` without stacked predictions (i.e., no out-of-sample predictions in `validation` or `holdout`), `validation` and `holdout` sources are not available.'
      operationId: projectsModelsFeatureEffectsMetadata_list
