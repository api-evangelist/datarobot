  /api/v2/projects/{projectId}/datetimeModels/{modelId}/featureEffects/:
    get:
      description: 'Retrieve Feature Effects for a model backtest.

        Feature Effects provides partial dependence and predicted vs actual values for the top 500 features, ordered by feature impact score.

        The partial dependence shows marginal effect of a feature on the target variable after accounting for the average effects of all other predictive features. It indicates how, holding all other variables except the feature of interest as they were, the value of this feature affects your prediction.

        If a Feature Effects job was previously submitted for a given backtest, this endpoint will return a response structured as {"message": , "jobId": } where `jobId` is the ID of the job. Retrieve the job with :http:get:`/api/v2/projects/(projectId)/jobs/(jobId)/`'
      operationId: projectsDatetimeModelsFeatureEffects_list
      parameters:
      - description: The model's data source.
        in: query
        name: source
        required: false
        schema:
          default: training
          enum:
          - training
          - validation
          - holdout
          type: string
      - description: 'The backtest index. For example: `0`, `1`, ..., `20`, `holdout`, `startstop`.'
        in: query
        name: backtestIndex
        required: true
        schema:
          type: string
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureEffectsDatetimeResponse'
          description: ''
        '403':
          description: User does not have permission to view the project.
        '404':
          description: Project, model, source, backtest index, or computation results do not exist.
      summary: Retrieve Feature Effects by project ID
      tags:
      - Insights
      x-versionadded: v2.18
    post:
      description: 'Add a request to the queue to calculate Feature Effects for a backtest.

        If the job has been previously submitted, the request fails, returning the `jobId` of the previously submitted job. Use this `jobId` to check status of the previously submitted job.'
      operationId: projectsDatetimeModelsFeatureEffects_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureEffectsCreateDatetime'
      responses:
        '202':
          description: The Feature Effects request for a backtest has been successfully submitted. See Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '403':
          description: User does not have permission to view or submit jobs for the project.
        '404':
          description: Provided project, model, or backtest index does not exist.
        '422':
          description: Queue submission error.
      summary: Add a request by project ID
      tags:
      - Insights
      x-versionadded: v2.18
  /api/v2/projects/{projectId}/datetimeModels/{modelId}/featureEffectsMetadata/:
    get:
      description: 'Retrieve Feature Effects metadata for each backtest. Response contains status and available sources for each backtest of the model.

        One of the provided `backtestIndex` indexes used for submitting the compute request and retrieving Feature Effects.

        * Start/stop models contain a single `backtestIndex` response value of `startstop`.

        * Other models contain `backtestIndex` of `0`, `1`, ..., `holdout`.

        One of the provided `source` parameters used for retrieving Feature Effects.

        * Each backtest source can be, at a minimum, `training` or `validation`. If holdout is configured for the project, `backtestIndex` also includes `holdout` with sources `training` and `holdout`.

        * Source value of `training` is always available. (versions prior to v2.17 support `validation` only)

        * When a start/stop model is trained into `validation` or `holdout` without stacked predictions (i.e., no out-of-sample predictions in `validation` or `holdout`), `validation` and `holdout` sources are not available.

        * Source `holdout` is not available when there is no holdout configured for the project.'
      operationId: projectsDatetimeModelsFeatureEffectsMetadata_list
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelXrayMetadataDatetimeResponse'
          description: ''
        '403':
          description: User does not have permission to view the project.
        '404':
          description: The project or model does not exist.
        '422':
          description: The model is not datetime partitioned.
      summary: Retrieve Feature Effects metadata for each backtest by project ID
      tags:
      - Insights
      x-versionadded: v2.18
