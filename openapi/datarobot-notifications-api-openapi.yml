paths:
  /api/v2/entityNotificationChannels/:
    post:
      description: Create a new entity notification channel.
      operationId: entityNotificationChannels_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityNotificationChannelCreate'
      responses:
        '201':
          content:
