      summary: Create an entity notification channel
      tags:
      - Notifications
      x-versionadded: v2.33
  /api/v2/entityNotificationChannels/{relatedEntityType}/{relatedEntityId}/:
    get:
      description: List the notification channels related to the entity according to the query.
      operationId: entityNotificationChannels_list
      parameters:
      - description: The number of notification channels to skip.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The maximum number of notification channels to return.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Only return the notification channels whose names contain the given substring.
        in: query
        name: namePart
        required: false
        schema:
          type: string
      - description: The ID of the related entity.
        in: path
        name: relatedEntityId
        required: true
        schema:
          type: string
      - description: The type of the related entity.
        in: path
        name: relatedEntityType
        required: true
        schema:
          enum:
          - deployment
          - Deployment
          - DEPLOYMENT
          - customjob
          - Customjob
          - CUSTOMJOB
          type: string
      responses:
        '200':
          content:
            application/json:
