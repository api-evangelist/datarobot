components:
  schemas:
    UpdateSessionRequest:
      description: Schema for session partial patch-updates.
      properties:
        description:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: New session description.
          title: Description
        lifecycleStrategies:
          anyOf:
          - items:
              $ref: '#/components/schemas/LifecycleStrategiesDataModel'
            maxItems: 5
            minItems: 1
            type: array
          - type: 'null'
          description: When present, replaces the session's lifecycle strategies entirely. At least one strategy is required so every session stays controlled by one; null is rejected -- omit the field to leave the strategies unchanged. A strategy type that already executed for this session can never run again, so changing its configuration is rejected with 409; re-sending it unchanged is inert.
          title: Lifecyclestrategies
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Custom metadata as key-value pairs for storing application-specific data
          title: Metadata
      title: UpdateSessionRequest
      type: object
    MemorySpaceOwnership:
      description: 'Which half of the accessible set a listing asks for.


        A caller reaches a space either by creating it or by being given a share,

        and the two differ in what they may do with it, so the listing can return

        one without the other. There is no member for both: that is the absence of

        the filter, so it stays None rather than becoming a third value.'
      enum:
      - owned
      - shared
      title: MemorySpaceOwnership
      type: string
    EventBody:
      additionalProperties: true
      description: Body for all event types. Content field is mandatory, any additional fields are allowed.
      properties:
        content:
          description: Event body content text.
          maxLength: 100000
          minLength: 1
          title: Content
          type: string
      required:
      - content
      title: EventBody
      type: object
    EventCountTrigger:
      additionalProperties: false
      description: 'Trigger based on event count.


        Fires when the session''s event count reaches or exceeds the configured threshold.'
      properties:
        eventCount:
          description: Event count threshold
          exclusiveMinimum: 0.0
          maximum: 1000000.0
          title: Eventcount
          type: integer
      required:
      - eventCount
      title: EventCountTrigger
      type: object
    CreateSessionRequest:
      description: Request to create a new session with optional lifecycle strategies.
      example:
        description: Customer support conversation
        lifecycleStrategies:
        - trigger:
            ttl: 604800
          type: soft_delete
        metadata:
          department: sales
          priority: high
          region: us-east
        participants:
        - 507f1f77bcf86cd799439011
      properties:
        deduplicationKey:
          anyOf:
          - maxLength: 72
            minLength: 1
            type: string
          - type: 'null'
          description: Optional key, unique within the memory space, for idempotent session creation by coordinating HA agents. A second create with the same key returns 409.
          title: Deduplicationkey
        description:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: Optional session description
          title: Description
        lifecycleStrategies:
          description: Lifecycle strategies that automatically manage session lifecycle
          items:
            $ref: '#/components/schemas/LifecycleStrategiesDataModel'
          maxItems: 5
          title: Lifecyclestrategies
          type: array
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Custom metadata as key-value pairs for storing application-specific data
          title: Metadata
        participants:
          description: List of participant IDs (ObjectId format)
          items:
            type: string
          maxItems: 50
          minItems: 1
          title: Participants
          type: array
      required:
      - participants
      - lifecycleStrategies
      title: CreateSessionRequest
      type: object
    CreateEventRequest:
      description: Schema for create event request.
      properties:
        body:
          $ref: '#/components/schemas/EventBody'
          description: Event body.
        emitter:
          $ref: '#/components/schemas/EmitterDataModel'
          description: Emitter information.
        type:
          $ref: '#/components/schemas/EventType'
          default: message
          description: Event type.
      required:
      - body
      - emitter
      title: CreateEventRequest
      type: object
    PaginatedResponse_EventResponse_:
      properties:
        items:
          description: List of items for the current page
          items:
            $ref: '#/components/schemas/EventResponse'
          maxItems: 100
          title: Items
          type: array
        limit:
          description: Maximum number of returned items
          exclusiveMinimum: 0.0
          title: Limit
          type: integer
        offset:
          description: Number of skipped items
          minimum: 0.0
          title: Offset
          type: integer
        total:
          description: Total number of matching items
          title: Total
          type: integer
      required:
      - items
      - offset
      - limit
      - total
      title: PaginatedResponse[EventResponse]
      type: object
    BatchUpdateEventItem:
      description: 'A single item of a batch update: identifies the target event by sequence_id.


        Inherits the mutable body/type/emitter fields from UpdateEventRequest. The

        inherited "at least one field present" validator is overridden below because the

        always-present sequence_id would otherwise satisfy it vacuously.'
      properties:
        body:
          anyOf:
          - $ref: '#/components/schemas/EventBody'
          - type: 'null'
          description: Updated event body.
        createdAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Optional per-item version check: must match the target event''s timestamp.'
          title: Createdat
        emitter:
          anyOf:
          - $ref: '#/components/schemas/EmitterDataModel'
          - type: 'null'
          description: Updated emitter information.
        sequenceId:
          description: Target event sequence ID within the session.
          minimum: 0.0
          title: Sequenceid
          type: integer
        type:
          anyOf:
          - $ref: '#/components/schemas/EventType'
          - type: 'null'
          description: Updated event type.
      required:
      - sequenceId
      title: BatchUpdateEventItem
      type: object
    TTLTrigger:
      additionalProperties: false
      description: 'Trigger based on time-to-live (session age).


        Fires when the session age exceeds the configured TTL threshold.'
      properties:
        ttl:
          description: Time-to-live in seconds. Values above the environment's configured maximum session TTL are rejected; see MAX_SESSION_TTL_SECONDS.
          exclusiveMinimum: 0.0
          maximum: 315360000.0
          title: Ttl
          type: integer
      required:
      - ttl
      title: TTLTrigger
      type: object
    Message:
      description: A single conversation message passed to the POST /v1/memory endpoint
      properties:
        content:
          maxLength: 50000
          minLength: 1
          title: Content
          type: string
        role:
          enum:
          - user
          - assistant
          - system
          title: Role
          type: string
      required:
      - role
      - content
      title: Message
      type: object
    BatchCreateEventRequest:
      description: Schema for batch event creation. Events are appended in list order.
      properties:
        events:
          description: Events to append, in order.
          items:
            $ref: '#/components/schemas/CreateEventRequest'
          maxItems: 200
          minItems: 1
          title: Events
          type: array
      required:
      - events
      title: BatchCreateEventRequest
      type: object
    MemorySpaceResponse:
      description: Response schema for a single Memory Space
      properties:
        createdAt:
          description: Memory space creation timestamp.
          format: date-time
          title: Createdat
          type: string
        customInstructions:
          anyOf:
          - type: string
          - type: 'null'
          description: Custom prompt instructions used for fact extraction. Null means the default mem0 extraction prompt is used.
          title: Custominstructions
        deduplicationKey:
          anyOf:
          - type: string
          - type: 'null'
          description: Deduplication key, unique per user, if one was set.
          title: Deduplicationkey
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Memory space description.
          title: Description
        llmBaseUrl:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          description: Chat API URL to use for memory extraction.
          title: Llmbaseurl
        llmModelName:
          anyOf:
          - type: string
          - type: 'null'
          description: LLM model configured for memory extraction.
          title: Llmmodelname
        memorySpaceId:
          description: Unique memory space identifier.
          format: uuid
          title: Memoryspaceid
          type: string
        permissions:
          description: Actions the authenticated caller may perform on this memory space. The creator of a registered space holds all four; a space shared with the caller carries only what the share granted, and one still awaiting registration cannot be shared at all.
          items:
            enum:
            - CAN_VIEW
            - CAN_UPDATE
            - CAN_DELETE
            - CAN_SHARE
            type: string
          maxItems: 4
          title: Permissions
          type: array
        rbacResourceId:
          anyOf:
          - type: string
          - type: 'null'
          description: Identifier of this memory space in the platform's access-control system. Sharing is managed there, and this is the id its API expects. Null while the space has no such record yet, which is the same state that withholds `CAN_SHARE` from `permissions`.
          title: RBACResourceID
        tenantId:
          description: Tenant identifier.
          format: uuid
          title: Tenantid
          type: string
        userId:
          description: ID of the user who owns this memory space.
          title: Userid
          type: string
      required:
      - memorySpaceId
      - userId
      - tenantId
      - createdAt
      - permissions
      title: MemorySpaceResponse
      type: object
    BatchUpdateEventRequest:
      description: Schema for batch event update.
      properties:
        events:
          description: Events to update.
          items:
            $ref: '#/components/schemas/BatchUpdateEventItem'
          maxItems: 200
          minItems: 1
          title: Events
          type: array
      required:
      - events
      title: BatchUpdateEventRequest
      type: object
    LifecycleStrategiesDataModel:
      description: Lifecycle strategy configuration that defines when and how to manage session lifecycle.
      example:
        trigger:
          ttl: 86400
        type: soft_delete
      properties:
        opts:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional strategy-specific configuration parameters
          title: Opts
        trigger:
          anyOf:
          - $ref: '#/components/schemas/TTLTrigger'
          - $ref: '#/components/schemas/EventCountTrigger'
          - $ref: '#/components/schemas/TokenCountTrigger'
          - $ref: '#/components/schemas/IdleTimeoutTrigger'
          - $ref: '#/components/schemas/NeverTrigger'
          description: 'Trigger condition. Available: ''ttl'' (time in seconds), ''eventCount'', ''tokenCount'', ''idle'', ''never'' (retain indefinitely; only accepted in environments where the never-expire trigger is enabled)'
          title: Trigger
        type:
          description: 'Strategy type. Available: ''soft_delete'''
          enum:
          - soft_delete
          - extract_memories
          title: Type
          type: string
      required:
      - type
      - trigger
      title: LifecycleStrategiesDataModel
      type: object
    BatchEventResponse:
      description: 'Envelope wrapping a list of event responses for batch endpoints.


        Per the DataRobot API design policy enforced by adipose, every JSON response must

        be an object. The single-event endpoints already satisfy this; the batch endpoints

        wrap their list in this envelope so the same rule holds.'
      properties:
        items:
          description: Events processed by the batch operation.
          items:
            $ref: '#/components/schemas/EventResponse'
          maxItems: 200
          title: Items
          type: array
      required:
      - items
      title: BatchEventResponse
      type: object
    TokenCountTrigger:
      additionalProperties: false
      description: 'Trigger based on token count.


        Fires when the session''s total token count reaches or exceeds the configured threshold.

        Tokens are calculated from event message content using tiktoken.'
      properties:
        tokenCount:
          description: Token count threshold
          exclusiveMinimum: 0.0
          maximum: 100000000.0
          title: Tokencount
          type: integer
      required:
      - tokenCount
      title: TokenCountTrigger
      type: object
    LifecycleStrategyResponse:
      description: 'Schema for lifecycle strategy in response.


        Execution status is tracked in the strategy_executions table and can be

        queried separately if needed.'
      properties:
        opts:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Strategy-specific configuration parameters.
          title: Opts
        trigger:
          anyOf:
          - $ref: '#/components/schemas/TTLTrigger'
          - $ref: '#/components/schemas/EventCountTrigger'
          - $ref: '#/components/schemas/TokenCountTrigger'
          - $ref: '#/components/schemas/IdleTimeoutTrigger'
          - $ref: '#/components/schemas/NeverTrigger'
          description: Trigger condition.
          title: Trigger
        type:
          description: Strategy type.
          enum:
          - soft_delete
          - extract_memories
          title: Type
          type: string
      required:
      - type
      - trigger
      title: LifecycleStrategyResponse
      type: object
    SessionResponse:
      description: Schema for session response.
      properties:
        createdAt:
          description: Session creation timestamp.
          format: date-time
          title: Createdat
          type: string
        deduplicationKey:
          anyOf:
          - type: string
          - type: 'null'
          description: Deduplication key, unique within the memory space, if one was set.
          title: Deduplicationkey
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Session description.
          title: Description
        id:
          description: Session ID.
          format: uuid
          title: Id
          type: string
        lifecycleStrategies:
          description: Lifecycle strategies associated with this session.
          items:
            $ref: '#/components/schemas/LifecycleStrategyResponse'
          maxItems: 5
          title: Lifecyclestrategies
          type: array
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Custom metadata as key-value pairs for storing application-specific data
          title: Metadata
        participants:
          description: List of participant IDs.
          items:
            type: string
          maxItems: 50
          title: Participants
          type: array
        version:
          default: 1
          description: 'Monotonic version for optimistic concurrency. Echo back as `If-Match: "<version>"` on PATCH to detect lost updates.'
          minimum: 1.0
          title: Version
          type: integer
      required:
      - id
      - participants
      - createdAt
      title: SessionResponse
      type: object
    NeverTrigger:
      additionalProperties: false
      description: 'Trigger that never fires.


        Marks the session as exempt from automatic lifecycle execution: the data

        is retained until explicitly deleted. Used for app system data and for

        compliance retention beyond the TTL/idle 2-year cap.'
      properties:
        never:
          const: true
          description: Never fire; retain the session indefinitely
          title: Never
          type: boolean
      required:
      - never
      title: NeverTrigger
      type: object
    EventType:
      description: The type of the event that triggers the notification.
      enum:
      - message
      - tool_output
      - status
      properties:
        id:
          description: The ID of the event type.
          type: string
        label:
          description: The display name of the event type.
          type: string
      required:
      - id
      - label
      title: EventType
      type: object
    SessionDeduplicationErrorResponse:
      description: 'Body returned with HTTP 409 when a session create collides on `deduplicationKey`.


        Carries enough context for an HA-replica caller to adopt the existing winner

        without a second round-trip: the live session''s id and a path to it.'
      properties:
        deduplicationKey:
          description: The deduplication key that triggered the conflict.
          title: Deduplicationkey
          type: string
        detail:
          description: Human-readable explanation of the conflict.
          title: Detail
          type: string
        errorName:
          const: SessionDeduplicationConflict
          default: SessionDeduplicationConflict
          description: Stable machine-readable error name. Clients should switch on this, not detail.
          title: Errorname
          type: string
        existingSessionId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: ID of the live session already holding the key, or null if it could not be resolved (e.g. concurrently soft-deleted).
          title: Existingsessionid
        existingSessionUrl:
          anyOf:
          - type: string
          - type: 'null'
          description: Path to GET the existing session. Null when `existingSessionId` is null. Mirrors the `Location` response header (which is absolute).
          title: Existingsessionurl
      required:
      - detail
      - deduplicationKey
      title: SessionDeduplicationErrorResponse
      type: object
    PaginatedResponse_MemorySpaceResponse_:
      properties:
        items:
          description: List of items for the current page
          items:
            $ref: '#/components/schemas/MemorySpaceResponse'
          maxItems: 100
          title: Items
          type: array
        limit:
          description: Maximum number of returned items
          exclusiveMinimum: 0.0
          title: Limit
          type: integer
        offset:
          description: Number of skipped items
          minimum: 0.0
          title: Offset
          type: integer
        total:
          description: Total number of matching items
          title: Total
          type: integer
      required:
      - items
      - offset
      - limit
      - total
      title: PaginatedResponse[MemorySpaceResponse]
      type: object
    UpdateEventRequest:
      description: Schema for create event request.
      properties:
        body:
          anyOf:
          - $ref: '#/components/schemas/EventBody'
          - type: 'null'
          description: Updated event body.
        emitter:
          anyOf:
          - $ref: '#/components/schemas/EmitterDataModel'
          - type: 'null'
          description: Updated emitter information.
        type:
          anyOf:
