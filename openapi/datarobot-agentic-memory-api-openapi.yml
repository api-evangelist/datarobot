openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Agentic Memory API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Endpoints for managing agentic memory spaces, sessions, and events.
  name: agentic_memory
paths:
  /:
    get:
      description: 'List all Memory Spaces accessible by the authenticated user


        * Covers spaces the user created and spaces shared with them, each carrying

        the permissions the caller holds on it.

        * Returns offset/limit pagination with a total count.

        * Soft-deleted spaces, and spaces belonging to another tenant, are excluded.

        * `filter` narrows that set to the spaces whose description or ID contains

        the given text. It is one search box, so the caller does not have to say

        which of the two they mean.

        * `ownership` narrows it to one half of that set: the spaces the caller

        created, or the ones shared with them.'
      operationId: list_memory_spaces__get
      parameters:
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: Limit
          type: integer
      - description: Filter memory spaces by deduplication key (exact match). Keys are unique per creator, so this filter matches only spaces you created.
        in: query
        name: deduplicationKey
        required: false
        schema:
          anyOf:
          - maxLength: 72
            minLength: 1
            type: string
          - type: 'null'
          description: Filter memory spaces by deduplication key (exact match). Keys are unique per creator, so this filter matches only spaces you created.
          title: Deduplicationkey
      - description: Return only the memory spaces you created (`owned`), or only the ones shared with you (`shared`). Omit it for both, which is everything you can reach.
        in: query
        name: ownership
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MemorySpaceOwnership'
          - type: 'null'
          description: Return only the memory spaces you created (`owned`), or only the ones shared with you (`shared`). Omit it for both, which is everything you can reach.
          title: Ownership
      - description: Filter memory spaces by description or ID (case-insensitive substring match on either). Any length is accepted, and blank means no filter, so a caller can narrow the list from the first character they type. A partial ID matches, so the shortened ID shown to a user is enough to find their space.
        in: query
        name: filter
        required: false
        schema:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: Filter memory spaces by description or ID (case-insensitive substring match on either). Any length is accepted, and blank means no filter, so a caller can narrow the list from the first character they type. A partial ID matches, so the shortened ID shown to a user is enough to find their space.
          title: Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_MemorySpaceResponse_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: List Memory Spaces
      tags:
      - agentic_memory
  /new/:
    post:
      description: 'Create a new Memory Space


        tenant_id is bound from the authenticated user''s context; clients cannot set or override it.'
      operationId: create_memory_space_new__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemorySpaceRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySpaceResponse'
          description: Successful Response
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySpaceDeduplicationErrorResponse'
          description: A memory space with this `deduplicationKey` already exists for the user. Body carries `existingMemorySpaceId` / `existingMemorySpaceUrl` when the live winner can be resolved; the response also sets a `Location` header to its absolute URL.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: Create Memory Space
      tags:
      - agentic_memory
  /{memory_space_id}/:
    delete:
      description: 'Delete a Memory Space


        Returns 404 if already deleted or not accessible by the caller, and 403 if the

        space is shared with them under a role that cannot delete it.

        Sharing grants are revoked asynchronously by the RBAC reconciliation worker.

        The persisted RBAC resource pointer is its durable cleanup marker.'
      operationId: delete_memory_space__memory_space_id___delete
      parameters:
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      responses:
        '204':
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Memory Space by memory_space_ ID
      tags:
      - agentic_memory
    get:
      description: 'Get a Memory Space by ID


        Covers spaces the caller created and spaces shared with them, carrying the

        permissions the caller holds on it.


        Returns 404 if the space does not exist, is soft-deleted, belongs to another

        tenant, or is not shared with the caller.'
      operationId: get_memory_space__memory_space_id___get
      parameters:
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySpaceResponse'
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: Get Memory Space by memory_space_ ID
      tags:
      - agentic_memory
    patch:
      description: Partially update a Memory Space
      operationId: update_memory_space__memory_space_id___patch
      parameters:
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemorySpaceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySpaceResponse'
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: Update Memory Space by memory_space_ ID
      tags:
      - agentic_memory
  /{memory_space_id}/sessions/:
    get:
      operationId: list_sessions__memory_space_id__sessions__get
      parameters:
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: Limit
          type: integer
      - description: Filter sessions by participant IDs (ObjectId format).
        in: query
        name: participants
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 50
            type: array
          - type: 'null'
          description: Filter sessions by participant IDs (ObjectId format).
          title: Participants
      - description: Filter sessions by description (case-insensitive substring match). Must be at least 3 characters.
        in: query
        name: description
        required: false
        schema:
          anyOf:
          - maxLength: 1000
            minLength: 3
            type: string
          - type: 'null'
          description: Filter sessions by description (case-insensitive substring match). Must be at least 3 characters.
          title: Description
      - description: Filter sessions by deduplication key (exact match).
        in: query
        name: deduplicationKey
        required: false
        schema:
          anyOf:
          - maxLength: 72
            minLength: 1
            type: string
          - type: 'null'
          description: Filter sessions by deduplication key (exact match).
          title: Deduplicationkey
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_SessionResponse_'
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: List Sessions by memory_space_ ID
      tags:
      - agentic_memory
    post:
      operationId: create_session__memory_space_id__sessions__post
      parameters:
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDeduplicationErrorResponse'
          description: A session with this `deduplicationKey` already exists in the memory space. Body carries `existingSessionId` / `existingSessionUrl` when the live winner can be resolved; the response also sets a `Location` header to its absolute URL.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: Create Session by memory_space_ ID
      tags:
      - agentic_memory
  /{memory_space_id}/sessions/{session_id}/:
    delete:
      description: 'Delete a session.


        Performs a soft-delete by setting the deleted_at timestamp.'
      operationId: delete_session__memory_space_id__sessions__session_id___delete
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        schema:
          description: Session ID
          format: uuid
          title: Session Id
          type: string
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      responses:
        '204':
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space or Session not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Session by memory_space_ ID
      tags:
      - agentic_memory
    get:
      description: Get a single session by ID
      operationId: get_session__memory_space_id__sessions__session_id___get
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        schema:
          description: Session ID
          format: uuid
          title: Session Id
          type: string
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space or Session not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: Get Session by memory_space_ ID
      tags:
      - agentic_memory
    patch:
      description: 'Patch a session with new description, metadata and/or lifecycle strategies.


        Only fields explicitly included in the request body are modified others remain untouched.

        `lifecycleStrategies`, when present, replaces the whole list. A strategy type that

        already executed for this session can never run again, so changing its configuration

        is rejected with 409; re-sending it unchanged is accepted and stays inert.'
      operationId: update_session__memory_space_id__sessions__session_id___patch
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        schema:
          description: Session ID
          format: uuid
          title: Session Id
          type: string
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      - description: Optional optimistic-concurrency precondition. Supply the `version` from the prior response (quoted or bare integer, e.g. `"3"` or `3`). Returns 409 if the stored version no longer matches.
        in: header
        name: If-Match
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional optimistic-concurrency precondition. Supply the `version` from the prior response (quoted or bare integer, e.g. `"3"` or `3`). Returns 409 if the stored version no longer matches.
          title: If-Match
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space or Session not found
        '409':
          description: Session version does not match the If-Match precondition, or the request changes a lifecycle strategy type that has already been executed
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: Update Session by memory_space_ ID
      tags:
      - agentic_memory
  /{memory_space_id}/sessions/{session_id}/events/:
    get:
      operationId: list_events__memory_space_id__sessions__session_id__events__get
      parameters:
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        schema:
          description: Session ID
          format: uuid
          title: Session Id
          type: string
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: Limit
          type: integer
      - description: Return the last N events in chronological order. Mutually exclusive with offset
        in: query
        name: lastN
        required: false
        schema:
          anyOf:
          - exclusiveMinimum: 0
            maximum: 100
            type: integer
          - type: 'null'
          description: Return the last N events in chronological order. Mutually exclusive with offset
          title: Lastn
      - description: Filter session events by type. Omit to return events of all types.
        in: query
        name: eventType
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EventType'
          - type: 'null'
          description: Filter session events by type. Omit to return events of all types.
          title: Eventtype
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_EventResponse_'
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space or Session not found
        '422':
          description: Validation error (e.g. lastN used together with offset)
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: List Events by memory_space_ ID
      tags:
      - agentic_memory
    post:
      operationId: create_event__memory_space_id__sessions__session_id__events__post
      parameters:
      - description: Memory Space ID
        in: path
        name: memory_space_id
        required: true
        schema:
          description: Memory Space ID
          title: Memory Space Id
          type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        schema:
          description: Session ID
          format: uuid
          title: Session Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
          description: Successful Response
        '403':
          description: Insufficient permissions on this Memory Space
        '404':
          description: Memory Space or Session not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: 'Trial usage limit reached: the tenant''s monthly read/write request quota or its total storage cap is exhausted. Carries `X-RateLimit-*` headers; quota (not storage) responses also carry `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the monthly quota resets. Quota responses only.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: The applicable limit (monthly request quota, or storage cap).
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Units remaining before the limit is reached.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Epoch seconds at which the quota resets. Quota responses only.
              schema:
                type: integer
      summary: Create Event by memory_space_ ID
      tags:
      - agentic_memory
  /{memory_space_id}/sessions/{session_id}/events/batch/:
    patch:
      description: Update up to MAX_BATCH_SIZE events atomically; any failure rolls back the batch.
      operationId: update_events_batch__memory_space_id__sessions__session_id__events_batch__patch
      parameters:
