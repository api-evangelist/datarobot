        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ListEvaluationDatasetMetricAggregationSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name", "creationUserId", "creationDate", "datasetId", "userName", "datasetName", "promptColumnName", "responseColumnName". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: If `true`, only retrieve the evaluation dataset metric aggregations that are in a non-errored status. The default is `false`.
        in: query
        name: nonErroredOnly
        required: false
        schema:
          default: false
          description: If `true`, only retrieve the evaluation dataset metric aggregations that are in a non-errored status. The default is `false`.
          title: nonErroredOnly
          type: boolean
      responses:
        '200':
          content:
