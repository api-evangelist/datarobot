          - type: 'null'
          description: Only retrieve the evaluation dataset metric aggregations associated with these metric names.
          title: metricNames
      - description: Only retrieve the evaluation dataset metric aggregations associated with these aggregation types.
        in: query
        name: aggregationTypes
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/AggregationType'
            maxItems: 1000
            type: array
          - type: 'null'
          description: Only retrieve the evaluation dataset metric aggregations associated with these aggregation types.
          title: aggregationTypes
      - description: Only retrieve the evaluation dataset metric aggregations associated with the current configuration of the llmblueprints.
        in: query
        name: currentConfigurationOnly
        required: false
        schema:
          default: false
          description: Only retrieve the evaluation dataset metric aggregations associated with the current configuration of the llmblueprints.
          title: currentConfigurationOnly
          type: boolean
      - description: Apply this sort order to the results. Valid options are "name", "creationUserId", "creationDate", "datasetId", "userName", "datasetName", "promptColumnName", "responseColumnName". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
