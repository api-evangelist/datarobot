  /api/v2/genai/evaluationDatasetConfigurations/:
    get:
      description: List evaluation dataset configurations.
      operationId: list_evaluation_dataset_configuration_evaluationDatasetConfigurations__get
      parameters:
      - description: Only retrieve the evaluation dataset configurations associated with this use case ID.
        in: query
        name: useCaseId
        required: true
        schema:
          description: Only retrieve the evaluation dataset configurations associated with this use case ID.
          title: useCaseId
          type: string
      - description: Only retrieve the evaluation dataset configuration associated with this playground ID.
        in: query
        name: playgroundId
        required: true
        schema:
          description: Only retrieve the evaluation dataset configuration associated with this playground ID.
          title: playgroundId
          type: string
      - description: Only retrieve the evaluation dataset configuration with this ID.
        in: query
        name: evaluationDatasetConfigurationId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the evaluation dataset configuration with this ID.
          title: evaluationDatasetConfigurationId
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Only retrieve the evaluation dataset configurations matching the search query.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the evaluation dataset configurations matching the search query.
          title: search
      - description: Apply this sort order to the results. Valid options are "name", "creationUserId", "creationDate", "datasetId", "userName", "datasetName", "promptColumnName", "responseColumnName". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ListEvaluationDatasetConfigurationsQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name", "creationUserId", "creationDate", "datasetId", "userName", "datasetName", "promptColumnName", "responseColumnName". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      - description: If `true`, only retrieve the evaluation dataset configurations with correctness enabled. The default is `false`.
        in: query
        name: correctnessEnabledOnly
        required: false
        schema:
          default: false
          description: If `true`, only retrieve the evaluation dataset configurations with correctness enabled. The default is `false`.
          title: correctnessEnabledOnly
          type: boolean
      - description: If `true`, only retrieve the evaluation dataset configurations where the evaluation dataset is in the completed status. The default is `false`.
        in: query
        name: completedOnly
        required: false
        schema:
          default: false
          description: If `true`, only retrieve the evaluation dataset configurations where the evaluation dataset is in the completed status. The default is `false`.
          title: completedOnly
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEvaluationDatasetConfigurationResponse'
          description: Evaluation dataset configurations successfully retrieved.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List evaluation dataset configurations
      tags:
      - AI Robustness Tests
    post:
      description: Create a new evaluation dataset configuration.
      operationId: create_evaluation_dataset_configuration_evaluationDatasetConfigurations__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationDatasetConfigurationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationDatasetConfigurationResponse'
          description: Evaluation dataset configuration successfully created
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
