  /api/v2/genai/evaluationDatasetMetricAggregations/:
    delete:
      description: Delete the evaluation dataset metric aggregation associated with the specified LLM blueprint IDs and/or chat IDs.
      operationId: delete_evaluation_dataset_metric_aggregation_evaluationDatasetMetricAggregations__delete
      parameters:
      - description: The IDs of the LLM blueprints to delete the associated evaluation dataset metric aggregation for. If both `llmBlueprintIds` and `chatIds` are specified, will delete the aggregation record only if it matches both criteria.
        in: query
        name: llmBlueprintIds
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: The IDs of the LLM blueprints to delete the associated evaluation dataset metric aggregation for. If both `llmBlueprintIds` and `chatIds` are specified, will delete the aggregation record only if it matches both criteria.
          title: llmBlueprintIds
      - description: The IDs of the chats to delete the associated evaluation dataset metric aggregation for. If both `llmBlueprintIds` and `chatIds` are specified, will delete the aggregation record only if it matches both criteria.
        in: query
        name: chatIds
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: The IDs of the chats to delete the associated evaluation dataset metric aggregation for. If both `llmBlueprintIds` and `chatIds` are specified, will delete the aggregation record only if it matches both criteria.
          title: chatIds
