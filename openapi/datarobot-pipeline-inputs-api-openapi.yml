        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Draft Input
      tags:
      - pipeline-inputs
    get:
      description: Get a specific draft input.
      operationId: get_draft_input_api_v2_pipelines__pipeline_id__inputs__input_id__get
