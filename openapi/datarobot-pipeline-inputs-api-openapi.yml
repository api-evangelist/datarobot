    get:
      description: List draft inputs for a pipeline.
      operationId: list_draft_inputs_api_v2_pipelines__pipeline_id__inputs_get
      parameters:
      - in: path
        name: pipeline_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipeline Id
          type: string
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPage_PipelineInputResponse_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Draft Inputs
      tags:
      - pipeline-inputs
    post:
      description: Create a mutable input set for a draft pipeline.
      operationId: create_draft_input_api_v2_pipelines__pipeline_id__inputs_post
