components:
  schemas:
    PipelineInputCreateRequest:
      description: Request body for creating a pipeline input set.
      properties:
        payload:
          additionalProperties: true
          title: Payload
          type: object
      required:
      - payload
      title: PipelineInputCreateRequest
      type: object
    PipelineInputState:
      description: Validation state of a pipeline input set.
      enum:
      - VALID
      - INVALID
      title: PipelineInputState
      type: string
    PipelineInputUpdateRequest:
      description: Request body for updating a draft pipeline input set.
      properties:
        payload:
          additionalProperties: true
          title: Payload
          type: object
      required:
      - payload
      title: PipelineInputUpdateRequest
      type: object
    ValidationError:
      properties:
        code:
          description: Machine-readable error type (e.g. 'missing', 'string_type').
          title: Code
          type: string
        ctx:
          description: Additional context about the validation error.
          title: Context
          type: object
        input:
          additionalProperties: true
          description: The input value that caused the validation error.
          title: Input
          type: object
        loc:
          description: The location in the request where the validation error occurred.
          items:
            anyOf:
            - type: string
            - type: integer
          maxItems: 100
          title: loc
          type: array
        message:
          description: Human-readable description of the validation failure.
          title: Message
          type: string
        msg:
          description: A human-readable description of the validation error.
          title: msg
          type: string
        path:
          description: Dotted path to the invalid field (e.g. 'runtime.containerGroups.0.autoscaling').
          title: Path
          type: string
        type:
          description: A machine-readable error type identifier.
          title: type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    PipelineInputResponse:
      description: Response schema for a pipeline input set.
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        id:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Id
          type: string
        isDraft:
          title: Isdraft
          type: boolean
        payload:
          additionalProperties: true
          title: Payload
          type: object
        pipelineId:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipelineid
          type: string
        state:
          $ref: '#/components/schemas/PipelineInputState'
        updatedAt:
          format: date-time
          title: Updatedat
          type: string
        versionId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Versionid
      required:
      - id
      - pipelineId
      - isDraft
      - payload
      - state
      - createdAt
      - updatedAt
      title: PipelineInputResponse
      type: object
    DataPage_PipelineInputResponse_:
      properties:
        count:
          readOnly: true
          title: Count
          type: integer
        data:
          items:
            $ref: '#/components/schemas/PipelineInputResponse'
          title: Data
          type: array
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
        totalCount:
          title: Totalcount
          type: integer
      required:
      - data
      - totalCount
      - count
      title: DataPage[PipelineInputResponse]
      type: object
    HTTPValidationError:
      properties:
        detail:
          description: List of validation errors.
          items:
            $ref: '#/components/schemas/ValidationError'
          maxItems: 100
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
  securitySchemes:
    BearerAuth:
      description: JWT Bearer Auth
      scheme: bearer
      type: http
