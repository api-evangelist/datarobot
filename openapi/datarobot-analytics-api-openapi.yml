          description: URL pointing to the next page.
          type:
          - string
          - 'null'
        previous:
          description: URL pointing to the previous page.
          type:
          - string
          - 'null'
        usage:
          description: The resource usage records.
          items:
            $ref: '#/components/schemas/ResourceUsage'
          type: array
      required:
      - count
      - next
      - previous
      - usage
      type: object
