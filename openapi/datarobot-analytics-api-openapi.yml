        name: minTimestamp
        required: false
        schema:
          format: date-time
          type: string
      - description: The upper bound for timestamps. e.g., '2016-12-13T11:12:13.141516Z'.
        in: query
        name: maxTimestamp
        required: false
        schema:
          format: date-time
          type: string
      - description: This many results will be skipped. Defaults to 0.
        in: query
        name: offset
        required: false
        schema:
