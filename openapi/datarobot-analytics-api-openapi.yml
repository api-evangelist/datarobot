openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Analytics API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use analytics endpoints to retrieve and audit and event logs.
  name: Analytics
paths:
  /api/v2/activityEventDescriptions/:
    get:
      description: Retrieve user-friendly descriptions for user activity events (application and admin). The ``CAN_ACCESS_USER_ACTIVITY`` permission (or org admin access to Event Logs) is required.
      operationId: activityEventDescriptions_list
      parameters:
      - description: The number of results that will be skipped. Defaults to 0.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The maximum number of results returned. Defaults to 1000.
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEventDescriptionsListResponse'
          description: The user activity event description catalog.
      summary: Retrieve user-friendly descriptions
      tags:
      - Analytics
      x-versionadded: v2.48
  /api/v2/eventLogs/:
    get:
      description: Retrieve one page of audit log records.
      operationId: eventLogs_list
