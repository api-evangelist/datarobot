        in: query
        name: projectId
        required: false
        schema:
          type: string
      - description: The user to select log records for.
        in: query
        name: userId
        required: false
        schema:
          type: string
      - description: The organization to select log records for.
        in: query
        name: orgId
        required: false
        schema:
