        in: path
        name: validationId
        required: true
        schema:
          description: The ID of the custom model embedding validation to edit.
          title: validationId
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCustomModelValidationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelEmbeddingValidationResponse'
          description: Custom model embedding validation successfully updated.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Edit custom model embedding validation by validation ID
      tags:
      - Vector Databases
  /api/v2/genai/customModelEmbeddingValidations/{validationId}/revalidate/:
    post:
      description: Revalidate an existing custom model embedding validation.
      operationId: revalidate_custom_model_embedding_validation_customModelEmbeddingValidations__validationId__revalidate__post
      parameters:
      - description: The ID of the custom model embedding validation to revalidate.
        in: path
        name: validationId
        required: true
        schema:
          description: The ID of the custom model embedding validation to revalidate.
          title: validationId
