openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Vector Databases API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: The following endpoints outline how to manage vector databases.
  name: Vector Databases
paths:
  /api/v2/genai/customModelEmbeddingValidations/:
    get:
      description: List custom model embedding validations.
      operationId: list_custom_model_embeddings_customModelEmbeddingValidations__get
      parameters:
      - description: Only retrieve the custom model embedding validations associated with these use case IDs.
        in: query
        name: useCaseId
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: Only retrieve the custom model embedding validations associated with these use case IDs.
          title: useCaseId
      - description: Only retrieve the custom model embedding validations associated with this playground ID.
        in: query
        name: playgroundId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the custom model embedding validations associated with this playground ID.
          title: playgroundId
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Only retrieve the custom model embedding validations matching the search query.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the custom model embedding validations matching the search query.
          title: search
      - description: Apply this sort order to the results. Valid options are "name", "deploymentName", "userName", "creationDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ListCustomModelValidationSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name", "deploymentName", "userName", "creationDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      - description: If `true`, only retrieve the completed custom model embedding validations. The default is `false`.
        in: query
        name: completedOnly
        required: false
        schema:
          default: false
          description: If `true`, only retrieve the completed custom model embedding validations. The default is `false`.
          title: completedOnly
          type: boolean
      - description: Only retrieve the custom model embedding validations associated with this deployment ID.
        in: query
        name: deploymentId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the custom model embedding validations associated with this deployment ID.
          title: deploymentId
      - description: Only retrieve the custom model embedding validations associated with this model ID.
        in: query
        name: modelId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the custom model embedding validations associated with this model ID.
          title: modelId
      - description: Only retrieve the custom model embedding validations where the custom model uses this column name for prompt input.
        in: query
        name: promptColumnName
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the custom model embedding validations where the custom model uses this column name for prompt input.
          title: promptColumnName
      - description: Only retrieve the custom model embedding validations where the custom model uses this column name for prediction output.
        in: query
        name: targetColumnName
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the custom model embedding validations where the custom model uses this column name for prediction output.
          title: targetColumnName
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomModelEmbeddingValidationResponse'
          description: Custom model embedding validations successfully retrieved.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List custom model embedding validations
      tags:
      - Vector Databases
    post:
      description: Validate an embedding model hosted in a custom model deployment for use in the playground.
      operationId: create_custom_model_embedding_validation_customModelEmbeddingValidations__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomModelEmbeddingValidationRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelEmbeddingValidationResponse'
          description: Custom model embedding validation job successfully accepted. Follow the `Location` header to poll for job execution status.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Validate custom model embedding
      tags:
      - Vector Databases
