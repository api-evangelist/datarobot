      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Only retrieve the vector databases with names matching the search query.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the vector databases with names matching the search query.
          title: search
      - description: Apply this sort order to the results. Valid options are "name", "creationDate", "creationUserId", "embeddingModel", "datasetId", "chunkingMethod", "chunksCount", "size", "userName", "datasetName", "playgroundsCount", "source". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ListVectorDatabaseSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name", "creationDate", "creationUserId", "embeddingModel", "datasetId", "chunkingMethod", "chunksCount", "size", "userName", "datasetName", "playgroundsCount", "source". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      - description: If `true`, only retrieve the vector databases that have finished building. The default is `false`.
        in: query
        name: completedOnly
        required: false
        schema:
          default: false
          description: If `true`, only retrieve the vector databases that have finished building. The default is `false`.
          title: completedOnly
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVectorDatabasesResponse'
          description: Vector databases successfully retrieved.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List vector databases
      tags:
      - Vector Databases
    post:
      description: Create a new vector database.
      operationId: create_vector_database_vectorDatabases__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVectorDatabaseRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorDatabaseResponse'
          description: Vector database creation job successfully accepted. Follow the `Location` header to poll for job execution status.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create vector database
      tags:
      - Vector Databases
