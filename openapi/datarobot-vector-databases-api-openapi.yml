  /api/v2/genai/vectorDatabases/:
    get:
      description: List vector databases.
      operationId: list_vector_databases_vectorDatabases__get
      parameters:
      - description: Only retrieve the vector databases linked to these use case IDs.
        in: query
        name: useCaseId
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: Only retrieve the vector databases linked to these use case IDs.
          title: useCaseId
      - description: Only retrieve the vector databases linked to this playground ID.
        in: query
        name: playgroundId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the vector databases linked to this playground ID.
          title: playgroundId
      - description: Only retrieve the vector databases linked to this family ID.
        in: query
        name: familyId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the vector databases linked to this family ID.
          title: familyId
      - description: If `true`, only retrieve (root) parent vector databases. The default is `false`.
