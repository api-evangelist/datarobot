      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelEmbeddingValidationResponse'
          description: Custom model embedding successfully revalidated.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Revalidate custom model embedding by validation ID
      tags:
      - Vector Databases
