openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Monitoring Jobs API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage monitoring jobs. To integrate more closely with external data sources, monitoring job definitions allow DataRobot to monitor deployments running and storing feature data and predictions outside of DataRobot. For example, you can create a monitoring job to connect to Snowflake, fetch raw data from the relevant Snowflake tables, and send the data to DataRobot for monitoring purposes.
  name: monitoring_jobs
paths:
  /api/v2/batchMonitoring/:
    post:
      description: Submit the configuration for the job and it will be submitted to the queue
      operationId: batchMonitoring_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchMonitoringJobCreate'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobResponse'
          description: Job details for the created Batch Monitoring job
      summary: Creates a new Batch Monitoring job
      tags:
      - monitoring_jobs
      x-versionadded: v2.35
  /api/v2/batchMonitoringJobDefinitions/:
    get:
      description: List all Batch Monitoring jobs definitions available
      operationId: batchMonitoringJobDefinitions_list
      parameters:
      - description: This many results will be skipped
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned
        in: query
        name: limit
        required: true
        schema:
          default: 100
          maximum: 10000
          minimum: 1
          type: integer
      - description: A human-readable name for the definition, must be unique across organisations.
        in: query
        name: searchName
        required: false
        schema:
          maxLength: 100
          minLength: 1
          type: string
      - description: Includes only definitions for this particular deployment
        in: query
        name: deploymentId
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMonitoringJobDefinitionsListResponse'
          description: List of all available jobs
        '422':
          description: Your input data or query arguments did not work together
      summary: List Batch Monitoring job definitions
      tags:
      - monitoring_jobs
      x-versionadded: v2.35
    post:
      description: Create a Batch Monitoring Job definition. A configuration for a Batch Monitoring job which can either be executed manually upon request or on scheduled intervals, if enabled. The API payload is the same as for `/batchJobs` along with optional ``enabled`` and ``schedule`` items.
      operationId: batchMonitoringJobDefinitions_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchMonitoringJobDefinitionsCreate'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMonitoringJobDefinitionsResponse'
          description: Job details for the created Batch Monitoring job definition
        '403':
          description: You are not authorized to create a job definition on this deployment due to your permissions role
        '422':
          description: You tried to create a job definition with incompatible or missing parameters to create a fully functioning job definition
      summary: Creates a new Batch Monitoring job definition
      tags:
      - monitoring_jobs
      x-versionadded: v2.35
  /api/v2/batchMonitoringJobDefinitions/{jobDefinitionId}/:
    delete:
      description: Delete a Batch Prediction job definition
      operationId: batchMonitoringJobDefinitions_delete
      parameters:
      - description: ID of the Batch Prediction job definition
        in: path
        name: jobDefinitionId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '403':
          description: You are not authorized to delete this job definition due to your permissions role
        '404':
          description: Job was deleted, never existed or you do not have access to it
        '409':
          description: Job could not be deleted, as there are currently running jobs in the queue.
      summary: Delete Batch Prediction job definition by job definition ID
      tags:
      - monitoring_jobs
      x-versionadded: v2.35
    get:
      description: Retrieve a Batch Monitoring job definition
      operationId: batchMonitoringJobDefinitions_retrieve
      parameters:
      - description: ID of the Batch Prediction job definition
        in: path
        name: jobDefinitionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMonitoringJobDefinitionsResponse'
          description: Job details for the requested Batch Monitoring job definition
        '404':
          description: Job was deleted, never existed or you do not have access to it
      summary: Retrieve Batch Monitoring job definition by job definition ID
      tags:
      - monitoring_jobs
      x-versionadded: v2.35
    patch:
      description: Update a Batch Monitoring job definition
      operationId: batchMonitoringJobDefinitions_patch
      parameters:
      - description: ID of the Batch Prediction job definition
        in: path
        name: jobDefinitionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchMonitoringJobDefinitionsUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMonitoringJobDefinitionsResponse'
          description: Job details for the updated Batch Monitoring job definition
        '403':
          description: You are not authorized to alter the contents of this monitoring job due to your permissions role
        '404':
          description: Job was deleted, never existed or you do not have access to it
        '409':
          description: You chose a name of your monitoring job that was already existing within your organization
        '422':
          description: 'Could not update the monitoring job. Possible reasons: {}'
      summary: Update Batch Monitoring job definition by job definition ID
      tags:
      - monitoring_jobs
      x-versionadded: v2.35
components:
  schemas:
    DatasphereIntake:
      description: Stream CSV data chunks from Datasphere using browser-datasphere
      properties:
        catalog:
          description: The name of the specified database catalog to read input data from.
          type: string
        credentialId:
          description: The ID of the credential holding information about a user with read access to the data source.
          type: string
        dataStoreId:
          description: ID of the data store to connect to
          type: string
        schema:
          description: The name of the specified database schema to read input data from.
          type: string
        table:
          description: The name of the specified database table to read input data from.
          type: string
        type:
          description: Type name for this intake type
          enum:
          - datasphere
          type: string
      required:
      - credentialId
      - dataStoreId
      - schema
      - table
      - type
      type: object
      x-versionadded: v2.35
    CatalogDataStreamer:
      description: Stream CSV data chunks from AI catalog dataset
      properties:
        datasetId:
          description: Either the populated value of the field or [redacted] due to permission settings
          oneOf:
          - description: The ID of the AI catalog dataset
            type: string
          - enum:
            - '[redacted]'
            type: string
        datasetVersionId:
          description: The ID of the AI catalog dataset version
          type: string
        type:
          description: Type name for this intake type
          enum:
          - dataset
          type: string
      required:
      - datasetId
      - type
      type: object
    BigQueryOutput:
      description: Save CSV data chunks to Google BigQuery in bulk
      properties:
        bucket:
          description: The name of gcs bucket for data loading
          type: string
        credentialId:
          description: The ID of the GCP credentials
          type: string
        dataset:
          description: The name of the specified big query dataset to write data back
          type: string
        table:
          description: The name of the specified big query table to write data back
          type: string
        type:
          description: Type name for this output type
          enum:
          - bigquery
          type: string
      required:
      - bucket
      - credentialId
      - dataset
      - table
      - type
      type: object
    SynapseDataStreamer:
      description: Stream CSV data chunks from Azure Synapse
      properties:
        cloudStorageCredentialId:
          description: Either the populated value of the field or [redacted] due to permission settings
          oneOf:
          - description: The ID of the Azure credential holding information about a user with read access to the cloud storage.
            type:
            - string
            - 'null'
          - enum:
            - '[redacted]'
            type: string
          - type: 'null'
        credentialId:
          description: Either the populated value of the field or [redacted] due to permission settings
          oneOf:
          - description: The ID of the credential holding information about a user with read access to the JDBC data source.
            type:
            - string
            - 'null'
          - enum:
            - '[redacted]'
            type: string
          - type: 'null'
        dataStoreId:
          description: Either the populated value of the field or [redacted] due to permission settings
          oneOf:
          - description: ID of the data store to connect to
            type: string
          - enum:
            - '[redacted]'
            type: string
        externalDataSource:
