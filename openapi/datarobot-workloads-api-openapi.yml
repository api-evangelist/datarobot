  /api/v2/workloads/{workload_id}/stats:
    delete:
      description: Clear collected statistics for a workload within the specified time range.
      operationId: resetWorkloadStats
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      - description: Proton ID to get stats for (optional, defaults to current proton)
        in: query
        name: protonId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Proton ID to get stats for (optional, defaults to current proton)
          title: Proton ID
      - description: Start time for stats
        in: query
        name: startTime
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Start time for stats
          title: Start Time
      - description: End time for stats
        in: query
        name: endTime
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: End time for stats
          title: End Time
      responses:
        '204':
          description: Successful Response
        '400':
          description: Invalid time range
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Reset Workload Stats by workload_ ID
      tags:
      - Workloads
    get:
      description: 'Get aggregated performance statistics for a workload.


        For `agent` workloads, and only for users with agent monitoring enabled, the response also

        carries an `agent` block with token usage, tool, component and guard-quality statistics.

        Unlike the request metrics, the `agent` block is scoped to the whole workload, not to

        `protonId`, and each of its sections is `null` when it could not be retrieved.'
      operationId: getWorkloadStats
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      - description: Proton ID to get stats for (optional, defaults to current proton)
        in: query
        name: protonId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Proton ID to get stats for (optional, defaults to current proton)
          title: Proton ID
      - description: Start time for stats
        in: query
        name: startTime
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Start time for stats
          title: Start Time
      - description: End time for stats
        in: query
        name: endTime
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: End time for stats
          title: End Time
      - description: Response time quantile (e.g., 0.95 for p95)
        in: query
        name: responseTimeQuantile
        required: false
        schema:
          default: 0.5
          description: Response time quantile (e.g., 0.95 for p95)
          maximum: 1
          minimum: 0
          title: Response Time Quantile
          type: number
      - description: Slow requests threshold in milliseconds
        in: query
        name: slowRequestsThreshold
        required: false
        schema:
          default: 2000
          description: Slow requests threshold in milliseconds
          minimum: 0
          title: Slow Requests Threshold
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtonRequestStats'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Workload Stats by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/stats/{metric_name}:
    get:
      description: Get time-series data for a specific performance metric of a workload.
