          - type: 'null'
          description: Execution environment declared for the generated Dockerfile, if any.
          title: Execution Environment ID
        executionEnvironmentVersionId:
          anyOf:
          - type: string
          - type: 'null'
          description: Execution environment version the base image was resolved from, if any.
          title: Execution Environment Version ID
      required:
      - codeRef
