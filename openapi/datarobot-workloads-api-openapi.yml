        Lets workload creators tighten security constraints beyond the platform defaults. runAsNonRoot and runAsUser are enforced by the platform and are not user-settable. Elevated fields (capabilities.add, allowPrivilegeEscalation=true, seccompProfile.type=Unconfined) require the MLOps Admin role; regular users may only tighten defaults — drop capabilities, enable read-only rootfs, or set a RuntimeDefault/Localhost seccomp profile.'
