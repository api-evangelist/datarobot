components:
  schemas:
    StringEnvironmentVariable:
      properties:
        name:
          description: Name of the environment variable
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        source:
          const: string
          default: string
          title: Source
          type: string
        value:
          description: Value of the environment variable
          maxLength: 131072
          title: Value
          type: string
      required:
      - name
      - value
      title: StringEnvironmentVariable
      type: object
    ArtifactInfoFormatted:
      description: Artifact basic information.
      properties:
        artifactRepositoryId:
          anyOf:
          - type: string
          - type: 'null'
          description: ID of the artifact repository this artifact belongs to (for versioning)
          title: Artifactrepositoryid
        id:
          description: Unique identifier of the entity
          title: Id
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: Name of the entity
          title: Name
        status:
          anyOf:
          - $ref: '#/components/schemas/ArtifactStatus'
          - type: 'null'
          description: Artifact status. Draft artifacts carry an 8-hour TTL; the workload is auto-terminated after that period unless promoted to production.
        templateId:
          anyOf:
          - type: string
          - type: 'null'
          description: ID of the template used to create this artifact
          title: Templateid
        type:
          anyOf:
          - $ref: '#/components/schemas/ArtifactType'
          - type: 'null'
          description: Artifact type
        version:
          anyOf:
          - type: integer
          - type: 'null'
          description: Version number of the artifact (set only for locked artifacts)
          title: Version
      required:
      - id
      title: ArtifactInfoFormatted
      type: object
    WorkloadRoute:
      description: A workload route exposed publicly.
      properties:
        auth:
          $ref: '#/components/schemas/RouteAuth'
          description: Authentication applied to this route.
        path:
          description: Route path relative to the workload root, excluding the URL prefix the workload is mounted on. Must start with '/'. For example '/.well-known/agent-card.json'.
          maxLength: 1024
          pattern: ^/
          title: Path
          type: string
      required:
      - path
      - auth
      title: WorkloadRoute
      type: object
    ReplicaStatusesSnapshot:
      properties:
        overallStatus:
          $ref: '#/components/schemas/WorkloadMonitorOverallStatus'
        replicas:
          items:
            $ref: '#/components/schemas/ReplicaDetail'
          title: Replicas
          type: array
      required:
      - overallStatus
      - replicas
      title: ReplicaStatusesSnapshot
      type: object
    GrantAccessControlWithUsername:
      description: Grant access control request using username for user identification.
      properties:
        role:
          $ref: '#/components/schemas/SharingRole'
          description: The role of the recipient on this entity.
          enum:
          - ADMIN
          - CONSUMER
          - DATA_SCIENTIST
          - EDITOR
          - NO_ROLE
          - OBSERVER
          - OWNER
          - READ_ONLY
          - READ_WRITE
          - USER
          type: string
        shareRecipientType:
          $ref: '#/components/schemas/SubjectType'
          description: Describes the recipient type — one of user, group, organization, or externalApplication.
          enum:
          - user
          - group
          - organization
          - externalApplication
          type: string
        username:
          description: Username of the user to update the access role for.
          title: Username
          type: string
      required:
      - role
      - shareRecipientType
      - username
      title: GrantAccessControlWithUsername
      type: object
    ContainerBuildInfo:
      description: The image build this container came from.
      properties:
        artifactImageBuildId:
          description: Identifies the build. Full detail, including what it consumed, is available from GET /artifacts/{artifactId}/builds/{buildId}.
          title: Artifactimagebuildid
          type: string
        builtFrom:
          anyOf:
          - $ref: '#/components/schemas/BuiltFrom'
          - type: 'null'
          description: What this build consumed. Compare against imageBuildConfig to see what the current image was built from, in particular the execution environment version, which a codeRef-keyed build pointer does not track. Absent on builds triggered before this was recorded.
        createdAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the build was created (UTC), read from the build record. Null when that record cannot be read.
          title: Createdat
        imageDeleted:
          default: false
          description: True once the built image is confirmed gone from the registry. The build still reads COMPLETED, because it did complete, but the imageUri has been withdrawn and the container must be rebuilt before it can be deployed.
          title: Imagedeleted
          type: boolean
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: Build status, read from the build record. Null when that record cannot be read.
          title: Status
      required:
      - artifactImageBuildId
      title: ContainerBuildInfo
      type: object
    ContainerStatusDetail:
      properties:
        exitCode:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exit Code
        image:
          title: Image
          type: string
        lastState:
          anyOf:
          - $ref: '#/components/schemas/ContainerLastStateDetail'
          - type: 'null'
          title: Last State
        message:
          default: ''
          title: Message
          type: string
        name:
          title: Name
          type: string
        ready:
          title: Ready
          type: boolean
        reason:
          default: ''
          title: Reason
          type: string
        restartCount:
          title: Restartcount
          type: integer
        startedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Startedat
        status:
          $ref: '#/components/schemas/ContainerStatus'
      required:
      - name
      - status
      - startedAt
      - ready
      - restartCount
      - image
      title: ContainerStatusDetail
      type: object
    WorkloadsResponseTimeStats:
      description: Workload response time statistics.
      properties:
        millis:
          default: 0
          description: Response time in milliseconds
          title: Millis
          type: integer
        trend:
          default: 0.0
          description: Trend indicator (positive = increasing)
          title: Trend
          type: number
      title: WorkloadsResponseTimeStats
      type: object
    ANY_PERMISSION:
      const: '*'
      type: string
    ProbeConfig:
      properties:
        failureThreshold:
          default: 3
          description: Minimum consecutive failures for the probe to be considered failed
          maximum: 2147483647.0
          minimum: 1.0
          title: Failurethreshold
          type: integer
        host:
          anyOf:
          - maxLength: 253
            minLength: 0
            type: string
          - type: 'null'
          description: Host name to connect to, defaults to the pod IP.
          title: Host
        httpHeaders:
          additionalProperties:
            type: string
          description: HTTP headers for probe
          title: Httpheaders
          type: object
        initialDelaySeconds:
          default: 0
          description: Number of seconds to wait before the first probe is executed
          maximum: 3600.0
          minimum: 0.0
          title: Initialdelayseconds
          type: integer
        path:
          description: URL path to query for health check
          maxLength: 2048
          title: Path
          type: string
        periodSeconds:
          default: 10
          description: How often (in seconds) to perform the probe
          maximum: 3600.0
          minimum: 1.0
          title: Periodseconds
          type: integer
        port:
          default: 8080
          description: Port number to access on the container.
          maximum: 65535.0
          minimum: 1.0
          title: Port
          type: integer
        scheme:
          default: HTTP
          description: Scheme to use for connecting to the host.
          enum:
          - HTTP
          - HTTPS
          title: Scheme
          type: string
        successThreshold:
          default: 1
          description: Minimum consecutive successes for the probe to be considered successful after having failed
          maximum: 10.0
          minimum: 1.0
          title: Successthreshold
          type: integer
        timeoutSeconds:
          default: 10
          description: Number of seconds after which the probe times out
          maximum: 3600.0
          minimum: 1.0
          title: Timeoutseconds
          type: integer
      required:
      - path
      title: ProbeConfig
      type: object
    NimArtifactSpec:
      properties:
        containerGroups:
          default: []
          description: List of container groups.
          items:
            $ref: '#/components/schemas/ContainerGroup'
          title: Containergroups
          type: array
        storage:
          anyOf:
          - $ref: '#/components/schemas/NimStorageConfig'
          - type: 'null'
          description: Model weight storage configuration. When omitted, defaults to a dedicated per-workload PVC provisioned exclusively for this workload.
        templateId:
          anyOf:
          - type: string
          - type: 'null'
          description: ID of the template used to create this NIM Artifact
          title: Templateid
        type:
          const: nim
          default: nim
          description: Artifact type discriminator. Injected automatically from the top-level `type` field — do not set this directly.
          title: Type
          type: string
      title: NimArtifactSpec
      type: object
    ApiKeyEnvironmentVariable:
      description: 'A platform-managed DataRobot API token injected as an environment variable.

        The token value is resolved at proton creation (find-or-create a per-workload

        ``Workload <workloadId>`` API key scoped to the invoking user); no value or id

        is supplied by the user.


        ``name`` is optional for this source: when omitted it resolves to

        ``DATAROBOT_API_TOKEN`` at consumption time. The default is intentionally not

        persisted — an omitted name is stored as absent, not as ``DATAROBOT_API_TOKEN``.'
      properties:
        name:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          description: Name of the environment variable. Optional for the api-key source; defaults to DATAROBOT_API_TOKEN when omitted.
          title: Name
        source:
          const: api-key
          title: Source
          type: string
      required:
      - source
      title: ApiKeyEnvironmentVariable
      type: object
    ReplicaPhase:
      description: Lifecycle phase of a deployment replica.
      enum:
      - pending
      - running
      - succeeded
      - failed
      - unknown
      title: ReplicaPhase
      type: string
    ProtonListResponse:
      properties:
        count:
          description: The number of records on this page.
          title: Count
          type: integer
        data:
          description: The list of records.
          items:
            $ref: '#/components/schemas/ProtonFormatted'
          title: Data
          type: array
        next:
          anyOf:
          - type: string
          - type: 'null'
          description: The URL to the next page, or `null` if there is no such page.
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          description: The URL to the previous page, or `null` if there is no such page.
          title: Previous
        totalCount:
          description: The total number of records.
          title: Totalcount
          type: integer
      required:
