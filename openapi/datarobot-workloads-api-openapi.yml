    WorkloadRuntime:
      description: 'Runtime configuration for a workload.


        For service and nim artifacts, all configuration is scoped inside

        ``container_groups``, each identified by name matching the artifact topology.'
      properties:
        containerGroups:
          description: Per-group runtime configuration. Each entry's name must match a group in the artifact.
          items:
            $ref: '#/components/schemas/GroupRuntime'
          title: Containergroups
          type: array
        enclaveSelectionPolicy:
          anyOf:
          - $ref: '#/components/schemas/EnclaveSelectionPolicy'
          - type: 'null'
          description: 'Where the workload runs, and how that can change later. At creation: unset (the default) runs the workload on the Hub, outside any Enclave, and needs no Use Case. When the policy is set, the workload runs on an Enclave granted to its Use Case; this requires the organization''s Enclave entitlement, a useCaseId, and deploy access (CAN_DEPLOY) to the Enclave it lands on. ''availability'' lets the scheduler choose among the Use Case''s Enclaves; ''enclaves'' must be omitted or empty. ''manual'' pins it to the one Enclave named in ''enclaves'' (exactly one entry), which must be one of the Use Case''s Enclaves; because a pin overrides the scheduler''s choice it also requires the CAN_OVERRIDE_WORKLOAD_PLACEMENT permission. A useCaseId without a policy is refused when that Use Case has Enclaves; with a Use Case that has none, the workload runs on the Hub. On a settings update or replacement: a workload that runs on an Enclave keeps running on an Enclave, and its Use Case cannot be changed through this API; to run it under a different Use Case, or on the Hub, create a new workload with the values above. Clearing this field is refused (422 ENCLAVE_POLICY_REQUIRED). Changing the policy or the pinned Enclave is allowed: ''availability'' drops the pin and leaves the workload where it runs; ''manual'' pins it to one of the Use Case''s Enclaves, with the same permission as at creation, and the rolling replacement the update starts moves it there if that is a different Enclave. An Enclave outside the Use Case is refused (422 ENCLAVE_NOT_IN_USE_CASE).'
          title: Enclave Selection Policy
        enclaves:
          description: 'Enclave names to run on. Required with enclaveSelectionPolicy ''manual''. Exactly one entry is accepted today; the list shape is forward-compatible with running a workload on several Enclaves. Each named Enclave must still be eligible and the caller must hold deploy access to it. Desired state: the platform never rewrites it. See ''placements'' for where the workload actually runs.'
          items:
            type: string
          title: Enclaves
          type: array
        workers:
          anyOf:
          - $ref: '#/components/schemas/RoleRuntime'
          - type: 'null'
          description: '`llm` artifacts only: the GPU workers that serve the model. Mutually exclusive with containerGroups, which `llm` runtimes do not use.'
      title: WorkloadRuntime
      type: object
