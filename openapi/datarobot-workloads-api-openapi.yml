            maxItems: 256
            type: array
          - type: 'null'
          description: Runtime entrypoint override for the container command. Independent of build entrypoint.
          title: Entrypoint
        environmentVars:
          default: []
          description: Environment variables
          items:
            discriminator:
              mapping:
                api-key: '#/components/schemas/ApiKeyEnvironmentVariable'
