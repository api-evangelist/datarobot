          description: 'The Use Case to link this workload to. Optional for any workload: the link organizes the workload alongside the Use Case''s other assets. Required when the workload targets an Enclave (enclaveSelectionPolicy: ''manual'' or ''availability'') on an organization with Enclaves enabled: placement is then restricted to the Enclaves an administrator has granted to that Use Case.'
          title: Use Case ID
