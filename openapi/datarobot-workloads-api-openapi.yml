        name:
          anyOf:
          - type: string
          - type: 'null'
          description: Name of the container. Lowercase letters, digits, and hyphens only; must start with a lowercase letter and end with a letter or digit; max 63 characters.
          title: Name
        port:
          anyOf:
          - maximum: 65535.0
            minimum: 1024.0
            type: integer
          - type: 'null'
          description: Container access port. When set, must be >= 1024 for security and platform compatibility reasons. Primary containers must define a port; non-primary containers must omit it.
          title: Port
        primary:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          description: Whether this is the primary container
          title: Primary
        readinessProbe:
          anyOf:
          - $ref: '#/components/schemas/ProbeConfig'
          - type: 'null'
          description: Container readiness check configuration
        routes:
          anyOf:
          - items:
              $ref: '#/components/schemas/WorkloadRoute'
            maxItems: 50
            type: array
          - type: 'null'
          description: Routes of the workload to expose publicly. Primary containers only. The workload root is exposed authenticated unless '/' is declared here with another policy.
          title: Routes
        securityContext:
          anyOf:
          - $ref: '#/components/schemas/SecurityContext'
          - type: 'null'
          description: Container security context
        startupProbe:
          anyOf:
          - $ref: '#/components/schemas/ProbeConfig'
