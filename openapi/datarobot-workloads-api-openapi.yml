          title: Workload Id
          type: string
      - description: Proton ID to get stats for (optional, defaults to current proton)
        in: query
        name: protonId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Proton ID to get stats for (optional, defaults to current proton)
          title: Proton ID
      - description: Start time for stats
        in: query
        name: startTime
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Start time for stats
          title: Start Time
      - description: End time for stats
        in: query
        name: endTime
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: End time for stats
          title: End Time
      - description: Response time quantile (e.g., 0.95 for p95)
        in: query
        name: responseTimeQuantile
        required: false
        schema:
          default: 0.5
          description: Response time quantile (e.g., 0.95 for p95)
          maximum: 1
          minimum: 0
          title: Response Time Quantile
          type: number
      - description: Slow requests threshold in milliseconds
        in: query
        name: slowRequestsThreshold
        required: false
        schema:
          default: 2000
          description: Slow requests threshold in milliseconds
          minimum: 0
          title: Slow Requests Threshold
          type: integer
      - description: Time resolution for data aggregation
        in: query
        name: resolution
