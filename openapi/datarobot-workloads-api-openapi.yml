          description: Configuration for server-side image builds from source code.
        imageOutdated:
          description: True when imageUri is set but the latest build is still pending/in-progress or failed, i.e. the image is from a previous build. A cancelled build (prior image kept on purpose) or an unknown status does not mark the image outdated. Read-only and derived; never persisted.
