    BuiltFrom:
      description: 'What a build consumed, captured when the build was triggered and never rewritten.


        A container''s build pointer is dropped when its ``code_ref`` changes, so a surviving

        ``build`` already implies the code is unchanged. The execution environment is not part of

        that check, which makes ``execution_environment_version_id`` here the only way to see that

        an image was built on a different environment version than the container now declares.


        Both execution environment fields are null for a build from a user-provided Dockerfile,

        which resolves no execution environment at all.'
