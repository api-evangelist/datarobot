openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Workloads API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Manage AI workload deployments and their lifecycle.
  name: Workloads
paths:
  /api/v2/workloadResourceBundles:
    get:
      description: 'List resource bundles available to the authenticated user.


        Union of the platform''s workload-curated compute bundles and any additional bundles

        already in use across the user''s enclaves. Bundle listing is tenant-wide, so no

        enclave id is needed (or accepted) here.'
      operationId: listWorkloadResourceBundles
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeBundlesResponse'
          description: Successful Response
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
      summary: List Resource Bundles
      tags:
      - Workloads
  /api/v2/workloads:
    get:
      description: List all workloads accessible to the authenticated user.
      operationId: listWorkloads
      parameters:
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Retrieve only the specified number of values.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Filters by those created by the given user.
        in: query
        name: createdBy
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filters by those created by the given user.
          title: Created By
      - description: Filter by specific IDs
        in: query
        name: ids
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by specific IDs
          title: Ids
      - description: Case insensitive search against name, description and partial ID.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Case insensitive search against name, description and partial ID.
          title: Search
      - description: List of tag keys to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
        in: query
        name: tagKeys
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tag keys to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
          title: Tag Keys
      - description: List of tag values to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
        in: query
        name: tagValues
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tag values to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
          title: Tag Values
      - description: The order to sort the results.
        in: query
        name: orderBy
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/WorkloadSortQueryParam'
          - type: 'null'
          description: The order to sort the results.
          title: Order By
      - description: Filters workloads by status.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/WorkloadStatus'
            type: array
          - type: 'null'
          description: Filters workloads by status.
          title: Status
      - description: Filters workloads by their corresponding artifact status.
        in: query
        name: artifactStatus
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArtifactStatus'
            type: array
          - type: 'null'
          description: Filters workloads by their corresponding artifact status.
          title: Artifact Status
      - description: Filters workloads by their importance.
        in: query
        name: importance
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/WorkloadImportance'
            type: array
          - type: 'null'
          description: Filters workloads by their importance.
          title: Importance
      - description: Filter workloads by their active artifact ID.
        in: query
        name: artifactId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter workloads by their active artifact ID.
          title: Artifact ID
      - description: Filter workloads by the ID of the Enclave they actually run on.
        in: query
        name: enclaveId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter workloads by the ID of the Enclave they actually run on.
          title: Enclave ID
      - description: Filter workloads by the name of the Enclave they actually run on.
        in: query
        name: enclave
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter workloads by the name of the Enclave they actually run on.
          title: Enclave
      - description: Filter workloads by their active artifact's repository ID.
        in: query
        name: repositoryId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter workloads by their active artifact's repository ID.
          title: Artifact Repository ID
      - description: List of artifact types to filter for. If multiple values are specified, workloads matching any of the values will be returned.
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArtifactType'
            type: array
          - type: 'null'
          description: List of artifact types to filter for. If multiple values are specified, workloads matching any of the values will be returned.
          title: Type
      - description: If true, includes recent service statistics in the response.
        in: query
        name: serviceStats
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: If true, includes recent service statistics in the response.
          title: Service Statistics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadListResponse'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Workloads
      tags:
      - Workloads
    post:
      description: Create a workload from the specified artifact and schedule its initial runtime.
      operationId: createWorkload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkloadRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Workload
      tags:
      - Workloads
  /api/v2/workloads/stats:
    get:
      description: Get aggregated statistics across all workloads accessible to the authenticated user.
      operationId: listWorkloadsStats
      parameters:
      - description: Filters by those created by the given user.
        in: query
        name: createdBy
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filters by those created by the given user.
          title: Created By
      - description: Filter by specific IDs
        in: query
        name: ids
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by specific IDs
          title: Ids
      - description: Case insensitive search against name, description and partial ID.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Case insensitive search against name, description and partial ID.
          title: Search
      - description: List of tag keys to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
        in: query
        name: tagKeys
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tag keys to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
          title: Tag Keys
      - description: List of tag values to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
        in: query
        name: tagValues
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tag values to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
          title: Tag Values
      - description: The order to sort the results.
        in: query
        name: orderBy
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/WorkloadSortQueryParam'
          - type: 'null'
          description: The order to sort the results.
          title: Order By
      - description: Filters workloads by status.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/WorkloadStatus'
            type: array
          - type: 'null'
          description: Filters workloads by status.
          title: Status
      - description: Filters workloads by their corresponding artifact status.
        in: query
        name: artifactStatus
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArtifactStatus'
            type: array
          - type: 'null'
          description: Filters workloads by their corresponding artifact status.
          title: Artifact Status
      - description: Filters workloads by their importance.
        in: query
        name: importance
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/WorkloadImportance'
            type: array
          - type: 'null'
          description: Filters workloads by their importance.
          title: Importance
      - description: Filter workloads by their active artifact ID.
        in: query
        name: artifactId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter workloads by their active artifact ID.
          title: Artifact ID
      - description: Filter workloads by the ID of the Enclave they actually run on.
        in: query
        name: enclaveId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter workloads by the ID of the Enclave they actually run on.
          title: Enclave ID
      - description: Filter workloads by the name of the Enclave they actually run on.
        in: query
        name: enclave
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter workloads by the name of the Enclave they actually run on.
          title: Enclave
      - description: Filter workloads by their active artifact's repository ID.
        in: query
        name: repositoryId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter workloads by their active artifact's repository ID.
          title: Artifact Repository ID
      - description: List of artifact types to filter for. If multiple values are specified, workloads matching any of the values will be returned.
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArtifactType'
            type: array
          - type: 'null'
          description: List of artifact types to filter for. If multiple values are specified, workloads matching any of the values will be returned.
          title: Type
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadStatsResponse'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get All Workloads Stats
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}:
    delete:
      description: 'Delete a workload permanently.


        Returns 204 on success. Proton stop failures are logged internally

        but do not change the response status.'
      operationId: deleteWorkload
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      responses:
        '204':
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Workload by workload_ ID
      tags:
      - Workloads
    get:
      description: Retrieve a workload by ID.
      operationId: getWorkload
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Workload by workload_ ID
      tags:
      - Workloads
    patch:
      description: 'Partially update a workload''s name, description and importance.


        Runtime settings are changed with PATCH /workloads/{workloadId}/settings and the deployed

        artifact with POST /workloads/{workloadId}/replacement. A body naming a field that another

        endpoint changes is rejected with 422, one error per such field saying where it is changed;

        any other field is ignored.'
      operationId: updateWorkload
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkloadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Workload by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/events:
    get:
      description: List events for a workload, such as status changes and errors.
      operationId: listWorkloadEvents
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Retrieve only the specified number of values.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadEventsResponse'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Workload Events by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/history:
    get:
      description: List the artifact deployment history for a workload.
      operationId: listWorkloadArtifactHistory
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Retrieve only the specified number of values.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplacementHistoryListResponse'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Artifact Histories by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/promote:
    post:
      description: 'Lock the draft artifact currently running on a workload.


        The workload continues running the same artifact, which is promoted from

        draft to locked and assigned a version number. Workload stats are reset

        and the event is recorded in the replacement history.'
      operationId: promoteWorkloadArtifact
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          description: Artifact is not a draft, workload has no active proton, or a replacement is in progress
      summary: Promote Workload Artifact by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/protons:
    get:
      description: List all protons associated with a workload.
      operationId: listWorkloadProtons
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Retrieve only the specified number of values.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtonListResponse'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Workload Protons by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/protons/{proton_id}:
    get:
      description: Get a specific proton for a workload.
      operationId: getWorkloadProton
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      - description: Proton ID
        in: path
        name: proton_id
        required: true
        schema:
          description: Proton ID
          title: Proton Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtonFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Workload Proton by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/protons/{proton_id}/statusDetails:
    get:
      description: 'Get per-replica status details for a proton.


        Returns 204 if no status update has been received yet.

        Returns 200 with the latest replica snapshot when available.'
      operationId: getWorkloadProtonStatusDetails
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      - description: Proton ID
        in: path
        name: proton_id
        required: true
        schema:
          description: Proton ID
          title: Proton Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicaStatusesSnapshot'
          description: Successful Response
        '204':
          description: No status update has been received for this proton yet
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Workload Proton Status Details by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/related:
    get:
      description: List entities related to a workload, such as linked artifacts.
      operationId: getWorkloadRelatedEntities
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedEntitiesResponse'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Workload Related Entities by workload_ ID
      tags:
      - Workloads
  /api/v2/workloads/{workload_id}/replacement:
    delete:
      operationId: deleteWorkloadReplacement
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
          title: Workload Id
          type: string
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Workload not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Replacement by workload_ ID
      tags:
      - Workloads
    get:
      operationId: getWorkloadReplacement
      parameters:
      - description: Workload ID
        in: path
        name: workload_id
        required: true
        schema:
          description: Workload ID
