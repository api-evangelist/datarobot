    ContainerLastStateDetail:
      description: 'The container''s previous recorded state — in practice its most recent termination — using the same encoding as the container''s current-state fields: a `status` label plus detail fields. It carries the failure verdict while the container is waiting between restarts, when the current state has no reason: for example reason "OOMKilled" with exitCode 137, or reason "StartError" with the failure text in `message`.


        `startedAt`/`finishedAt` bound the previous run: a near-zero span means the container failed during startup; a long span points at a runtime termination such as a failed liveness probe.'
