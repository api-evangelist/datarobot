openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Blueprints API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: This page outlines DataRobot's endpoints for blueprints, a graphical representation of the many steps involved in transforming input predictors and targets into a model.
  name: Blueprints
paths:
  /api/v2/customTasks/:
    get:
      description: 'Retrieve metadata for all accessible custom tasks.


        For more information on custom tasks, access the UI documentation.'
      operationId: customTasks_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 1000
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Sort order which will be applied to custom task list, valid options are "created", "updated". Prefix the attribute name with a dash to sort in descending order, e.g. orderBy="-created". By default, the orderBy parameter is None which will result in custom tasks being returned in order of creation time descending.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - created
          - -created
          - updated
          - -updated
          type: string
      - description: String to search for occurrence in custom task's description, language and name. Search is case insensitive. If not specified, all custom tasks will be returned.
        in: query
        name: searchFor
        required: false
        schema:
          maxLength: 10000
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskListResponse'
          description: OK.
      summary: List custom tasks
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
    post:
      description: 'Creates a new custom task and returns the newly created metadata record for it.


        A custom task may either be an estimator or a transform. Estimators must support a single

        target type (e.g., binary classification, regression).

        Regression and anomaly detection models are

        expected to produce predictions that are arbitrary floating-point or integer numbers.

        A classification model is expected to return predictions with probability scores for each

        class.


        Transforms are expected to return a dataframe or sparse matrix with the same number

        of rows as the input feature matrix. Only numeric outputs are supported

        for custom transforms.'
      operationId: customTasks_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTaskCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskResponse'
          description: Custom task successfully created.
        '403':
          description: Custom task creation is not enabled.
        '422':
          description: Input parameters invalid
      summary: Create a custom task
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
  /api/v2/customTasks/fromCustomTask/:
    post:
      description: Creates a copy of the provided custom task, including metadata, versions of that task, and uploaded files. Associates the new versions with files owned by the custom task.
      operationId: customTasksFromCustomTask_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTaskCopy'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskResponse'
          description: Successfully created copy.
      summary: Clone custom task
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
  /api/v2/customTasks/{customTaskId}/:
    delete:
      description: Delete a custom task. Only users who have permission to edit custom task can delete it. Only custom tasks which are not currently deployed, used in a blueprint, or in the AIcatalog can be deleted. Relevant CustomTaskImage will be deleted also.
      operationId: customTasks_delete
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Record deleted.
        '409':
          description: This custom task is currently deployed, trained, or part of a user blueprint, and cannot be deleted. The response body will contain link where these conflicts can be retrieved.
      summary: Delete custom task by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
    get:
      description: Retrieve metadata for a custom task
      operationId: customTasks_retrieve
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskResponse'
          description: OK.
      summary: Get custom task by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
    patch:
      description: 'Updates metadata for an existing custom task.


        All custom tasks must support one target type (e.g. binaryClassification, regression, transform).


        Setting `positiveClassLabel` and `negativeClassLabel` to null will set

        the labels to their default values (1 and 0 for positiveClassLabel and negativeClassLabel,

        respectively).


        Setting `positiveClassLabel`, `negativeClassLabel`, `targetName` is disabled if task

        has active deployments.'
      operationId: customTasks_patch
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTaskUpdate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskResponse'
          description: Created.
        '422':
          description: Input parameters are invalid.
      summary: Update custom task by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
  /api/v2/customTasks/{customTaskId}/accessControl/:
    get:
      description: Get a list of users who have access to this custom task and their roles on it.
      operationId: customTasksAccessControl_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 1000
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskAccessControlListResponse'
          description: A list of users who have access to this custom task and their roles on it.
        '400':
          description: Both username and userId were specified.
      summary: Get a list of users who have access by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.27
    patch:
      description: Grant access or update roles for users on this custom task and appropriate learning data. Up to 100 user roles may be set in a single request.
      operationId: customTasksAccessControl_patchMany
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingUpdateOrRemoveWithGrant'
      responses:
        '204':
          description: Roles updated successfully.
        '409':
          description: The request would leave the custom task without an owner.
        '422':
          description: One of the users in the request does not exist, or the request is otherwise invalid.
      summary: Grant access or update roles by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.27
  /api/v2/customTasks/{customTaskId}/download/:
    get:
      description: Download the latest item bundle from a custom task as a zip compressed archive.
      operationId: customTasksDownload_list
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The download succeeded.
          headers:
            Content-Disposition:
              description: Contains an auto generated filename for this download ("attachment;filename=model-<model_id>-version-<version_id>.zip").
              schema:
                type: string
      summary: Download the latest custom task version content by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
  /api/v2/customTasks/{customTaskId}/versions/:
    get:
      description: List custom task versions.
      operationId: customTasksVersions_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 1000
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskVersionListResponse'
          description: OK.
        '400':
          description: Query parameters are invalid.
      summary: List custom task versions by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
    patch:
      description: Create a new custom task version with files added, replaced or deleted. Files from the previous version of a custom task will be used as a basis.
      operationId: customTaskVersion_createFromLatest
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTaskVersionCreateFromLatest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskVersionResponse'
          description: Item successfully created.
        '413':
          description: Item or collection of items was too large in size (bytes).
        '422':
          description: 'Cannot create the custom task version due to one or more errors. All error responses will have a "message" field and some may have optional fields. The optional fields include: ["errors", "dependencies", "invalidDependencies"]'
      summary: Update custom task version files by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
    post:
      description: Create a new custom task version with attached files if supplied.
      operationId: customTasksVersions_create
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTaskVersionCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskVersionResponse'
          description: Item successfully created.
        '413':
          description: Item or collection of items was too large in size (bytes).
        '422':
          description: 'Cannot create the custom task version due to one or more errors. All error responses will have a "message" field and some may have optional fields. The optional fields include: ["errors", "dependencies", "invalidDependencies"]'
      summary: Create custom task version by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
  /api/v2/customTasks/{customTaskId}/versions/fromRepository/:
    patch:
      description: Create a new custom task version with files added from a remote repository. Files from the previous version of a custom task will be used as a basis.
      operationId: customTasksVersionsFromRepository_patchMany
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTaskVersionCreateFromRepository'
      responses:
        '202':
          description: 'Accepted: request placed to a queue for processing.'
          headers:
            Location:
              description: URL for tracking async job status.
              schema:
                type: string
        '422':
          description: Input parameters are invalid.
      summary: Create custom task version from remote repository by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
    post:
      description: Create a new custom task version with only files added from the specified remote repository.
      operationId: customTasksVersionsFromRepository_create
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTaskVersionCreateFromRepository'
      responses:
        '202':
          description: 'Accepted: request placed to a queue for processing.'
          headers:
            Location:
              description: URL for tracking async job status.
              schema:
                type: string
        '422':
          description: Input parameters are invalid.
      summary: Create a version from a repository
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
  /api/v2/customTasks/{customTaskId}/versions/{customTaskVersionId}/:
    get:
      description: Display a requested version of a custom task along with the files attached to it.
      operationId: customTasksVersions_retrieve
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      - description: The ID of the custom task version.
        in: path
        name: customTaskVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskVersionResponse'
          description: OK.
      summary: Get custom task version by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
    patch:
      description: Edit metadata of a specific task version.
      operationId: customTasksVersions_patch
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      - description: The ID of the custom task version.
        in: path
        name: customTaskVersionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTaskVersionMetadataUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskVersionResponse'
          description: The edit was successful.
        '404':
          description: Custom task not found or user does not have edit permissions.
      summary: Update custom task version by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
  /api/v2/customTasks/{customTaskId}/versions/{customTaskVersionId}/dependencyBuild/:
    delete:
      description: Cancel the custom task version's dependency build.
      operationId: customTasksVersionsDependencyBuild_deleteMany
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      - description: The ID of the custom task version.
        in: path
        name: customTaskVersionId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Custom task version's dependency build was cancelled.
        '409':
          description: Custom task dependency build has reached a terminal state and cannot be cancelled.
        '422':
          description: No custom task dependency build started for specified version or dependency image is in use and cannot be deleted
      summary: Cancel dependency build by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.27
    get:
      description: Retrieve the custom task version's dependency build status.
      operationId: customTasksVersionsDependencyBuild_list
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      - description: The ID of the custom task version.
        in: path
        name: customTaskVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskVersionDependencyBuildMetadataResponse'
          description: The metadata from the custom task version's dependency build.
        '422':
          description: Custom task dependency build has not started.
      summary: Retrieve the custom task version's dependency build status by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.27
    post:
      description: Start a custom task version's dependency build. This is required to test, deploy, or train custom tasks.
      operationId: customTasksVersionsDependencyBuild_create
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      - description: The ID of the custom task version.
        in: path
        name: customTaskVersionId
        required: true
        schema:
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTaskVersionDependencyBuildMetadataResponse'
          description: Custom task version's dependency build has started.
        '422':
          description: Custom task dependency build has failed.
      summary: Start a custom task version's dependency build by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.27
  /api/v2/customTasks/{customTaskId}/versions/{customTaskVersionId}/dependencyBuildLog/:
    get:
      description: Retrieve the custom task version's dependency build log.
      operationId: customTasksVersionsDependencyBuildLog_list
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      - description: The ID of the custom task version.
        in: path
        name: customTaskVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The log file generated during the custom task version's dependency build.
        '404':
          description: Dependency build is in progress or could not be found.
        '422':
          description: Custom task dependency build has not started.
      summary: Retrieve the custom task version's dependency build log by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.27
  /api/v2/customTasks/{customTaskId}/versions/{customTaskVersionId}/download/:
    get:
      description: Download a specific item bundle from a custom task as a zip compressed archive.
      operationId: customTasksVersionsDownload_list
      parameters:
      - description: The ID of the custom task.
        in: path
        name: customTaskId
        required: true
        schema:
          type: string
      - description: The ID of the custom task version.
        in: path
        name: customTaskVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The download succeeded.
          headers:
            Content-Disposition:
              description: Contains an auto generated filename for this download ("attachment;filename=model-<model_id>-version-<version_id>.zip").
              schema:
                type: string
      summary: Download custom task version content by custom task ID
      tags:
      - Blueprints
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the development of custom code for estimators and transforms.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TASKS
      x-versionadded: v2.26
  /api/v2/customTrainingBlueprints/:
    get:
      description: 'List custom training blueprints.


        This route retrieves the metadata for all custom training blueprints a user has access to.'
      operationId: customTrainingBlueprints_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 1000
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: 'The list of blueprints for a specific model. Default: all.'
        in: query
        name: customModelId
        required: false
        schema:
          type: string
      - description: List blueprints in reverse order.
        in: query
        name: reverse
        required: false
        schema:
          default: 'False'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Custom model target types to return.
        in: query
        name: targetTypes
        required: false
        schema:
          items:
            enum:
            - Binary
            - Regression
