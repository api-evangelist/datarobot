openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Features API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage features.
  name: Features
paths:
  /api/v2/calendarCountryCodes/:
    get:
      description: Retrieves the list of allowed country codes to request preloaded calendar generation for.
      operationId: calendarCountryCodes_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreloadedCalendarListResponse'
          description: The list of allowed country codes that have the generated preloaded calendars.
      summary: Retrieve the list of allowed country codes
      tags:
      - Features
      x-versionadded: v2.23
  /api/v2/calendars/:
    get:
      description: List all the calendars which the user has access to.
      operationId: calendars_list
      parameters:
      - description: Optional, if provided will filter returned calendars to those being used in the specified project.
        in: query
        name: projectId
        required: false
        schema:
          type: string
      - description: 'Optional (default: `0`), this many results will be skipped.'
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: 'Optional (default: `0`), at most this many results will be returned. If `0`, all results will be returned.'
        in: query
        name: limit
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarListResponse'
          description: The list of calendar objects.
      summary: List all available calendars
      tags:
      - Features
      x-versionadded: v2.15
  /api/v2/calendars/fileUpload/:
    post:
      description: Create a calendar from a file in a CSV or XLSX format. The calendar file specifies the dates or events in a dataset such that DataRobot automatically derives and creates special features based on the calendar events (e.g., time until the next event, labeling the most recent event).
      operationId: calendarsFileUpload_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarFileUpload'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: Request for calendar generation was submitted. See Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Create a calendar
      tags:
      - Features
      x-versionadded: v2.15
  /api/v2/calendars/fromCountryCode/:
    post:
      description: Initialize generation of preloaded calendars. Preloaded calendars are available only for time series projects. Preloaded calendars do not support multiseries calendars.
      operationId: calendarsFromCountryCode_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreloadedCalendar'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: Request for calendar generation was submitted. See Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Initialize generation of preloaded calendars
      tags:
      - Features
      x-versionadded: v2.23
  /api/v2/calendars/fromDataset/:
    post:
      description: Create a calendar from the dataset.
      operationId: calendarsFromDataset_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarFromDataset'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCalendarDatasetResponse'
          description: Successfully created a calendar from the dataset.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Create a calendar from a dataset
      tags:
      - Features
      x-versionadded: v2.21
  /api/v2/calendars/{calendarId}/:
    delete:
      description: Delete a calendar. This can only be done if all projects and deployments using the calendar have been deleted.
      operationId: calendars_delete
      parameters:
      - description: The ID of this calendar.
        in: path
        name: calendarId
        required: true
        schema:
          type: string
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: Calendar successfully deleted.
        '404':
          description: Invalid `calendarId` provided, or user does not have permissions to delete calendar.
      summary: Delete a calendar by calendar ID
      tags:
      - Features
      x-versionadded: v2.15
    get:
      description: List all the information about a calendar such as the total number of event dates, the earliest calendar event date, the IDs of projects currently using this calendar and the others.
      operationId: calendars_retrieve
      parameters:
      - description: The ID of this calendar.
        in: path
        name: calendarId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarRecord'
          description: Request for a Calendar object was successful.
      summary: Retrieve information about a calendar by calendar ID
      tags:
      - Features
      x-versionadded: v2.15
    patch:
      description: Update a calendar's name.
      operationId: calendars_patch
      parameters:
      - description: The ID of this calendar.
        in: path
        name: calendarId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarNameUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: Calendar name successfully updated.
        '404':
          description: Invalid `calendarId` provided, or user does not have permissions to update calendar.
      summary: Update a calendar's name by calendar ID
      tags:
      - Features
      x-versionadded: v2.15
  /api/v2/calendars/{calendarId}/accessControl/:
    get:
      description: Get a list of users who have access to this calendar and their roles on the calendar.
      operationId: calendarsAccessControl_list
      parameters:
      - description: Optional, only return the access control information for a user with this username. Should not be specified if `userId` is specified.
        in: query
        name: username
        required: false
        schema:
          type: string
      - description: Optional, only return the access control information for a user with this user ID. Should not be specified if `username` is specified.
        in: query
        name: userId
        required: false
        schema:
          type: string
      - description: 'Optional (default: `0`), this many results will be skipped.'
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: 'Optional (default: `0`), at most this many results will be returned. If `0`, all results will be returned.'
        in: query
        name: limit
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The ID of this calendar.
        in: path
        name: calendarId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarAccessControlListResponse'
          description: Request for the list of users who have access to this calendar and their roles on the calendar was successful.
        '400':
          description: Both `username` and `userId` were specified.
        '404':
          description: Entity not found. Either the calendar does not exist or the user does not have permissions to view the calendar.
      summary: Get a list of users who have access by calendar ID
      tags:
      - Features
      x-versionadded: v2.15
    patch:
      description: Update the access control for this calendar. See the `entity sharing documentation ` for more information.
      operationId: calendarsAccessControl_patchMany
      parameters:
      - description: The ID of this calendar.
        in: path
        name: calendarId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarAccessControlUpdate'
      responses:
        '200':
          description: The request to update the access control for this calendar was successful.
        '404':
          description: Invalid `calendarId` provided, or user has no access whatsoever on the specified calendar.
        '422':
          description: Invalid `username` provided to modify access for the specified calendar.
      summary: Update the access control by calendar ID
      tags:
      - Features
      x-versionadded: v2.15
  /api/v2/datasets/{datasetId}/documentsDataQualityLog/:
    get:
      description: Retrieve the documents data quality log content and log length as JSON.
      operationId: datasetsDocumentsDataQualityLog_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsDataQualityLogLinesResponse'
          description: Paginated list of lines of the documents data quality log.
        '404':
          description: Documents data quality assessment log not available.
      summary: Retrieve the documents data quality log content by dataset ID
      tags:
      - Features
      x-versionadded: v2.32
  /api/v2/datasets/{datasetId}/documentsDataQualityLog/file/:
    get:
      description: Retrieve a text file containing the documents data quality log.
      operationId: datasetsDocumentsDataQualityLogFile_list
      parameters:
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The response will contain a text file with the contents of the data quality log.
          headers:
            Content-Disposition:
              description: '`attachment;filename=<filename>.txt` The suggested filename is dynamically generated'
              schema:
                type: string
            Content-Type:
              description: The MIME type of the returned data.
              schema:
                enum:
                - text/plain
                type: string
        '404':
          description: The data quality assessment log is not available.
      summary: Retrieve a text file containing the documents data quality log by dataset ID
      tags:
      - Features
      x-versionadded: v2.32
  /api/v2/datasets/{datasetId}/imagesDataQualityLog/:
    get:
      description: Retrieve the images data quality log content and log length as JSON
      operationId: datasetsImagesDataQualityLog_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesDataQualityLogLinesResponse'
          description: Paginated list of lines of the image data quality log
      summary: Retrieve the images data quality log content by dataset ID
      tags:
      - Features
      x-versionadded: v2.21
  /api/v2/datasets/{datasetId}/imagesDataQualityLog/file/:
    get:
      description: Retrieve a text file containing the images data quality log.
      operationId: datasetsImagesDataQualityLogFile_list
      parameters:
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The response will contain a text file with the contents of the images data quality log.
          headers:
            Content-Disposition:
              description: '`attachment;filename=<filename>.txt` The suggested filename is dynamically generated'
              schema:
                type: string
            Content-Type:
              description: MIME type of the returned data
              schema:
                enum:
                - text/plain
                type: string
      summary: Retrieve a text file containing the images data quality log by dataset ID
      tags:
      - Features
      x-versionadded: v2.21
  /api/v2/datasets/{datasetId}/versions/{datasetVersionId}/documentsDataQualityLog/:
    get:
      description: Retrieve the documents data quality log content and log length as JSON.
      operationId: datasetsVersionsDocumentsDataQualityLog_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      - description: The ID of the dataset version.
        in: path
        name: datasetVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsDataQualityLogLinesResponse'
          description: Paginated list of lines of the documents data quality log.
        '404':
          description: Documents data quality assessment log not available.
      summary: Retrieve documents data quality log by ID
      tags:
      - Features
      x-versionadded: v2.32
  /api/v2/datasets/{datasetId}/versions/{datasetVersionId}/documentsDataQualityLog/file/:
    get:
      description: Retrieve a text file containing the documents data quality log.
      operationId: datasetsVersionsDocumentsDataQualityLogFile_list
      parameters:
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      - description: The ID of the dataset version.
        in: path
        name: datasetVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The response will contain a text file with the contents of the data quality log.
          headers:
            Content-Disposition:
              description: '`attachment;filename=<filename>.txt` The suggested filename is dynamically generated'
              schema:
                type: string
            Content-Type:
              description: The MIME type of the returned data.
              schema:
                enum:
                - text/plain
                type: string
        '404':
          description: The data quality assessment log is not available.
      summary: Retrieve file by ID
      tags:
      - Features
      x-versionadded: v2.32
  /api/v2/models/{modelId}/documentTextExtractionSampleDocuments/:
    get:
      description: Retrieve documents with computed document text extraction samples.
      operationId: modelsDocumentTextExtractionSampleDocuments_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: The name of the feature to retrieve documents for.
        in: query
        name: featureName
        required: true
        schema:
          type: string
      - description: The document task to retrieve documents for.
        in: query
        name: documentTask
        required: false
        schema:
          enum:
          - DOCUMENT_TEXT_EXTRACTOR
          - TESSERACT_OCR
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTextExtractionSamplesRetrieveDocumentsResponse'
          description: Documents with computed document text extraction samples.
      summary: Retrieve documents by model ID
      tags:
      - Features
      x-versionadded: v2.32
  /api/v2/models/{modelId}/documentTextExtractionSamplePages/:
    get:
      description: Retrieve document pages with recognized text lines and bounding boxes enclosing the text lines.
      operationId: modelsDocumentTextExtractionSamplePages_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: The name of the feature.
        in: query
        name: featureName
        required: true
        schema:
          type: string
      - description: The index of the document within the dataset.
        in: query
        name: documentIndex
        required: false
        schema:
          type: integer
      - description: The document task to retrieve pages for.
        in: query
        name: documentTask
        required: false
        schema:
          enum:
          - DOCUMENT_TEXT_EXTRACTOR
          - TESSERACT_OCR
          type: string
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTextExtractionSamplesRetrievePagesResponse'
          description: Document pages with recognized text lines and bounding boxes enclosing the text lines.
      summary: Retrieve document pages by model ID
      tags:
      - Features
      x-versionadded: v2.32
  /api/v2/models/{modelId}/documentTextExtractionSamples/:
    post:
      description: Requests the computation of document text extraction samples for the specified model.
      operationId: modelsDocumentTextExtractionSamples_create
      parameters:
      - description: The model ID.
        in: path
        name: modelId
        required: true
        schema:
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTextExtractionSamplesComputeResponse'
          description: Document text extraction samples computation has been successfully requested.
          headers:
            Location:
              description: a url that can be polled to check the status of the job.
              schema:
                format: url
                type: string
        '422':
          description: 'Cannot compute document text extraction samples: if the insight was already computed for the model or there was another issue creating this job.'
      summary: Requests the computation of document text extraction samples by model ID
      tags:
      - Features
      x-versionadded: v2.32
  /api/v2/ocrJobResources/:
    get:
      description: Retrieve user's OCR job resources.
      operationId: ocrJobResources_list
      parameters:
      - description: The number of results to skip (for pagination).
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The max number of results to return.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRJobResourceListResponse'
          description: The OCR job resources.
      summary: Retrieve user's OCR job resources
      tags:
      - Features
      x-versionadded: v2.35
    post:
      description: Create an OCR job resource. This creates several entities, including an empty Dataset for writing the results and associates the input dataset with them.
      operationId: ocrJobResources_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OCRJobCreationRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRJobResourceResponse'
          description: The OCR job resource.
        '202':
          description: An OCR job resource is successfully created.
        '403':
          description: User doesn't have permission to access the dataset associated with the OCR job resource.
        '404':
          description: The OCR input dataset was not found.
        '422':
          description: The language parameter in the request is invalid, a selected file is not part of the input item, or a file selection is used without supported engine.
      summary: Create an OCR job resource
      tags:
      - Features
      x-versionadded: v2.35
  /api/v2/ocrJobResources/{jobResourceId}/:
    get:
      description: Retrieve an OCR job resource.
      operationId: ocrJobResources_retrieve
      parameters:
      - description: The OCR job resource ID.
        in: path
        name: jobResourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRJobResourceResponse'
          description: The OCR job resource.
        '404':
          description: OCR job resource is not found for the requested job resource ID.
      summary: Retrieve an OCR job resource by job resource ID
      tags:
      - Features
      x-versionadded: v2.35
  /api/v2/ocrJobResources/{jobResourceId}/errorReport/:
    get:
      description: Download the OCR job error report.
      operationId: ocrJobResourcesErrorReport_list
      parameters:
      - description: The OCR job resource ID.
        in: path
        name: jobResourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The OCR job error report.
        '404':
          description: OCR job error report is not found for the requested OCR job resource ID.
      summary: Retrieve the OCR job error report by job resource ID
      tags:
      - Features
      x-versionadded: v2.35
    put:
      description: Upload the job error report to the associated OCR job resource for later downloading.
      operationId: ocrJobResourcesErrorReport_putMany
      parameters:
      - description: The OCR job resource ID.
        in: path
        name: jobResourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OCRJobErrorReportPutRequest'
      responses:
        '200':
          description: ''
        '403':
          description: User doesn't have permission to save error report.
        '404':
          description: Dataset with which the error report is associated is not found.
      summary: Save the OCR job error report by job resource ID
      tags:
      - Features
      x-versionadded: v2.35
  /api/v2/ocrJobResources/{jobResourceId}/jobProgress/:
    get:
      description: Retrieve the per-file OCR progress of a job, batch by batch, as reported by the OCR worker.
      operationId: ocrJobResourcesJobProgress_list
      parameters:
      - description: The OCR job resource ID.
        in: path
        name: jobResourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRJobProgressResponse'
          description: The per-file OCR job progress.
        '404':
          description: OCR job resource is not found for the requested job resource ID.
        '422':
          description: The OCR job does not run on the new OCR pipeline, which is the only pipeline reporting per-file progress.
      summary: Retrieve per-file OCR job progress by job resource ID
      tags:
      - Features
      x-versionadded: v2.48
  /api/v2/ocrJobResources/{jobResourceId}/jobStatus/:
    get:
      description: Get the status of a running OCR job from the OCR service.
      operationId: ocrJobResourcesJobStatus_list
      parameters:
      - description: The OCR job resource ID.
        in: path
        name: jobResourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRJobStatusesResponse'
          description: The OCR job status.
        '404':
          description: OCR job resource is not found for the requested job resource ID.
      summary: Retrieve OCR job status by job resource ID
      tags:
      - Features
      x-versionadded: v2.35
  /api/v2/ocrJobResources/{jobResourceId}/start/:
    post:
      description: Start an OCR job from the information in the OCR job resource. Each OCR job may be started exactly once.
      operationId: ocrJobResourcesStart_create
      parameters:
      - description: The OCR job resource ID.
        in: path
        name: jobResourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OCRJobPostPayload'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRJobPostResponse'
          description: The OCR job info.
        '202':
          description: An OCR job is successfully created.
        '404':
          description: The job resource was not found.
        '422':
          description: The OCR job is already started.
        '503':
          description: The OCR service is temporarily unavailable.
