        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of records to return in the range from 1 to 100. Default 100.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: The ID of the Use Case to update.
        in: path
        name: useCaseId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCaseCustomApplicationsResponse'
