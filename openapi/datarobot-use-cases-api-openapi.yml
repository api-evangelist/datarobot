openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Use Cases API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: The endpoints below outline how to create and manage Workbench Use Cases. They are not associated with the Value Tracker, which was formerly called Use Cases.
  name: Use Cases
paths:
  /api/v2/pinnedUsecases/:
    get:
      operationId: pinnedUsecases_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedUsecasesResponse'
          description: Pinned Use Cases retrieved successfully.
        '403':
          description: User does not have access to this functionality.
      summary: Retrieve Pinned Usecases
      tags:
      - Use Cases
      x-versionadded: v2.36
    patch:
      operationId: pinnedUsecases_patchMany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinnedUsecaseUpdatePayload'
      responses:
        '204':
          description: Pinned Use Cases retrieved successfully.
        '403':
          description: User does not have access to this functionality.
      summary: Modify Pinned Usecases
      tags:
      - Use Cases
      x-versionadded: v2.36
  /api/v2/useCases/:
    get:
      description: Retrieve the list of Use Cases.
      operationId: useCases_list
      parameters:
      - description: The number of records to skip over. Default 0.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of records to return in the range from 1 to 100. Default 100.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: Returns only Use Cases with names that match the given string.
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: Only return experiment containers associated with the given project ID.
        in: query
        name: projectId
        required: false
        schema:
          type: string
        x-versiondeprecated: v2.35
      - description: Only return experiment containers associated with the given app.
        in: query
        name: applicationId
        required: false
        schema:
          type: string
        x-versiondeprecated: v2.35
      - description: The id of the entity type that is linked with the Use Case.
        in: query
        name: entityId
        required: false
        schema:
          type: string
      - description: The entity type that is linked to the Use Case.
        in: query
        name: entityType
        required: false
        schema:
          enum:
          - project
          - dataset
          - file
          - notebook
          - application
          - recipe
          - playground
          - vectorDatabase
          - syftrSearchInstance
          - embeddingModelValidation
          - customModelVersion
          - registeredModelVersion
          - deployment
          - customApplication
          - customApplicationSource
          - customJob
          - workload
          - artifactRepository
          - promptTemplate
          - customModel
          - registeredModel
          - enclave
          - executionEnvironment
          - entityNotificationPolicyTemplate
          - notificationChannelTemplate
          type: string
      - description: '[DEPRECATED - replaced with order_by] The order in which Use Cases and return Use Cases.'
        in: query
        name: sort
        required: true
        schema:
          default: id
          enum:
          - -applicationsCount
          - -createdAt
          - -createdBy
          - -customApplicationsCount
          - -datasetsCount
          - -description
          - -filesCount
          - -id
          - -name
          - -notebooksCount
          - -playgroundsCount
          - -potentialValue
          - -projectsCount
          - -riskLevel
          - -stage
          - -updatedAt
          - -updatedBy
          - -vectorDatabasesCount
          - applicationsCount
          - createdAt
          - createdBy
          - customApplicationsCount
          - datasetsCount
          - description
          - filesCount
          - id
          - name
          - notebooksCount
          - playgroundsCount
          - potentialValue
          - projectsCount
          - riskLevel
          - stage
          - updatedAt
          - updatedBy
          - vectorDatabasesCount
          type: string
        x-versiondeprecated: v2.32
      - description: The order in which Use Cases are returned.
        in: query
        name: orderBy
        required: true
        schema:
          default: id
          enum:
          - -applicationsCount
          - -createdAt
          - -createdBy
          - -customApplicationsCount
          - -datasetsCount
          - -description
          - -filesCount
          - -id
          - -name
          - -notebooksCount
          - -playgroundsCount
          - -potentialValue
          - -projectsCount
          - -riskLevel
          - -stage
          - -updatedAt
          - -updatedBy
          - -vectorDatabasesCount
          - applicationsCount
          - createdAt
          - createdBy
          - customApplicationsCount
          - datasetsCount
          - description
          - filesCount
          - id
          - name
          - notebooksCount
          - playgroundsCount
          - potentialValue
          - projectsCount
          - riskLevel
          - stage
          - updatedAt
          - updatedBy
          - vectorDatabasesCount
          type: string
      - description: A filter to return Use Cases by type.
        in: query
        name: usecaseType
        required: true
        schema:
          default: all
          enum:
          - all
          - general
          - walkthrough
          type: string
      - description: Only return Use Cases associated with the given risk level.
        in: query
        name: riskLevel
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 10
            type: array
      - description: Only return Use Cases in the given stage.
        in: query
        name: stage
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 7
            type: array
      - description: Filter Use Cases to return only those created by the selected user.
        in: query
        name: createdBy
        required: false
        schema:
          type: string
      - description: Defines if the Use Cases available on Organization level should be shown.
        in: query
        name: showOrgUseCases
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCaseListResponse'
          description: The Use Cases were retrieved successfully.
        '403':
          description: User does not have access to this functionality.
      summary: Retrieve the list of Use Cases
      tags:
      - Use Cases
      x-versionadded: v2.32
    post:
      description: Look up a Use Case.
      operationId: useCases_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseCaseCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
          description: The experiment container.
        '422':
          description: Unprocessable Entity
      summary: Get a Use Case
      tags:
      - Use Cases
      x-versionadded: v2.32
  /api/v2/useCases/allResources/:
    get:
      description: Get a list of the all used assets associated with a Use Case.
      operationId: useCasesAllResources_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: '[DEPRECATED - replaced with order_by] The order to sort the Use Case references.'
        in: query
        name: sort
        required: true
        schema:
          default: -updatedAt
          enum:
          - -entityType
          - -lastActivity
          - -name
          - -updatedAt
          - -updatedBy
          - entityType
          - lastActivity
          - name
          - updatedAt
          - updatedBy
          type: string
        x-versiondeprecated: v2.32
      - description: The order to sort the Use Case references.
        in: query
        name: orderBy
        required: true
        schema:
          default: -updatedAt
          enum:
          - -entityType
          - -lastActivity
          - -name
          - -updatedAt
          - -updatedBy
          - entityType
          - lastActivity
          - name
          - updatedAt
          - updatedBy
          type: string
      - description: Only retrieve resources that had activity within the specified number of days.
        in: query
        name: daysSinceLastActivity
        required: false
        schema:
          exclusiveMinimum: 0
          maximum: 365
          type: integer
      - description: The recipe status used for filtering recipes.
        in: query
        name: recipeStatus
        required: false
        schema:
          oneOf:
          - enum:
            - draft
            - preview
            - published
            type: string
          - items:
              enum:
              - draft
              - preview
              - published
              type: string
            maxItems: 3
            minItems: 1
            type: array
        x-versionadded: v2.33
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCaseRecentAssetsListResponse'
          description: ''
      summary: Get the list of the references associated
      tags:
      - Use Cases
      x-versionadded: v2.33
  /api/v2/useCases/notebooks/:
    get:
      description: Get the list of the notebooks from all Use Cases.
      operationId: use_cases_all_notebooks
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: Include Use Case name.
        in: query
        name: includeName
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCasesNotebooksListResponse'
          description: ''
        '403':
          description: User does not have access to this functionality.
      summary: Get the list of the notebooks
      tags:
      - Use Cases
      x-versionadded: v2.32
  /api/v2/useCases/{useCaseId}/:
    delete:
      description: Delete a Use Case.
      operationId: useCases_delete
      parameters:
      - description: The ID of the use case to update.
        in: path
        name: useCaseId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
      summary: Delete a Use Case by use case ID
      tags:
      - Use Cases
      x-versionadded: v2.32
    get:
      description: Retrieve a single Use Case.
      operationId: useCases_retrieve
      parameters:
      - description: The ID of the use case to update.
        in: path
        name: useCaseId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
          description: ''
      summary: Get a Use Case by use case ID
      tags:
      - Use Cases
      x-versionadded: v2.32
    patch:
      description: Update a Use Case.
      operationId: useCases_patch
      parameters:
      - description: The ID of the use case to update.
        in: path
        name: useCaseId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseCaseUpdate'
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
          description: The Use Case has been successfully updated.
        '403':
          description: User does not have access to this functionality.
        '404':
          description: The Use Case was not found.
        '422':
          description: Unprocessable Entity
      summary: Update a Use Case by use case ID
      tags:
      - Use Cases
      x-versionadded: v2.32
  /api/v2/useCases/{useCaseId}/applications/:
    get:
      description: Get the list of the applications associated with a Use Case.
      operationId: useCasesApplications_list
      parameters:
      - description: The number of results to skip.
