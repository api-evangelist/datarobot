          maximum: 100
          type: integer
      - description: Only return applications with names that match the given string.
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: '[DEPRECATED - replaced with order_by] The order to sort applications.'
        in: query
        name: sort
        required: true
        schema:
          default: updatedAt
          enum:
          - -applicationTemplateType
          - -createdAt
          - -lastActivity
          - -name
          - -source
          - -updatedAt
          - -userId
          - applicationTemplateType
          - createdAt
          - lastActivity
          - name
          - source
          - updatedAt
          - userId
          type: string
        x-versiondeprecated: v2.32
      - description: The order to sort applications.
        in: query
        name: orderBy
        required: true
        schema:
          default: updatedAt
          enum:
          - -applicationTemplateType
          - -createdAt
          - -lastActivity
          - -name
          - -source
          - -updatedAt
          - -userId
          - applicationTemplateType
          - createdAt
          - lastActivity
          - name
          - source
          - updatedAt
          - userId
          type: string
      - description: The ID of the use case to update.
        in: path
        name: useCaseId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseCasesApplicationsListResponse'
          description: ''
        '403':
          description: User does not have access to this functionality.
      summary: Get the list of the applications associated by use case ID
      tags:
      - Use Cases
      x-versionadded: v2.32
  /api/v2/useCases/{useCaseId}/customApplications/:
    get:
      description: The list of the custom applications referenced by a Use Case.
