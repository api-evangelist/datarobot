openapi: 3.2.0
info:
  title: Datarobot Projects API
  x-refined-note:
  - x-authored-by differs across the merged source definitions and was not carried
  - x-datarobot-release-version differs across the merged source definitions and was not carried
  - x-engine differs across the merged source definitions and was not carried
  - x-evidence-tiers differs across the merged source definitions and was not carried
  - x-generated differs across the merged source definitions and was not carried
  - x-generated-from differs across the merged source definitions and was not carried
  - x-generator differs across the merged source definitions and was not carried
  - x-provenance differs across the merged source definitions and was not carried
  - x-sources differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged projects across 2 of this provider''s published API definitions: datarobot-openapi.yml, datarobot-openapi-generated.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.datarobot.com/
- url: https://cli.datarobot.com
tags:
- description: Use the endpoints described below to manage projects and their properties.
  name: Projects
paths:
  /api/v2/deletedProjects/:
    get:
      description: Retrieve a list of soft-deleted projects matching search criteria
      operationId: deletedProjects_list
      parameters:
      - description: Project or dataset name to filter by.
        in: query
        name: searchFor
        required: false
        schema:
          type: string
      - description: Creator ID to filter projects by
        in: query
        name: creator
        required: false
        schema:
          type: string
      - description: ID of organization that projects should belong to. Given project belongs to the organization the user who created the project is part of that organization.If there are no users in organization, then no projects will match the query.
        in: query
        name: organization
        required: false
        schema:
          type: string
      - description: ISO-8601 formatted date projects were deleted before
        in: query
        name: deletedBefore
        required: false
        schema:
          format: date-time
          type: string
      - description: ISO-8601 formatted date projects were deleted after
        in: query
        name: deletedAfter
        required: false
        schema:
          format: date-time
          type: string
      - description: Project ID to search
        in: query
        name: projectId
        required: false
        schema:
          type: string
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 1000
          minimum: 1
          type: integer
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Order deleted projects by
        in: query
        name: orderBy
        required: false
        schema:
          default: deletedOn
          enum:
          - projectId
          - projectName
          - datasetName
          - deletedOn
          - deletedBy
          - creator
          - -projectId
          - -projectName
          - -datasetName
          - -deletedOn
          - -deletedBy
          - -creator
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedProjectListResponse'
          description: The list of soft-deleted projects.
      summary: Retrieve the list of soft-deleted projects
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/deletedProjects/{projectId}/:
    patch:
      description: Recover (undelete) soft-deleted project.
      operationId: deletedProjects_patch
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRecover'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRecoverResponse'
          description: The recovery operation result description.
      summary: Recover soft-deleted project by project ID
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/deletedProjectsCount/:
    get:
      description: Get current number of deleted projects matching search criteria. Value is limited by DELETED_PROJECTS_BATCH_LIMIT system setting. That means that the actual amount of deleted projects can be greater than the limit, but counting will stop when reaching it.
      operationId: deletedProjectsCount_list
      parameters:
      - description: Project or dataset name to filter by.
        in: query
        name: searchFor
        required: false
        schema:
          type: string
      - description: Creator ID to filter projects by
        in: query
        name: creator
        required: false
        schema:
          type: string
      - description: ID of organization that projects should belong to. Given project belongs to the organization the user who created the project is part of that organization.If there are no users in organization, then no projects will match the query.
        in: query
        name: organization
        required: false
        schema:
          type: string
      - description: ISO-8601 formatted date projects were deleted before
        in: query
        name: deletedBefore
        required: false
        schema:
          format: date-time
          type: string
      - description: ISO-8601 formatted date projects were deleted after
        in: query
        name: deletedAfter
        required: false
        schema:
          format: date-time
          type: string
      - description: Project ID to search
        in: query
        name: projectId
        required: false
        schema:
          type: string
      - description: Count deleted projects until specified value reached.
        in: query
        name: limit
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedProjectCountResponse'
          description: Soft-deleted projects amount, current counting limit value and boolean flag to notify if an actual amount of soft-deleted projects in the system exceeds the limit value.
      summary: Count soft-deleted projects
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/hdfsProjects/:
    post:
      description: 'Create a project from an HDFS file via WebHDFS API. Represent the file using URL, optionally, port, and optionally, user/password credentials. For example, `{"url": "hdfs:///path/to/file.csv", "port": "50070"}`.'
      operationId: hdfsProjects_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HdfsProjectCreate'
      responses:
        '200':
          description: ''
      summary: Create a project
      tags:
      - Projects
      x-versionadded: v2.4
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projectCleanupJobs/:
    get:
      description: Get async status of the project permadelete job.
      operationId: projectCleanupJobs_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNukeJobListStatus'
          description: The permadelete job status with details per project.
      summary: Retrieve project permadelete job status
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    post:
      description: Add list of projects to permadelete and returns async status
      operationId: projectCleanupJobs_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectNuke'
      responses:
        '202':
          description: Location URL to check permadelete status per project
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Schedule project permadelete job
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projectCleanupJobs/{statusId}/:
    delete:
      description: Stop permadelete job, if possible.
      operationId: projectCleanupJobs_delete
      parameters:
      - description: The ID of the status object.
        in: path
        name: statusId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
      summary: Cancel scheduled project permadelete job by status ID
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    get:
      description: Get async status of the project permadelete job.
      operationId: projectCleanupJobs_retrieve
      parameters:
      - description: The ID of the status object.
        in: path
        name: statusId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNukeJobStatus'
          description: The permadelete job status with details per project.
      summary: Retrieve project permadelete job status by status ID
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projectCleanupJobs/{statusId}/download/:
    get:
      description: Get a file containing a per-project report of permanent deletion.
      operationId: projectCleanupJobsDownload_list
      parameters:
      - description: The ID of the status object.
        in: path
        name: statusId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNukeReportDownloadResponse'
          description: JSON-formatted project permadeletion report.
          headers:
            Content-Disposition:
              description: Contains an auto generated filename for this download ('attachment;filename="project_permadeletion_<statusId>.json"').
              schema:
                type: string
      summary: Download a projects permadeletion report by status ID
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projectCleanupJobs/{statusId}/summary/:
    get:
      description: Get number of projects whose deletion finished in particular state
      operationId: projectCleanupJobsSummary_list
      parameters:
      - description: The ID of the status object.
        in: path
        name: statusId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNukeJobStatusSummary'
          description: Project permanent deletion job status to occurrence count
      summary: Get a projects cleanup jobs summary by status ID
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projectClones/:
    post:
      description: 'Create a clone of an existing project.


        The resultant project will begin the initial exploratory

        data analysis and will be ready to set the target of the new project shortly.'
      operationId: projectClones_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectClone'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateResponse'
          description: Project cloning has successfully started.  See the Location header.
      summary: Clone a project
      tags:
      - Projects
      x-versionadded: v2.19
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/:
    get:
      description: List all available projects.
      operationId: projects_list
      parameters:
      - description: if provided will filter returned projects for projects with matching names
        in: query
        name: projectName
        required: false
        schema:
          type: string
      - description: if provided will filter returned projects with matching project IDs
        in: query
        name: projectId
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 100
            type: array
      - description: if provided will order the results by this field
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - projectName
          - -projectName
          type: string
      - description: Return only feature discovery projects
        in: query
        name: featureDiscovery
        required: false
        schema:
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versionadded: v2.23
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          maximum: 1000
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectDetailsResponse'
                type: array
          description: The list of projects.
      summary: List projects
      tags:
      - Projects
      x-versionadded: v2.0
      security:
      - BearerAuth: []
    post:
      description: Create a new project.
      operationId: projects_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateResponse'
          description: Creation has successfully started.  See the Location header.
        '403':
          description: User does not have permission to use specified dataset item for project.
        '404':
          description: The dataset item with the given ID or version ID is not found.
        '422':
          description: Ingest not yet completed.
      summary: Create a project
      tags:
      - Projects
      x-versionadded: v2.0
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/{projectId}/:
    delete:
      description: Delete a project.
      operationId: projects_delete
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The project has been successfully deleted.
        '409':
          description: The project is in use and cannot be deleted.
      summary: Delete a project by project ID
      tags:
      - Projects
      x-versionadded: v2.0
      security:
      - BearerAuth: []
    get:
      description: Look up a particular project.
      operationId: projects_retrieve
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRetrieveResponse'
          description: The project.
      summary: Get project by project ID
      tags:
      - Projects
      x-versionadded: v2.0
      security:
      - BearerAuth: []
    patch:
      description: 'Change project name, worker count, or unlock the holdout.

        If any of the optional json arguments are not provided,

        that aspect of the project will not be altered.'
      operationId: projects_patch
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The project was successfully updated.
      summary: Update a project by project ID
      tags:
      - Projects
      x-versionadded: v2.0
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/{projectId}/accessControl/:
    get:
      description: Get a list of users who have access to this project and their roles on the project.
      operationId: projectsAccessControl_list
      parameters:
      - description: This many results will be skipped
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned
        in: query
        name: limit
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Optional, only return the access control information for a user with this username.
        in: query
        name: username
        required: false
        schema:
          type: string
      - description: Optional, only return the access control information for a user with this user ID.
        in: query
        name: userId
        required: false
        schema:
          type: string
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingListResponse'
          description: The project's access control list.
        '404':
          description: Either the project does not exist or the user does not have permissions to view the project.
        '422':
          description: Both username and userId were specified
      summary: Get the project access control list by project ID
      tags:
      - Projects
      x-versionadded: v2.15
      security:
      - BearerAuth: []
    patch:
      description: Set roles for users on this project.
      operationId: projectsAccessControl_patchMany
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingUpdateOrRemove'
      responses:
        '204':
          description: Roles updated successfully.
        '409':
          description: The request would leave the project without an owner.
        '422':
          description: One of the users in the request does not exist, or the request is otherwise invalid
      summary: Update the project's access controls by project ID
      tags:
      - Projects
      x-versionadded: v2.15
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/{projectId}/aim/:
    patch:
      description: Start the data modeling process.
      operationId: configure_and_start_autopilot
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aim'
      responses:
        '202':
          description: Autopilot has successfully started.  See the Location header.
      summary: Start modeling by project ID
      tags:
      - Projects
      x-versionadded: v2.0
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/{projectId}/autopilot/:
    post:
      description: Pause or unpause the autopilot for a project.
      operationId: projectsAutopilot_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Autopilot'
      responses:
        '202':
          description: The request was received.
      summary: Pause by project ID
      tags:
      - Projects
      x-versionadded: v2.0
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/{projectId}/autopilots/:
    post:
      description: Start autopilot on provided featurelist.
      operationId: projectsAutopilots_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutopilotStart'
      responses:
        '201':
          description: Successfully started.
        '422':
          description: Autopilot on this featurelist has already completed or is already in progress. This status code is also returned if target was not selected for specified project.
      summary: Start autopilot by project ID
      tags:
      - Projects
      x-versionadded: v2.0
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/{projectId}/datetimePartitioning/:
    get:
      description: 'Retrieve datetime partitioning configuration


        The datetime partition object in the response describes the full partitioning parameters. Since it becomes available after the target has been fully specified and the project is ready for modeling, there are some additional fields available compared to the response from :http:post:`/api/v2/projects/(projectId)/datetimePartitioning/`.


        The available training data corresponds to all the data available for training, while the primary training data corresponds to the data that can be used to train while ensuring that all backtests are available. If a model is trained with more data than is available in the primary training data, then all backtests may not have scores available.


        All durations and datetimes will be specified in accordance with the :ref:`timestamp and duration formatting rules`.'
      operationId: projectsDatetimePartitioning_list
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalDatetimePartitioningResponse'
          description: Generated datetime partitioning.
        '422':
          description: Partitioning has not been set.
      summary: Retrieve datetime partitioning configuration by project ID
      tags:
      - Projects
      x-versionadded: v2.6
      security:
      - BearerAuth: []
    post:
      description: 'Preview the fully specified datetime partitioning generated by the requested configuration.

        DEPRECATED: Please use the optimized partitioning route instead: :http:post:`/api/v2/projects/(projectId)/optimizedDatetimePartitionings/`


        Populates the full datetime partitioning that would be used if the same arguments were passed to :http:patch:`/api/v2/projects/(projectId)/aim/` based on the requested configuration, generating defaults for all non-specified values, so that potential configurations can be tested prior to setting the target and applying a configuration.


        `useTimeSeries` controls whether a time series project should be created or a normal project that uses datetime partitioning. See :ref:`Time-Series Projects` for more detail on the differences between time series projects and datetime partitioned projects. Time-series projects are only available to some users and use the additional settings of `featureDerivationWindowStart` and `featureDerivationWindowEnd` to establish feature derivation window and `forecastWindowStart` and `forecastWindowEnd` to establish a forecast window. The overview referenced above provides more information about using feature derivation and forecast windows.


        When specifying a feature derivation window of a forecast window, the number of units it spans (end - start) must be an integer multiple of the timeStep of the datetimePartitionColumn.


        All durations and datetimes should be specified in accordance with the :ref:`timestamp and duration formatting rules`.'
      operationId: projectsDatetimePartitioning_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatetimePartitioningDataForOpenApi'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatetimePartitioningResponse'
          description: The generated datetime partitioning.
        '404':
          description: Requested feature was not found.
        '422':
          description: Partitioning generation failed.
      summary: Preview the fully specified datetime partitioning generated by the requested…
      tags:
      - Projects
      x-versionadded: v2.6
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/{projectId}/externalTimeSeriesBaselineDataValidationJobs/:
    post:
      description: This route validates if a provided catalog version id can be used as baseline for calculating metrics. This functionality is available only for time series projects.For a baseline dataset to be valid, the number of unique date amd multiseries_id columnrows must match the unique number of date and multiseries_id column rows in the uploadedtraining dataset. This functionality is limited to one forecast distance. Additionally, the catalog must be a snapshot.
      operationId: projectsExternalTimeSeriesBaselineDataValidationJobs_create
      parameters:
      - description: The project ID.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalTSBaselinePayload'
      responses:
        '202':
          description: Validate baseline data that is provided in the form of a catalog version id. We willconfirm that the dataset contains the proper date, target column, and multiseries ID column. If the provided dataset meets the criteria, the job will be successful.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '403':
          description: User does not have access to this functionality.
        '422':
          description: Unable to process the external time series baseline validation job.
      summary: Validate baseline data by project ID
      tags:
      - Projects
      x-versionadded: v2.26
      security:
      - BearerAuth: []
    servers:
    - url: https://app.datarobot.com/
  /api/v2/projects/{projectId}/externalTimeSeriesBaselineDataValidationJobs/{baselineValidationJobId}/:
    get:
      description: Retrieve information to confirm if the validation job triggered via /api/v2/projects/(projectId)/externalTimeSeriesBaselineDataValidationJobs/ is valid.
      operationId: projectsExternalTimeSeriesBaselineDataValidationJobs_retrieve
      parameters:
      - description: The project to retrieve the validation job information from.
        in: path
        name: projectId
        required: true
        schema:
          type: string
      - description: The ID for the validation job.
        in: path
        name: baselineValidationJobId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
