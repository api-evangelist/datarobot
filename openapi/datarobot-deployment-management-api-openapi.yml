openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Deployment Management API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage deployments.
  name: deployment_management
paths:
  /api/v2/customModelDeployments/:
    get:
      description: List of model deployments for user sorted by creation time descending.
      operationId: customModelDeployments_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: List of ID's of the custom model which model deployments will be retrieved.
        in: query
        name: customModelIds
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 100
            type: array
      - description: List of ID's of the execution environment which model deployments will be retrieved.
        in: query
        name: environmentIds
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 100
            type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelDeploymentListResponse'
          description: OK.
        '400':
          description: Query parameters are invalid.
      summary: List custom model deployments
      tags:
      - deployment_management
      x-versionadded: v2.24
  /api/v2/customModelDeployments/limitState/:
    get:
      description: 'Retrieve custom model deployment limit state: maximum allowed, current count, and whether the limit has been reached.'
      operationId: customModelDeploymentsLimitState_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelDeploymentsLimitsResponse'
          description: OK.
        '404':
          description: User not found or user does not have an organization.
      summary: Get custom model deployment limits
      tags:
      - deployment_management
      x-versionadded: v2.42
  /api/v2/customModelDeployments/{deploymentId}/logs/:
    get:
      description: Retrieve the logs generated during deployment of the custom model.
      operationId: customModelDeploymentsLogs_list
      parameters:
      - description: The ID of the custom model deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The response will contain a text file with the contents of the Custom Model deployment log.
          headers:
            Content-Disposition:
              description: Contains an auto generated filename of the log file ("attachment;filename=deployment-<deployment_id>.log").
              schema:
                type: string
        '404':
          description: No logs found.
      summary: Get custom model log by deployment ID
      tags:
      - deployment_management
      x-versionadded: v2.30
    post:
      description: Request logs from a custom deployed model.
      operationId: customModelDeploymentsLogs_create
      parameters:
      - description: The ID of the custom model deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelAsyncOperationResponse'
          description: 'Accepted: request placed to a queue for processing.'
          headers:
            Location:
              description: URL for tracking async job status.
              schema:
                type: string
        '404':
          description: Deployment not found or model is not a Custom Model.
        '422':
          description: Deployed model is not a Custom Model.
      summary: Create logs by ID
      tags:
      - deployment_management
      x-versionadded: v2.30
  /api/v2/customModelDeployments/{deploymentId}/logs/{logId}/:
    get:
      description: Retrieve the logs generated during predictions on the deployed custom model.
      operationId: customModelDeploymentsLogs_retrieve
      parameters:
      - description: The ID of the custom model deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: The ID of the custom model deployment log.
        in: path
        name: logId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The response will contain a text file with the contents of the Custom Model deployment log.
          headers:
            Content-Disposition:
              description: Contains an auto generated filename of the log file ("attachment;filename=deployment-<deployment_id>.log").
              schema:
                type: string
        '404':
          description: No logs found.
      summary: Retrieve logs by ID
      tags:
      - deployment_management
      x-versionadded: v2.30
  /api/v2/deletedDeployments/:
    get:
      description: List deleted deployments.Only available as part of an enterprise (on-prem) installation. Requires a CAN_DELETE_APP_PROJECTS permission to execute.
      operationId: deletedDeployments_list
      parameters:
      - description: The number of deleted deployments to skip.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of deleted deployments to return.
        in: query
        name: limit
        required: true
        schema:
          default: 20
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedDeploymentListResponse'
          description: The deleted deployments
      summary: List deleted deployments
      tags:
      - deployment_management
      x-versionadded: v2.21
    patch:
      description: Permanently erase data for deleted deployments. Only available as part of an on-premise or private/hybrid cloud deployment. Requires a CAN_DELETE_APP_PROJECTS permission to execute.
      operationId: deletedDeployments_patchMany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentPermanentDelete'
      responses:
        '202':
          description: Job submitted. See Location header.
          headers:
            Location:
              description: URL for tracking deployment permanently erase job status.
              schema:
                type: string
      summary: Erase deleted deployments
      tags:
      - deployment_management
      x-versionadded: v2.21
  /api/v2/deployments/:
    get:
      description: List deployments a user can view.
      operationId: deployments_list
      parameters:
      - description: The number of deployments to skip. Defaults to 0.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of deployments (greater than zero, max 100) to return. Defaults to 20.
        in: query
        name: limit
        required: true
        schema:
          default: 20
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: The order to sort the deployments.Defaults to order by deployment last prediction timestamp in descending order.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - label
          - -label
          - serviceHealth
          - -serviceHealth
          - modelHealth
          - -modelHealth
          - accuracyHealth
          - -accuracyHealth
          - recentPredictions
          - -recentPredictions
          - lastPredictionTimestamp
          - -lastPredictionTimestamp
          - currentModelDeployedTimestamp
          - -currentModelDeployedTimestamp
          - createdAtTimestamp
          - -createdAtTimestamp
          - importance
          - -importance
          - fairnessHealth
          - -fairnessHealth
          - customMetricsHealth
          - -customMetricsHealth
          - actualsTimelinessHealth
          - -actualsTimelinessHealth
          - predictionsTimelinessHealth
          - -predictionsTimelinessHealth
          type: string
        x-versionadded: v2.18
      - description: Case insensitive search against deployment's label and description.
        in: query
        name: search
        required: false
        schema:
          maxLength: 100
          type: string
        x-versionadded: v2.18
      - description: Filters deployments by their service health status.
        in: query
        name: serviceHealth
        required: false
        schema:
          items:
            enum:
            - failing
            - not_started
            - passing
            - unavailable
            - unknown
            - warning
            type: string
          type: array
        x-versionadded: v2.20
      - description: Filters deployments by their model health status.
        in: query
        name: modelHealth
        required: false
        schema:
          items:
            enum:
            - failing
            - not_started
            - passing
            - unavailable
            - unknown
            - warning
            type: string
          type: array
        x-versionadded: v2.20
      - description: Filters deployments by their accuracy health status.
        in: query
        name: accuracyHealth
        required: false
        schema:
          items:
            enum:
            - failing
            - not_started
            - passing
            - unavailable
            - unknown
            - warning
            type: string
          type: array
        x-versionadded: v2.20
      - description: Filter deployments to only those that the authenticated user has the specified role for.
        in: query
        name: role
        required: false
        schema:
          enum:
          - OWNER
          - USER
          type: string
        x-versionadded: v2.20
      - description: Filters deployments by their status
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - active
            - archived
            - errored
            - inactive
            - launching
            - replacingModel
            - stopping
            type: string
          type: array
        x-versionadded: v2.25
      - description: Filters deployments by their importance
        in: query
        name: importance
        required: false
        schema:
          items:
            enum:
            - CRITICAL
            - HIGH
            - MODERATE
            - LOW
            type: string
          type: array
        x-versionadded: v2.21
      - description: Only include deployments that have had a prediction request on or after the specified timestamp.
        in: query
        name: lastPredictionTimestampStart
        required: false
        schema:
          format: date-time
          type: string
        x-versionadded: v2.23
      - description: Only include deployments that have had a prediction request before the specified timestamp.
        in: query
        name: lastPredictionTimestampEnd
        required: false
        schema:
          format: date-time
          type: string
        x-versionadded: v2.23
      - description: only include deployments that have had more than the specified number of predictions per day on average over the past week.
        in: query
        name: predictionUsageDailyAvgGreaterThan
        required: false
        schema:
          minimum: 0
          type: integer
        x-versionadded: v2.23
      - description: Only include deployments that have had fewer than the specified number of predictions per day on average over the past week.
        in: query
        name: predictionUsageDailyAvgLessThan
        required: false
        schema:
          exclusiveMinimum: 0
          type: integer
        x-versionadded: v2.23
      - description: Filter deployments to those whose default prediction server has the specified id.
        in: query
        name: defaultPredictionServerId
        required: false
        schema:
          items:
            type: string
          type: array
        x-versionadded: v2.23
      - description: Filter deployments based on the type of their current model's build environment type.
        in: query
        name: buildEnvironmentType
        required: false
        schema:
          items:
            enum:
            - DataRobot
            - Python
            - R
            - Java
            - Julia
            - Legacy
            - Other
            type: string
          type: array
        x-versionadded: v2.21
      - description: Filter deployments based on the type of their execution environment.
        in: query
        name: executionEnvironmentType
        required: false
        schema:
          items:
            enum:
            - datarobot
            - external
            type: string
          type: array
        x-versionadded: v2.20
      - description: Filter deployments based on prediction environment platform
        in: query
        name: predictionEnvironmentPlatform
        required: false
        schema:
          items:
            enum:
            - aws
            - gcp
            - azure
            - onPremise
            - datarobot
            - datarobotServerless
            - openShift
            - other
            - snowflake
            - sapAiCore
            type: string
          type: array
        x-versionadded: v2.22
      - description: Filter deployments to those created by the current user.
        in: query
        name: createdByMe
        required: false
        schema:
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versionadded: v2.29
      - description: Filters deployments by those created by the given user.
        in: query
        name: createdBy
        required: false
        schema:
          type: string
        x-versionadded: v2.34
      - description: Filter deployments by the execution type of the champion model.
        in: query
        name: championModelExecutionType
        required: false
        schema:
          enum:
          - custom_inference_model
          - external
          - dedicated
          type: string
        x-versionadded: v2.34
      - description: 'Filter deployments by the target type of the champion model. Example: Binary'
        in: query
        name: championModelTargetType
        required: false
        schema:
          type: string
      - description: List of tag keys to filter for. If multiple values are specified, deployments with tags that match any of the values will be returned.
        in: query
        name: tagKeys
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 10
            type: array
        x-versionadded: v2.35
      - description: List of tag values to filter for. If multiple values are specified, deployments with tags that match any of the values will be returned.
        in: query
        name: tagValues
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 10
            type: array
        x-versionadded: v2.35
      - description: Filter deployments by whether the deployment is an A2A agent. When true, returns only deployments that are A2A agents. When false, returns only deployments that are not A2A agents.
        in: query
        name: isA2AAgent
        required: false
        schema:
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-datarobot-public-preview: false
        x-datarobot-required-feature-flags:
        - description: Enables the creation, management, and utilization of a vector database-augmented LLM solution, allowing organizations to use their content to experiment and leverage GenAI for a specific use case.
          enabled_by_default: false
          maturity: GA_PREMIUM
          name: GENAI_EXPERIMENTATION
        x-versionadded: v2.43.0
      - description: List of tag keys. If specified, only deployments with prediction environments that have tags matching any of the keys will be returned.
        in: query
        name: predictionEnvironmentTagKeys
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 10
            type: array
        x-versionadded: v2.44
      - description: List of tag values. If specified, only deployments with prediction environments that have tags matching any of the values will be returned.
        in: query
        name: predictionEnvironmentTagValues
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 10
            type: array
        x-versionadded: v2.44
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentListResponse'
          description: The deployments
      summary: List deployments
      tags:
      - deployment_management
      x-versionadded: v2.17
  /api/v2/deployments/fromLearningModel/:
    post:
      description: 'Create a deployment from a DataRobot model.


        DEPRECATED in v2.37: Register the Leaderboard model with `POST /api/v2/modelPackages/fromLeaderboard/`.


        Use the following route to create a deployment `POST /api/v2/deployments/fromModelPackage/`.'
      operationId: deploymentsFromLearningModel_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreateFromLearningModel'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentCreateResponse'
          description: Deployment successfully created.
        '403':
          description: User does not have permission to create a deployment.
        '409':
          description: User's organization has reached the maximum number of deployments.
        '422':
          description: Unable to process the deployment creation request.
      summary: Create deployment
      tags:
      - deployment_management
      x-versionadded: v2.17
  /api/v2/deployments/fromModelPackage/:
    post:
      description: Create a deployment from a model package.
      operationId: deploymentsFromModelPackage_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreateFromModelPackage'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentCreateResponse'
          description: Job submitted. The URL at the Location header can be used to track when the deployment is ready for predictions.
          headers:
            Location:
              description: URL for tracking async job status.
              schema:
                type: string
        '422':
          description: Unable to process the deployment creation request.
      summary: Create a deployment from a model package
      tags:
      - deployment_management
      x-versionadded: v2.37
  /api/v2/deployments/limits/:
    get:
      description: Fetch deployment limit information.
      operationId: deploymentsLimits_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentGetLimitsResponse'
          description: The deployment limits.
      summary: Get deployment limits
      tags:
      - deployment_management
      x-versionadded: v2.43
  /api/v2/deployments/migrateDPStoServerless/:
    post:
      description: Update a deployment's prediction environment from dedicated to serverless.
      operationId: deploymentsMigrateDPStoServerless_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentPredictionEnvironmentUpdate'
      responses:
        '204':
          description: Deployment successfully updated.
      summary: Update a deployment's prediction environment from dedicated
      tags:
      - deployment_management
      x-versionadded: v2.38
  /api/v2/deployments/{deploymentId}/:
    delete:
      description: Delete a deployment.
      operationId: deployments_delete
      parameters:
      - description: Do not wait for management agent to delete the deployment first.
        in: query
        name: ignoreManagementAgent
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deployment successfully deleted.
        '422':
          description: Unable to process the request.
      summary: Delete deployment by deployment ID
      tags:
      - deployment_management
      x-versionadded: v2.17
    get:
      description: Retrieve a deployment.
      operationId: deployments_retrieve
      parameters:
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRetrieveResponse'
          description: The deployment
      summary: Retrieve deployment by deployment ID
      tags:
      - deployment_management
      x-versionadded: v2.17
    patch:
      description: Update a deployment's label and description.
      operationId: deployments_patch
      parameters:
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentUpdate'
      responses:
        '204':
          description: Deployment successfully updated
      summary: Update deployment by deployment ID
      tags:
      - deployment_management
      x-versionadded: v2.19
  /api/v2/deployments/{deploymentId}/agentCard/:
    delete:
      description: Delete the agent card associated with an external agent deployment. This operation is idempotent - returns 204 even if no agent card exists.
      operationId: deploymentsAgentCard_deleteMany
      parameters:
      - description: The ID of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: Deployment not found.
        '405':
          description: Agent card deletion is only allowed for external deployments.
      summary: Delete the agent card by deployment ID
      tags:
      - deployment_management
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the creation, management, and utilization of a vector database-augmented LLM solution, allowing organizations to use their content to experiment and leverage GenAI for a specific use case.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: GENAI_EXPERIMENTATION
      x-versionadded: v2.44
    get:
      description: Retrieve the agent card associated with an agent deployment. The agent card is returned by this route as it was returned by the agent during deployment creation or as it was uploaded to DataRobot.
      operationId: deploymentsAgentCard_list
      parameters:
      - description: The ID of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agent card for the deployment.
        '404':
          description: No agent card found for this deployment.
      summary: Retrieve the agent card by deployment ID
      tags:
      - deployment_management
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the creation, management, and utilization of a vector database-augmented LLM solution, allowing organizations to use their content to experiment and leverage GenAI for a specific use case.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: GENAI_EXPERIMENTATION
      x-versionadded: v2.44
    put:
      description: Upload the agent card for an agent deployment. The request body must be the agent card document as a JSON object. If an agent card already exists for this deployment it will be replaced. This operation is only supported for external deployments. For DataRobot hosted deployments, the agent card document is pulled automatically from the deployment.
      operationId: deploymentsAgentCard_putMany
      parameters:
      - description: The ID of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The stored agent card for the deployment.
        '413':
          description: The agent card exceeds the maximum allowed size.
        '422':
          description: Agent card upload is only supported for external deployments.
      summary: Create by deployment ID
      tags:
      - deployment_management
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables the creation, management, and utilization of a vector database-augmented LLM solution, allowing organizations to use their content to experiment and leverage GenAI for a specific use case.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: GENAI_EXPERIMENTATION
      x-versionadded: v2.44
  /api/v2/deployments/{deploymentId}/capabilities/:
    get:
      description: Retrieve the capabilities for the deployment.
      operationId: deploymentsCapabilities_list
      parameters:
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentCapabilitiesRetrieveResponse'
          description: ''
      summary: Retrieve capabilities by deployment ID
      tags:
      - deployment_management
      x-versionadded: v2.29
  /api/v2/deployments/{deploymentId}/features/:
    get:
      description: Retrieve features contained within the universe dataset associated with a specific deployment. By default, this returns all raw features required for predictions.
      operationId: deploymentsFeatures_list
      parameters:
      - description: The number of features to skip, defaults to 0.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of features to return, defaults to 0.
        in: query
        name: limit
        required: true
        schema:
          default: 50
          minimum: 0
          type: integer
      - description: When True will return all raw features in the universe dataset associated with the deployment, and when False will return only those raw features used to make predictions on the deployment.
        in: query
        name: includeNonPredictionFeatures
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versionadded: v2.20
      - description: When True, features returned will be filtered to those usable for segmented analysis.
        in: query
        name: forSegmentedAnalysis
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Case insensitive search against names of the deployment's features.
        in: query
        name: search
        required: false
        schema:
          maxLength: 100
          type: string
        x-versionadded: v2.24
      - description: The sort order to apply to the list of features. Prefix the attribute name with a dash to sort in descending order, e.g., "-name".
        in: query
        name: orderBy
        required: false
        schema:
          enum:
