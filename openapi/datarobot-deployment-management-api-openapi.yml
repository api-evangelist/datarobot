          - SettingsChallengers
          - SETTINGS_CHALLENGERS
          - settingsPredictions
          - SettingsPredictions
          - SETTINGS_PREDICTIONS
          - settingsRetraining
          - SettingsRetraining
          - SETTINGS_RETRAINING
          - settingsUsage
          - SettingsUsage
          - SETTINGS_USAGE
          - settingsDataExploration
          - SettingsDataExploration
          - SETTINGS_DATA_EXPLORATION
          - settingsNotifications
          - SettingsNotifications
          - SETTINGS_NOTIFICATIONS
