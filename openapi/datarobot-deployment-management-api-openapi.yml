  /api/v2/deployments/{deploymentId}/scoringCode/:
    get:
      description: 'Retrieve Scoring Code of the current deployed model for making predictions outside of a DataRobot prediction server.

        You need the "Scoring Code" feature enabled to use this route.


        By default, returns a compiled executable JAR that can be executed locally to calculate model predictions, or it can be used as a library for a Java application. Execute it with the ''--help` parameters to learn how to use it as a command-line utility.

        See model API documentation at https://javadoc.io/doc/com.datarobot/datarobot-prediction/latest/index.html to be able to use it inside an existing Java application.


        With sourceCode query parameter set to ''true'', returns a source code archive that can be used to review internal calculations of the model.

        This JAR is NOT executable.


        See "https://docs.datarobot.com/en/docs/predictions/port-pred/scoring-code/index.html" documentation in DataRobot application for more information.


        *Note*

        Cannot retrieve source code if agent is included.'
      operationId: deploymentsScoringCode_list
      parameters:
      - description: Whether source code or binary of the Scoring Code will be retrieved
        in: query
        name: sourceCode
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Whether the Scoring code retrieved will include tracking agent
        in: query
        name: includeAgent
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Please use includePredictionExplanations parameter instead
        in: query
        name: includePe
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versiondeprecated: v2.28
      - description: Whether the Scoring Code retrieved will include prediction explanations
        in: query
        name: includePredictionExplanations
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versionadded: v2.28
      - description: Whether the Scoring Code retrieved will include prediction intervals
        in: query
        name: includePredictionIntervals
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versionadded: v2.28
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
