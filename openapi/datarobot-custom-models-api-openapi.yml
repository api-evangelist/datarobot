openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Custom Models API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Assemble, test and deploy your own custom model with a custom environment.
  name: custom_models
paths:
  /api/v2/customInferenceImages/{imageId}/featureImpact/:
    get:
      description: 'Retrieve feature impact scores for features in a custom inference model image.


        .. minversion:: v2.23

        DEPRECATED: please use version route instead:

        :http:get:`/api/v2/customModels/(customModelId)/versions/(customModelVersionId)/featureImpact/`


        This route is a counterpart of a corresponding endpoint for native models:

        :http:get:`/api/v2/projects/(projectId)/models/(modelId)/featureImpact/`'
      operationId: customInferenceImagesFeatureImpact_list
      parameters:
      - description: ID of the image of the custom inference model to retrieve feature impact from.
        in: path
        name: imageId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureImpactResponse'
          description: Custom model feature impact returned.
        '404':
          description: No feature impact data found for custom model.
        '422':
          description: 'Cannot retrieve feature impact scores: (1) if custom model is not an inference model, (2) if training data is not assigned, (3) if feature impact job is in progress for custom model.'
      summary: Get custom model feature impact by image ID
      tags:
      - custom_models
      x-versionadded: v2.20
    post:
      description: 'Add a request to calculate feature impact for a custom inference model image to the queue.


        .. minversion:: v2.23

        DEPRECATED: please use version route instead:

        :http:post:`/api/v2/customModels/(customModelId)/versions/(customModelVersionId)/featureImpact/`


        This route is a counterpart of a corresponding endpoint for native models:

        :http:post:`/api/v2/projects/(projectId)/models/(modelId)/featureImpact/`'
      operationId: customInferenceImagesFeatureImpact_create
      parameters:
      - description: ID of the image of the custom inference model to submit feature impact job for.
        in: path
        name: imageId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureImpactCreatePayload'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureImpactCreateResponse'
          description: Feature impact request has been successfully submitted.
          headers:
            Location:
              description: 'Contains a url for tracking job status: :http:get:`/api/v2/status/(statusId)/`.'
              schema:
                type: string
        '404':
          description: If feature impact has already been submitted. The response will include `jobId` property which can be used for tracking its progress.
        '422':
          description: 'If job cannot be submitted because of invalid input or model state: (1) if image id does not correspond to a custom inference model, (2) if training data is not yet assigned or assignment is in progress, (3) if the `rowCount` exceeds the minimum or maximum value for this model''s training data.'
      summary: Create custom model feature impact by image ID
      tags:
      - custom_models
      x-versionadded: v2.20
  /api/v2/customModelLimits/:
    get:
      description: Retrieve custom model resource limits the user has access to.
      operationId: customModelLimits_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelResourceLimits'
          description: OK.
      summary: Get custom model resource limits
      tags:
      - custom_models
      x-versionadded: v2.24
  /api/v2/customModelTests/:
    get:
      description: Retrieve the testing history for a model.
      operationId: customModelTests_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 1000
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: 'A single identifier that represents a bundle of resources: Memory, CPU, GPU, etc. A list of available bundles can be obtained via the resource bundles endpoint.'
        in: query
        name: resourceBundleId
        required: false
        schema:
          type:
          - string
          - 'null'
        x-versionadded: v2.33
      - description: The maximum memory that might be allocated by the custom-model. If exceeded, the custom-model will be killed. This setting is incompatible with setting the resourceBundleId.
        in: query
        name: maximumMemory
        required: false
        schema:
          maximum: 15032385536
          minimum: 134217728
          type:
          - integer
          - 'null'
      - description: Network egress policy.
        in: query
        name: networkEgressPolicy
        required: false
        schema:
          enum:
          - NONE
          - PUBLIC
          type:
          - string
          - 'null'
      - description: The amount of memory that is expected to be allocated by the custom model. This setting is incompatible with setting the resourceBundleId.
        in: query
        name: desiredMemory
        required: false
        schema:
          maximum: 15032385536
          minimum: 134217728
          type:
          - integer
          - 'null'
        x-versiondeprecated: v2.24
      - description: A fixed number of replicas that will be set for the given custom-model.
        in: query
        name: replicas
        required: false
        schema:
          exclusiveMinimum: 0
          maximum: 25
          type:
          - integer
          - 'null'
      - description: Require all custom model replicas to be deployed on different Kubernetes nodes for predictions fault tolerance.
        in: query
        name: requiresHa
        required: false
        schema:
          type:
          - boolean
          - 'null'
        x-versionadded: v2.26
      - description: ID of the Custom Model to retrieve testing history for.
        in: query
        name: customModelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelTestsListResponse'
          description: OK.
      summary: List custom model tests
      tags:
      - custom_models
      x-versionadded: v2.24
    post:
      description: Test a custom inference model. This will start a job to check that the custom model can make predictions against the supplied dataset without breaking.
      operationId: customModelTests_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelTests'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelAsyncOperationResponse'
          description: Model testing job successfully started.
          headers:
            Location:
              description: URL that can be polled to check the status.
              schema:
                type: string
        '403':
          description: No access to use data for testing custom model.
        '404':
          description: Custom model or dataset not found.
        '422':
          description: 'Custom Model Testing cannot be submitted because of invalid input or model state: (1) if user does not have permission to create legacy conversion environment, (2) testing is already in progress for the custom model, (3) dataset used for testing is not snapshotted,(4) other cases.'
      summary: Create custom model test
      tags:
      - custom_models
      x-versionadded: v2.24
  /api/v2/customModelTests/{customModelTestId}/:
    delete:
      description: Cancel custom inference model testing.
      operationId: customModelTests_delete
      parameters:
      - description: ID of the testing history attempt.
        in: path
        name: customModelTestId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Testing canceled.
        '404':
          description: Testing attempt not found.
        '409':
          description: Testing attempt has already reached a terminal state.
      summary: Cancel custom model test by custom model test ID
      tags:
      - custom_models
      x-versionadded: v2.24
    get:
      description: Retrieve a specific testing history entry for a custom model.
      operationId: customModelTests_retrieve
      parameters:
      - description: ID of the testing history attempt.
        in: path
        name: customModelTestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelTestsResponse'
          description: OK.
      summary: Get custom model test by custom model test ID
      tags:
      - custom_models
      x-versionadded: v2.24
  /api/v2/customModelTests/{customModelTestId}/log/:
    get:
      description: Retrieve the logs from a model testing attempt.
      operationId: customModelTestsLog_list
      parameters:
      - description: ID of the testing history attempt.
        in: path
        name: customModelTestId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The log file will be downloaded.
          headers:
            Content-Disposition:
              description: Contains an auto generated filename for this download ("attachment;filename=testing-<custom_model_id>.log").
              schema:
                type: string
        '404':
          description: No testing log found.
      summary: Get custom model test log by custom model test ID
      tags:
      - custom_models
      x-versionadded: v2.24
  /api/v2/customModelTests/{customModelTestId}/tail/:
    get:
      description: Retrieve the last N lines of logs from a model testing attempt.
      operationId: customModelTestsTail_list
      parameters:
      - description: Number of lines from the log to retrieve (1-1000, default 100).
        in: query
        name: lines
        required: true
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: ID of the testing history attempt.
        in: path
        name: customModelTestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelTestsLogTailResponse'
          description: The log tail was retrieved.
        '400':
          description: Requested number of lines is invalid.
        '404':
          description: The testing history entry cannot be found.
      summary: Get custom model test log tail by custom model test ID
      tags:
      - custom_models
      x-versionadded: v2.24
  /api/v2/customModels/:
    get:
      description: Retrieve metadata for all custom models the user has access to.
      operationId: customModels_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 1000
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: If "training" specified, only Custom Training Tasks will be returned. If "inference" specified, only Custom Inference Models will be returned. If not specified, all custom models will be returned. After deprecation, only Custom Inference Models will be returned
        in: query
        name: customModelType
        required: false
        schema:
          enum:
          - training
          - inference
          type: string
        x-versiondeprecated: '2.28'
      - description: The target type of the custom model.
        in: query
        name: targetType
        required: false
        schema:
          enum:
          - Binary
          - Regression
          - Multiclass
          - Anomaly
          - Transform
          - TextGeneration
          - GeoPoint
          - Unstructured
          - VectorDatabase
          - AgenticWorkflow
          - MCP
          - Multilabel
          type: string
        x-versionadded: v2.36
      - description: If TRUE, only deployed custom models will be returned. If FALSE, only not deployed custom models will be returned. If not specified, all custom models will be returned.
        in: query
        name: isDeployed
        required: false
        schema:
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Sort order which will be applied to custom model list, valid options are "created", "updated". Prefix the attribute name with a dash to sort in descending order, e.g. orderBy="-created". By default, the orderBy parameter is None which will result in custom models being returned in order of creation time descending.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - created
          - -created
          - updated
          - -updated
          type: string
      - description: String to search for occurrence in custom model's description, language and name. Search is case insensitive. If not specified, all custom models will be returned.
        in: query
        name: searchFor
        required: false
        schema:
          maxLength: 10000
          type: string
      - description: List of tag keys to filter by.
        in: query
        name: tagKeys
        required: false
        schema:
          type: string
      - description: List of tag values to filter by.
        in: query
        name: tagValues
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelListResponse'
          description: OK.
      summary: List custom models
      tags:
      - custom_models
      x-versionadded: v2.24
    post:
      description: 'Creates a new custom model and returns the newly created metadata record for it.


        All custom models must support at least one target type (binaryClassification, regression).

        Custom inference models can only support a single target type. A regression model is

        expected to produce predictions that are arbitrary floating-point or integer numbers.

        A classification model is expected to return predictions with probability scores for each

        class. For example, a binary classification model might return:


        .. code:: Python


        {

        positiveClassLabel: probability,

        negativeClassLabel: 1.0 - probability

        }


        For Custom Inference Models, the ``file`` parameter must be either a tarball or zip archive

        containing, at minimum,

        a script named ``start_server.sh``. It may contain additional files, including scripts and

        precompiled binaries as well as data files. ``start_server.sh`` may execute these scripts

        and/or binaries. When this script is executed, it is run as part of an Environment

        (specified via subsequent API calls), and all included scripts and binaries

        can take advantage of any programming language interpreters, compilers, libraries,

        or other tools included in the Environment. ``start_server.sh`` must be marked as executable

        (``chmod +x``).


        When ``start_server.sh`` is launched, it must launch and maintain

        (in the foreground) a Web server that listens on two URLs:


        * ``GET $URL_PREFIX/``

        This route must return a 200 response code with an empty body immediately

        if the server is ready to respond to prediction requests. Otherwise it should

        either not accept the request, not respond to the request, or return a

        503 response code.

        * ``POST $URL_PREFIX/predict_no_state/``

        This route must accept as input a JSON object of the form:


        .. code-block:: Python


        {

        ''X'': {

        ''col1'': [...col1_data...],

        ''col2'': [...col2_data...],

        ''col3'': [...col3_data...],

        ...

        }

        }


        The data lists will all be the same length.


        It must return a JSON object of the form:


        .. code-block:: Python


        {

        ''predictions'': [...predictions data...]

        }


        The predictions data must correspond 1:1 to the rows in the input data lists.


        ``$URL_PREFIX`` is provided as an environment variable. The Web server process must

        re-read its value every time the process starts, as it may change.

        It is an opaque string that is guaranteed to be a valid URL component,

        but may contain path separators (``/``).'
      operationId: customModels_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelResponse'
          description: Created.
        '403':
          description: Custom model creation is not enabled.
        '422':
          description: Input parameters are invalid.
      summary: Create custom model
      tags:
      - custom_models
      x-versionadded: v2.24
  /api/v2/customModels/fromCustomModel/:
    post:
      description: Creates a copy of the provided custom model, including metadata, versions of that model, and uploaded files. Associates the new versions with files owned by the custom model.
      operationId: customModelsFromCustomModel_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelCopy'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelResponse'
          description: Successfully created copy.
      summary: Clone custom model
      tags:
      - custom_models
      x-versionadded: v2.24
  /api/v2/customModels/fromModelTemplate/:
    post:
      description: Create a custom model from a template.
      operationId: customModelsFromModelTemplate_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelCreateFromTemplatePayload'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelCreateFromTemplateResponse'
          description: Custom model created from template
        '403':
          description: UXR Custom Model Workshop is not enabled.
        '422':
          description: Invalid template data.
      summary: Create a custom model
      tags:
      - custom_models
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables creating NVIDIA NIM models from templates in the Registry.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: NIM_MODELS
      x-versionadded: v2.36
  /api/v2/customModels/predictionExplanationsInitialization/:
    post:
      description: 'Create a new prediction explanations initialization for custom model.

        This is a necessary prerequisite for generating prediction explanations.


        .. minversion:: v2.23

        DEPRECATED please use custom model version route instead:

        :http:post:`/api/v2/customModels/(customModelId)/versions/(customModelVersionId)/predictionExplanationsInitialization/`'
      operationId: customModelsPredictionExplanationsInitialization_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelPredictionExplanations'
      responses:
        '202':
          description: The request was accepted and will be worked on.
          headers:
            Location:
              description: URL to poll to track the prediction explanation initialization has finished.
              schema:
                type: string
        '422':
          description: Specified custom model is not valid for prediction explanations.
      summary: Create a new prediction explanations initialization
      tags:
      - custom_models
      x-versionadded: v2.22
  /api/v2/customModels/{customModelId}/:
    delete:
      description: Delete a custom model. Only users who have permission to edit custom model can delete it. Only custom models which are not currently deployed or undergoing custom model testing can be deleted.
      operationId: customModels_delete
      parameters:
      - description: The ID of the custom model.
        in: path
        name: customModelId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Record deleted.
        '409':
          description: This custom model is currently deployed and cannot be deleted. The response body will contain link where those deployments can be retrieved.
      summary: Delete custom model by custom model ID
      tags:
      - custom_models
      x-versionadded: v2.24
    get:
      description: Retrieve metadata for a custom model.
      operationId: customModels_retrieve
      parameters:
      - description: The ID of the custom model.
        in: path
        name: customModelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelResponse'
          description: OK.
      summary: Get custom model by custom model ID
      tags:
      - custom_models
      x-versionadded: v2.24
    patch:
      description: 'Updates metadata for an existing custom model.


        All custom models must support at least one target type (binaryClassification, regression).

        Custom inference models can only support a single target type.


        Setting `positiveClassLabel` and `negativeClassLabel` to null will set

        the labels to their default values (1 and 0 for positiveClassLabel and negativeClassLabel,

        respectively).


        Setting `positiveClassLabel`, `negativeClassLabel`, ''targetName` is disabled if model

        has active deployments or assigned training data.'
      operationId: customModels_patch
      parameters:
      - description: The ID of the custom model.
        in: path
        name: customModelId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelUpdate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelResponse'
          description: Created.
        '403':
          description: Custom inference model modification is not enabled for the user.
        '409':
          description: Custom model cannot be updated while it is being validated or some fields cannot be updated after deployment or assigning training data.
        '422':
          description: Input parameters are invalid.
      summary: Update custom model by custom model ID
      tags:
      - custom_models
      x-versionadded: v2.24
  /api/v2/customModels/{customModelId}/accessControl/:
    get:
      description: Get a list of users who have access to this custom model and their roles on it.
      operationId: customModelsAccessControl_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 1000
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: The ID of the custom model.
        in: path
        name: customModelId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelAccessControlListResponse'
          description: A list of users who have access to this custom model and their roles on it.
        '400':
          description: Both username and userId were specified.
      summary: Get a list of users who have access by custom model ID
      tags:
      - custom_models
      x-versionadded: v2.25
    patch:
      description: Grant access or update roles for users on this custom model and appropriate learning data. Up to 100 user roles may be set in a single request.
      operationId: customModelsAccessControl_patchMany
      parameters:
      - description: The ID of the custom model.
        in: path
        name: customModelId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingUpdateOrRemoveWithGrant'
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelAccessControlUpdateResponse'
          description: Roles updated successfully.
        '409':
          description: The request would leave the custom model without an owner.
        '422':
          description: One of the users in the request does not exist, or the request is otherwise invalid.
      summary: Grant access or update roles by custom model ID
      tags:
      - custom_models
      x-versionadded: v2.25
  /api/v2/customModels/{customModelId}/download/:
    get:
      description: Download the latest item bundle from a custom model as a zip compressed archive.
      operationId: customModelsDownload_list
      parameters:
      - description: Download model version from PPS tab.If "true" specified, model archive includes dependencies install script. If "false" specified, dependencies script is not included. If not specified -> "false" behavior.
        in: query
        name: pps
        required: false
        schema:
          default: 'False'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: The ID of the custom model.
        in: path
        name: customModelId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The download succeeded.
          headers:
            Content-Disposition:
              description: Contains an auto generated filename for this download ("attachment;filename=model-<model_id>-version-<version_id>.zip").
              schema:
                type: string
      summary: Download the latest custom model version content by custom model ID
      tags:
      - custom_models
      x-versionadded: v2.22
  /api/v2/customModels/{customModelId}/trainingData/:
    patch:
      description: 'The current API is deprecated and scheduled for removal in v2.34. Training data assignment is implemented in CustomModelVersionCreateController and CustomModelVersionCreateFromLatestController.


        Assigns the specified dataset to the specified custom model as training data.

        For each of the custom model''s deployments, the training data from the specified project

        provides a baseline to enable drift tracking.

        The API is disabled and returns HTTP 422

        when a custom model is converted to assign training data at the version level. See isTrainingDataForVersionsPermanentlyEnabled parameter for :http:post:`/api/v2/customModels/` and :http:patch:`/api/v2/customModels/(customModelId)/`

        Use training data assignment at the version level: :http:post:`/api/v2/customModels/(customModelId)/versions/` :http:patch:`/api/v2/customModels/(customModelId)/versions/`'
      operationId: customModelsTrainingData_patchMany
      parameters:
      - description: The ID of the custom model.
        in: path
        name: customModelId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeprecatedTrainingDataForModelsAssignment'
      responses:
        '202':
          description: The request was accepted and will be worked on.
          headers:
            Location:
              description: URL to poll to track the training data assignment has finished.
              schema:
                type: string
        '409':
          description: Custom model has assigned training data already and is deployed.
        '410':
          description: The requested Dataset has been deleted.
        '422':
          description: Dataset ingest must finish before assigning training data or provided dataset is incompatible with the custom model.
      summary: Assign training data by custom model ID
      tags:
      - custom_models
      x-versionadded: v2.24
