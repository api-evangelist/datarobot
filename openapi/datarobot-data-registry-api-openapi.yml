components:
  schemas:
    DatasetAccessSet:
      properties:
        applyGrantToLinkedObjects:
          default: false
          description: If `true` for any users being granted access to the entity, grant the user read access to any linked objects such as `DataSources` and `DataStores` that may be used by this entity. Ignored if no such objects are relevant for the entity. This will not result in access being lowered for a user if the user already has higher access to linked objects than read access. However, if the target user does not have sharing permissions to the linked object, they will be given sharing access without lowering existing permissions. May result in an error if the user making the call does not have sufficient permissions to complete the grant. Default value is false.
          type: boolean
        data:
          description: array of DatasetAccessControl objects.
          items:
            $ref: '#/components/schemas/DatasetAccessInner'
          minItems: 1
          type: array
      required:
      - data
      type: object
    ColnameAndType:
      properties:
        colname:
          description: The column name.
          type: string
        hex:
          description: A safe hex representation of the column name.
          type: string
        type:
          description: The data type of the column.
          type: string
      required:
      - colname
      - hex
      - type
      type: object
    SharedRolesBoundedListResponse:
      properties:
        count:
          description: The number of items returned on this page.
          type: integer
        data:
          description: The list of SharedRoles objects.
          items:
            $ref: '#/components/schemas/SharedRolesResponse'
          maxItems: 100
          type: array
        next:
          description: The URL of the next page (if null, there is no next page).
          format: uri
          type:
          - string
          - 'null'
        previous:
          description: The URL of the previous page (if null, there is no previous page).
          format: uri
          type:
          - string
          - 'null'
        totalCount:
          description: The total number of items across all pages.
          type: integer
      required:
      - data
      - next
      - previous
      - totalCount
      type: object
      x-versionadded: v2.45
    BulkCatalogSharePayload:
      properties:
        action:
          description: The action to execute on the datasets. Has to be 'updateRoles' for this payload.
          enum:
          - updateRoles
          type: string
        applyGrantToLinkedObjects:
          default: false
          description: If `true` for any users being granted access to the entity, grant the user read access to any linked objects such as `DataSources` and `DataStores` that may be used by this entity. Ignored if no such objects are relevant for the entity. This will not result in access being lowered for a user if the user already has higher access to linked objects than read access. However, if the target user does not have sharing permissions to the linked object, they will be given sharing access without lowering existing permissions. May result in an error if the user making the call does not have sufficient permissions to complete the grant. Default value is false.
          type: boolean
        roles:
          description: An array of `RoleRequest` objects. Maximum number of such objects is 100.
          items:
            oneOf:
            - $ref: '#/components/schemas/CatalogRolesWithNames'
            - $ref: '#/components/schemas/CatalogRolesWithId'
          maxItems: 100
          minItems: 1
          type: array
      required:
      - action
      - roles
      type: object
    GrantAccessControlWithUsername:
      description: Grant access control request using username for user identification.
      properties:
        role:
          $ref: '#/components/schemas/SharingRole'
          description: The role of the recipient on this entity.
          enum:
          - ADMIN
          - CONSUMER
          - DATA_SCIENTIST
          - EDITOR
          - NO_ROLE
          - OBSERVER
          - OWNER
          - READ_ONLY
          - READ_WRITE
          - USER
          type: string
        shareRecipientType:
          $ref: '#/components/schemas/SubjectType'
          description: Describes the recipient type — one of user, group, organization, or externalApplication.
          enum:
          - user
          - group
          - organization
          - externalApplication
          type: string
        username:
          description: Username of the user to update the access role for.
          title: Username
          type: string
      required:
      - role
      - shareRecipientType
      - username
      title: GrantAccessControlWithUsername
      type: object
    GetDatasetVersionProjectsResponse:
      properties:
        count:
          description: The number of items returned on this page.
          type: integer
        data:
          description: Array of project references.
          items:
            $ref: '#/components/schemas/DatasetProject'
          type: array
        next:
          description: The URL of the next page (if null, there is no next page).
          format: uri
          type:
          - string
          - 'null'
        previous:
          description: The URL of the previous page (if null, there is no previous page).
          format: uri
          type:
          - string
          - 'null'
        totalCount:
          description: The total number of items across all pages.
          type: integer
      required:
      - data
      - next
      - previous
      - totalCount
      type: object
    UserBlueprintUpdate:
