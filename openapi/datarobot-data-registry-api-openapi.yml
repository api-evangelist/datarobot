openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Data Registry API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Read below to learn about DataRobot's endpoints for managing data, including topics such as the Data Registry, datasets, feature lists, and blueprints. Reference the Glossary and UI documentation for more information about these topics.
  name: data_registry
paths:
  /api/v2/catalogItems/:
    get:
      description: List all catalog items accessible by the user.
      operationId: catalogItems_list
      parameters:
      - description: Specifies the number of results to skip for pagination.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Sets the maximum number of results returned. Enter 0 to specify no limit.
        in: query
        name: limit
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The initial cache size, for Mongo search only.
        in: query
        name: initialCacheSize
        required: true
        schema:
          default: 500
          maximum: 10000
          minimum: 1
          type: integer
      - description: Sets whether to use the cache, for Mongo search only.
        in: query
        name: useCache
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: 'The attribute sort order applied to the returned catalog list: ''catalogName'', ''originalName'', ''description'', ''created'', or ''relevance''. For all options other than ''relevance'', prefix the attribute name with a dash to sort in descending order. e.g., orderBy=''-catalogName''. Defaults to ''-created''.'
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - originalName
          - -originalName
          - catalogName
          - -catalogName
          - description
          - -description
          - created
          - -created
          - relevance
          - -relevance
          type: string
      - description: A value to search for in the dataset's name, description, tags, column names, categories, and latest errors. The search is case insensitive. If no value is provided, or if the empty string is used, or if the string contains only whitespace, no filtering occurs. Partial matching is performed on the dataset name and description fields; all other fields require an exact match.
        in: query
        name: searchFor
        required: false
        schema:
          type: string
      - description: Filter results to display only items with the specified catalog item tags, in lower case, with no spaces.
        in: query
        name: tag
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
      - description: 'Access type used to filter returned results. Valid options are ''owner'', ''shared'', ''created'', and ''any'' (the default): ''owner'' items are owned by the requester, ''shared'' items have been shared with the requester, ''created'' items have been created by the requester, and ''any'' items matches all.'
        in: query
        name: accessType
        required: false
        schema:
          default: any
          enum:
          - owner
          - shared
          - any
          - created
          type: string
      - description: Data source types used for filtering.
        in: query
        name: datasourceType
        required: false
        schema:
          oneOf:
          - enum:
            - local
            - url
            - hdfs
            - jdbc
            - spark
            - dr-connector-v1
            - dr-database-v1
            type: string
          - items:
              enum:
              - local
              - url
              - hdfs
              - jdbc
              - spark
              - dr-connector-v1
              - dr-database-v1
              type: string
            type: array
      - description: Category type(s) used for filtering. Searches are case sensitive and support '&' and 'OR' operators.
        in: query
        name: category
        required: false
        schema:
          oneOf:
          - enum:
            - BATCH_PREDICTIONS
            - PREDICTION
            - SAMPLE
            - TRAINING
            type: string
          - items:
              enum:
              - BATCH_PREDICTIONS
              - PREDICTION
              - SAMPLE
              - TRAINING
              type: string
            type: array
        x-versionadded: v2.21
      - description: Sets whether to exclude from the search results all catalog items that failed during import. If True, invalid catalog items will be excluded; default is False.
        in: query
        name: filterFailed
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Filter results to display only those owned by user(s) identified by the specified UID.
        in: query
        name: ownerUserId
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
      - description: Filter results to display only those owned by user(s) identified by the specified username.
        in: query
        name: ownerUsername
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
      - description: Filter results by catalog type. The 'dataset' option matches both 'snapshot_dataset' and 'remote_dataset'.
        in: query
        name: type
        required: false
        schema:
          enum:
          - dataset
          - snapshot_dataset
          - remote_dataset
          - user_blueprint
          - files
          type: string
        x-enum-versionadded:
        - value: user_blueprint
          x-versionadded: v2.25
        x-versionadded: v2.22
      - description: Filter results by catalogType = 'snapshot_dataset' and catalogType = 'remote_dataset' and data_origin in ['snowflake', 'bigquery-v1']
        in: query
        name: isUxrPreviewable
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListSearchResponse'
          description: Paginated list of catalog items is returned.
      summary: List all catalog items accessible by the user
      tags:
      - data_registry
      x-versionadded: v2.18
  /api/v2/catalogItems/{catalogId}/:
    get:
      description: Retrieves latest version information, by ID, for catalog items.
      operationId: catalogItems_retrieve
      parameters:
      - description: Catalog item ID.
        in: path
        name: catalogId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDetailsRetrieveResponse'
          description: Catalog item details retrieved successfully.
      summary: Retrieves latest version information, by ID by catalog ID
      tags:
      - data_registry
      x-versionadded: v2.18
    patch:
      description: Update the name, description, or tags for the requested catalog item.
      operationId: catalogItems_patch
      parameters:
      - description: Catalog item ID.
        in: path
        name: catalogId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogMetadata'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogExtendedDetailsResponse'
          description: Extended details of the updated catalog item.
        '403':
          description: User does not have permission to update this catalog item.
        '410':
          description: Requested catalog item was previously deleted.
      summary: Update the name, description, or tags by catalog ID
      tags:
      - data_registry
      x-versionadded: v2.18
  /api/v2/dataEngineQueryGenerators/:
    post:
      description: Create a data engine query generator.
      operationId: dataEngineQueryGenerators_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataEngineQueryGenerator'
      responses:
        '202':
          description: Creation has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '403':
          description: User does not have access to this functionality.
        '422':
          description: Unable to process data engine query generation.
      summary: Create a data engine query generator
      tags:
      - data_registry
      x-versionadded: v2.27
  /api/v2/dataEngineQueryGenerators/{dataEngineQueryGeneratorId}/:
    get:
      description: Retrieve a data engine query generator
      operationId: dataEngineQueryGenerators_retrieve
      parameters:
      - description: The ID of the data engine query generator.
        in: path
        name: dataEngineQueryGeneratorId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveDataEngineQueryResponse'
          description: ''
        '403':
          description: User does not have access to this functionality.
        '404':
          description: Specified query generator was not found.
      summary: Retrieve a data engine query generator by ID
      tags:
      - data_registry
      x-versionadded: v2.27
  /api/v2/dataEngineWorkspaceStates/:
    post:
      description: Create Data Engine workspace state in database.
      operationId: dataEngineWorkspaceStates_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceState'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSourceCreatedResponse'
          description: The Data Engine workspace state.
        '410':
          description: Specified workspace state was already deleted.
      summary: Create Data Engine workspace state
      tags:
      - data_registry
      x-versionadded: v2.21
  /api/v2/dataEngineWorkspaceStates/fromDataEngineQueryGenerator/:
    post:
      description: Create Data Engine workspace state in database from a query generator.
      operationId: dataEngineWorkspaceStatesFromDataEngineQueryGenerator_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceStateFromQueryGenerator'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStateCreatedFromQueryGeneratorResponse'
          description: The Data Engine Workspace state
      summary: Create Data Engine workspace state
      tags:
      - data_registry
      x-versionadded: v2.27
  /api/v2/dataEngineWorkspaceStates/{workspaceStateId}/:
    get:
      description: Read and return previously stored Data Engine workspace state.
      operationId: dataEngineWorkspaceStates_retrieve
      parameters:
      - description: The ID of the data engine workspace state.
        in: path
        name: workspaceStateId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStateResponse'
          description: The Data Engine workspace state.
        '410':
          description: Specified workspace state was already deleted.
      summary: Read Data Engine workspace state by workspace state ID
      tags:
      - data_registry
      x-versionadded: v2.21
  /api/v2/datasets/:
    get:
      description: List all datasets accessible by the user.
      operationId: datasets_list
      parameters:
      - description: If specified, only dataset versions that have the specified category will be included in the results. Categories identify the intended use of the dataset.
        in: query
        name: category
        required: false
        schema:
          enum:
          - TRAINING
          - PREDICTION
          - SAMPLE
          type: string
      - description: Sorting order which will be applied to catalog list.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - created
          - -created
          type: string
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          maximum: 100
          minimum: 1
          type: integer
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Whether datasets that failed during import should be excluded from the results. If True invalid datasets will be excluded.
        in: query
        name: filterFailed
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: If specified will only return datasets that are associated with specified dataset versions. Cannot be used as the same time with experiment_container_ids.
        in: query
        name: datasetVersionIds
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 20
            type: array
        x-versionadded: v2.21
      - description: Return only datasets associated with the specified Use Cases.Cannot be used as the same time with dataset_version_ids.
        in: query
        name: useCaseIds
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 20
            type: array
        x-versionadded: v2.47
      - description: Only return datasets capable of supporting LLM vector database.
        in: query
        name: vectorDatabaseEligibleOnly
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versionadded: v2.47
      - description: Only return datasets available for use as metadata when creating a vector database.
        in: query
        name: vectorDatabaseMetadataEligibleOnly
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versionadded: v2.47
      - description: Only return soft-deleted datasets.
        in: query
        name: isDeleted
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
        x-versionadded: v2.47
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListResponse'
          description: A paginated list of datasets
      summary: List datasets
      tags:
      - data_registry
      x-versionadded: v2.18
    patch:
      description: Execute the specified bulk action on multiple datasets.
      operationId: datasets_patchMany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDatasetAction'
      responses:
        '204':
          description: Successfully executed
        '409':
          description: Cannot delete a dataset that has refresh jobs.
      summary: Execute bulk dataset action
      tags:
      - data_registry
      x-versionadded: v2.21
  /api/v2/datasets/fromDataEngineWorkspaceState/:
    post:
      description: Create a dataset from a Data Engine workspace state.
      operationId: datasetsFromDataEngineWorkspaceState_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateFromWorkspaceState'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDatasetDataEngineResponse'
          description: Creation has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '410':
          description: Specified query output was already deleted.
      summary: Create dataset
      tags:
      - data_registry
      x-versionadded: v2.21
  /api/v2/datasets/fromDataSource/:
    post:
      description: Create a Dataset Item from a data source.
      operationId: datasetsFromDataSource_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Datasource'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDatasetResponse'
          description: Creation has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Create a dataset from a data source
      tags:
      - data_registry
      x-versionadded: v2.18
  /api/v2/datasets/fromFile/:
    post:
      description: Create a dataset from a file.
      operationId: datasetsFromFile_create
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DatasetFromFile'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDatasetResponse'
          description: Creation has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '422':
          description: The request cannot be processed. The request did not contain file contents.
      summary: Create a dataset from a file
      tags:
      - data_registry
      x-versionadded: v2.18
  /api/v2/datasets/fromHDFS/:
    post:
      description: Create a Dataset Item from an HDFS URL.
      operationId: datasetsFromHDFS_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hdfs'
      responses:
        '200':
          description: ''
      summary: Create a dataset from a hdfs
      tags:
      - data_registry
      x-versionadded: v2.18
  /api/v2/datasets/fromRecipe/:
    post:
      description: Create a dataset item and version from a recipe.During publishing, an immutable copy of the recipe is created, as well as a copy of the recipe's data source.
      operationId: datasetsFromRecipe_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFromRecipe'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDatasetResponse'
          description: Creation has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Create a dataset from a recipe
      tags:
      - data_registry
      x-versionadded: v2.33
  /api/v2/datasets/fromStage/:
    post:
      description: Create a dataset from a data stage.
      operationId: datasetsFromStage_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetFromStage'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDatasetResponse'
          description: Creation has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '403':
          description: You do not have permission to use data stages.
        '404':
          description: Data Stage not found.
        '409':
          description: Data Stage not finalized
        '410':
          description: Data Stage failed
        '422':
          description: The request cannot be processed. The request did not contain data stage.
      summary: Create a dataset from a stage
      tags:
      - data_registry
      x-versionadded: v2.35
  /api/v2/datasets/fromURL/:
    post:
      description: Create a Dataset Item from a URL.
      operationId: datasetsFromURL_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Url'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDatasetResponse'
          description: Creation has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Create a dataset from an URL
      tags:
      - data_registry
      x-versionadded: v2.18
  /api/v2/datasets/{datasetId}/:
    delete:
      description: Marks the dataset with the given ID as deleted.
      operationId: datasets_delete
      parameters:
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successfully deleted
        '409':
          description: Cannot delete a dataset that has refresh jobs.
      summary: Delete dataset by dataset ID
      tags:
      - data_registry
      x-versionadded: v2.19
    get:
      description: Retrieves the details of the dataset with given ID.
      operationId: datasets_retrieve
      parameters:
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullDatasetDetailsResponse'
          description: The dataset details
      summary: Get dataset details by dataset ID
      tags:
      - data_registry
      x-versionadded: v2.18
    patch:
      description: Modifies the specified dataset.
      operationId: datasets_patch
      parameters:
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDataset'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicDatasetDetailsResponse'
          description: Dataset successfully modified
        '422':
          description: The categories are not applicable to the dataset.
      summary: Modify dataset by dataset ID
      tags:
      - data_registry
      x-versionadded: v2.18
  /api/v2/datasets/{datasetId}/accessControl/:
    get:
      description: List the users and their associated roles for the specified dataset.
      operationId: datasetsAccessControl_list
      parameters:
      - description: Only return the access control information for a user with this user ID.
        in: query
        name: userId
        required: false
        schema:
          type: string
      - description: Only return the access control information for a user with this username.
        in: query
        name: username
        required: false
        schema:
          type: string
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAccessControlListResponse'
          description: The paginated list of user permissions.
      summary: List dataset access by dataset ID
      tags:
      - data_registry
      x-versionadded: v2.18
    patch:
      description: Grant access to the dataset at the specified role level, or remove access to the dataset.
      operationId: datasetsAccessControl_patchMany
      parameters:
      - description: The ID of the dataset.
        in: path
        name: datasetId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetAccessSet'
      responses:
        '204':
          description: Successfully modified.
        '409':
          description: Duplicate entry for a user in permission list or the request would leave the dataset without an owner.
      summary: Modify dataset access by dataset ID
      tags:
      - data_registry
      x-versionadded: v2.18
  /api/v2/datasets/{datasetId}/allFeaturesDetails/:
    get:
      description: Return detailed information on all the features and transforms for this dataset.If the Dataset Item has attribute snapshot = True, all optional fields also appear
      operationId: datasetsAllFeaturesDetails_list
      parameters:
      - description: At most this many results are returned. The default may change and a maximum limit may be imposed without notice.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          maximum: 100
          minimum: 0
          type: integer
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: How the features should be ordered.
        in: query
        name: orderBy
        required: true
        schema:
          default: name
          enum:
          - featureType
          - name
          - id
          - unique
          - missing
          - stddev
          - mean
          - median
          - min
          - max
          - dataQualityIssues
          - -featureType
          - -name
          - -id
          - -unique
          - -missing
          - -stddev
          - -mean
          - -median
          - -min
          - -max
          - -dataQualityIssues
          type: string
      - description: Include histogram plot data in the response.
        in: query
        name: includePlot
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: A value to search for in the feature name. The search is case insensitive. If no value is provided, an empty string is used, or the string contains only whitespace, no filtering occurs.
        in: query
        name: searchFor
        required: false
        schema:
          type: string
        x-versionadded: v2.33
      - description: The ID of a featurelist. If specified, only returns features that are present in the specified featurelist.
        in: query
        name: featurelistId
        required: false
        schema:
          type: string
        x-versionadded: v2.33
