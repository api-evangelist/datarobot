openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Observability Custom Metrics API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage custom metrics. Use the data you collect from data exploration (or data calculated through other custom metrics) to compute and monitor custom business or performance metrics. This feature allows you to implement your organization's specialized metrics, expanding on the insights provided by DataRobot's built-in service health, data drift, and accuracy metrics.
  name: observability_custom_metrics
paths:
  /api/v2/customJobs/fromHostedCustomMetricGalleryTemplate/:
    post:
      description: Creates a custom job from the hosted custom metric template.
      operationId: customJobsFromHostedCustomMetricGalleryTemplate_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomJobFromGalleryTemplateCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomJobResponse'
          description: Custom metric test job creation started.
        '403':
          description: User does not have permission to create a custom job.
      summary: Creates a custom job
      tags:
      - observability_custom_metrics
      x-versionadded: v2.34
  /api/v2/customJobs/{customJobId}/customMetrics/:
    get:
      description: List all of the custom metrics associated with a custom job.
      operationId: customJobsCustomMetrics_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: ID of the custom job.
        in: path
        name: customJobId
        required: true
        schema:
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricCreateFromCustomJobResponse'
          description: Custom metrics associated with custom job.
        '403':
          description: User does not have permission to custom jobs.
      summary: List all of the custom metrics associated by custom job ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.34
  /api/v2/customJobs/{customJobId}/customMetrics/{customMetricId}/:
    delete:
      description: Delete a custom metric associated with a custom job.
      operationId: customJobsCustomMetrics_delete
      parameters:
      - description: ID of the custom job.
        in: path
        name: customJobId
        required: true
        schema:
          type: string
      - description: ID of the custom metric.
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
        x-versionadded: v2.34
      responses:
        '204':
          description: ''
        '403':
          description: User does not have permission to custom jobs.
      summary: Delete a custom metric associated by custom job ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.34
    patch:
      description: Update custom metric associated with a custom job.
      operationId: customJobsCustomMetrics_patch
      parameters:
      - description: ID of the custom job.
        in: path
        name: customJobId
        required: true
        schema:
          type: string
      - description: ID of the custom metric.
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
        x-versionadded: v2.34
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomJobCustomMetricUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricCreateFromCustomJobResponse'
          description: Updated custom metric.
        '403':
          description: User does not have permission to custom jobs.
      summary: Update custom metric associated by custom job ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.34
  /api/v2/customJobs/{customJobId}/hostedCustomMetricTemplate/:
    get:
      description: Retrieve a template for hosted custom metric job.
      operationId: customJobsHostedCustomMetricTemplate_list
      parameters:
      - description: ID of the custom job.
        in: path
        name: customJobId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedCustomMetricTemplateResponse'
          description: Hosted custom metric template retrieved.
        '403':
          description: User does not have permission to retrieve a custom metric test job.
        '404':
          description: Custom job does not exist or user does not have permission to access it.
      summary: Retrieve a template by custom job ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.34
    patch:
      description: Updates a template for hosted custom metric job.
      operationId: customJobsHostedCustomMetricTemplate_patchMany
      parameters:
      - description: ID of the custom job.
        in: path
        name: customJobId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedCustomMetricTemplateUpdate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedCustomMetricTemplateResponse'
          description: Hosted custom metric template updated.
        '403':
          description: User does not have permission to update a custom metric test job.
        '404':
          description: Custom job or template does not exist or user does not have permission to access it.
        '409':
          description: Custom job have at least 1 associated deployment.
      summary: Updates a template by custom job ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.34
    post:
      description: Creates a template for hosted custom metric job.
      operationId: customJobsHostedCustomMetricTemplate_create
      parameters:
      - description: ID of the custom job.
        in: path
        name: customJobId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedCustomMetricTemplateCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedCustomMetricTemplateResponse'
          description: Hosted custom metric template created.
        '403':
          description: User does not have permission to create a custom metric test job.
        '404':
          description: Custom job does not exist or user does not have permission to access it.
        '409':
          description: Hosted custom metric template already exists.
      summary: Creates a template by custom job ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.34
  /api/v2/deployments/{deploymentId}/customMetrics/:
    get:
      description: Retrieve a list of custom metrics.
      operationId: deploymentsCustomMetrics_list
      parameters:
      - description: Offset this number of objects to retrieve
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this number of objects to retrieve
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricListResponse'
          description: Success
        '403':
          description: User does not have permission to access a particular deployment or create a custom metric.
      summary: Retrieve a list of custom metrics by deployment ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.30
    post:
      description: Create a deployment custom metric.
      operationId: deploymentsCustomMetrics_create
      parameters:
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricCreatePayload'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricEntity'
          description: Custom metric is successfully created.
        '403':
          description: User does not have permission to create a custom metric.
      summary: Create a deployment custom metric by deployment ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.30
  /api/v2/deployments/{deploymentId}/customMetrics/bulkUpload/:
    post:
      description: Bulk upload custom metric values from JSON.
      operationId: deploymentsCustomMetricsBulkUpload_create
      parameters:
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMetricValuesPayload'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricEntity'
          description: Custom metric values import started
        '403':
          description: User does not have permission to import custom metric values.
      summary: Bulk upload custom metric values by deployment ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.39
  /api/v2/deployments/{deploymentId}/customMetrics/fromCustomJob/:
    post:
      description: Create a deployment custom metric from an existing custom job.
      operationId: deploymentsCustomMetricsFromCustomJob_create
      parameters:
      - description: Unique identifier of the deployment.
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricCreateFromCustomJob'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricCreateFromCustomJobResponse'
          description: Custom metric is successfully created.
        '403':
          description: User does not have permission to create a custom metric.
      summary: Create a custom metrics from a custom job
      tags:
      - observability_custom_metrics
      x-versionadded: v2.34
  /api/v2/deployments/{deploymentId}/customMetrics/{customMetricId}/:
    delete:
      description: Delete a custom metric.
      operationId: deploymentsCustomMetrics_delete
      parameters:
      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: A custom metric was successfully deleted.
        '403':
          description: User does not have permission to delete a custom metric.
        '404':
          description: Custom metric was not found.
      summary: Delete a custom metric by deployment ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.30
    get:
      description: Retrieve a single custom metric metadata.
      operationId: deploymentsCustomMetrics_retrieve
      parameters:
      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricEntity'
          description: A given custom metric metadata.
        '403':
          description: User does not have permission to access a particular deployment or custom metric metadata.
      summary: Retrieve a single custom metric metadata by deployment ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.30
    patch:
      description: Update given custom metric settings.
      operationId: deploymentsCustomMetrics_patch
      parameters:
      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricUpdatePayload'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricEntity'
          description: Custom metric settings updated.
        '403':
          description: User does not have permission to update the custom metric.
      summary: Update given custom metric settings by deployment ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.30
  /api/v2/deployments/{deploymentId}/customMetrics/{customMetricId}/batchSummary/:
    get:
      description: Retrieve the summary of deployment batch custom metric.
      operationId: deploymentsCustomMetricsBatchSummary_retrieve
      parameters:
      - description: Start of the period to retrieve monitoring stats, defaults to 7 days ago from the end of the period.
        in: query
        name: start
        required: false
        schema:
          format: date-time
          type: string
      - description: End of the period to retrieve monitoring stats, defaults to the next top of the hour from now.
        in: query
        name: end
        required: false
        schema:
          format: date-time
          type: string
      - description: The model package ID of related champion/challenger to retrieve custom metric values for.
        in: query
        name: modelPackageId
        required: false
        schema:
          default: null
          type:
          - string
          - 'null'
      - description: The model ID of related champion/challenger to retrieve custom metric values for.
        in: query
        name: modelId
        required: false
        schema:
          default: null
          type:
          - string
          - 'null'
      - description: The name of the segment on which segment analysis is being performed.
        in: query
        name: segmentAttribute
        required: false
        schema:
          type: string
      - description: The value of the `segmentAttribute` to segment on.
        in: query
        name: segmentValue
        required: false
        schema:
          default: ''
          type: string
      - description: The id of the batch for which metrics are being retrieved.
        in: query
        name: batchId
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 25
            type: array
      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomMetricBatchSummary'
          description: Summary retrieved successfully.
        '403':
          description: User does not have permission to read the custom metric summary.
      summary: Retrieve the summary of deployment batch custom metric by deployment ID
      tags:
      - observability_custom_metrics
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables batch monitoring for deployments.
        enabled_by_default: true
        maturity: GA_ALL
        name: MMM_BATCH_MONITORING
      x-versionadded: v2.33
  /api/v2/deployments/{deploymentId}/customMetrics/{customMetricId}/fromDataset/:
    post:
      description: Upload custom metric values from dataset.
      operationId: deploymentsCustomMetricsFromDataset_create
      parameters:
      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricValuesFromDatasetPayload'
      responses:
        '202':
          description: Custom metric values import started
        '403':
          description: User does not have permission to import custom metric values.
      summary: Upload custom metric values by deployment ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.30
  /api/v2/deployments/{deploymentId}/customMetrics/{customMetricId}/fromJSON/:
    post:
      description: Upload custom metric values from JSON.
      operationId: deploymentsCustomMetricsFromJSON_create
      parameters:
      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricValuesFromJSONPayload'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricEntity'
          description: Custom metric values import started
        '403':
          description: User does not have permission to import custom metric values.
      summary: Create a custom metrics from a JSON
      tags:
      - observability_custom_metrics
      x-versionadded: v2.30
  /api/v2/deployments/{deploymentId}/customMetrics/{customMetricId}/summary/:
    get:
      description: Retrieve the summary of deployment custom metric.
      operationId: deploymentsCustomMetricsSummary_retrieve
      parameters:
      - description: Start of the period to retrieve monitoring stats, defaults to 7 days ago from the end of the period.
        in: query
        name: start
