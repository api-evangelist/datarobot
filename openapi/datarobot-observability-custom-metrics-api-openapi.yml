          default: null
          type:
          - string
          - 'null'
      - description: The name of the segment on which segment analysis is being performed.
        in: query
        name: segmentAttribute
        required: false
        schema:
          type: string
      - description: The value of the `segmentAttribute` to segment on.
        in: query
        name: segmentValue
        required: false
        schema:
          default: ''
          type: string
      - description: The id of the batch for which metrics are being retrieved.
        in: query
        name: batchId
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            maxItems: 25
            type: array
      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomMetricSummary'
          description: Summary retrieved successfully.
        '403':
          description: User does not have permission to read the custom metric summary.
      summary: Retrieve the summary of deployment custom metric by deployment ID
      tags:
      - observability_custom_metrics
      x-versionadded: v2.30
  /api/v2/deployments/{deploymentId}/customMetrics/{customMetricId}/valuesOverBatch/:
    get:
      description: Retrieve custom metric values over batch.
      operationId: deploymentsCustomMetricsValuesOverBatch_list
      parameters:
      - description: The model package ID of related champion/challenger to retrieve batch custom metric values for.
        in: query
        name: modelPackageId
        required: false
        schema:
          default: null
