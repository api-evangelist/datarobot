  /api/v2/deployments/{deploymentId}/customMetricsBatchSummary/:
    get:
      description: Retrieve the bulk summary of deployment batch custom metrics.
      operationId: deploymentsCustomMetricsBulkBatchSummary_retrieve
      parameters:
