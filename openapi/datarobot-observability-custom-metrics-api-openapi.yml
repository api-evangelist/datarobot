      - description: The model ID of related champion/challenger to retrieve batch custom metric values for.
        in: query
        name: modelId
        required: false
        schema:
          default: null
          type:
          - string
          - 'null'
      - description: The id of the batch for which metrics are being retrieved.
        in: query
        name: batchId
        required: false
        schema:
