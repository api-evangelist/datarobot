      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
