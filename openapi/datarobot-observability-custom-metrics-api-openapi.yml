            maxItems: 25
            type: array
      - description: The name of the segment on which segment analysis is being performed.
        in: query
        name: segmentAttribute
        required: false
        schema:
          type: string
      - description: The value of the `segmentAttribute` to segment on.
        in: query
        name: segmentValue
        required: false
        schema:
          default: ''
          type: string
      - description: ID of the deployment
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: ID of the custom metric
        in: path
        name: customMetricId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricValuesOverBatchResponse'
          description: Data retrieved successfully
        '403':
          description: User does not have permission to read custom metric values.
      summary: Retrieve custom metric values over batch by deployment ID
      tags:
      - observability_custom_metrics
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables batch monitoring for deployments.
        enabled_by_default: true
        maturity: GA_ALL
        name: MMM_BATCH_MONITORING
      x-versionadded: v2.33
  /api/v2/deployments/{deploymentId}/customMetrics/{customMetricId}/valuesOverSpace/:
    get:
