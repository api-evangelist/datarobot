  /api/v2/deployments/{deploymentId}/customMetrics/{customMetricId}/valuesOverTime/:
    get:
      description: Retrieve custom metric values over time.
      operationId: deploymentsCustomMetricsValuesOverTime_list
      parameters:
      - description: Start of the period to retrieve monitoring stats, defaults to 7 days ago from the end of the period.
        in: query
        name: start
        required: false
        schema:
          format: date-time
          type: string
      - description: End of the period to retrieve monitoring stats, defaults to the next top of the hour from now.
        in: query
        name: end
        required: false
        schema:
          format: date-time
          type: string
      - description: The model package ID of related champion/challenger to retrieve custom metric values for.
        in: query
        name: modelPackageId
        required: false
        schema:
          default: null
