openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Data Connectivity API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: This page outlines how to integrate with a variety of enterprise databases, using a 'self-service' JDBC platform.
  name: data_connectivity
paths:
  /api/v2/aclConnections/:
    get:
      description: A list of all ACL management connections for the user organization.
      operationId: aclConnections_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 100
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACLAdminConnectionList'
          description: ''
      summary: List all ACL management connections
      tags:
      - data_connectivity
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Synchronize access permissions to VDB and GDrive/SharePoint source files.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: ACL_SYNC
      x-versionadded: v2.43
    put:
      description: Create or update the ACL management connection. Default credentials must be defined for the data store in advance.
      operationId: aclConnections_putMany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ACLAdminConnectionBase'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACLAdminConnectionResponse'
          description: ''
      summary: Define the connection as ACL management
      tags:
      - data_connectivity
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Synchronize access permissions to VDB and GDrive/SharePoint source files.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: ACL_SYNC
      x-versionadded: v2.43
  /api/v2/aclConnections/{dataStoreId}/:
    delete:
      operationId: aclConnections_delete
      parameters:
      - description: The ACL management connection ID.
        in: path
        name: dataStoreId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
      summary: Deactivate ACL management by data store ID
      tags:
      - data_connectivity
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Synchronize access permissions to VDB and GDrive/SharePoint source files.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: ACL_SYNC
      x-versionadded: v2.43
  /api/v2/dataStages/:
    post:
      description: Create a data stage.
      operationId: dataStages_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataStageRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDataStageResponse'
          description: Created data stage
        '403':
          description: Permission denied.
        '422':
          description: The request cannot be processed.
      summary: Create a data stage
      tags:
      - data_connectivity
      x-versionadded: v2.35
  /api/v2/dataStages/{dataStageId}/finalize/:
    post:
      description: Finalize a data stage.
      operationId: dataStagesFinalize_create
      parameters:
      - description: The ID of the data stage.
        in: path
        name: dataStageId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStageFinalizeResponse'
          description: Finalize data stage
        '403':
          description: Permission denied.
        '404':
          description: The entity is not found.
        '406':
          description: The request is not acceptable.
        '409':
          description: The request conflicts with the server state.
        '410':
          description: The requested entity has been deleted.
        '422':
          description: The request cannot be processed.
      summary: Finalize a data stage by data stage ID
      tags:
      - data_connectivity
      x-versionadded: v2.35
  /api/v2/dataStages/{dataStageId}/parts/{partNumber}/:
    put:
      description: Upload a part to the data stage.
      operationId: dataStagesParts_put
      parameters:
      - description: The ID of the data stage.
        in: path
        name: dataStageId
        required: true
        schema:
          type: string
      - description: The part number associated with the part.
        in: path
        name: partNumber
        required: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUploadRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartUploadResponse'
          description: Upload part to a data stage
        '403':
          description: Permission denied.
        '404':
          description: The entity is not found.
        '409':
          description: The request conflicts with the server state.
        '410':
          description: The requested entity has been deleted.
        '422':
          description: The request cannot be processed.
      summary: Upload a part by data stage ID
      tags:
      - data_connectivity
      x-versionadded: v2.35
  /api/v2/externalDataDriverFile/:
    post:
      description: Upload JDBC driver from file. Only Java archive (.jar) files are supported.
      operationId: externalDataDriverFile_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUploadRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverUploadResponse'
          description: ''
        '413':
          description: JDBC driver JAR file size exceeds the configured limit.
      summary: Upload JDBC driver
      tags:
      - data_connectivity
      x-versionadded: v2.11
  /api/v2/externalDataDrivers/:
    get:
      description: Fetch all drivers a user has access to.
      operationId: externalDataDrivers_list
      parameters:
      - description: Driver type. Either 'jdbc' or 'dr-database-v1'.
        in: query
        name: type
        required: true
        schema:
          default: jdbc
          enum:
          - all
          - dr-connector-v1
          - dr-database-v1
          - jdbc
          type: string
        x-versionadded: v2.30
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListResponse'
          description: Drivers accessible by the user.
      summary: List drivers
      tags:
      - data_connectivity
      x-versionadded: v2.11
    post:
      description: Create a new JDBC driver. To create connections from fields, rather than supplying a JDBC URL, use 'configurationId'. When using 'configurationId', do not include 'canonicalName' or 'className' as they are part of the driver configuration. Specifying a 'version' is required as it is used in the construction of the canonicalName.
      operationId: externalDataDrivers_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
          description: Details about new driver entity.
      summary: Create a new JDBC driver
      tags:
      - data_connectivity
      x-versionadded: v2.11
  /api/v2/externalDataDrivers/{driverId}/:
    delete:
      description: Delete the driver with given ID if it is not used by any data store or data source.
      operationId: externalDataDrivers_delete
      parameters:
      - description: Driver ID.
        in: path
        name: driverId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Driver deleted successfully.
        '409':
          description: Driver is in use by one or more data store or data source
      summary: Delete the driver by driver ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
    get:
      description: Retrieve driver details by ID.
      operationId: externalDataDrivers_retrieve
      parameters:
      - description: Driver ID.
        in: path
        name: driverId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
          description: Driver details retrieved successfully.
      summary: Retrieve driver details by driver ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
    patch:
      description: Update properties of an existing JDBC driver. To change the canonicalName and className, you must first remove the driver configuration, if it exists, as its properties will otherwise override name changes.
      operationId: externalDataDrivers_patch
      parameters:
      - description: Driver ID.
        in: path
        name: driverId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
          description: Driver properties updated successfully.
      summary: Update properties of an existing JDBC Driver by driver ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
  /api/v2/externalDataDrivers/{driverId}/configuration/:
    get:
      description: Retrieve the driver configuration with the specified ID.
      operationId: externalDataDriversConfiguration_list
      parameters:
      - description: Driver ID.
        in: path
        name: driverId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverConfigurationRetrieveResponse'
          description: Driver configuration retrieved successfully.
      summary: Driver configuration details by driver ID
      tags:
      - data_connectivity
      x-versionadded: v2.19
  /api/v2/externalDataSources/:
    get:
      description: Return the detailed list of available data sources.
      operationId: externalDataSources_list
      parameters:
      - description: The data source type to filter by.
        in: query
        name: type
        required: false
        schema:
          default: databases
          enum:
          - all
          - databases
          - dr-connector-v1
          - dr-database-v1
          - jdbc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceListResponse'
          description: Data sources retrieved successfully.
      summary: List data sources
      tags:
      - data_connectivity
      x-versionadded: v2.11
    post:
      description: 'Create a fully configured source of data which could be used for datasets and projects creation. A data source specifies, via SQL query or selected table and schema data, which data to extract from the data connection (the location of data within a given endpoint) to use for modeling or predictions. A data source has one data connection and one connector but can have many datasets.

        To test the SQL query before creating the data source, use :http:post:`/api/v2/externalDataStores/(dataStoreId)/verifySQL/`.'
      operationId: externalDataSources_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceRetrieveResponse'
          description: Data source created successfully.
      summary: Create a data source
      tags:
      - data_connectivity
      x-versionadded: v2.11
  /api/v2/externalDataSources/{dataSourceId}/:
    delete:
      description: Delete the data source with given ID if it is not used by any dataset.
      operationId: externalDataSources_delete
      parameters:
      - description: The ID of the Data Source.
        in: path
        name: dataSourceId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Data source deleted successfully.
        '409':
          description: Data source is in use by one or more datasets
      summary: Delete the data source by data source ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
    get:
      description: Return the details of the existing data source with the given ID, including SQL query or selected table and schema data, which fully describe which data to extract and from which location.
      operationId: externalDataSources_retrieve
      parameters:
      - description: The ID of the Data Source.
        in: path
        name: dataSourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceRetrieveResponse'
          description: Data source details retrieved successfully.
      summary: Data source details by data source ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
    patch:
      description: 'Update the data source with given ID.

        To test the SQL query before updating the data source,use :http:post:`/api/v2/externalDataStores/(dataStoreId)/verifySQL/`.'
      operationId: externalDataSources_patch
      parameters:
      - description: The ID of the Data Source.
        in: path
        name: dataSourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceUpdate'
      responses:
        '204':
          description: Data source updated successfully.
      summary: Update the data source by data source ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
  /api/v2/externalDataSources/{dataSourceId}/accessControl/:
    get:
      description: Get a list of users, groups and organizations who have access to this data source and their roles.
      operationId: externalDataSourcesAccessControl_list
      parameters:
      - description: This many results will be skipped
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned
        in: query
        name: limit
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Optional, only return the access control information for a user with this username.
        in: query
        name: username
        required: false
        schema:
          type: string
      - description: Optional, only return the access control information for a user with this user ID.
        in: query
        name: userId
        required: false
        schema:
          type: string
      - description: The ID of the Data Source.
        in: path
        name: dataSourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingListResponse'
          description: The data source's access control list.
        '404':
          description: Either the data source does not exist or the user does not have permissions to view the data source.
        '422':
          description: Both username and userId were specified
      summary: Get the data source's access control list by data source ID
      tags:
      - data_connectivity
      x-versionadded: v2.14
    patch:
      description: Set roles for users on this data source. Note that when granting access to a data source, access to the corresponding data store as a "CONSUMER" will also be granted.
      operationId: externalDataSourcesAccessControl_patchMany
      parameters:
      - description: The ID of the Data Source.
        in: path
        name: dataSourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingUpdateOrRemoveWithGrant'
      responses:
        '204':
          description: Roles updated successfully.
        '409':
          description: The request would leave the data source without an owner.
        '422':
          description: One of the users in the request does not exist, or the request is otherwise invalid
      summary: Update the data source's access controls by data source ID
      tags:
      - data_connectivity
      x-versionadded: v2.14
  /api/v2/externalDataSources/{dataSourceId}/permissions/:
    get:
      description: Describe what permissions current user has for given data source.
      operationId: externalDataSourcesPermissions_list
      parameters:
      - description: The ID of the Data Source.
        in: path
        name: dataSourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceDescribePermissionsResponse'
          description: The data source permissions.
      summary: Describe data source permissions by data source ID
      tags:
      - data_connectivity
      x-versionadded: v2.23
  /api/v2/externalDataSources/{dataSourceId}/sharedRoles/:
    get:
      description: Get a list of users, groups and organizations who have access to this data source and their roles.
      operationId: externalDataSourcesSharedRoles_list
      parameters:
      - description: Only return roles for a user, group or organization with this identifier.
        in: query
        name: id
        required: false
        schema:
          type: string
      - description: This many results will be skipped
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned
        in: query
        name: limit
        required: true
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      - description: Only return roles for a user, group or organization with this name.
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: The list of access controls for recipients with this type.
        in: query
        name: shareRecipientType
        required: false
        schema:
          enum:
          - user
          - group
          - organization
          - externalApplication
          type: string
      - description: The ID of the Data Source.
        in: path
        name: dataSourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedRolesWithGrantListResponse'
          description: A paginated list of user/group/organization roles.
      summary: Retrieve shared roles by ID
      tags:
      - data_connectivity
      x-versionadded: v2.22
    patch:
      description: Grant access, remove access or update roles for organizations, groups or users on this data source. Up to 100 roles may be set per array in a single request.
      operationId: externalDataSourcesSharedRoles_patchMany
      parameters:
      - description: The ID of the Data Source.
        in: path
        name: dataSourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedRolesUpdateWithGrant'
      responses:
        '204':
          description: Roles updated successfully.
        '409':
          description: Duplicate entry for the org/group/user in roles listor the request would leave the data source without an owner.
        '422':
          description: Request is unprocessable. For example, `name` is stated for not user recipient.
      summary: Modify data source shared roles by data source ID
      tags:
      - data_connectivity
      x-versionadded: v2.22
  /api/v2/externalDataStores/:
    get:
      description: Return the list with details of the existing data stores available for the user.
      operationId: externalDataStores_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Includes only data stores of the specified type or any if set to `all`.
        in: query
        name: type
        required: false
        schema:
          default: jdbc
          enum:
          - all
          - databases
          - dr-connector-v1
          - dr-database-v1
          - jdbc
          type: string
        x-versionadded: v2.22
      - description: Includes only data stores of the specified database type. For JDBC based data stores, the database_type value is the string between the first and the second colons of a jdbc url. For example, a snowflake jdbc url is jdbc:snowflake://, the database_type is hence snowflake. If an empty string is used, or if the string contains only whitespace, no filtering occurs.
        in: query
        name: databaseType
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
        x-versionadded: v2.30
      - description: Includes only data stores of the specified connector type.
        in: query
        name: connectorType
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
      - description: Specifies whether non-visible OAuth fields are shown.
        in: query
        name: showHidden
        required: false
        schema:
          default: 'False'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Search for data stores whose canonicalName matches or contains the specified name.The search is case insensitive.
        in: query
        name: name
        required: false
        schema:
          type: string
        x-versionadded: v2.34
      - description: Specifies whether dynamic parameters in the URL will be substituted.
        in: query
        name: substituteUrlParameters
        required: false
        schema:
          default: 'False'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Includes only data stores which support the specified data type or all data stores if set to `all`.
        in: query
        name: dataType
        required: false
        schema:
          default: all
          enum:
          - all
          - structured
          - unstructured
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStoreListResponse'
          description: Data stores retrieved successfully.
        '422':
          description: Filtering by database type is currently not supported for dr-connector-v1 data stores.
      summary: List data stores
      tags:
      - data_connectivity
      x-versionadded: v2.11
    post:
      description: Create a data store which includes a name and a driver ID or a connector ID. The driver would be configured by a JDBC URL or by jdbc fields; the connector would be configured by connection fields.
      operationId: externalDataStores_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataStoreCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStoreRetrieveResponse'
          description: Data store created successfully.
      summary: Create a data store
      tags:
      - data_connectivity
      x-versionadded: v2.11
  /api/v2/externalDataStores/{dataStoreId}/:
    delete:
      description: Delete the data store with given ID if it is not used by any data source.
      operationId: externalDataStores_delete
      parameters:
      - description: The ID of the data store.
        in: path
        name: dataStoreId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Data store deleted successfully.
        '409':
          description: Data store is in use by one or more data source
      summary: Delete the data store by data store ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
    get:
      description: A configured connection to a database; it has a name and a specified driver. The driver may be specified by a JDBC URL or connection parameters if the driver was created with the parameter configuration.
      operationId: externalDataStores_retrieve
      parameters:
      - description: Specifies whether dynamic parameters in the URL will be substituted.
        in: query
        name: substituteUrlParameters
        required: false
        schema:
          default: 'False'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: The ID of the data store.
        in: path
        name: dataStoreId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStoreRetrieveResponse'
          description: Data store details retrieved successfully.
      summary: Data store details by data store ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
    patch:
      description: Update a data store configuration.
      operationId: externalDataStores_patch
      parameters:
      - description: The ID of the data store.
        in: path
        name: dataStoreId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataStoreUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStoreRetrieveResponse'
          description: The updated data store entry.
      summary: Update a data store configuration by data store ID
      tags:
      - data_connectivity
      x-versionadded: v2.11
  /api/v2/externalDataStores/{dataStoreId}/accessControl/:
    patch:
      description: Set roles for users on this data store.
      operationId: externalDataStoresAccessControl_patchMany
      parameters:
      - description: The ID of the data store.
        in: path
        name: dataStoreId
        required: true
        schema:
          type: string
      requestBody:
