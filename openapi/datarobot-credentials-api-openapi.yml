openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Credentials API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: The following endpoints outline how to manage user credentials.
  name: Credentials
paths:
  /api/v2/credentials/:
    get:
      description: List all sets of credentials available for given user.
      operationId: credentials_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Includes only credentials of the specified type. Repeat the parameter for filtering on multiple statuses.
        in: query
        name: types
        required: false
        schema:
          oneOf:
          - enum:
            - adls_gen2_oauth
            - api_token
            - azure
            - azure_oauth
            - azure_sas
            - azure_service_principal
            - basic
            - bearer
            - box_jwt
            - client_id_and_secret
            - databricks_access_token_account
            - databricks_service_principal_account
            - external_oauth_provider
            - gcp
            - oauth
            - opaque
            - rsa
            - s3
            - sap_oauth
            - snowflake_key_pair_user_account
            - snowflake_oauth_user_account
            - tableau_access_token
            type: string
          - items:
              enum:
              - adls_gen2_oauth
              - api_token
              - azure
              - azure_oauth
              - azure_sas
              - azure_service_principal
              - basic
              - bearer
              - box_jwt
              - client_id_and_secret
              - databricks_access_token_account
              - databricks_service_principal_account
              - external_oauth_provider
              - gcp
              - oauth
              - opaque
              - rsa
              - s3
              - sap_oauth
              - snowflake_key_pair_user_account
              - snowflake_oauth_user_account
              - tableau_access_token
              type: string
            type: array
      - description: The order to sort the credentials. Defaults to the order by the creation_date in descending order. Sorting by name is case-insensitive.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - creationDate
          - -creationDate
          - name
          - -name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsListResponse'
          description: A paginated list of credentials.
      summary: List credentials
      tags:
      - Credentials
      x-versionadded: v2.19
    post:
      description: Store a new set of credentials.
      operationId: credentials_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsBody'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialsResponse'
          description: Credentials stored successfully.
        '403':
          description: The caller is not permitted to perform this operation.
        '409':
          description: The specified name is already in use.
        '422':
          description: The request is invalid.
      summary: Store a new set of credentials which can be used
      tags:
      - Credentials
      x-versionadded: v2.19
  /api/v2/credentials/associations/{associationId}/:
    get:
      description: Returns a list of credentials associated with the specified object for the given session user.
      operationId: credentialsAssociations_listForObject
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Sort order which will be applied to credential associations list. Prefix the attribute name with a dash to sort in descending order, e.g. "-is_default".  Absent by default.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - isDefault
          - -isDefault
          type: string
      - description: 'The compound ID of the data connection. <association_id> == <object_type>:<object_id> Where: <object_id> of ObjectId type - the ID of the data connection; <object_type> of string type - the type of data connection from CredentialMappingResourceTypes Enum: dataconnection, batch_prediction_job_definition.'
        in: path
        name: associationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCredentialsAssociationsResponse'
          description: List of credentials associated with the object for the session user.
      summary: List credentials associated by association ID
      tags:
      - Credentials
      x-versionadded: v2.30
  /api/v2/credentials/{credentialId}/:
    delete:
      description: Delete the credential set matching the specified ID if it is not used by any data connection or batch prediction job.
      operationId: credentials_delete
      parameters:
      - description: Credentials entity ID.
        in: path
        name: credentialId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Credentials deleted successfully.
        '409':
          description: Credentials are in use by one or more data connections or batch prediction jobs.
      summary: Delete the credentials set by credential ID
      tags:
      - Credentials
      x-versionadded: v2.19
    get:
      description: Return the credential set matching the specified ID.
      operationId: credentials_retrieve
      parameters:
      - description: Credentials entity ID.
        in: path
        name: credentialId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialsResponse'
          description: Credentials retrieved successfully.
      summary: Retrieve the credentials set by credential ID
      tags:
      - Credentials
      x-versionadded: v2.19
    patch:
      description: Update specified credentials
      operationId: credentials_patch
      parameters:
      - description: Credentials entity ID.
        in: path
        name: credentialId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsUpdate'
      responses:
        '200':
          description: Set of credentials updated
        '403':
          description: The caller is not permitted to perform this operation.
        '404':
          description: Requested credentials not found
        '409':
          description: The name specified for credentials is already in use.
        '422':
          description: Must specify at least one field to update
      summary: Update specified credentials by credential ID
      tags:
      - Credentials
      x-versionadded: v2.19
  /api/v2/credentials/{credentialId}/associations/:
    get:
      description: List all objects associated with specified credentials for the current user.
      operationId: credentialsAssociations_listForCredential
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Includes only credentials of the specified type. Repeat the parameter for filtering on multiple statuses.
        in: query
        name: types
        required: false
        schema:
          oneOf:
          - enum:
            - adls_gen2_oauth
            - api_token
            - azure
            - azure_oauth
            - azure_sas
            - azure_service_principal
            - basic
            - bearer
            - box_jwt
            - client_id_and_secret
            - databricks_access_token_account
            - databricks_service_principal_account
            - external_oauth_provider
            - gcp
            - oauth
            - opaque
            - rsa
            - s3
            - sap_oauth
            - snowflake_key_pair_user_account
            - snowflake_oauth_user_account
            - tableau_access_token
            type: string
          - items:
              enum:
              - adls_gen2_oauth
              - api_token
              - azure
              - azure_oauth
              - azure_sas
              - azure_service_principal
              - basic
              - bearer
              - box_jwt
              - client_id_and_secret
              - databricks_access_token_account
              - databricks_service_principal_account
              - external_oauth_provider
              - gcp
              - oauth
              - opaque
              - rsa
              - s3
              - sap_oauth
              - snowflake_key_pair_user_account
              - snowflake_oauth_user_account
              - tableau_access_token
              type: string
            type: array
      - description: The order to sort the credentials. Defaults to the order by the creation_date in descending order. Sorting by name is case-insensitive.
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - creationDate
          - -creationDate
          - name
          - -name
          type: string
      - description: Credentials entity ID.
        in: path
        name: credentialId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsListAssociationsResponse'
          description: Objects associated with the specified credentials for the current user.
      summary: List all objects associated by credential ID
      tags:
      - Credentials
      x-versionadded: v2.19
    patch:
      description: Add objects associated with credentials.
      operationId: credentialsAssociations_patchMany
      parameters:
      - description: Credentials entity ID.
        in: path
        name: credentialId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsAssociationUpdate'
      responses:
        '204':
          description: Credentials association updated.
        '404':
          description: Requested credentials not found
        '409':
          description: One or more associations already exist when adding or one or more associations do not exist.
        '422':
          description: Must specify a field to update or must specify only one of `credentialsToAdd` or `credentialsToRemove`.
      summary: Add objects associated by credential ID
      tags:
      - Credentials
      x-versionadded: v2.19
  /api/v2/credentials/{credentialId}/associations/{associationId}/:
    put:
      description: Set (create or update) the credentials' association for the given Data Connection for the given session Owner for the given credentials.
      operationId: credentialsAssociations_put
      parameters:
      - description: Credentials entity ID.
        in: path
        name: credentialId
        required: true
        schema:
          type: string
      - description: 'The compound ID of the data connection. <association_id> == <object_type>:<object_id> Where: <object_id> of ObjectId type - the ID of the data connection; <object_type> of string type - the type of data connection from CredentialMappingResourceTypes Enum: dataconnection, batch_prediction_job_definition.'
        in: path
        name: associationId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCredentialsAssociationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCredentialAssociationResponse'
          description: Credentials association was successfully set (created or updated).
        '201':
          description: New credential association was created.
      summary: Set default credentials by credential ID
      tags:
      - Credentials
      x-versionadded: v2.30
components:
  schemas:
    CredentialsAssociationsData:
      properties:
        isDefault:
          description: Whether this credential association with the given object is default for given session user.
          type: boolean
        link:
          description: Link to get more details about associated object.
          format: uri
          type:
          - string
          - 'null'
        objectId:
          description: Associated object ID.
          type: string
        objectType:
          description: Associated object type.
          type: string
      required:
      - link
      - objectId
      - objectType
      type: object
    CredentialsBody:
      discriminator:
        propertyName: credentialType
      oneOf:
      - properties:
          credentialType:
            description: The credential type.
            enum:
            - basic
            type: string
          description:
            description: Credentials description.
            type: string
          name:
            description: Credentials name.
            type: string
          password:
            description: Password to store for these credentials.
            type: string
          snowflakeAccountName:
            description: Snowflake account name.
            type: string
            x-versionadded: v2.21
          user:
            description: Username to store for these credentials.
            type: string
        required:
        - name
        - password
        - user
        type: object
      - properties:
          credentialType:
            description: The credential type.
            enum:
            - oauth
            type: string
          description:
            description: Credentials description.
            type: string
          name:
            description: Credentials name.
            type: string
          refreshToken:
            description: OAUTH refresh token.
            type: string
          token:
            description: OAUTH token.
            type: string
        required:
        - credentialType
        - name
        - refreshToken
        - token
        type: object
      - properties:
          awsAccessKeyId:
            description: The S3 AWS access key ID. Required if configId is not specified.Cannot include this parameter if configId is specified.
            type: string
            x-versionadded: v2.20
          awsSecretAccessKey:
            description: The S3 AWS secret access key. Required if configId is not specified.Cannot include this parameter if configId is specified.
