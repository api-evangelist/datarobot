components:
  schemas:
    CodeInspectionSchema:
      description: The schema for the code inspection request.
      properties:
        code:
          description: The code to inspect.
          title: Code
          type: string
        cursorPosition:
          description: The position of the cursor in the code.
          title: Cursorposition
          type: integer
        detailLevel:
          description: The detail level of the inspection. Possible values are 0 and 1.
          title: Detaillevel
          type: integer
      required:
      - code
      - cursorPosition
      - detailLevel
      title: CodeInspectionSchema
      type: object
    CodeCellSchema:
      description: The schema for a code cell in the notebook.
      properties:
        cellType:
          allOf:
          - $ref: '#/components/schemas/SupportedCellTypes'
          default: code
          description: Type of the cell.
        executionCount:
          default: 0
          description: Execution count of the cell.
          title: Executioncount
          type: integer
        id:
          description: ID of the cell.
          title: Id
          type: string
        metadata:
          allOf:
          - $ref: '#/components/schemas/NotebookCellMetadata'
          description: Metadata of the cell.
          title: Metadata
        outputs:
          description: Outputs of the cell.
          items:
            anyOf:
            - $ref: '#/components/schemas/ExecuteResultOutputSchema'
            - $ref: '#/components/schemas/DisplayDataOutputSchema'
            - $ref: '#/components/schemas/StreamOutputSchema'
            - $ref: '#/components/schemas/ErrorOutputSchema'
          title: Outputs
          type: array
        source:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          default: ''
