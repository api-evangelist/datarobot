openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public LLM Generation API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: The following endpoints outline how to manage LLM generation.
  name: LLM Generation
paths:
  /api/v2/genai/customModelLLMValidations/:
    get:
      description: List custom model LLM validations.
      operationId: list_custom_model_llm_validations_customModelLLMValidations__get
      parameters:
      - description: Only retrieve the custom model LLM validations associated with these use case IDs.
        in: query
        name: useCaseId
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: Only retrieve the custom model LLM validations associated with these use case IDs.
          title: useCaseId
      - description: Only retrieve the custom model LLM validations associated with this playground ID.
        in: query
        name: playgroundId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the custom model LLM validations associated with this playground ID.
          title: playgroundId
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Only retrieve the custom model LLM validations matching the search query.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the custom model LLM validations matching the search query.
          title: search
      - description: Apply this sort order to the results. Valid options are "name", "deploymentName", "userName", "creationDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ListCustomModelValidationSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name", "deploymentName", "userName", "creationDate". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      - description: If `true`, only retrieve the completed custom model LLM validations. The default is `false`.
        in: query
        name: completedOnly
        required: false
        schema:
          default: false
          description: If `true`, only retrieve the completed custom model LLM validations. The default is `false`.
          title: completedOnly
          type: boolean
      - description: Only retrieve the custom model LLM validations associated with this deployment ID.
        in: query
        name: deploymentId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the custom model LLM validations associated with this deployment ID.
          title: deploymentId
      - description: Only retrieve the custom model LLM validations associated with this model ID.
        in: query
        name: modelId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only retrieve the custom model LLM validations associated with this model ID.
          title: modelId
      - description: Only retrieve the custom model LLM validations where the custom model uses this column name for prompt input.
        in: query
        name: promptColumnName
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the custom model LLM validations where the custom model uses this column name for prompt input.
          title: promptColumnName
      - description: Only retrieve the custom model LLM validations where the custom model uses this column name for prediction output.
        in: query
        name: targetColumnName
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the custom model LLM validations where the custom model uses this column name for prediction output.
          title: targetColumnName
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomModelLLMValidationsResponse'
          description: Custom model LLM validations successfully retrieved.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List custom model LLM validations
      tags:
      - LLM Generation
    post:
      description: Validate an LLM hosted in a custom model deployment for use in the playground.
      operationId: create_custom_model_llm_validation_customModelLLMValidations__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomModelLLMValidationRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelLLMValidationResponse'
          description: Custom model LLM validation job successfully accepted. Follow the `Location` header to poll for job execution status.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Validate custom model LLM
      tags:
      - LLM Generation
  /api/v2/genai/customModelLLMValidations/{validationId}/:
    delete:
      description: Delete an existing custom model LLM validation.
      operationId: delete_custom_model_llm_validation_customModelLLMValidations__validationId___delete
      parameters:
      - description: The ID of the custom model LLM validation to delete.
        in: path
        name: validationId
        required: true
        schema:
          description: The ID of the custom model LLM validation to delete.
          title: validationId
          type: string
      responses:
        '204':
          description: Custom model LLM validation successfully deleted.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Delete custom model LLM validation by validation ID
      tags:
      - LLM Generation
    get:
      description: Retrieve the status of validating a custom model LLM.
      operationId: get_custom_model_llm_validation_customModelLLMValidations__validationId___get
      parameters:
      - description: The ID of the custom model LLM validation to retrieve.
        in: path
        name: validationId
        required: true
        schema:
          description: The ID of the custom model LLM validation to retrieve.
          title: validationId
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelLLMValidationResponse'
          description: Custom model LLM validation status successfully retrieved.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Retrieve custom model LLM validation status by validation ID
      tags:
      - LLM Generation
    patch:
      description: Edit an existing custom model LLM validation.
      operationId: update_custom_model_llm_validation_customModelLLMValidations__validationId___patch
      parameters:
      - description: The ID of the custom model LLM validation to edit.
        in: path
        name: validationId
        required: true
        schema:
          description: The ID of the custom model LLM validation to edit.
          title: validationId
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCustomModelValidationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelLLMValidationResponse'
          description: Custom model LLM validation successfully updated.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Edit custom model LLM validation by validation ID
      tags:
      - LLM Generation
  /api/v2/genai/customModelLLMValidations/{validationId}/revalidate/:
    post:
      description: Revalidate an existing custom model LLM validation.
      operationId: revalidate_custom_model_llm_validation_customModelLLMValidations__validationId__revalidate__post
      parameters:
      - description: The ID of the custom model LLM validation to revalidate.
        in: path
        name: validationId
        required: true
        schema:
          description: The ID of the custom model LLM validation to revalidate.
          title: validationId
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelLLMValidationResponse'
          description: Custom model LLM successfully revalidated.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Revalidate custom model LLM by validation ID
      tags:
      - LLM Generation
  /api/v2/genai/customModelVersions/:
    post:
      description: Export the specified LLM blueprint as a custom model version in Model Registry.
      operationId: create_custom_model_version_customModelVersions__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomModelVersionRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomModelVersionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create custom model version
      tags:
      - LLM Generation
  /api/v2/genai/llmBlueprints/:
    get:
      description: List LLM blueprints.
      operationId: list_llm_blueprints_llmBlueprints__get
      parameters:
      - description: Playground ID.
        in: query
        name: playgroundId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Playground ID.
          title: playgroundId
      - description: Retrieve only the LLM blueprints that use the specified LLM IDs.
        in: query
        name: llmIds
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: Retrieve only the LLM blueprints that use the specified LLM IDs.
          title: llmIds
      - description: Retrieve only the LLM blueprints linked to the specified vector database IDs.
        in: query
        name: vectorDatabaseIds
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: Retrieve only the LLM blueprints linked to the specified vector database IDs.
          title: vectorDatabaseIds
      - description: Retrieve only the LLM blueprints that have the specified draft/saved status.
        in: query
        name: isSaved
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Retrieve only the LLM blueprints that have the specified draft/saved status.
          title: isSaved
      - description: Retrieve only the LLM blueprints that have the specified starred status.
        in: query
        name: isStarred
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Retrieve only the LLM blueprints that have the specified starred status.
          title: isStarred
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Apply this sort order to the results. Valid options are "name", "description", "creationDate", "lastUpdateDate", "llmId", "vectorDatabaseId". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ListLLMBlueprintSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name", "description", "creationDate", "lastUpdateDate", "llmId", "vectorDatabaseId". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      - description: Retrieve only the LLM blueprints created by these users.
        in: query
        name: creationUserIds
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Retrieve only the LLM blueprints created by these users.
          title: creationUserIds
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLLMBlueprintsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List LLM blueprints
      tags:
      - LLM Generation
    post:
      description: Create a new LLM blueprint.
      operationId: create_llm_blueprint_llmBlueprints__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLLMBlueprintRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMBlueprintResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create LLM blueprint
      tags:
      - LLM Generation
  /api/v2/genai/llmBlueprints/fromChatPrompt/:
    post:
      description: Create a new LLM blueprint using the LLM and vector database settings currently used by the specified existing chat prompt.
      operationId: create_from_chat_prompt_llmBlueprints_fromChatPrompt__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFromChatPromptRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMBlueprintResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create a LLM blueprints from a chat prompt
      tags:
      - LLM Generation
  /api/v2/genai/llmBlueprints/fromLLMBlueprint/:
    post:
      description: Create a new LLM blueprint using the LLM and vector database settings currently used by the specified existing LLM blueprint.
      operationId: create_from_llm_blueprint_llmBlueprints_fromLLMBlueprint__post
      requestBody:
        content:
          application/json:
            schema:
