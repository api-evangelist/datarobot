        required: true
        schema:
          description: The ID of the LLM blueprint to delete.
          title: llmBlueprintId
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Delete LLM blueprint by LLM blueprint ID
      tags:
      - LLM Generation
    get:
      description: Retrieve an existing LLM blueprint.
      operationId: get_llm_blueprint_llmBlueprints__llmBlueprintId___get
      parameters:
      - description: The ID of the LLM blueprint to retrieve.
        in: path
        name: llmBlueprintId
        required: true
        schema:
          description: The ID of the LLM blueprint to retrieve.
          title: llmBlueprintId
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMBlueprintResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Retrieve LLM blueprint by LLM blueprint ID
      tags:
      - LLM Generation
    patch:
      description: Edit an existing LLM blueprint.
      operationId: update_llm_blueprint_llmBlueprints__llmBlueprintId___patch
      parameters:
      - description: The ID of the LLM blueprint to edit.
        in: path
        name: llmBlueprintId
        required: true
        schema:
          description: The ID of the LLM blueprint to edit.
          title: llmBlueprintId
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLLMBlueprintRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMBlueprintResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Edit LLM blueprint by LLM blueprint ID
      tags:
      - LLM Generation
  /api/v2/genai/llms/:
    get:
      description: List the large language models (LLMs) available in the DataRobot platform for the current user.
      operationId: list_llms_llms__get
      parameters:
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 200
          title: limit
          type: integer
      - description: If specified, include custom model LLMs available for this use case.
        in: query
        name: useCaseId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: If specified, include custom model LLMs available for this use case.
          title: useCaseId
      - description: Whether to include only active models.
        in: query
        name: activeOnly
        required: false
        schema:
          default: false
          description: Whether to include only active models.
          title: activeOnly
          type: boolean
      - description: Whether to include only the models available for moderations.
        in: query
        name: moderationSupportedOnly
        required: false
        schema:
          default: false
          description: Whether to include only the models available for moderations.
          title: moderationSupportedOnly
          type: boolean
      - description: Whether to include only the models available for chat completions.
        in: query
        name: chatCompletionsSupportedOnly
        required: false
        schema:
          default: false
          description: Whether to include only the models available for chat completions.
          title: chatCompletionsSupportedOnly
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLLMsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List LLMs
      tags:
      - LLM Generation
  /api/v2/genai/llms/{llmId}/:
    get:
      description: Get the large language model (LLM) by ID.
      operationId: get_llm_llms__llmId___get
      parameters:
      - description: The ID of the LLM to retrieve.
        in: path
        name: llmId
        required: true
        schema:
          description: The ID of the LLM to retrieve.
          title: llmId
          type: string
      - description: If specified, include custom model LLMs available for this use case.
        in: query
        name: useCaseId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: If specified, include custom model LLMs available for this use case.
          title: useCaseId
      responses:
