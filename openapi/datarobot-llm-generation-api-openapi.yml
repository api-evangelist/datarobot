  /api/v2/genai/llmBlueprints/{llmBlueprintId}/:
    delete:
      description: Delete an existing LLM blueprint.
      operationId: delete_llm_blueprint_llmBlueprints__llmBlueprintId___delete
      parameters:
      - description: The ID of the LLM blueprint to delete.
        in: path
