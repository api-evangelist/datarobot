            application/json:
              schema:
                $ref: '#/components/schemas/LanguageModelDefinitionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Get LLM by LLM ID
      tags:
      - LLM Generation
  /api/v2/genai/playgrounds/:
    get:
      description: List playgrounds.
      operationId: list_playgrounds_playgrounds__get
      parameters:
      - description: Only retrieve the playgrounds linked to the specified use cases.
        in: query
        name: useCaseId
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 1000
            type: array
          - type: 'null'
          description: Only retrieve the playgrounds linked to the specified use cases.
          title: useCaseId
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Retrieve only the specified number of values.
          exclusiveMinimum: 0
          maximum: 100
          title: limit
          type: integer
      - description: Only retrieve the playgrounds with names matching the search query.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          description: Only retrieve the playgrounds with names matching the search query.
          title: search
      - description: Apply this sort order to the results. Valid options are "name", "description", "creationDate", "creationUserId", "lastUpdateDate", "lastUpdateUserId", "savedLLMBlueprintsCount". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
        in: query
        name: sort
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ListPlaygroundSortQueryParam'
          - type: 'null'
          description: Apply this sort order to the results. Valid options are "name", "description", "creationDate", "creationUserId", "lastUpdateDate", "lastUpdateUserId", "savedLLMBlueprintsCount". Prefix the attribute name with a dash to sort in descending order, e.g., sort=-creationDate.
          title: sort
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlaygroundsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: List playgrounds
      tags:
      - LLM Generation
    post:
      description: Create a new playground.
      operationId: create_playground_playgrounds__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaygroundRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Create playground
      tags:
      - LLM Generation
  /api/v2/genai/playgrounds/{playgroundId}/:
    delete:
      description: Delete an existing playground.
      operationId: delete_playground_playgrounds__playgroundId___delete
      parameters:
      - description: The ID of the playground to delete.
        in: path
        name: playgroundId
        required: true
        schema:
          description: The ID of the playground to delete.
          title: playgroundId
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationErrorResponse'
          description: Validation Error
      summary: Delete playground by playground ID
      tags:
      - LLM Generation
    get:
      description: Retrieve an existing playground.
      operationId: get_playground_playgrounds__playgroundId___get
      parameters:
      - description: The ID of the playground to retrieve.
        in: path
        name: playgroundId
        required: true
        schema:
          description: The ID of the playground to retrieve.
          title: playgroundId
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundResponse'
          description: Successful Response
