          type: string
      responses:
        '204':
          description: ''
        '403':
          description: User does not have permission to delete OpenTelemetry logs.
      summary: Delete all OpenTelemetry logs by entitytype
      tags:
      - data_exports_and_tracing
      x-versionadded: v2.42
    get:
      operationId: otelLogs_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
