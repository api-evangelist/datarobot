openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Data Exports And Tracing API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage data exports and tracing.
  name: data_exports_and_tracing
paths:
  /api/v2/otel/stats/:
    get:
      operationId: otelStats_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: Service name, or list of service names, of the process.
        in: query
        name: serviceName
        required: false
        schema:
          oneOf:
          - description: Service name of the process
            type: string
          - items:
              description: Service name of the process
              type: string
            maxItems: 100
            type: array
      - description: User IDs to view (must be admin to use this field).
        in: query
        name: userId
        required: false
        schema:
          oneOf:
          - description: ID of the user.
            type: string
          - items:
              description: ID of the user.
              type: string
            maxItems: 100
            type: array
      - description: The start time of the trace
        in: query
        name: startTime
        required: false
        schema:
          format: date-time
          type: string
      - description: The end time of the trace
        in: query
        name: endTime
        required: false
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtelStatsResponse'
          description: ''
      summary: Gets OTel statistics
      tags:
      - data_exports_and_tracing
      x-versionadded: v2.43
  /api/v2/otel/traces/:
    post:
      operationId: otelTraces_create
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: The start time to filter data by.
        in: query
        name: startTime
        required: false
        schema:
          format: date-time
          type: string
      - description: The end time to filter data by.
        in: query
        name: endTime
        required: false
        schema:
          format: date-time
          type: string
      - description: The list of search keys.
        in: query
        name: searchKeys
        required: false
        schema:
          oneOf:
          - maxLength: 100
            minLength: 1
            type: string
          - items:
              maxLength: 100
              minLength: 1
              type: string
            maxItems: 10
            type: array
      - description: The list of search values.
        in: query
        name: searchValues
        required: false
        schema:
          oneOf:
          - maxLength: 100
            minLength: 1
            type: string
          - items:
              maxLength: 100
              minLength: 1
              type: string
            maxItems: 10
            type: array
      - description: The minimum duration of the span in nanoseconds.
        in: query
        name: minSpanDuration
        required: false
        schema:
          type: integer
      - description: The maximum duration of the span in nanoseconds.
        in: query
        name: maxSpanDuration
        required: false
        schema:
          type: integer
      - description: The minimum duration of the trace in nanoseconds.
        in: query
        name: minTraceDuration
        required: false
        schema:
          type: integer
      - description: The minimum cost of the trace.
        in: query
        name: minTraceCost
        required: false
        schema:
          type: integer
      - description: The maximum cost of the trace.
        in: query
        name: maxTraceCost
        required: false
        schema:
          type: integer
      - description: Filter by root span name. Accepts a single value or a list of values.
        in: query
        name: rootSpanName
        required: false
        schema:
          oneOf:
          - maxLength: 200
            minLength: 1
            type: string
          - items:
              maxLength: 200
              minLength: 1
              type: string
            maxItems: 50
            type: array
      - description: Filter traces by status. Use 'error' to return only traces with at least one error span, or 'ok' to return only traces with no error spans.
        in: query
        name: status
        required: false
        schema:
          enum:
          - error
          - ok
          type: string
      - description: 'Field to sort traces by. One of: ''timestamp'', ''duration'', ''cost''. Defaults to ''timestamp''.'
        in: query
        name: sortBy
        required: false
        schema:
          enum:
          - timestamp
          - duration
          - cost
          type: string
      - description: 'Sort direction. One of: ''asc'', ''desc''. Defaults to ''desc''.'
        in: query
        name: sortDirection
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
      - description: Filter traces by trace type. Currently supports only 'gen_ai'.
        in: query
        name: traceType
        required: false
        schema:
          enum:
          - gen_ai
          type: string
      - description: Filter by gen_ai.tool.name. Repeat the query parameter for each tool name (up to 50 names, each at most 100 characters). Returns traces that include at least one span using any of the listed tools.
        in: query
        name: tools
        required: false
        schema:
          oneOf:
          - maxLength: 100
            minLength: 1
            type: string
          - items:
              maxLength: 100
              minLength: 1
              type: string
            maxItems: 50
            minItems: 1
            type: array
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtelEntityList'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracingListResponse'
          description: ''
      summary: List OpenTelemetry traces
      tags:
      - data_exports_and_tracing
      x-versionadded: v2.50
