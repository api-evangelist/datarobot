          type: string
      - description: The end time to filter data by.
        in: query
        name: endTime
        required: false
        schema:
          format: date-time
          type: string
      - description: The list of search keys.
        in: query
        name: searchKeys
        required: false
        schema:
          oneOf:
          - maxLength: 100
            minLength: 1
            type: string
          - items:
              maxLength: 100
              minLength: 1
              type: string
            maxItems: 10
            type: array
      - description: The list of search values.
        in: query
        name: searchValues
        required: false
        schema:
          oneOf:
          - maxLength: 100
            minLength: 1
            type: string
          - items:
              maxLength: 100
              minLength: 1
              type: string
            maxItems: 10
            type: array
      - description: The minimum log level of logs to include.
        in: query
        name: level
        required: false
        schema:
          default: debug
          enum:
          - debug
          - info
          - warn
          - warning
          - error
          - critical
          type: string
      - description: The list of strings that must be included in the log entry.
        in: query
        name: includes
        required: false
        schema:
          oneOf:
          - maxLength: 100
            minLength: 1
            type: string
          - items:
              maxLength: 100
              minLength: 1
              type: string
            maxItems: 10
            type: array
      - description: The list of values that must be excluded from the log entry.
        in: query
        name: excludes
        required: false
        schema:
          oneOf:
          - maxLength: 100
            minLength: 1
            type: string
          - items:
              maxLength: 100
              minLength: 1
              type: string
            maxItems: 10
            type: array
      - description: The OTel span ID the logs must be associated with (if any).
        in: query
        name: spanId
        required: false
        schema:
          type: string
      - description: The OTel trace ID the logs must be associated with (if any).
        in: query
        name: traceId
        required: false
        schema:
          type: string
      - description: The type of the entity to which the logs belong.
        in: path
        name: entityType
        required: true
        schema:
          enum:
          - deployment
          - use_case
          - experiment_container
          - custom_application
          - workload
          - execution_environment
          - custom_job
          - artifact
          type: string
      - description: The ID of the entity to which the logs belong.
        in: path
        name: entityId
        required: true
        schema:
          type: string
      responses:
        '200':
