openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Data Wrangling API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: This page outlines the operations and endpoints for data wrangling (preparation).
  name: data_wrangling
paths:
  /api/v2/recipes/:
    get:
      description: Get a list of the recipes available for given user.
      operationId: recipes_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: 'The attribute sort order applied to the returned recipes list: ''recipe_id'', ''name'', ''description'', ''dialect'', ''status'', ''recipe_type'', ''created_at'', ''created_by'', ''updated_at'', ''updated_by''. Prefix the attribute name with a dash to sort in descending order. e.g., orderBy=''-name''. Defaults to ''-created''.'
        in: query
        name: orderBy
        required: false
        schema:
          default: -updatedAt
          enum:
          - recipeId
          - -recipeId
          - name
          - -name
          - description
          - -description
          - dialect
          - -dialect
          - status
          - -status
          - recipeType
          - -recipeType
          - createdAt
          - -createdAt
          - createdBy
          - -createdBy
          - updatedAt
          - -updatedAt
          - updatedBy
          - -updatedBy
          type: string
      - description: Only return recipes with names that contain the specified string.
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: SQL dialect for Query Generator.
        in: query
        name: dialect
        required: false
        schema:
          oneOf:
          - enum:
            - snowflake
            - bigquery
            - spark-feature-discovery
            - databricks
            - spark
            - postgres
            type: string
          - items:
              enum:
              - snowflake
              - bigquery
              - spark-feature-discovery
              - databricks
              - spark
              - postgres
              type: string
            type: array
      - description: Status used for filtering recipes.
        in: query
        name: status
        required: false
        schema:
          oneOf:
          - enum:
            - draft
            - preview
            - published
            type: string
          - items:
              enum:
              - draft
              - preview
              - published
              type: string
            type: array
      - description: Type of the recipe workflow.
        in: query
        name: recipeType
        required: false
        schema:
          oneOf:
          - enum:
            - sql
            - Sql
            - SQL
            - wrangling
            - Wrangling
            - WRANGLING
            - featureDiscovery
            - FeatureDiscovery
            - FEATURE_DISCOVERY
            - featureDiscoveryPrivatePreview
            - FeatureDiscoveryPrivatePreview
            - FEATURE_DISCOVERY_PRIVATE_PREVIEW
            type: string
          - items:
              enum:
              - sql
              - Sql
              - SQL
              - wrangling
              - Wrangling
              - WRANGLING
              - featureDiscovery
              - FeatureDiscovery
              - FEATURE_DISCOVERY
              - featureDiscoveryPrivatePreview
              - FeatureDiscoveryPrivatePreview
              - FEATURE_DISCOVERY_PRIVATE_PREVIEW
              type: string
            type: array
      - description: Filter results to display only those created by user(s) associated with the specified ID.
        in: query
        name: creatorUserId
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
      - description: Filter results to display only those created by user(s) associated with the specified username.
        in: query
        name: creatorUsername
        required: false
        schema:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipesListResponse'
          description: ''
      summary: List recipes
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/fromDataStore/:
    post:
      description: Create a recipe which could be used for wrangling from a created fully reconfigured source of data. A `data source` specifies, via SQL query or selected table and schema data, which data to extract from the `data connection` (the location of data within a given endpoint) to use for modeling or predictions. A `data source` has one `data connection` and one `connector` but can have many `datasets`.
      operationId: recipesFromDataStore_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeFromDataSourceCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
          description: Data source and recipe created successfully.
      summary: Create a recipe and a data source
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/fromDataset/:
    post:
      description: Create a recipe which could be used for wrangling from given dataset. Deepcopy the dataset's recipe if available.Otherwise create a new recipe reusing the dataset's data source.A `data source` specifies, via SQL query or selected table and schema data, which data to extract from the `data connection` (the location of data within a given endpoint) to use for modeling or predictions. A `data source` has one `data connection` and one `connector` but can have many `datasets`.
      operationId: recipesFromDataset_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRecipeFromDataset'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
          description: Recipe created successfully.
        '422':
          description: You can't specify `dialect` or `inputs` when source Recipe is available.
      summary: Create a recipe given dataset
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/fromRecipe/:
    post:
      description: Shallow copy the given recipe, reusing existing data sources. Implicitly creates duplicate of wrangling session.
      operationId: recipesFromRecipe_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeFromRecipeCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
          description: Recipe created successfully.
      summary: Clone given wrangling recipe
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/{recipeId}/:
    delete:
      description: Marks the wrangling recipe with a given ID as deleted.
      operationId: recipes_delete
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeSettingsUpdate'
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSettingsResponse'
          description: Successfully deleted.
      summary: Deletes the wrangling recipe by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
    get:
      description: Retrieve a wrangling recipe given ID.
      operationId: recipes_retrieve
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
          description: ''
      summary: Retrieve a wrangling recipe by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
    patch:
      description: Patch a wrangling recipe name and description
      operationId: recipes_patch
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRecipe'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
          description: ''
      summary: Patched wrangling recipe by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/{recipeId}/downsampling/:
    put:
      description: Updates the downsampling directive in the recipe.Downsampling will be applied on top of the recipe during publishing.
      operationId: recipesDownsampling_putMany
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeDownsamplingUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
          description: ''
        '422':
          description: Cannot modify published recipe.
      summary: Updates the downsampling by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/{recipeId}/inputs/:
    get:
      description: Gets inputs of the given recipe.
      operationId: recipesInputs_list
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeInputsResponse'
          description: ''
      summary: Gets inputs by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
    put:
      description: Set the inputs on a recipe to change the configuration. Implicitly restart the initial sampling job which calculates:1) Column names;2) resulting size of the sample in bytes;3) resulting size of the sample in rows.
      operationId: recipesInputs_putMany
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInputUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
          description: ''
      summary: Sets the input of the given recipe by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.35
  /api/v2/recipes/{recipeId}/insights/:
    get:
      description: Retrieve recipe insights.
      operationId: recipesInsights_list
      parameters:
      - description: At most this many results are returned. The default may change and a maximum limit may be imposed without notice.
        in: query
        name: limit
        required: true
        schema:
          default: 100
          maximum: 100
          minimum: 0
          type: integer
      - description: This many results will be skipped.
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number indicating how many operations from the beginning to return insights for.
        in: query
        name: numberOfOperationsToUse
        required: false
        schema:
          minimum: 0
          type: integer
        x-versionadded: v2.35
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefinexInsightsResponse'
          description: ''
      summary: Retrieve recipe insights by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/{recipeId}/operations/:
    put:
      description: Updates the operations in a recipe by saving new directives. To validate the new operations, run preview validation and SQL generation. To apply them to the new recipe, you must run a request to preview the results must be run.
      operationId: recipesOperations_putMany
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeOperationsUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
          description: ''
        '409':
          description: Operations can't be applied due to a wrangling session state.
        '422':
          description: Cannot modify published recipe.
      summary: Update the operations by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.35
  /api/v2/recipes/{recipeId}/operations/{operationIndex}/:
    get:
      description: Returns an operation configuration with an additional *inputColumns* field to show the list of columns available at that stage.
      operationId: recipesOperations_retrieve
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      - description: The zero-based index of the operation.
        in: path
        name: operationIndex
        required: true
        schema:
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetails'
          description: ''
      summary: Retrieve a recipe operation details by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/{recipeId}/preview/:
    get:
      description: Retrieve a wrangling preview given ID.
      operationId: recipesPreview_list
      parameters:
      - description: The number of results to skip.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned. The default may change without notice.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          maximum: 1000
          type: integer
      - description: The number indicating how many operations from the beginning to retrieve a preview for.
        in: query
        name: numberOfOperationsToUse
        required: false
        schema:
          minimum: 0
          type: integer
        x-versionadded: v2.35
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipePreviewResponse'
          description: ''
      summary: Retrieve a wrangling preview by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
    post:
      description: 'Starts the preview process for the recipe. Since this is an asynchronous process this endpoint returns a status ID to use with the status endpoint and a location header with the URL that can be polled for status.Launch WranglingJob, which includes:

        1. InitialSamplingJob if it hasn’t been launched before

        2. Preview query itself

        3. Launch recipe eda job


        Insights computation is launched implicitly if there was sampling specified and no operations specified.'
      operationId: recipesPreview_create
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeRunPreviewAsync'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: ''
        '422':
          description: Credentials were not provided and default credentials were not found.
      summary: Start the job by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/{recipeId}/relationshipQualityAssessments/:
    post:
      description: Submit a job to assess the quality of the relationship configuration within a Feature Discovery session in Workbench.
      operationId: recipesRelationshipQualityAssessments_create
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipQualityAssessmentsCreate'
      responses:
        '202':
          description: Relationship quality assessment has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
        '422':
          description: Unable to process the request
      summary: Submit a relationship quality assessment job by recipe ID
      tags:
      - data_wrangling
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables support of late project creation in Feature Discovery to separate feature selection from the Feature Discovery editor.
        enabled_by_default: true
        maturity: GA_ALL
        name: FEATURE_DISCOVERY_LATE_PROJECT_CREATION
      - description: Allows users to perform Feature Discovery on datasets in Workbench.
        enabled_by_default: true
        maturity: GA_ALL
        name: UXR_FEATURE_DISCOVERY
      x-versionadded: v2.35
  /api/v2/recipes/{recipeId}/settings/:
    patch:
      description: Updates some recipe settings applicable in the modeling stage.
      operationId: recipesSettings_patchMany
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeSettingsUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSettingsResponse'
          description: ''
      summary: Updates recipe settings by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/{recipeId}/sql/:
    post:
      description: Builds a SQL query for the recipe. Overrides operations to get the adjusted query without changing the recipe.
      operationId: recipesSql_create
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildRecipeSql'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildRecipeSqlResponse'
          description: ''
        '409':
          description: Input source data is not ready yet.
        '422':
          description: Failed to build SQL.
      summary: Build SQL query by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.33
  /api/v2/recipes/{recipeId}/timeseriesTransformationPlans/:
    post:
      description: Generate a list of recipe operations, which serve as the plan to transform a regular dataset into a time series dataset.
      operationId: recipesTimeseriesTransformationPlans_create
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTransformationPlan'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: ''
      summary: Generate a time series transformation plan by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.36
  /api/v2/recipes/{recipeId}/timeseriesTransformationPlans/{id}/:
    get:
      description: Returns a list of recipe operations, which serve as the plan to transform a regular dataset into a time series dataset.
      operationId: recipesTimeseriesTransformationPlans_retrieve
      parameters:
      - description: The ID of the recipe.
        in: path
        name: recipeId
        required: true
        schema:
          type: string
      - description: The ID of the transformation plan.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationPlanResponse'
          description: ''
      summary: Retrieve generated time series transformation plan by recipe ID
      tags:
      - data_wrangling
      x-versionadded: v2.36
  /api/v2/sparkSessions/:
    delete:
      description: Stop the underlying interactive Spark session, if applicable.
      operationId: sparkSessions_deleteMany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopSession'
      responses:
        '204':
          description: ''
      summary: Stop wrangling session
      tags:
      - data_wrangling
      x-versionadded: v2.38
components:
  schemas:
    DatetimeSampleArgumentsCreate:
      description: The interactive sampling config.
      properties:
        datetimePartitionColumn:
          description: The datetime partition column to order by.
          type: string
          x-versionadded: v2.33
        multiseriesIdColumn:
          default: null
          description: The series ID column, if present.
          type:
          - string
          - 'null'
          x-versionadded: v2.33
        rows:
          default: 10000
          description: The number of rows to be sampled.
          maximum: 10000
          minimum: 1
          type: integer
          x-versionadded: v2.33
        selectedSeries:
          description: The selected series to be sampled. Requires "multiseriesIdColumn".
          items:
            type: string
          maxItems: 1000
          minItems: 1
          type:
          - array
          - 'null'
          x-versionadded: v2.33
        skip:
          default: false
          description: If True, this directive will be skipped during processing.
          type: boolean
          x-versionadded: v2.37
        strategy:
          default: earliest
          description: Sets whether to take the latest or earliest rows relative to the datetime partition column.
          enum:
          - earliest
          - latest
          type: string
          x-versionadded: v2.33
      required:
      - datetimePartitionColumn
      - skip
      - strategy
      type: object
    RecipeFromRecipeCreate:
      properties:
        name:
          description: The recipe name.
          maxLength: 255
          type: string
          x-versionadded: v2.33
        recipeId:
          description: Recipe ID to create a Recipe from.
          type: string
          x-versionadded: v2.33
      required:
      - recipeId
      type: object
    BaseNumericStatsArguments:
      description: Task arguments.
      properties:
        methods:
          description: Methods to apply in a rolling window.
          items:
            enum:
            - avg
            - max
            - median
            - min
            - stddev
            type: string
          maxItems: 10
          minItems: 1
          type: array
        skip:
          default: false
          description: If True, this directive will be skipped during processing.
          type: boolean
          x-versionadded: v2.37
        windowSize:
          description: Rolling window size, defined in terms of rows. Left end is exclusive, right end is inclusive.
          exclusiveMinimum: 0
          maximum: 300
          type: integer
      required:
      - methods
      - skip
      - windowSize
      type: object
      x-versionadded: v2.35
    DropColumnsArguments:
      description: The transformation description.
      properties:
        columns:
          description: The list of columns.
          items:
            type: string
          maxItems: 1000
          minItems: 1
          type: array
          x-versionadded: v2.33
        keepColumns:
          default: false
          description: If True, keep only the specified columns. If False (default), drop the specified columns.
          type: boolean
          x-versionadded: v2.37
        skip:
          default: false
          description: If True, this directive will be skipped during processing.
          type: boolean
          x-versionadded: v2.37
      required:
      - columns
      - skip
      type: object
    DatasetInputCreate:
      description: Dataset configuration.
      properties:
        sampling:
          $ref: '#/components/schemas/DatasetInputSampling'
          default: null
          x-versionadded: v2.33
      type: object
    ReplaceDirectiveArguments:
      description: The transformation description.
      properties:
        isCaseSensitive:
          default: true
          description: The flag indicating if the "search_for" value is case-sensitive.
          type: boolean
          x-versionadded: v2.33
        matchMode:
          description: The match mode to use when detecting "search_for" values.
          enum:
          - partial
          - exact
          - regex
          type: string
          x-versionadded: v2.33
        origin:
          description: The place name to look for in values.
          type: string
          x-versionadded: v2.33
        replacement:
          default: ''
          description: The replacement value.
          type: string
          x-versionadded: v2.33
        searchFor:
          description: Indicates what needs to be replaced.
          type: string
          x-versionadded: v2.33
        skip:
          default: false
          description: If True, this directive will be skipped during processing.
          type: boolean
          x-versionadded: v2.37
      required:
      - matchMode
      - origin
      - searchFor
      - skip
      type: object
    LimitDirectiveArguments:
      description: The interactive sampling config.
      properties:
        rows:
          default: 1000
          description: The number of rows to be selected.
          maximum: 10000
          minimum: 1
          type: integer
