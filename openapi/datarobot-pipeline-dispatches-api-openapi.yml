    TaskExecutionResponse:
      description: "Response schema for a single task execution record.\n\nAttributes:\n    task_id: Pipeline-level sequential task number, e.g. ``1``, ``2``,\n        ``3``.  Use this as the ``{task_id}`` path parameter for per-task\n        endpoints.  ``None`` for internal utility nodes with no user\n        ``@task`` backing.\n    node_id: Per-dispatch execution node id.  Pass as ``?nodeId=`` to\n        per-task endpoints to address a specific invocation when the same\n        ``@task`` function runs more than once in a single dispatch\n        (fan-out).  Each invocation has a distinct ``nodeId`` even when\n        they share the same ``taskId``.  ``None`` for legacy rows that\n        pre-date node-id tracking.\n    graph_node_id: The static graph node ``id`` (from\n        ``GET .../graph``) this execution corresponds to.  Stable\n        across every dispatch of the same pipeline version, so the UI\n        can join execution status/logs/results to the exact graph box\n        even for fan-out.  ``None`` when no 1:1 match against the\n        static graph exists (call sites inside loops, helper-wrapped\n        tasks) or for rows created before this field was introduced.\n    name: The ``@task`` function name.\n    status: Current ``TaskExecutionStatus`` value.\n    started_at: When execution began, or ``None`` if not yet started.\n    completed_at: When execution finished, or ``None`` if still running.\n    error_detail: Failure message when ``status == FAILED``.\n    resource_bundle_id: MMS resource-bundle id/alias the task actually ran\n        on (resolved at dispatch — declared value, or the service default\n        for undeclared tasks). ``None`` only for legacy rows."
      properties:
        completedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completedat
        errorDetail:
          anyOf:
          - type: string
          - type: 'null'
          title: Errordetail
        graphNodeId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Graphnodeid
        name:
          title: Name
          type: string
        nodeId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Nodeid
        resourceBundleId:
          anyOf:
          - type: string
          - type: 'null'
          title: Resourcebundleid
        startedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Startedat
        status:
          title: Status
          type: string
        taskId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Taskid
      required:
