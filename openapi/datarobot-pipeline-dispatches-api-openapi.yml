  /api/v2/pipelines/{pipeline_id}/dispatches/{dispatch_id}/tasks:
    get:
      description: 'List all task execution records for a dispatch.


        Returns the per-``@task`` execution status for every task in the

        dispatch, ordered by covalent node id. Returns an empty list when no

        callbacks have been received yet (dispatch still pending).'
      operationId: list_task_executions_api_v2_pipelines__pipeline_id__dispatches__dispatch_id__tasks_get
      parameters:
      - in: path
        name: pipeline_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipeline Id
          type: string
      - in: path
        name: dispatch_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Dispatch Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TaskExecutionResponse'
                title: Response List Task Executions Api V2 Pipelines  Pipeline Id  Dispatches  Dispatch Id  Tasks Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Task Executions
      tags:
      - pipeline-dispatches
  /api/v2/pipelines/{pipeline_id}/dispatches/{dispatch_id}/tasks/{task_id}:
    get:
      description: 'Get the execution record for a single task in a dispatch.


        ``task_id`` is the public sequential task number (1, 2, 3, …) as

        returned by the pipeline tasks endpoint. Pass ``?nodeId=`` to address a

        specific fan-out invocation when the same ``@task`` runs at multiple

        graph nodes. Without ``nodeId``, a fan-out task returns 409 listing the

        candidate node ids — never another invocation''s data. Returns 404 when

        no execution record exists.'
      operationId: get_task_execution_api_v2_pipelines__pipeline_id__dispatches__dispatch_id__tasks__task_id__get
      parameters:
      - in: path
        name: pipeline_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipeline Id
          type: string
      - in: path
        name: dispatch_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Dispatch Id
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: integer
      - description: Node id of a specific fan-out invocation (the `nodeId` field on the task list response).  Required when the same @task ran at multiple graph nodes — omitting it then returns 409 with the candidate node ids.  May be omitted for tasks with a single execution.
        in: query
        name: nodeId
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Node id of a specific fan-out invocation (the `nodeId` field on the task list response).  Required when the same @task ran at multiple graph nodes — omitting it then returns 409 with the candidate node ids.  May be omitted for tasks with a single execution.
          title: Nodeid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskExecutionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Task Execution
      tags:
      - pipeline-dispatches
  /api/v2/pipelines/{pipeline_id}/dispatches/{dispatch_id}/tasks/{task_id}/logs:
    get:
      description: 'Read the K8s pod logs for a task execution.


        Under standalone dispatch (flag on) this reads the newest pod''s

        stdout+stderr for the task''s K8s Job via

        ``core_v1.read_namespaced_pod_log``. Under the legacy covalent

        path the pod lives inside covalent-cloud-server''s cluster —

        pipelines-api does not own it and this endpoint returns an

        empty string; callers should hit covalent''s own log endpoint

        for those dispatches.


        ``verbosity`` (see ``specs/task_log_verbosity_filter.md``)

        defaults to hiding the task runner''s own structured JSON

        bookkeeping. Note: ``tail_lines`` is applied by Kubernetes to the

        *raw* log before filtering, so pairing a small ``tail_lines``

        with the default ``verbosity="user"`` can return fewer lines than

        requested — in the extreme, an empty string if the tailed window

        happens to be mostly runner-internal noise.'
      operationId: get_task_logs_api_v2_pipelines__pipeline_id__dispatches__dispatch_id__tasks__task_id__logs_get
      parameters:
      - in: path
        name: pipeline_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipeline Id
          type: string
      - in: path
        name: dispatch_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Dispatch Id
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: integer
      - description: Node id of a specific fan-out invocation (the `nodeId` field on the task list response).  Required when the same @task ran at multiple graph nodes — omitting it then returns 409 with the candidate node ids.  May be omitted for tasks with a single execution.
        in: query
        name: nodeId
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Node id of a specific fan-out invocation (the `nodeId` field on the task list response).  Required when the same @task ran at multiple graph nodes — omitting it then returns 409 with the candidate node ids.  May be omitted for tasks with a single execution.
          title: Nodeid
      - description: Optional cap on the number of trailing log lines returned.
        in: query
        name: tail_lines
        required: false
        schema:
          anyOf:
          - maximum: 10000
            minimum: 1
            type: integer
          - type: 'null'
          description: Optional cap on the number of trailing log lines returned.
          title: Tail Lines
      - description: '''user'' (default): hide the task runner''s own structured JSON log lines, showing only the task function''s own output (plus any uncaught-exception traceback). ''all'': return every line, unfiltered — the behavior every caller got before this parameter existed.'
        in: query
        name: verbosity
        required: false
        schema:
          default: user
          description: '''user'' (default): hide the task runner''s own structured JSON log lines, showing only the task function''s own output (plus any uncaught-exception traceback). ''all'': return every line, unfiltered — the behavior every caller got before this parameter existed.'
          enum:
          - user
          - all
          title: Verbosity
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskExecutionLogsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Task Logs
      tags:
      - pipeline-dispatches
  /api/v2/pipelines/{pipeline_id}/dispatches/{dispatch_id}/tasks/{task_id}/logs/{stream}:
    get:
      description: 'Return the inline content of a task''s captured stdout/stderr log.


        The task runner tees its own stdout + stderr into

        in-memory buffers and uploads them to

        ``dispatches//outputs//{stdout,stderr}.log``

        at process exit (action 186''s ``pod_logs.LogCapture``). This

        endpoint reads that S3 blob itself, UTF-8 decodes it, and

        returns the content directly (no presigned URL) — the sibling

        ``.../logs`` endpoint reads live K8s pod logs which stop

        working ~60 s after Job terminal when kubelet TTL-GCs the pod.

        See ``specs/task_durable_log_inline_content.md`` and

        ``specs/task_log_verbosity_filter.md``.


        Path parameter ``stream`` must be ``"stdout"`` or

        ``"stderr"``; anything else returns 400.


        ``verbosity`` defaults to hiding the task runner''s own

        structured JSON bookkeeping (applied before the inline-response

        truncation cap, so filtering out noise can bring an otherwise

        oversized blob back under the cap). ``total_bytes`` in the

        response always reflects the raw S3 object size regardless of

        ``verbosity``; only ``content`` and ``truncated`` vary.


        Status codes:


        - **200** — body is :class:`TaskExecutionDurableLogResponse`.

        - **400** — ``stream`` param is not ``stdout``/``stderr``.

        - **404** — Dispatch, task, or execution row not found.

        - **409** — Task ran at multiple graph nodes and no ``?nodeId=``

        was given (detail lists the candidate node ids).

        - **500** — Task execution finished but the log blob is

        missing from S3 (runner''s upload path failed).'
      operationId: get_task_durable_log_url_api_v2_pipelines__pipeline_id__dispatches__dispatch_id__tasks__task_id__logs__stream__get
      parameters:
      - in: path
        name: pipeline_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipeline Id
          type: string
      - in: path
        name: dispatch_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Dispatch Id
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: integer
      - in: path
        name: stream
        required: true
        schema:
          title: Stream
          type: string
      - description: Node id of a specific fan-out invocation (the `nodeId` field on the task list response).  Required when the same @task ran at multiple graph nodes — omitting it then returns 409 with the candidate node ids.  May be omitted for tasks with a single execution.
        in: query
        name: nodeId
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Node id of a specific fan-out invocation (the `nodeId` field on the task list response).  Required when the same @task ran at multiple graph nodes — omitting it then returns 409 with the candidate node ids.  May be omitted for tasks with a single execution.
          title: Nodeid
      - description: '''user'' (default): hide the task runner''s own structured JSON log lines, showing only the task function''s own output (plus any uncaught-exception traceback). ''all'': return every line, unfiltered — the behavior every caller got before this parameter existed.'
        in: query
        name: verbosity
        required: false
        schema:
          default: user
          description: '''user'' (default): hide the task runner''s own structured JSON log lines, showing only the task function''s own output (plus any uncaught-exception traceback). ''all'': return every line, unfiltered — the behavior every caller got before this parameter existed.'
          enum:
          - user
          - all
          title: Verbosity
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskExecutionDurableLogResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Task Durable Log Url
      tags:
      - pipeline-dispatches
  /api/v2/pipelines/{pipeline_id}/dispatches/{dispatch_id}/tasks/{task_id}/result:
    get:
      description: 'Return a presigned S3 URL for a completed task''s result blob.


        The blob is a raw cloudpickle payload — the task runner writes

        it directly to S3 at ``dispatches//outputs//result.tobj``.

        Callers download the URL directly from S3 and decode with

        ``cloudpickle.loads(response.content)``. pipelines-api never

        proxies the payload (avoids the RCE risk of pickle-loading

        untrusted user output on the server, and scales to results of

        any size).


        Status codes:


        - **200** — URL signed; body is :class:`TaskExecutionResultResponse`.

        - **404** — Dispatch, task, or execution row not found (or the

        dispatch is not owned by the caller).

        - **409** — Task exists but has not yet reached ``COMPLETED`` state

        (detail includes the current status so a polling client can

        distinguish "keep polling" from "stop"), **or** the task ran at

        multiple graph nodes and no ``?nodeId=`` was given (detail lists

        the candidate node ids).

        - **500** — Task is ``COMPLETED`` but the ``result.tobj`` blob is

        missing from S3. Server-side inconsistency; not a caller error.'
      operationId: get_task_result_url_api_v2_pipelines__pipeline_id__dispatches__dispatch_id__tasks__task_id__result_get
      parameters:
      - in: path
        name: pipeline_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipeline Id
          type: string
      - in: path
        name: dispatch_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Dispatch Id
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: integer
      - description: Node id of a specific fan-out invocation (the `nodeId` field on the task list response).  Required when the same @task ran at multiple graph nodes — omitting it then returns 409 with the candidate node ids.  May be omitted for tasks with a single execution.
        in: query
        name: nodeId
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Node id of a specific fan-out invocation (the `nodeId` field on the task list response).  Required when the same @task ran at multiple graph nodes — omitting it then returns 409 with the candidate node ids.  May be omitted for tasks with a single execution.
          title: Nodeid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskExecutionResultResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Task Result Url
      tags:
      - pipeline-dispatches
