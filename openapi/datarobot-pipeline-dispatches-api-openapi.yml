  /api/v2/pipelines/{pipeline_id}/dispatches/{dispatch_id}/status:
    get:
      description: Get the current status of a draft dispatch (lightweight polling).
      operationId: get_draft_dispatch_status_api_v2_pipelines__pipeline_id__dispatches__dispatch_id__status_get
      parameters:
      - in: path
        name: pipeline_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipeline Id
