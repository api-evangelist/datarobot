          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Dispatch Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Cancel Draft Dispatch
      tags:
      - pipeline-dispatches
    get:
      description: Get details of a draft dispatch.
      operationId: get_draft_dispatch_api_v2_pipelines__pipeline_id__dispatches__dispatch_id__get
      parameters:
      - in: path
        name: pipeline_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Pipeline Id
          type: string
      - in: path
        name: dispatch_id
        required: true
        schema:
          maxLength: 24
          minLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          title: Dispatch Id
          type: string
      responses:
        '200':
          content:
