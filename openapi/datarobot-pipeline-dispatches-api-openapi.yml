              schema:
                $ref: '#/components/schemas/PipelineDispatchResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Draft Dispatch
      tags:
