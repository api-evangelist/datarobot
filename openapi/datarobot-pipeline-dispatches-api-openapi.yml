    PipelineDispatchStatus:
      description: 'Lifecycle status of a pipeline dispatch.


        ``PREPARING`` is the transient state a dispatch enters at

        creation while the prep-Pod (see

        ``specs/dispatch_prep_pod_implementation_plan.md``) traces the

        transport graph in the user''s own image + uploads it to S3.

        On the prep-Pod''s callback the dispatch flips to ``RUNNING``

        and per-task Jobs start submitting; on prep failure it

        flips to ``FAILED`` without any task rows ever having been

        created.'
      enum:
      - PENDING
      - PREPARING
      - RUNNING
      - COMPLETED
      - FAILED
      - CANCELLED
      - ERRORED
      title: PipelineDispatchStatus
      type: string
    TaskExecutionDurableLogResponse:
      description: "Inline content of a task's S3-uploaded stdout/stderr log.\n\nThe task runner tees its own stdout + stderr into in-memory\nbuffers and uploads them to\n``dispatches/<did>/outputs/<node_id>/{stdout,stderr}.log`` on\nprocess exit (see action 186's ``pod_logs.LogCapture``). This\nendpoint reads that blob itself, UTF-8 decodes it, and hands the\ncontent back directly — no presigned URL, no second\nunauthenticated request to S3 required from the caller. Callers\nuse it for post-mortem debugging after the pod has been TTL-GC'd\n(kubelet drops it 60 s after Job terminal, so the live-pod-log\nendpoint stops working past that window; the S3 upload is the\ndurable copy). See ``specs/task_durable_log_inline_content.md`` and\n``specs/task_log_verbosity_filter.md``.\n\nAttributes:\n    content: UTF-8 decoded log content, subject to the\n        ``verbosity`` query param: by default the task\n        runner's own structured JSON log lines are removed\n        (uncaught-exception tracebacks are always kept — they're\n        plain text on the runner side, never JSON). Invalid byte\n        sequences are replaced, never raised on. When\n        ``truncated`` is ``True`` this is a head+tail excerpt of\n        the (already-filtered) content, not the full blob.\n    content_type: MIME type of the payload. Fixed to\n        ``text/plain`` because the log blob is UTF-8 encoded\n        plain text.\n    total_bytes: Size in bytes of the full S3 object, independent\n        of any inline truncation applied to ``content`` **and**\n        independent of ``verbosity`` — this always reflects the\n        raw blob size, not the filtered content's size.\n    truncated: ``True`` iff ``content`` is a head+tail excerpt\n        because the *filtered* content exceeded the inline\n        response cap (``Settings.task_log_inline_max_bytes``).\n    filtered_line_count: Number of lines the verbosity filter\n        removed. Always ``0`` when ``verbosity=all`` was\n        requested."
      properties:
        content:
          description: UTF-8 decoded log content (invalid byte sequences replaced, never raises). When `truncated` is true, this is a head+tail excerpt, not the full blob.
          title: Content
          type: string
        contentType:
          default: text/plain
          description: MIME type of the log payload.
          title: Contenttype
          type: string
        filteredLineCount:
          default: 0
          description: Number of lines removed by the verbosity filter. Always 0 when verbosity=all.
          minimum: 0.0
          title: Filteredlinecount
          type: integer
        totalBytes:
          description: Size in bytes of the full S3 object, independent of any inline truncation.
          minimum: 0.0
          title: Totalbytes
          type: integer
        truncated:
          default: false
          description: True iff `content` is a head+tail excerpt because the verbosity-filtered content exceeded the inline response cap. Not directly comparable to `total_bytes`, which reflects the raw (unfiltered) blob size.
          title: Truncated
          type: boolean
      required:
      - content
      - totalBytes
      title: TaskExecutionDurableLogResponse
      type: object
    TaskExecutionResultResponse:
      description: "Presigned-URL response for a completed task's cloudpickled result.\n\nHanded back by ``GET .../dispatches/{dispatch_id}/tasks/{task_id}/result``\nonce a task reaches ``COMPLETED`` state and its ``result.tobj`` blob\nis present in S3. The caller GETs ``url`` directly from S3 to\nstream the payload — pipelines-api never proxies the bytes, which\nkeeps the response independent of result size and side-steps the\nRCE risk of cloudpickle-loading untrusted user output on the server.\n\n``value`` / ``value_available`` / ``value_unavailable_reason`` are an\nadditive, optional JSON-safe preview of the same result — populated\nfrom a small manifest the task runner writes alongside\n``result.tobj`` (see ``specs/task_result_preview.md``). Unlike\n``result.tobj``, decoding this manifest is safe to do server-side:\n``json.loads`` cannot execute arbitrary code the way\n``cloudpickle.loads`` can. ``url`` / ``expires_in`` / ``content_type``\nare always populated once the task is ``COMPLETED``, independent of\nwhether a preview is available.\n\n``value_text`` / ``value_text_truncated`` add a human-readable\n``str(result)`` preview the runner emits for *every* result — even\nnon-JSON-serializable or oversized ones the JSON ``value`` can't\nrepresent — so a UI always has something to display. Unlike JSON, the\ntext repr is truncatable, closing the ``not_json_serializable`` /\n``too_large`` gaps.\n\nAttributes:\n    url: Presigned ``https://`` URL granting ``GetObject`` on the\n        task's ``result.tobj`` blob. Time-limited by\n        ``expires_in``; treat as one-shot.\n    expires_in: Validity window in seconds from the signing\n        moment. Default 900 (15 min).\n    content_type: MIME type the caller should expect on the\n        downloaded body. Fixed to ``application/octet-stream``\n        because the payload is a raw cloudpickle blob; callers\n        decode with ``cloudpickle.loads(response.content)``.\n    value: JSON-decoded preview of the task's return value, when\n        available. ``None`` both when no preview exists AND when the\n        task legitimately returned ``None`` — use ``value_available``\n        to disambiguate.\n    value_available: ``True`` iff ``value`` reflects an actual\n        preview.\n    value_unavailable_reason: Set iff ``value_available`` is\n        ``False``, explaining why no preview could be produced. One\n        of ``\"not_json_serializable\"`` (the return value isn't\n        JSON-safe), ``\"too_large\"`` (exceeded the preview size cap),\n        or ``\"unavailable\"`` (no preview was ever recorded — a\n        pre-feature task, or the preview upload itself failed).\n        ``None`` when ``value_available`` is ``True``.\n    value_text: Human-readable ``str(result)`` preview the runner\n        embeds in *every* manifest branch — present even when the\n        JSON ``value`` is unavailable, so a UI always has something\n        to render for non-JSON-serializable or oversized results.\n        Possibly truncated (see ``value_text_truncated``); the full\n        object is always available via ``url``. ``None`` only for\n        tasks whose manifest predates this field.\n    value_text_truncated: ``True`` iff ``value_text`` was cut to the\n        configured character cap — download the full object via\n        ``url`` for the complete value."
      properties:
        contentType:
          default: application/octet-stream
          description: MIME type of the payload the URL serves.
          title: Contenttype
          type: string
        expiresIn:
          description: URL validity window in seconds from the moment it was signed.
          exclusiveMinimum: 0.0
          title: Expiresin
          type: integer
        url:
          description: Presigned S3 URL for the result blob.
          title: Url
          type: string
        value:
          anyOf:
          - {}
          - type: 'null'
          description: JSON-decoded preview of the task's return value, when available.
          title: Value
        valueAvailable:
          default: false
          description: True iff `value` reflects an actual preview. Needed because a task can legitimately return None/null, which is otherwise indistinguishable from no preview being available.
          title: Valueavailable
          type: boolean
        valueText:
          anyOf:
          - type: string
          - type: 'null'
          description: Human-readable `str()` preview of the task's return value, present even when the JSON `value` is unavailable (non-JSON-serializable or oversized results). Possibly truncated (see `value_text_truncated`). The full object is always available via `url`. `None` only for pre-feature tasks whose manifest predates this field, or when no preview was recorded at all.
          title: Valuetext
        valueTextTruncated:
          default: false
          description: True iff `value_text` was cut to the configured character cap. When True, download the full object via `url` to see the complete value.
          title: Valuetexttruncated
          type: boolean
        valueUnavailableReason:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Set iff `value_available` is False, explaining why no preview could be produced. One of: `not_json_serializable`, `too_large`, or `unavailable`. `None` when `value_available` is True.'
          title: Valueunavailablereason
      required:
      - url
      - expiresIn
      title: TaskExecutionResultResponse
      type: object
    TaskExecutionLogsResponse:
      description: "Response schema for per-task pod logs.\n\nPopulated only when standalone dispatch is on — under the\nlegacy covalent path, pipelines-api does not own the pod and\nthe endpoint returns an empty string.\n\nAttributes:\n    logs: Pod stdout+stderr as a UTF-8 decoded string, subject to\n        the ``verbosity`` query param (see\n        ``specs/task_log_verbosity_filter.md``): by default the\n        task runner's own structured JSON log lines are\n        removed, leaving only the task function's own output\n        (plus any uncaught-exception traceback, which is always\n        kept). Empty when the pod has been GC'd, hasn't started\n        yet, or when the dispatch predates standalone mode.\n    filtered_line_count: Number of lines the verbosity filter\n        removed. Always ``0`` when ``verbosity=all`` was\n        requested."
      properties:
        filteredLineCount:
          default: 0
          description: Number of lines removed by the verbosity filter. Always 0 when verbosity=all.
          minimum: 0.0
          title: Filteredlinecount
          type: integer
        logs:
          title: Logs
          type: string
      required:
      - logs
      title: TaskExecutionLogsResponse
      type: object
