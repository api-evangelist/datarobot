openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Custom Applications API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage custom applications.
  name: custom_applications
paths:
  /api/v2/customApplicationSources/:
    get:
      description: The list of custom application sources.
      operationId: customApplicationSources_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: The sort order applied to the list of custom application sources. Prefix the attribute name with a dash to sort in descending order, e.g. "-createdAt".
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - name
          - -name
          - createdAt
          - -createdAt
          - updatedAt
          - -updatedAt
          type: string
      - description: Allows for searching custom application sources by name.
        in: query
        name: name
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
      - description: Filter custom application sources to return only those created by the specified user.
        in: query
        name: createdBy
        required: false
        schema:
          type: string
      - description: Filter application sources modified on or after this timestamp.
        in: query
        name: updatedAtStartTs
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter application sources modified before this timestamp.
        in: query
        name: updatedAtEndTs
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter application sources created on or after this timestamp.
        in: query
        name: createdAtStartTs
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter application sources created before this timestamp.
        in: query
        name: createdAtEndTs
        required: false
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSourceListResponse'
          description: ''
      summary: The list of custom application sources created
      tags:
      - custom_applications
      x-versionadded: v2.37
    post:
      description: Create a custom application source.
      operationId: customApplicationSources_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationSourceCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSource'
          description: ''
        '202':
          description: Creation has successfully started.
        '403':
          description: User does not have permission to create a source.
        '422':
          description: Custom application source could not be created with the given input.
      summary: Create a custom application source
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplicationSources/fromCustomTemplate/:
    post:
      description: Create a custom application source from a template.
      operationId: customApplicationSourcesFromCustomTemplate_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationSourceFromGalleryTemplateCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSource'
          description: ''
        '202':
          description: The custom application source creation process has successfully started. See the location header.
        '403':
          description: The current user does not have permission to create a custom application source.
        '422':
          description: A custom application source could not be created with the selected custom template.
      summary: Create a custom application source
      tags:
      - custom_applications
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Enables Custom Templates.
        enabled_by_default: true
        maturity: GA_ALL
        name: CUSTOM_TEMPLATES
      x-versionadded: v2.35
  /api/v2/customApplicationSources/{appSourceId}/:
    delete:
      description: Delete a custom application source.
      operationId: customApplicationSources_delete
      parameters:
      - description: Marks that this application source should be hard deleted instead of soft deleted.
        in: query
        name: hardDelete
        required: false
        schema:
          default: 'true'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The source has been deleted.
      summary: Delete a custom application source by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
    get:
      description: Retrieve a source.
      operationId: customApplicationSources_retrieve
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSource'
          description: ''
      summary: Retrieve a custom application source by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
    patch:
      description: Update a source's name.
      operationId: customApplicationSources_patch
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationSourceUpdate'
      responses:
        '204':
          description: The source has been updated.
      summary: Update a custom application source's name by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplicationSources/{appSourceId}/sharedRoles/:
    get:
      description: Get a list of users, groups, and organizations with access to this application source.
      operationId: customApplicationSourcesSharedRoles_list
      parameters:
      - description: Only return roles for a user, group or organization with this identifier.
        in: query
        name: id
        required: false
        schema:
          type: string
      - description: This many results will be skipped
        in: query
        name: offset
        required: true
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned
        in: query
        name: limit
        required: true
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      - description: Only return roles for a user, group or organization with this name.
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: The list of access controls for recipients with this type.
        in: query
        name: shareRecipientType
        required: false
        schema:
          enum:
          - user
          - group
          - organization
          - externalApplication
          type: string
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingListV2Response'
          description: ''
      summary: Get a list of users, groups, and organizations with access by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
    patch:
      description: Share an application source with a user, group, or organization.
      operationId: customApplicationSourcesSharedRoles_patchMany
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSharingUpdateOrRemove'
      responses:
        '204':
          description: The roles were updated successfully.
        '422':
          description: The request was formatted improperly.
      summary: Share an application source by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplicationSources/{appSourceId}/versions/:
    get:
      description: List of custom application source versions.
      operationId: customApplicationSourcesVersions_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSourceVersionListResponse'
          description: ''
      summary: Paginated list of custom application source versions of the specified by app…
      tags:
      - custom_applications
      x-versionadded: v2.37
    post:
      description: Create a custom application source.
      operationId: customApplicationSourcesVersions_create
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationSourceVersionCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSourceVersion'
          description: ''
        '201':
          description: Source version was successfully created.
        '403':
          description: User does not have permission to create a new source version.
        '422':
          description: Custom application source version could not be created with the given input.
      summary: Create a custom application source version by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplicationSources/{appSourceId}/versions/{appSourceVersionId}/:
    delete:
      description: Delete a custom application source version.
      operationId: customApplicationSourcesVersions_delete
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      - description: The ID of the application source version.
        in: path
        name: appSourceVersionId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The source version has been deleted.
      summary: Delete a custom application source version if it is still mutable by app source…
      tags:
      - custom_applications
      x-versionadded: v2.37
    get:
      description: Retrieve a source version.
      operationId: customApplicationSourcesVersions_retrieve
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      - description: The ID of the application source version.
        in: path
        name: appSourceVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSourceVersion'
          description: ''
      summary: Retrieve a custom application source version by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
    patch:
      description: Update the source version
      operationId: customApplicationSourcesVersions_patch
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      - description: The ID of the application source version.
        in: path
        name: appSourceVersionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationSourceVersionUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSourceVersion'
          description: ''
      summary: Update a custom application source version by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplicationSources/{appSourceId}/versions/{appSourceVersionId}/archive/:
    get:
      description: Download all files from a Custom Application Source version as a zip archive.
      operationId: customApplicationSourcesVersionsArchive_list
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      - description: The ID of the application source version.
        in: path
        name: appSourceVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/zip:
              schema:
                format: binary
                type: string
          description: A zip archive containing all files in the source version.
          headers:
            Content-Disposition:
              description: Specifies the zip filename derived from the version label (e.g. "attachment; filename=v1.0.zip").
              schema:
                type: string
      summary: Download Custom Application Source version files as a zip archive by app source…
      tags:
      - custom_applications
      x-versionadded: v2.43
  /api/v2/customApplicationSources/{appSourceId}/versions/{appSourceVersionId}/fromCodespace/:
    post:
      description: Update files in the source version from Codespace.
      operationId: customApplicationSourcesVersionsFromCodespace_create
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      - description: The ID of the application source version.
        in: path
        name: appSourceVersionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationSourceVersionFromCodespace'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSourceVersionFromCodespaceResponse'
          description: ''
        '202':
          description: Task for updating source applied.
      summary: Update the custom application source version by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplicationSources/{appSourceId}/versions/{appSourceVersionId}/items/{itemId}/:
    get:
      description: Retrieve a file stored inside a custom application source version.
      operationId: customApplicationSourcesVersionsItems_retrieve
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      - description: The ID of the application source version.
        in: path
        name: appSourceVersionId
        required: true
        schema:
          type: string
      - description: The ID of file item inside of the application source version.
        in: path
        name: itemId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationItemRetrieve'
          description: ''
      summary: Retrieve a file by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplicationSources/{appSourceId}/versions/{appSourceVersionId}/toCodespace/:
    post:
      description: Update a codespace with files from the source version.
      operationId: customApplicationSourcesVersionsToCodespace_create
      parameters:
      - description: The ID of the application source.
        in: path
        name: appSourceId
        required: true
        schema:
          type: string
      - description: The ID of the application source version.
        in: path
        name: appSourceVersionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationSourceVersionToCodespace'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationSourceVersionFromCodespaceResponse'
          description: ''
        '202':
          description: Task for uploading files to codespace applied.
      summary: Update a codespace by app source ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplications/:
    get:
      description: The list of applications created by the currently authenticated user.
      operationId: customApplications_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: The sort order applied to the list of custom applications. Prefix the attribute name with a dash to sort in descending order, e.g. "-createdAt". Additional sorting options include "bundleSize" and "replicas".
        in: query
        name: orderBy
        required: false
        schema:
          enum:
          - name
          - -name
          - createdAt
          - -createdAt
          - updatedAt
          - -updatedAt
          - bundleSize
          - -bundleSize
          - replicas
          - -replicas
          type: string
      - description: Allows for searching custom applications by name.
        in: query
        name: name
        required: false
        schema:
          maxLength: 512
          minLength: 1
          type: string
      - description: Allows you to get custom applications created only from specific sources. To find apps not linked to a custom application source, use the value "null".
        in: query
        name: customApplicationSourceId
        required: false
        schema:
          oneOf:
          - anyOf:
            - type: string
            - enum:
              - 'null'
              type: string
          - items:
              anyOf:
              - type: string
              - enum:
                - 'null'
                type: string
            maxItems: 100
            type: array
      - description: Whether or not you want to include the name of the application source andthe label of the source version.
        in: query
        name: includeSourceLabels
        required: false
        schema:
          default: false
          type: boolean
      - description: Whether we should only fetch apps created from a custom application source.
        in: query
        name: requireSource
        required: false
        schema:
          default: false
          type: boolean
      - description: Filter custom applications to return only those created by the specified user.
        in: query
        name: createdBy
        required: false
        schema:
          type: string
      - description: Filter applications by status.
        in: query
        name: status
        required: false
        schema:
          oneOf:
          - enum:
            - created
            - failed
            - initializing
            - paused
            - publishing
            - running
            type: string
          - items:
              enum:
              - created
              - failed
              - initializing
              - paused
              - publishing
              - running
              type: string
            maxItems: 10
            type: array
      - description: Filter applications modified on or after this timestamp.
        in: query
        name: updatedAtStartTs
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter applications modified before this timestamp.
        in: query
        name: updatedAtEndTs
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter applications by external access enablement status.
        in: query
        name: externalAccessEnabled
        required: false
        schema:
          type: boolean
      - description: Filter applications by resource bundle label.
        in: query
        name: resourceLabel
        required: false
        schema:
          maxLength: 256
          type: string
      - description: Filter applications with replica count greater than or equal to this value.
        in: query
        name: replicasMin
        required: false
        schema:
          type: integer
      - description: Filter applications with replica count less than or equal to this value.
        in: query
        name: replicasMax
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationListResponse'
          description: ''
      summary: The list of applications created by the currently authenticated user
      tags:
      - custom_applications
      x-versionadded: v2.37
    post:
      operationId: customApplications_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplication'
          description: ''
        '202':
          description: Creation has successfully started. See the Location header.
        '403':
          description: User does not have permission to launch application of provided type.
        '422':
          description: Application could not be created with the given input.
      summary: Create a custom application
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplications/{applicationId}/:
    delete:
      description: Delete an application
      operationId: customApplications_delete
      parameters:
      - description: Marks that this application should be hard deleted instead of soft deleted.
        in: query
        name: hardDelete
        required: false
        schema:
          default: 'true'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: The ID of the application
        in: path
        name: applicationId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The application has been deleted.
      summary: Delete an application by application ID
      tags:
      - custom_applications
      x-versionadded: v2.37
    get:
      description: Retrieve an application
      operationId: customApplications_retrieve
      parameters:
      - description: Whether or not you want to include the name of the application source andthe label of the source version.
        in: query
        name: includeSourceLabels
        required: false
        schema:
          default: false
          type: boolean
      - description: The ID of the application
        in: path
        name: applicationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplication'
          description: ''
      summary: Retrieve an application by application ID
      tags:
      - custom_applications
      x-versionadded: v2.37
    patch:
      description: Update an application's name
      operationId: customApplications_patch
      parameters:
      - description: The ID of the application
        in: path
        name: applicationId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomApplicationUpdate'
      responses:
        '204':
          description: The application has been updated.
      summary: Update an application's name by application ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplications/{applicationId}/history/:
    get:
      description: Retrieve an application's publication history.
      operationId: customApplicationsHistory_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: The ID of the application
        in: path
        name: applicationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationsHistoryListResponse'
          description: ''
      summary: Retrieve an application's publication history by application ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplications/{applicationId}/logs/:
    get:
      description: Retrieve an application's logs
      operationId: customApplicationsLogs_list
      parameters:
      - description: The ID of the application
        in: path
        name: applicationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomApplicationLogs'
          description: ''
      summary: Retrieve an application's logs by application ID
      tags:
      - custom_applications
      x-versionadded: v2.37
  /api/v2/customApplications/{applicationId}/migrateToWorkload/:
    post:
      operationId: customApplicationsMigrateToWorkload_create
      responses:
        '202':
          description: Creation has successfully started. See the Location header.
          headers:
            Location:
              description: A url that can be polled to check the status.
              schema:
                type: string
      summary: Create Migrate To Workload by application ID
      tags:
      - custom_applications
      x-versionadded: v2.48
  /api/v2/customApplications/{applicationId}/revertToLrs/:
    post:
      operationId: customApplicationsRevertToLrs_create
      responses:
        '200':
          description: ''
      summary: Create Revert To Lrs by application ID
      tags:
      - custom_applications
      x-versionadded: v2.48
  /api/v2/customApplications/{applicationId}/sharedRoles/:
    get:
      description: Get a list of users, groups and organizations that have an access to this application
      operationId: customApplicationsSharedRoles_list
      parameters:
      - description: Only return roles for a user, group or organization with this identifier.
        in: query
