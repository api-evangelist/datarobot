        value:
          description: Value of the tag
          title: Value
          type: string
      required:
      - id
      - name
      - value
      title: TagInfo
      type: object
    SharedRolesUpdateRequest:
      description: 'Request model for updating shared roles on an entity.


        Used to grant access, remove access, or update roles for organizations,

        groups, users, or external applications. Up to 100 roles may be set in a

        single request.'
      properties:
        operation:
          const: updateRoles
          description: Name of the action being taken. The only operation is 'updateRoles'.
          title: Operation
          type: string
        roles:
          description: Array of GrantAccessControl objects, up to maximum 100 objects.
          items:
            anyOf:
            - $ref: '#/components/schemas/GrantAccessControlWithUsername'
            - $ref: '#/components/schemas/GrantAccessControlWithId'
          maxItems: 100
          minItems: 1
          title: Roles
          type: array
      required:
      - operation
      - roles
      title: SharedRolesUpdateRequest
      type: object
    BuiltFrom:
      description: 'What a build consumed, captured when the build was triggered and never rewritten.


        A container''s build pointer is dropped when its ``code_ref`` changes, so a surviving

        ``build`` already implies the code is unchanged. The execution environment is not part of

        that check, which makes ``execution_environment_version_id`` here the only way to see that

        an image was built on a different environment version than the container now declares.


        Both execution environment fields are null for a build from a user-provided Dockerfile,

        which resolves no execution environment at all.'
      properties:
        codeRef:
          $ref: '#/components/schemas/CodeRef'
          description: Source code reference this image was built from.
          title: Code Ref
        executionEnvironmentId:
          anyOf:
          - type: string
          - type: 'null'
          description: Execution environment declared for the generated Dockerfile, if any.
          title: Execution Environment ID
        executionEnvironmentVersionId:
          anyOf:
          - type: string
          - type: 'null'
          description: Execution environment version the base image was resolved from, if any.
          title: Execution Environment Version ID
      required:
      - codeRef
      title: BuiltFrom
      type: object
    ImageBuildExternalStatus:
      description: Client-facing artifact image build status.
      enum:
      - PENDING
      - IN_PROGRESS
      - BUILT
      - COMPLETED
      - CANCELLED
      - FAILED
      - UNKNOWN
      title: ImageBuildExternalStatus
      type: string
    ValidationError:
      properties:
        code:
          description: Machine-readable error type (e.g. 'missing', 'string_type').
          title: Code
          type: string
        ctx:
          description: Additional context about the validation error.
          title: Context
          type: object
        input:
          additionalProperties: true
          description: The input value that caused the validation error.
          title: Input
          type: object
        loc:
          description: The location in the request where the validation error occurred.
          items:
            anyOf:
            - type: string
            - type: integer
          maxItems: 100
          title: loc
          type: array
        message:
          description: Human-readable description of the validation failure.
          title: Message
          type: string
        msg:
          description: A human-readable description of the validation error.
          title: msg
          type: string
        path:
          description: Dotted path to the invalid field (e.g. 'runtime.containerGroups.0.autoscaling').
          title: Path
          type: string
        type:
          description: A machine-readable error type identifier.
          title: type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    SharedRoleListResponse:
      properties:
        count:
          description: The number of records on this page.
          title: Count
          type: integer
        data:
          description: The list of records.
          items:
            $ref: '#/components/schemas/SharedRole'
          title: Data
