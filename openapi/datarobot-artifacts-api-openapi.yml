          title: Totalcount
          type: integer
      required:
      - totalCount
      - count
      - next
      - previous
      - data
      title: SharedRoleListResponse
      type: object
    ArtifactType:
      description: "Discriminator for the artifact spec variant. Used to label the workload so it can be\nscheduled on the best-matching runtime. Defaults to ``service`` when omitted.\n- ``service``: generic service artifact.\n- ``nim``: NVIDIA NIM model artifact.\n- ``agent``: A2A-capable agent artifact; scheduled like ``service`` (the ``a2a_enabled``\n    spec flag turns on agent-card management and the A2A surface).\n- ``mcp``: MCP server artifact; scheduled like ``service``.\n- ``llm``: open-weights model served by the platform's inference engine. The user\n    declares a model, not containers."
      enum:
      - service
      - nim
      - agent
      - mcp
      - llm
      title: ArtifactType
      type: string
    GeneratedDockerfile:
      description: System generates a Dockerfile from execution environment metadata.
      properties:
        entrypoint:
          description: Entrypoint baked into the generated Dockerfile CMD (e.g. ["python", "app.py"]).
          items:
            type: string
          minItems: 1
          title: Entrypoint
          type: array
        executionEnvironmentId:
          description: Execution environment that executionEnvironmentVersionId belongs to. A version from a different execution environment is rejected.
          title: Execution Environment ID
          type: string
        executionEnvironmentVersionId:
          description: Execution environment version that determines the base Docker image, via its source Docker image URI or, failing that, its image ID.
          title: Execution Environment Version ID
          type: string
        source:
          const: generated
          default: generated
          title: Source
          type: string
      required:
      - executionEnvironmentId
      - executionEnvironmentVersionId
      - entrypoint
      title: GeneratedDockerfile
      type: object
    SecurityContext:
      description: 'Container-level security context.


        Lets workload creators tighten security constraints beyond the platform defaults. runAsNonRoot and runAsUser are enforced by the platform and are not user-settable. Elevated fields (capabilities.add, allowPrivilegeEscalation=true, seccompProfile.type=Unconfined) require the MLOps Admin role; regular users may only tighten defaults — drop capabilities, enable read-only rootfs, or set a RuntimeDefault/Localhost seccomp profile.'
      properties:
        allowPrivilegeEscalation:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether a process can gain more privileges than its parent. Requires the MLOps Admin role to set to True.
          title: Allowprivilegeescalation
        capabilities:
          anyOf:
          - $ref: '#/components/schemas/Capabilities'
          - type: 'null'
          description: Linux capabilities to add or drop
        readOnlyRootFilesystem:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether the root filesystem is read-only
          title: Readonlyrootfilesystem
        seccompProfile:
          anyOf:
          - $ref: '#/components/schemas/SeccompProfile'
          - type: 'null'
          description: Seccomp profile for the container
      title: SecurityContext
      type: object
