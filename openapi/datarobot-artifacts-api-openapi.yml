              service: '#/components/schemas/ServiceArtifactSpec'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/ServiceArtifactSpec'
          - $ref: '#/components/schemas/NimArtifactSpec'
          - $ref: '#/components/schemas/AgentArtifactSpec'
          - $ref: '#/components/schemas/LlmArtifactSpec'
          title: Spec
        status:
          $ref: '#/components/schemas/ArtifactStatus'
          default: draft
          description: Artifact status
        type:
          $ref: '#/components/schemas/ArtifactType'
          default: service
          description: Artifact type
      required:
      - name
      - spec
      title: InputArtifact
      type: object
    AgentArtifactSpec:
      properties:
        a2aEnabled:
          default: false
          description: Turns on agent-to-agent (A2A) card management and the A2A surface for this agent. Defaults to off. Valid only on `agent` artifacts.
          title: A2A Enabled
          type: boolean
        containerGroups:
          default: []
          description: List of container groups.
          items:
            $ref: '#/components/schemas/ContainerGroup'
          title: Containergroups
          type: array
        type:
          const: agent
          default: agent
          description: Artifact type discriminator. Injected automatically from the top-level `type` field — do not set this directly.
          title: Type
          type: string
      title: AgentArtifactSpec
      type: object
    Capabilities:
      description: Linux capabilities to add or drop from the container.
      properties:
        add:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Capabilities to add
          title: Add
        drop:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Capabilities to drop
          title: Drop
      title: Capabilities
      type: object
    ImageBuildConfig:
      description: User-provided configuration for server-side image builds from source code.
      properties:
        codeRef:
          anyOf:
          - $ref: '#/components/schemas/CodeRef'
          - type: 'null'
          description: Reference to source code (e.g. Files API catalog). Optional at create time; required before build or lock.
        dockerfile:
          description: How the Dockerfile is obtained. Defaults to using ./Dockerfile from the source code.
          discriminator:
            mapping:
              generated: '#/components/schemas/GeneratedDockerfile'
              provided: '#/components/schemas/ProvidedDockerfile'
            propertyName: source
          oneOf:
          - $ref: '#/components/schemas/ProvidedDockerfile'
          - $ref: '#/components/schemas/GeneratedDockerfile'
          title: Dockerfile
      title: ImageBuildConfig
      type: object
    SharedRole:
      description: 'Represents a recipient (user, group, organization, or external application) with

        access to an entity.


        This model is used for listing and managing access control on shared resources,

        providing information about who has access and what role they have.'
      properties:
        id:
          description: The identifier of the recipient.
          title: Id
          type: string
        name:
          description: The name of the recipient.
          title: Name
          type: string
        role:
          $ref: '#/components/schemas/SharingRole'
          description: The role of the recipient on this entity.
        shareRecipientType:
          $ref: '#/components/schemas/SubjectType'
          description: The type of the recipient.
      required:
      - id
      - name
      - shareRecipientType
      - role
      title: SharedRole
      type: object
    ImageBuildTriggerResponse:
      description: Response after requesting image build(s) for a draft artifact.
      properties:
        buildIds:
          description: Workload API artifact image build document ids (same strings returned as `build_id` on GET/DELETE build routes), one per distinct Files API catalog/version pair. Internal image build ids are not returned.
          items:
            type: string
          title: Buildids
          type: array
      required:
      - buildIds
      title: ImageBuildTriggerResponse
      type: object
    ResourcePermission:
      description: Represents the particular role a user, group or organization holds on an entity.
      enum:
      - CAN_VIEW
      - CAN_UPDATE
      - CAN_DELETE
      - CAN_SHARE
      - CAN_MAKE_PREDICTIONS
      - CAN_OVERRIDE_WORKLOAD_PLACEMENT
      - CAN_SHARE_ROLE_OWNER
      - CAN_SHARE_ROLE_READ_WRITE
      - CAN_SHARE_ROLE_READ_ONLY
      title: ResourcePermission
      type: string
    ImageBuildFormattedList:
      description: Paginated list of formatted artifact image builds for GET …/builds.
      properties:
        count:
          description: The number of records on this page.
          title: Count
          type: integer
        data:
          description: The list of records.
          items:
            $ref: '#/components/schemas/ImageBuildFormatted'
          title: Data
          type: array
        next:
          anyOf:
          - type: string
          - type: 'null'
          description: The URL to the next page, or `null` if there is no such page.
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          description: The URL to the previous page, or `null` if there is no such page.
          title: Previous
        totalCount:
          description: The total number of records.
          title: Totalcount
          type: integer
      required:
      - totalCount
      - count
      - next
      - previous
      - data
      title: ImageBuildFormattedList
      type: object
    RouteAuth:
      description: "Authentication applied to a workload route.\n\n- ``required``: unauthenticated requests are rejected.\n- ``optional``: authenticated when an ``Authorization`` header is present, otherwise passed\n  through without an authentication attempt.\n- ``disabled``: no authentication is ever attempted."
      enum:
      - required
      - optional
      - disabled
      title: RouteAuth
      type: string
    CredentialEnvironmentVariable:
      properties:
        drCredentialId:
          description: ID of the DataRobot credential to use
          title: DR Credential ID
          type: string
        key:
          description: Key within the credential
          title: Key
          type: string
        name:
          description: Name of the environment variable
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        source:
          const: dr-credential
          title: Source
          type: string
      required:
      - source
      - name
      - drCredentialId
      - key
      title: CredentialEnvironmentVariable
      type: object
    CodeRef:
      properties:
        datarobot:
          $ref: '#/components/schemas/DataRobotCodeRef'
        provider:
          const: datarobot
          default: datarobot
          title: Provider
          type: string
        type:
          const: datarobot
          default: datarobot
          title: Type
          type: string
      required:
      - datarobot
      title: CodeRef
      type: object
    HTTPValidationError:
      properties:
        detail:
          description: List of validation errors.
          items:
            $ref: '#/components/schemas/ValidationError'
          maxItems: 100
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ArtifactCloneRequest:
      properties:
        name:
          description: The name of the cloned artifact.
          maxLength: 5000
          minLength: 1
          title: Name
          type: string
      required:
