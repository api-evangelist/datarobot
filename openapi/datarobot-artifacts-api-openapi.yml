openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Artifacts API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Manage artifact definitions and container specifications.
  name: Artifacts
paths:
  /api/v2/artifactRepositories:
    get:
      description: Returns the list of artifact repositories.
      operationId: listArtifactRepositories
      parameters:
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Retrieve only the specified number of values.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Filters by those created by the given user.
        in: query
        name: createdBy
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filters by those created by the given user.
          title: Created By
      - description: Filter by specific IDs
        in: query
        name: ids
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by specific IDs
          title: Ids
      - description: Case insensitive search against name, description and partial ID.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Case insensitive search against name, description and partial ID.
          title: Search
      - description: List of tag keys to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
        in: query
        name: tagKeys
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tag keys to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
          title: Tag Keys
      - description: List of tag values to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
        in: query
        name: tagValues
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tag values to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
          title: Tag Values
      - description: Select a sorting strategy from the list.
        in: query
        name: orderBy
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CommonSortQueryParams'
          - type: 'null'
          description: Select a sorting strategy from the list.
          title: Order By
      - description: Filters artifacts by their type (e.g., service, nim).
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ArtifactType'
          - type: 'null'
          description: Filters artifacts by their type (e.g., service, nim).
          title: Type
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactRepositoryListResponse'
          description: Successful Response
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Artifact Repositories
      tags:
      - Artifacts
  /api/v2/artifactRepositories/{artifact_repository_id}:
    delete:
      description: Delete an artifact repository. Artifacts within the repository are cascade-deleted unless they are locked or still in use by workloads.
      operationId: deleteArtifactRepository
      parameters:
      - description: Artifact Repository ID
        in: path
        name: artifact_repository_id
        required: true
        schema:
          description: Artifact Repository ID
          title: Artifact Repository Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact repository not found
        '409':
          description: Repository contains locked artifacts or artifacts in use by workloads
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Artifact Repository by artifact_repository_ ID
      tags:
      - Artifacts
    get:
      description: Get a specific artifact repository by ID.
      operationId: getArtifactRepository
      parameters:
      - description: Artifact Repository ID
        in: path
        name: artifact_repository_id
        required: true
        schema:
          description: Artifact Repository ID
          title: Artifact Repository Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactRepositoryFormatted'
          description: Successful Response
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact repository not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Artifact Repository by artifact_repository_ ID
      tags:
      - Artifacts
  /api/v2/artifactRepositories/{artifact_repository_id}/sharedRoles:
    get:
      description: Get artifact repository shared roles. Returns the list of roles shared for this artifact repository.
      operationId: listArtifactRepositorySharedRoles
      parameters:
      - description: Artifact Repository ID
        in: path
        name: artifact_repository_id
        required: true
        schema:
          description: Artifact Repository ID
          title: Artifact Repository Id
          type: string
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Retrieve only the specified number of values.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedRoleListResponse'
          description: Successful Response
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact repository not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Artifact Repository Shared Roles by artifact_repository_ ID
      tags:
      - Artifacts
    patch:
      description: Update artifact repository shared roles. Replaces the current shared roles with the provided list.
      operationId: updateArtifactRepositorySharedRoles
      parameters:
      - description: Artifact Repository ID
        in: path
        name: artifact_repository_id
        required: true
        schema:
          description: Artifact Repository ID
          title: Artifact Repository Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedRolesUpdateRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact repository not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Artifact Repository Shared Roles by artifact_repository_ ID
      tags:
      - Artifacts
  /api/v2/artifacts:
    get:
      description: List all artifacts accessible to the authenticated user.
      operationId: listArtifacts
      parameters:
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Retrieve only the specified number of values.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Filters by those created by the given user.
        in: query
        name: createdBy
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filters by those created by the given user.
          title: Created By
      - description: Filter by specific IDs
        in: query
        name: ids
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by specific IDs
          title: Ids
      - description: Case insensitive search against name, description and partial ID.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Case insensitive search against name, description and partial ID.
          title: Search
      - description: List of tag keys to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
        in: query
        name: tagKeys
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tag keys to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
          title: Tag Keys
      - description: List of tag values to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
        in: query
        name: tagValues
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tag values to filter for. If multiple values are specified, results with tags that match any of the values will be returned.
          title: Tag Values
      - description: The order to sort the results.
        in: query
        name: orderBy
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ArtifactSortQueryParams'
          - type: 'null'
          description: The order to sort the results.
          title: Orderby
      - description: Filters artifacts by their type (e.g., service, nim).
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ArtifactType'
          - type: 'null'
          description: Filters artifacts by their type (e.g., service, nim).
          title: Type
      - description: Filters artifacts by their status.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ArtifactStatus'
          - type: 'null'
          description: Filters artifacts by their status.
          title: Status
      - description: Filter artifacts by their artifact repository ID
        in: query
        name: repositoryId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter artifacts by their artifact repository ID
          title: Artifact Repository ID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Artifacts
      tags:
      - Artifacts
    post:
      description: Create a new artifact from the provided container specification. Artifacts are always created as drafts.
      operationId: createArtifact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputArtifact'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Artifact
      tags:
      - Artifacts
  /api/v2/artifacts/{artifact_id}:
    delete:
      description: Delete an artifact. Locked artifacts and artifacts with associated protons cannot be deleted.
      operationId: deleteArtifact
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      responses:
        '204':
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '409':
          description: Artifact is locked or currently in use by a workload
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Artifact by artifact_ ID
      tags:
      - Artifacts
    get:
      description: Get a specific artifact by ID.
      operationId: getArtifact
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Artifact by artifact_ ID
      tags:
      - Artifacts
    patch:
      description: 'Partially update an artifact. Only the provided fields will be updated.


        The repository is changed with PUT /artifacts/{artifactId} and the type is fixed when the

        artifact is created, so a body naming artifactRepositoryId or type is rejected with 422; any

        other field this endpoint does not know is ignored.'
      operationId: patchArtifact
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArtifactRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Patch Artifact by artifact_ ID
      tags:
      - Artifacts
    put:
      description: 'Update an existing artifact.


        Replaces all artifact fields with the provided values.

        For partial updates, use the PATCH endpoint instead.'
      operationId: updateArtifact
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputArtifact'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Artifact by artifact_ ID
      tags:
      - Artifacts
  /api/v2/artifacts/{artifact_id}/builds:
    get:
      operationId: getArtifactBuildList
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      - description: Skip the specified number of values.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Skip the specified number of values.
          minimum: 0
          title: Offset
          type: integer
      - description: Retrieve only the specified number of values.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Retrieve only the specified number of values.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBuildFormattedList'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '422':
          description: Bad request
      summary: Get Artifact Build List by artifact_ ID
      tags:
      - Artifacts
    post:
      description: Start image build(s) for a draft service artifact (codeRef). Locked artifacts are rejected.
      operationId: triggerArtifactBuild
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBuildTriggerResponse'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '422':
          description: Invalid state, missing files, or other services error
        '504':
          description: Build service did not confirm the submission in time; safe to retry
      summary: Trigger Artifact Build by artifact_ ID
      tags:
      - Artifacts
  /api/v2/artifacts/{artifact_id}/builds/{build_id}:
    delete:
      description: Request cancellation/deletion of an image build for a **draft** artifact (immutable when locked).
      operationId: deleteArtifactBuild
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      - description: Workload API artifact image build id, same id returned by trigger build
        in: path
        name: build_id
        required: true
        schema:
          description: Workload API artifact image build id, same id returned by trigger build
          title: Build Id
          type: string
      responses:
        '204':
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '422':
          description: Artifact not draft or internal error
      summary: Delete Artifact Build by artifact_ ID
      tags:
      - Artifacts
    get:
      operationId: getArtifactBuild
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      - description: Workload API artifact image build id, same id returned by trigger build
        in: path
        name: build_id
        required: true
        schema:
          description: Workload API artifact image build id, same id returned by trigger build
          title: Build Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBuildFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '422':
          description: Invalid build id or bad request
      summary: Get Artifact Build by artifact_ ID
      tags:
      - Artifacts
  /api/v2/artifacts/{artifact_id}/clone:
    post:
      description: Clone an existing artifact. Creates a new artifact with the same fields as the original.
      operationId: cloneArtifact
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: Artifact ID
          title: Artifact Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCloneRequest'
              description: Name for the cloned artifact
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactFormatted'
          description: Successful Response
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Artifact not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Clone Artifact by artifact_ ID
      tags:
      - Artifacts
components:
  schemas:
    StringEnvironmentVariable:
      properties:
        name:
          description: Name of the environment variable
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        source:
          const: string
          default: string
          title: Source
          type: string
        value:
          description: Value of the environment variable
          maxLength: 131072
          title: Value
          type: string
      required:
      - name
      - value
      title: StringEnvironmentVariable
      type: object
    HuggingFaceModelSource:
      description: Weights pulled from the Hugging Face Hub by the inference engine at start.
      properties:
        kind:
          const: huggingFace
          default: huggingFace
          title: Kind
          type: string
        repoId:
          description: Hugging Face repository id, for example `Qwen/Qwen3-0.6B`.
          maxLength: 256
          pattern: ^[A-Za-z0-9][\w.-]*/[A-Za-z0-9][\w.-]*$
          title: Repoid
          type: string
        revision:
          default: main
          description: Branch, tag or commit to pin. Defaults to `main`.
          maxLength: 128
          title: Revision
          type: string
      required:
      - repoId
      title: HuggingFaceModelSource
      type: object
    ArtifactStatus:
      enum:
      - draft
      - locked
      title: ArtifactStatus
      type: string
    SeccompProfile:
      description: Seccomp profile configuration.
      properties:
        localhostProfile:
          anyOf:
          - type: string
          - type: 'null'
          description: Path to a seccomp profile on the node. Only valid when type is Localhost.
          title: Localhostprofile
        type:
          $ref: '#/components/schemas/SeccompProfileType'
          description: Seccomp profile type
      required:
      - type
      title: SeccompProfile
      type: object
    WorkloadRoute:
      description: A workload route exposed publicly.
      properties:
        auth:
          $ref: '#/components/schemas/RouteAuth'
          description: Authentication applied to this route.
        path:
          description: Route path relative to the workload root, excluding the URL prefix the workload is mounted on. Must start with '/'. For example '/.well-known/agent-card.json'.
          maxLength: 1024
          pattern: ^/
          title: Path
          type: string
      required:
      - path
      - auth
      title: WorkloadRoute
      type: object
    ServiceArtifactSpec:
      properties:
        containerGroups:
          default: []
          description: List of container groups.
          items:
            $ref: '#/components/schemas/ContainerGroup'
          title: Containergroups
          type: array
        type:
          default: service
          description: Artifact type discriminator. Injected automatically from the top-level `type` field — do not set this directly.
          enum:
          - service
          - mcp
          title: Type
          type: string
      title: ServiceArtifactSpec
      type: object
    SharingRole:
      description: 'External sharing roles representing the permission level a user, group or

        organization holds on an entity.


        These roles map to internal permissions and are used in sharing APIs.'
      enum:
      - NO_ROLE
      - OWNER
      - READ_WRITE
      - EDITOR
      - USER
      - DATA_SCIENTIST
      - ADMIN
      - READ_ONLY
      - CONSUMER
      - OBSERVER
      title: SharingRole
      type: string
    GrantAccessControlWithUsername:
      description: Grant access control request using username for user identification.
      properties:
        role:
          $ref: '#/components/schemas/SharingRole'
          description: The role of the recipient on this entity.
          enum:
          - ADMIN
          - CONSUMER
          - DATA_SCIENTIST
          - EDITOR
          - NO_ROLE
          - OBSERVER
          - OWNER
          - READ_ONLY
          - READ_WRITE
          - USER
          type: string
        shareRecipientType:
          $ref: '#/components/schemas/SubjectType'
