    ImageBuildFormatted:
      description: Build row formatted for GET …/builds (same base fields as other `*Formatted` API models).
      properties:
        artifactId:
          description: Parent artifact id
          title: Artifact Id
          type: string
        builtFrom:
          anyOf:
          - $ref: '#/components/schemas/BuiltFrom'
          - type: 'null'
          description: The source code and execution environment this build consumed. Null for builds triggered before this was recorded.
          title: Built From
        createdAt:
          description: Timestamp of when the entity was created
          format: date-time
          title: Created At
          type: string
        creator:
          anyOf:
          - $ref: '#/components/schemas/UserData'
          - type: 'null'
          description: Owner user details including ID, username and email
          title: Creator
        failureReason:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the build ended FAILED or CANCELLED. Names the phase the build was last seen in when that phase locates the failure; early failures commonly report no phase at all, because the status they were last seen in carries none. Null while the build is running, for COMPLETED builds, and for builds that reached their terminal status before this field existed, so do not branch on it.
          title: Failure Reason
        id:
          description: Unique identifier of the entity
          title: ID
          type: string
        imageApplied:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether the artifact is now pointing at the image this build produced. A build reports COMPLETED once the image exists, which is a moment before the artifact is updated to use it, so once the status is COMPLETED wait for this to turn true before deploying. It stays false for a build that failed or was cancelled, which produced no image to point at. Null when it was not determined.
          title: Image Applied
        imageAvailable:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether the registry holds the image named by imageUri. True if present, false if not, null when not checked or not knowable, including when the registry could not be reached — null never means the image is gone. On a failed build this separates one that never pushed from one that died after pushing.
          title: Image Available
        imageUri:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The coordinates this build was assigned: {registry}/{repository}:{build id}, fixed when it is triggered. On a COMPLETED build that is the image it produced; on a FAILED one the image may never have been pushed, so read imageAvailable. What a container runs is its own imageUri, which may name a different build.'
          title: Image URI
        name:
          description: Name of the entity
          title: Name
          type: string
        status:
          $ref: '#/components/schemas/ImageBuildExternalStatus'
          default: UNKNOWN
          description: Reported build status
          title: Build Status
        updatedAt:
          description: Timestamp of when the entity was last updated
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - name
      - createdAt
      - updatedAt
      - artifactId
      title: ImageBuildFormatted
      type: object
