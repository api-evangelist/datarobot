openapi: 3.2.0
info:
  contact:
    email: support@datarobot.com
    name: DataRobot Support
    url: https://support.datarobot.com
  description: DataRobot's Public facing API
  license:
    name: DataRobot Tool and Utility Agreement
    url: https://www.datarobot.com/wp-content/uploads/2021/07/DataRobot-Tool-and-Utility-Agreement.pdf
  title: Public Guardrails API
  version: 2.49.0
  x-datarobot-release-version: Latest
servers:
- url: https://app.datarobot.com/
security:
- BearerAuth: []
tags:
- description: Use the endpoints described below to manage guardrails. Model guardrails are a set of rules or machine learning models that ensure the output of a language model is safe, accurate, and ethical.
  name: guardrails
paths:
  /api/v2/guardConfigurations/:
    get:
      description: The list of resource tags.
      operationId: guardConfigurations_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: Filter guard configurations by the given entity ID.
        in: query
        name: entityId
        required: true
        schema:
          type: string
      - description: The entity type of the given entity ID.
        in: query
        name: entityType
        required: true
        schema:
          enum:
          - customModel
          - customModelVersion
          - playground
          - workload
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardConfigurationListResponse'
          description: ''
        '400':
          description: Request invalid, refer to messages for detail.
        '404':
          description: User permissions problem.
      summary: The list of resource tags
      tags:
      - guardrails
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Configure and use guardrails for LLM intervention and moderation.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: MODERATION_GUARDRAILS
      x-versionadded: v2.35
    post:
      description: Create a guard configuration.
      operationId: guardConfigurations_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardConfigurationCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardConfigurationRetrieveResponse'
          description: ''
        '404':
          description: Either the resource does not exist or the user does not have permission to create the configuration.
        '409':
          description: The proposed configuration name is already in use for the same entity.
      summary: Create a guard configuration
      tags:
      - guardrails
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Configure and use guardrails for LLM intervention and moderation.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: MODERATION_GUARDRAILS
      x-versionadded: v2.35
  /api/v2/guardConfigurations/predictionEnvironmentsInUse/:
    get:
      description: Show the prediction environments in use for moderation.
      operationId: guardConfigurationsPredictionEnvironmentsInUse_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: Show prediction environment information for this custom model version.
        in: query
        name: customModelVersionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardConfigurationPredictionEnvironmentsInUseListResponse'
          description: ''
        '404':
          description: Either the resource does not exist or the user does not have permission to view the configuration.
      summary: Show the prediction environments in use
      tags:
      - guardrails
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Configure and use guardrails for LLM intervention and moderation.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: MODERATION_GUARDRAILS
      x-versionadded: v2.35
  /api/v2/guardConfigurations/toNewCustomModelVersion/:
    post:
      description: Apply moderation configuration to a new custom model version.
      operationId: guardConfigurationsToNewCustomModelVersion_create
      requestBody:
