    GuardInterventionResponse:
      description: The intervention configuration for the guard.
      properties:
        action:
          description: The action to take if conditions are met.
          enum:
          - block
          - report
          - replace
          type: string
        allowedActions:
          description: The actions this guard is allowed to take.
          items:
            enum:
            - block
            - report
            - replace
            type: string
          maxItems: 10
          type: array
        conditionLogic:
          default: any
          description: The action to take if conditions are met.
