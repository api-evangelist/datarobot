          description: ''
        '404':
          description: Either the resource does not exist or the user does not have permission to create the configuration.
        '409':
          description: The destination custom model version is frozen. Create a new version to save configuration.
      summary: Apply moderation configuration
      tags:
      - guardrails
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Configure and use guardrails for LLM intervention and moderation.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: MODERATION_GUARDRAILS
      x-versionadded: v2.35
  /api/v2/guardConfigurations/{configId}/:
    delete:
      description: Delete a guard config.
      operationId: guardConfigurations_delete
      parameters:
      - description: The ID of the configuration.
        in: path
        name: configId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: Either the config does not exist or the user does not have permission to delete it.
      summary: Delete a guard config by config ID
      tags:
      - guardrails
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Configure and use guardrails for LLM intervention and moderation.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: MODERATION_GUARDRAILS
      x-versionadded: v2.35
    get:
      description: Retrieve info about a guard configuration.
      operationId: guardConfigurations_retrieve
      parameters:
      - description: The ID of the configuration.
        in: path
        name: configId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardConfigurationRetrieveResponse'
          description: ''
        '404':
          description: Either the config does not exist or the user does not have permission to view it.
      summary: Retrieve info about a guard configuration by config ID
      tags:
      - guardrails
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Configure and use guardrails for LLM intervention and moderation.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: MODERATION_GUARDRAILS
      x-versionadded: v2.35
    patch:
      description: Update a guard config.
      operationId: guardConfigurations_patch
      parameters:
      - description: The ID of the configuration.
        in: path
        name: configId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardConfigurationUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardConfigurationRetrieveResponse'
          description: ''
        '404':
          description: Either the resource does not exist or the user does not have permission to create the configuration.
        '409':
          description: The proposed configuration name is already in use for the same entity.
      summary: Update a guard config by config ID
      tags:
      - guardrails
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Configure and use guardrails for LLM intervention and moderation.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: MODERATION_GUARDRAILS
      x-versionadded: v2.35
  /api/v2/guardTemplates/:
    get:
      description: List guard templates.
      operationId: guardTemplates_list
      parameters:
      - description: This many results will be skipped.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: At most this many results are returned.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          exclusiveMinimum: 0
          type: integer
      - description: Include agentic and non-agentic templates in results (by default, agentic templates are not included).
        in: query
        name: includeAgentic
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Limit results to agentic templates. If true, this overrides either includeAgentic setting.
        in: query
        name: isAgentic
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Filter for templates suitable for playground (exclude production-only templates).
        in: query
        name: forPlayground
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Filter for templates suitable for production (exclude playground-only templates).
        in: query
        name: forProduction
        required: false
        schema:
          default: 'false'
          enum:
          - 'false'
          - 'False'
          - 'true'
          - 'True'
          type: string
      - description: Search for templates by name.
        in: query
        name: name
        required: false
        schema:
          default: null
          maxLength: 255
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardTemplateListResponse'
          description: ''
        '400':
          description: Request invalid, refer to messages for detail.
        '404':
          description: Missing feature flag.
      summary: List guard templates
      tags:
      - guardrails
      x-datarobot-public-preview: false
      x-datarobot-required-feature-flags:
      - description: Configure and use guardrails for LLM intervention and moderation.
        enabled_by_default: false
        maturity: GA_PREMIUM
        name: MODERATION_GUARDRAILS
      x-versionadded: v2.35
